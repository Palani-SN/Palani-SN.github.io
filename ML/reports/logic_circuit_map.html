    <html lang="en">

    <title>Logic Circuit Heatmap</title>
    <style>
        :root {
            --surface-1: #fcfcfb;
            --page: #f9f9f7;
            --text-primary: #0b0b0b;
            --text-secondary: #52514e;
            --text-muted: #898781;
            --gridline: #e1e0d9;
            --border: rgba(11,11,11,0.10);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --surface-1: #1a1a19;
                --page: #0d0d0d;
                --text-primary: #ffffff;
                --text-secondary: #c3c2b7;
                --text-muted: #898781;
                --gridline: #2c2c2a;
                --border: rgba(255,255,255,0.10);
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--page);
            color: var(--text-primary);
            padding: 40px 20px;
        }
        .viz-root { display: flex; justify-content: center; }
        .card {
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px 32px 32px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            width: 100%;
        }
        .viz-title { margin: 0 0 4px; font-size: 20px; font-weight: 600; text-align: center; }
        .viz-subtitle { margin: 0 0 24px; font-size: 13px; color: var(--text-secondary); text-align: center; }
        .heatmap-wrap { display: flex; align-items: stretch; gap: 8px; }
        .y-axis-title {
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            align-self: center;
        }
        .heatmap-scroll { overflow-x: auto; flex: 1; padding-bottom: 8px; }
        .heatmap-grid { display: grid; gap: 2px; width: 100%; }
        .grid-cell { display: flex; align-items: center; justify-content: center; font-size: 11px; padding: 6px 4px; border-radius: 4px; min-width: 0; }
        .corner-cell { background: transparent; }
        .col-header, .row-header { color: var(--text-secondary); font-weight: 600; }
        .row-header { justify-content: flex-end; padding-right: 10px; }
        .heat-cell {
            min-height: 52px;
            cursor: pointer;
            outline-offset: 2px;
            font-weight: 700;
            font-size: clamp(10px, 1vw, 13px);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .heat-cell:hover, .heat-cell:focus-visible { outline: 2px solid var(--text-primary); z-index: 1; position: relative; }
        .x-axis-title { text-align: center; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-top: 8px; }
        .legend-row { display: flex; align-items: center; gap: 10px; margin-top: 24px; justify-content: center; }
        .legend-bar { width: 240px; height: 10px; border-radius: 6px; border: 1px solid var(--border); }
        .legend-label { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
        .table-toggle-btn {
            display: block; margin: 20px auto 0; padding: 8px 16px; font-size: 13px; font-weight: 600;
            border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-primary); cursor: pointer;
        }
        .table-toggle-btn:hover { background: var(--gridline); }
        .table-view { margin-top: 16px; overflow-x: auto; }
        .data-table, .tooltip-table { border-collapse: collapse; width: 100%; font-size: 12px; }
        .data-table th, .data-table td { border: 1px solid var(--gridline); padding: 4px 8px; text-align: center; font-variant-numeric: tabular-nums; }
        .data-table th { color: var(--text-secondary); }
        .tooltip {
            position: absolute; z-index: 1000; background: var(--surface-1); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px 12px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.18);
            max-width: 260px; pointer-events: none;
        }
        .tooltip-title { font-weight: 600; margin-bottom: 4px; }
        .tooltip-total { color: var(--text-secondary); margin-bottom: 6px; }
        .tooltip-table th, .tooltip-table td { padding: 2px 6px; text-align: left; border-bottom: 1px solid var(--gridline); }
        .tooltip-value { text-align: right !important; font-weight: 600; font-variant-numeric: tabular-nums; }
    </style>

        const MAX_ENERGY = 1517.8146;
        const POINT_MAP = new Map(DATA_POINTS.map(p => [p.x + "_" + p.y, p]));

        // Sequential blue ramp, light (near-surface) -> dark (max signal)
        const RAMP = [
            "#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7",
            "#3987e5", "#2a78d6", "#256abf", "#1c5cab", "#184f95", "#104281", "#0d366b"
        ];

        function hexToRgb(hex) {
            const n = parseInt(hex.slice(1), 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        function lerp(a, b, t) { return a + (b - a) * t; }
        function rgbToHex(r, g, b) {
            return "#" + [r, g, b].map(v => Math.round(v).toString(16).padStart(2, "0")).join("");
        }
        function colorForValue(t, isDark) {
            // Sequential scale flips its anchor on a dark surface: low -> dark step
            // (blends toward the near-black surface), high -> light step (stands out).
            const stops = isDark ? [...RAMP].reverse() : RAMP;
            const scaled = Math.min(Math.max(t, 0), 1) * (stops.length - 1);
            const lo = Math.floor(scaled);
            const hi = Math.min(lo + 1, stops.length - 1);
            const frac = scaled - lo;
            const [r1, g1, b1] = hexToRgb(stops[lo]);
            const [r2, g2, b2] = hexToRgb(stops[hi]);
            return rgbToHex(lerp(r1, r2, frac), lerp(g1, g2, frac), lerp(b1, b2, frac));
        }
        function textOnFill(hex) {
            const [r, g, b] = hexToRgb(hex);
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminance > 0.55 ? "#0b0b0b" : "#ffffff";
        }
        function prefersDark() {
            return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        }

        const grid = document.getElementById("heatmap-grid");
        const tooltip = document.getElementById("tooltip");
        const legendBar = document.getElementById("legend-bar");

        function showTooltip(cell, evt) {
            const key = cell.dataset.key;
            const circuits = METADATA[key] || [];
            const value = parseFloat(cell.dataset.value);

            tooltip.innerHTML = "";
            const title = document.createElement("div");
            title.className = "tooltip-title";
            title.textContent = `Idx ${cell.dataset.idx} · Expected ${cell.dataset.val}`;
            tooltip.appendChild(title);

            const totalRow = document.createElement("div");
            totalRow.className = "tooltip-total";
            totalRow.textContent = `Total energy: ${value.toFixed(4)}`;
            tooltip.appendChild(totalRow);

            if (circuits.length) {
                const table = document.createElement("table");
                table.className = "tooltip-table";
                const headRow = document.createElement("tr");
                ["Pair", "Energy"].forEach(h => {
                    const th = document.createElement("th");
                    th.textContent = h;
                    headRow.appendChild(th);
                });
                table.appendChild(headRow);

                circuits.forEach(c => {
                    const tr = document.createElement("tr");
                    const tdPair = document.createElement("td");
                    tdPair.textContent = `${c.n_id} ↔ ${c.f_id}`;
                    const tdVal = document.createElement("td");
                    tdVal.textContent = c.energy_sum;
                    tdVal.className = "tooltip-value";
                    tr.appendChild(tdPair);
                    tr.appendChild(tdVal);
                    table.appendChild(tr);
                });
                tooltip.appendChild(table);
            }

            tooltip.hidden = false;
            const rect = cell.getBoundingClientRect();
            const ttRect = tooltip.getBoundingClientRect();
            const margin = 12;
            const gap = 16;

            // Flip to the opposite side of the cursor/cell when there isn't room on
            // the default side. The decision uses the CELL's edge, not the cursor's
            // exact position, so every hover inside a near-edge cell (e.g. the last
            // couple of columns) flips the same way instead of it depending on
            // exactly where in the cell the pointer happens to be.
            const spaceRight = window.innerWidth - rect.right - gap;
            const flip = spaceRight < ttRect.width + margin;
            let left = flip
                ? (evt ? evt.clientX : rect.left) - gap - ttRect.width
                : (evt ? evt.clientX : rect.right) + gap;
            left = Math.max(margin, Math.min(left, window.innerWidth - ttRect.width - margin));

            const anchorY = evt ? evt.clientY : rect.top;
            const spaceBelow = window.innerHeight - anchorY - gap;
            let top = spaceBelow >= ttRect.height + margin
                ? anchorY + gap
                : anchorY - gap - ttRect.height;
            top = Math.max(margin, Math.min(top, window.innerHeight - ttRect.height - margin));

            tooltip.style.left = `${left + window.scrollX}px`;
            tooltip.style.top = `${top + window.scrollY}px`;
        }
        function hideTooltip() { tooltip.hidden = true; }

        function renderGrid() {
            const isDark = prefersDark();
            // Fluid columns (no fixed min-width) so the grid fills the card
            // width instead of overflowing into a horizontal scrollbar.
            grid.style.gridTemplateColumns = `minmax(64px, 96px) repeat(${INDICES.length}, minmax(0, 1fr))`;
            grid.innerHTML = "";

            const corner = document.createElement("div");
            corner.className = "grid-cell corner-cell";
            grid.appendChild(corner);

            INDICES.forEach(idx => {
                const head = document.createElement("div");
                head.className = "grid-cell col-header";
                head.textContent = idx;
                grid.appendChild(head);
            });

            VALUES.forEach((val, rowIdx) => {
                const rowHead = document.createElement("div");
                rowHead.className = "grid-cell row-header";
                rowHead.textContent = val;
                grid.appendChild(rowHead);

                INDICES.forEach((idx, colIdx) => {
                    const point = POINT_MAP.get(colIdx + "_" + rowIdx);
                    const value = point ? point.value : 0;
                    const t = MAX_ENERGY > 0 ? value / MAX_ENERGY : 0;
                    const color = colorForValue(t, isDark);

                    const cell = document.createElement("div");
                    cell.className = "grid-cell heat-cell";
                    cell.style.background = color;
                    cell.style.color = textOnFill(color);
                    cell.textContent = value.toFixed(1);
                    cell.dataset.key = idx + "_" + val;
                    cell.dataset.value = value;
                    cell.dataset.idx = idx;
                    cell.dataset.val = val;
                    cell.tabIndex = 0;
                    cell.addEventListener("pointerenter", (evt) => showTooltip(cell, evt));
                    cell.addEventListener("pointermove", (evt) => showTooltip(cell, evt));
                    cell.addEventListener("focus", () => showTooltip(cell, null));
                    cell.addEventListener("pointerleave", hideTooltip);
                    cell.addEventListener("blur", hideTooltip);

                    grid.appendChild(cell);
                });
            });
        }

        function renderLegend() {
            const isDark = prefersDark();
            const stops = isDark ? [...RAMP].reverse() : RAMP;
            legendBar.style.background = `linear-gradient(to right, ${stops.join(", ")})`;
        }

        function renderTable() {
            const tableView = document.getElementById("table-view");
            const table = document.createElement("table");
            table.className = "data-table";

            const headRow = document.createElement("tr");
            const corner = document.createElement("th");
            corner.textContent = "Expected \\ Index";
            headRow.appendChild(corner);
            INDICES.forEach(idx => {
                const th = document.createElement("th");
                th.textContent = idx;
                headRow.appendChild(th);
            });
            table.appendChild(headRow);

            VALUES.forEach((val, rowIdx) => {
                const tr = document.createElement("tr");
                const th = document.createElement("th");
                th.textContent = val;
                tr.appendChild(th);
                INDICES.forEach((idx, colIdx) => {
                    const point = POINT_MAP.get(colIdx + "_" + rowIdx);
                    const td = document.createElement("td");
                    td.textContent = point ? point.value : 0;
                    tr.appendChild(td);
                });
                table.appendChild(tr);
            });

            tableView.innerHTML = "";
            tableView.appendChild(table);
        }

        document.getElementById("table-toggle").addEventListener("click", (evt) => {
            const tableView = document.getElementById("table-view");
            const isHidden = tableView.hidden;
            if (isHidden && !tableView.dataset.built) {
                renderTable();
                tableView.dataset.built = "1";
            }
            tableView.hidden = !isHidden;
            evt.target.textContent = isHidden ? "Hide table" : "View as table";
        });

        renderGrid();
        renderLegend();

        if (window.matchMedia) {
            window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
                renderGrid();
                renderLegend();
            });
        }
