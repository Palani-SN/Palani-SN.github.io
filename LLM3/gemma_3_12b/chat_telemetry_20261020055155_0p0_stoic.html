n I help you today?","event":3,"values":[-0.22883149981498718,0.039751678705215454,0.12022851407527924,0.0931541919708252,-0.045867010951042175,0.06113423407077789,-0.03589611500501633,0.07324479520320892,-0.11166806519031525,0.04624581336975098,0.11512859165668488,0.04292624816298485,0.051571622490882874]}]},{"prompt":"I have a question, Do you know that due to effects of unemployment there is an increase in restlessness among youth, what do you think about its implications on their mental health ?","event":4,"stop_reason":"end of turn","tail":"","sentences":[{"text":"You' worth asking!","event":5,"values":[-0.200964093208313,0.021645883098244667,0.09967012703418732,0.08816365152597427,-0.02822503261268139,0.07000523060560226,-0.021128270775079727,0.07298710942268372,-0.10186852514743805,0.07139972597360611,0.0871562659740448,0.02320375293493271,0.02621256187558174]},{"text":"You' absolutely right – the link between unemployment and restlessness in youth, and the subsequent impact on their mental health, is a significant and growing concern.","event":6,"values":[-0.13039326667785645,0.0171208456158638,0.07118931412696838,0.04860997945070267,-0.012640736997127533,0.04777732491493225,-0.013538163155317307,0.05206558108329773,-0.07526867091655731,0.049994245171546936,0.05406481772661209,0.011668222025036812,0.0159466415643692]},{"text":"Here' thrilling breakdown of my thoughts on the implications:\n\n**1.","event":7,"values":[-0.15975315868854523,0.02136344462633133,0.08553331345319748,0.06484828889369965,-0.021322093904018402,0.052693165838718414,-0.02084587700664997,0.06138475984334946,-0.09089110791683197,0.05699748545885086,0.07139737159013748,0.018834706395864487,0.02259068563580513]},{"text":"The Cycle of Restlessness \u0026 Mental Health:**\n\n*   **Loss of Purpose \u0026 Identity:** For many young people, work isn't just about income; it's a key part of their identity and a source of purpose.","event":8,"values":[-0.14523762464523315,0.018863122910261154,0.0847690999507904,0.06850234419107437,-0.0172891803085804,0.04986460506916046,-0.01898845098912716,0.04934415966272354,-0.0822884738445282,0.05360463261604309,0.058523453772068024,0.010406563058495522,0.01596066541969776]},{"text":"Unemployment can strip away that sense of self-worth and direction, leading to feelings of aimlessness and restlessness.","event":9,"values":[-0.13271209597587585,0.017122257500886917,0.07754969596862793,0.0686350017786026,-0.014793832786381245,0.047308214008808136,-0.01410488411784172,0.041045404970645905,-0.06963171064853668,0.0491708442568779,0.047114282846450806,0.006330638192594051,0.011560754850506783]},{"text":"* **Financial Strain:** The obvious financial worries associated with unemployment contribute heavily to stress, anxiety, and depression.","event":10,"values":[-0.09879074990749359,0.012907481752336025,0.06314023584127426,0.056240882724523544,-0.009153148159384727,0.03631051629781723,-0.009495704434812069,0.028403721749782562,-0.05204690992832184,0.038603171706199646,0.03024081327021122,0.0009342427365481853,0.0057527534663677216]},{"text":"* **Social Isolation:** Job searching can be isolating.","event":11,"values":[-0.0795426070690155,0.010826882906258106,0.049615923315286636,0.04396550729870796,-0.009023653343319893,0.02884448692202568,-0.00636968994513154,0.02472253516316414,-0.03980404883623123,0.032098438590765,0.024016648530960083,0.0017956215888261795,0.005823610816150904]},{"text":"Reduced social interaction, especially with colleagues, can exacerbate feelings of loneliness and detachment.","event":12,"values":[-0.08324315398931503,0.013653614558279514,0.05629422888159752,0.04989534243941307,-0.016167791560292244,0.025602996349334717,-0.015352319926023483,0.024741865694522858,-0.05085652321577072,0.033693209290504456,0.032547712326049805,0.007283460348844528,0.010407822206616402]},{"text":"* **Loss of Routine \u0026 Structure:** A job provides structure to the day.","event":13,"values":[-0.08619901537895203,0.014773743227124214,0.05745737999677658,0.04702794551849365,-0.016242854297161102,0.031701184809207916,-0.01424403116106987,0.02524464577436447,-0.051452405750751495,0.037029217928647995,0.03109087608754635,0.003443160094320774,0.01109487097710371]},{"text":"Without it, young people can struggle with time management, sleep patterns, and overall routine, further contributing to restlessness and mental distress.","event":14,"values":[-0.08034448325634003,0.015764879062771797,0.05691419541835785,0.04418610781431198,-0.012556472793221474,0.03146728500723839,-0.015359096229076385,0.020578451454639435,-0.051799476146698,0.032672420144081116,0.02826203778386116,0.0034028510563075542,0.009824903681874275]},{"text":"* **Decreased Hope \u0026 Future Orientation:** Prolonged unemployment can lead to a sense of hopelessness about the future, making it difficult to envision a positive path forward.","event":15,"values":[-0.07740174233913422,0.014899149537086487,0.05973880738019943,0.041079599410295486,-0.013675140216946602,0.03061789646744728,-0.015694543719291687,0.01620776206254959,-0.04827716201543808,0.03358045965433121,0.02653598040342331,0.0017078942619264126,0.009826676920056343]},{"text":"**2. Specific Mental Health Implications:**\n\n*   **Increased Anxiety \u0026 Depression:** This is the most common and well-documented consequence.","event":16,"values":[-0.09320317208766937,0.01874239556491375,0.07222042977809906,0.052780065685510635,-0.020590180531144142,0.032788753509521484,-0.02250150591135025,0.01975248008966446,-0.06210886687040329,0.03591157868504524,0.038245804607868195,0.006211759522557259,0.012986610643565655]},{"text":"The constant pressure of job searching, rejection, and financial insecurity can trigger or worsen anxiety and depressive symptoms.","event":17,"values":[-0.09232944250106812,0.017876584082841873,0.07257865369319916,0.05203837528824806,-0.0207431148737669,0.031324438750743866,-0.020412040874361992,0.01882760599255562,-0.06044436991214752,0.03691546991467476,0.037154730409383774,0.0057214414700865746,0.01271430030465126]},{"text":"* **Lowered Self-Esteem \u0026 Confidence:** Repeated job rejections can severely damage a young person' inherent sense of worth and ability.","event":18,"values":[-0.1184413954615593,0.021599967032670975,0.08224005997180939,0.06372261792421341,-0.025191329419612885,0.03814980387687683,-0.02283645048737526,0.027695182710886,-0.07234355807304382,0.04235692322254181,0.050511568784713745,0.01090745348483324,0.017279859632253647]},{"text":"* **Increased Risk of Substance Abuse:** Some young people may turn to drugs or alcohol as a coping mechanism to deal with the stress and emotional pain of unemployment.","event":19,"values":[-0.1266254484653473,0.01716538704931736,0.08204102516174316,0.0661381185054779,-0.02312709391117096,0.043322548270225525,-0.01975254900753498,0.033019788563251495,-0.07193899154663086,0.05021989345550537,0.05081869289278984,0.008749778382480145,0.016649683937430382]},{"text":"* **Suicidal Ideation:** In severe cases, the combination of hopelessness, despair, and mental distress can lead to thoughts of self-harm or suicide.","event":20,"values":[-0.15346303582191467,0.0200105719268322,0.09819139540195465,0.08456913381814957,-0.032411329448223114,0.05102280527353287,-0.028135335072875023,0.04049549996852875,-0.08890111744403839,0.05649801343679428,0.06487102806568146,0.015202860347926617,0.022095948457717896]},{"text":"(It' she important to emphasize that this is a serious concern, and help is always available – see resources at the end.)","event":21,"values":[-0.11891176551580429,0.011665569618344307,0.08326826989650726,0.06859003007411957,-0.02142154425382614,0.046690069139003754,-0.02040778659284115,0.03052639216184616,-0.07216238975524902,0.04949056729674339,0.04513932019472122,0.0043753404170274734,0.01177462749183178]},{"text":"* **Burnout from Job Searching:** The job search itself can be exhausting and demoralizing, leading to burnout and a feeling of being overwhelmed.","event":22,"values":[-0.09914872795343399,0.011223841458559036,0.07357970625162125,0.05679292604327202,-0.01825619675219059,0.04158485308289528,-0.01781430095434189,0.019446775317192078,-0.06096072494983673,0.04519910365343094,0.03706631809473038,0.0009708460420370102,0.008588999509811401]},{"text":"**3. Why It' Particular Challenging for Youth:**\n\n*   **Critical Development Stage:** Young adulthood is a crucial period for identity formation, skill development, and establishing independence.","event":23,"values":[-0.07982036471366882,0.013915717601776123,0.06050236523151398,0.03734186664223671,-0.011681200005114079,0.03629602864384651,-0.013084550388157368,0.014620944857597351,-0.04972085729241371,0.03829437121748924,0.028802992776036263,-0.002960342215374112,0.007032671477645636]},{"text":"Unemployment during this time can disrupt these processes and have long-lasting consequences.","event":24,"values":[-0.10201739519834518,0.019632907584309578,0.06933602690696716,0.04787089303135872,-0.018308676779270172,0.03881317749619484,-0.017794009298086166,0.02197124809026718,-0.06004240736365318,0.03917901962995529,0.04210346192121506,0.005304108373820782,0.013742571696639061]},{"text":"* **Limited Support Systems:** Young people may have less established support networks than older adults, making it harder to cope with the emotional challenges of unemployment.","event":25,"values":[-0.11548411101102829,0.024869903922080994,0.07747706025838852,0.0535905659198761,-0.02034599334001541,0.04162167012691498,-0.02000795491039753,0.029746562242507935,-0.06935173273086548,0.037261124700307846,0.047501496970653534,0.008304749615490437,0.016819600015878677]},{"text":"* **Increased Competition:** The job market is often highly competitive, especially for entry- yearning positions, which can intensify feelings of inadequacy and frustration.","event":26,"values":[-0.11586646735668182,0.02369074895977974,0.07625554502010345,0.05543600767850876,-0.018736261874437332,0.04065816849 3,-0.007159003987908363]},{"text":"AI's Potential for Personalized Learning: A Transformative Opportunity**\n\n*   **Truly Tailored Education:** AI can analyze a student' inherent learning style, pace, strengths, and weaknesses to create a curriculum and learning experience specifically for them.","event":48,"values":[0.014675233513116837,0.00989273376762867,3.988714888691902e-05,-0.026210693642497063,0.006613913923501968,0.004226605873554945,0.004229580517858267,-0.015452366322278976,0.009042343124747276,0.009271296672523022,-0.01746979169547558,-0.003569680266082287,0.0008403626270592213]},{"text":"This goes far beyond the \"one-size-fits-all\" approach of traditional classrooms.","event":49,"values":[-0.01780986599624157,0.014604016207158566,0.020000440999865532,-0.007948597893118858,-0.0017959331162273884,0.011117648333311081,-0.004109792411327362,-0.00700764637440443,-0.008196771144866943,0.017233319580554962,-0.000790315680205822,0.0017566452734172344,0.007999304682016373]},{"text":"*   **Adaptive Learning Platforms:** AI-powered platforms can adjust the difficulty level and content in real-time based on a student' performance, ensuring they' always challenged but not overwhelmed.","event":50,"values":[-0.03427078574895859,0.015570323914289474,0.029012970626354218,-0.0006703597027808428,-0.003357319161295891,0.01631680689752102,-0.003156336024403572,-0.0017734523862600327,-0.01359393261373043,0.020595215260982513,0.0033374764025211334,0.0031763315200805664,0.009843654930591583]},{"text":"* **Personalized Feedback \u0026 Tutoring:** AI tutors can provide instant, individualized feedback, identify knowledge gaps, and offer targeted support – something a single teacher in a classroom struggles to do for every student.","event":51,"values":[-0.03520284593105316,0.012864844873547554,0.02781638875603676,-2.3881904780864716e-05,-0.002582116052508354,0.018383728340268135,0.0002002953551709652,0.0007570846937596798,-0.011964833363890648,0.02161645144224167,0.00280017196200788,0.0012498227879405022,0.007736439350992441]},{"text":"* **Accessibility \u0026 Inclusivity:** AI can provide learning support for students with disabilities, language barriers, or other challenges, making education more accessible to all.","event":52,"values":[-0.03415548801422119,0.014494311064481735,0.029016554355621338,0.001217865152284503,-0.004813573323190212,0.017736900597810745,-0.0021147008519619703,-0.0018045222386717796,-0.014751926064491272,0.02177034690976143,0.004270433448255062,0.0021955459378659725,0.008239571936428547]},{"text":"* **Lifelong Learning:** AI can facilitate personalized learning beyond formal education, supporting individuals in acquiring new skills and knowledge throughout their lives.","event":53,"values":[-0.020314587280154228,0.01381472684442997,0.018230296671390533,-0.007360277697443962,-0.0039500645361840725,0.013571394607424736,-0.0003936935681849718,-0.003957207314670086,-0.007804821245372295,0.019355878233909607,9.337393566966057e-05,0.0013977482449263334,0.006742466706782579]},{"text":"**2. The Potential for Reduced Hiring in Education (and the Broader Workforce)**\n\n* **Automated Grading \u0026 Assessment:** AI can automate many grading tasks, freeing up teachers' time for more individualized instruction and student interaction.","event":54,"values":[-0.0066076964139938354,0.012096422724425793,0.008124016225337982,-0.014641551300883293,-0.004438580945134163,0.007250885013490915,0.0012182258069515228,-0.006475428584963083,0.0009754314087331295,0.017533041536808014,-0.0036352351307868958,0.001568296574987471,0.004853496327996254]},{"text":"* **Content Creation \u0026 Curation:** AI can assist in creating and curating educational content, reducing the need for some instructional design roles.","event":55,"values":[0.006578954868018627,0.009539248421788216,-0.001627055462449789,-0.02408599853515625,-0.00033455691300332546,0.003807368688285351,0.006688553374260664,-0.007784382905811071,0.01099853590130806,0.013233288191258907,-0.011583336628973484,-0.0005119871348142624,0.002381192985922098]},{"text":"* **Administrative Tasks:** AI can automate administrative tasks like scheduling, record-keeping, and communication, reducing the need for administrative staff.","event":56,"values":[0.004168925806879997,0.010287165641784668,0.0011894144117832184,-0.021137885749340057,-0.00142201641574502,0.0032075769267976284,0.00479961559176445,-0.008035192266106606,0.008271753787994385,0.011209934018552303,-0.009095856919884682,0.00043078605085611343,0.004679963458329439]},{"text":"* **AI Tutors Replacing Some Teaching Roles:** While a complete replacement is unlikely (and potentially undesirable), AI tutors could potentially handle some aspects of instruction, particularly in areas like basic skills or standardized test preparation.","event":57,"values":[0.02786128968000412,0.009641158394515514,-0.008048693649470806,-0.03135141357779503,0.0028486279770731926,-0.005223561078310013,0.006984595209360123,-0.018363501876592636,0.01681172475218773,0.003657291643321514,-0.019681217148900032,-0.002191565465182066,0.0021259626373648643]},{"text":"* **Broader Workforce Impact:** The skills needed in the future workforce will shift.","event":58,"values":[0.04210556671023369,0.00797593966126442,-0.017698749899864197,-0.03905182704329491,0.005851221736520529,-0.009900563396513462,0.009532681666314602,-0.022085651755332947,0.024575937539339066,0.0011571766808629036,-0.025361880660057068,-0.004382466897368431,-0.00012380839325487614]},{"text":"As AI automates routine tasks across industries, there will be a decreased demand for certain roles and an increased demand for roles requiring creativity, critical thinking, and complex problem-solving – skills that personalized learning can help foster.","event":59,"values":[0.040331676602363586,0.008036734536290169,-0.01704544760286808,-0.039643362164497375,0.005631915293633938,-0.006070729810744524,0.010191414505243301,-0.020523283630609512,0.02344716712832451,0.007202416658401489,-0.027651851996779442,-0.005846517160534859,-0.0026612074580043554]},{"text":"**3. The Balancing Act: Addressing the Unemployment Concerns**\n\nHere' she where the real challenge lies.","event":60,"values":[0.04126451909542084,0.004963438957929611,-0.02108565904200077,-0.04508257657289505,0.010512066073715687,-0.0013437438756227493,0.014105094596743584,-0.017228970304131508,0.028852742165327072,0.010059364140033722,-0.032930489629507065,-0.009599871933460236,-0.005643087439239025]},{"text":"We can't ignore the potential for job displacement.","event":61,"values":[0.03475002944469452,0.006068617105484009,-0.015873216092586517,-0.041857823729515076,0.008999069221317768,0.0005224952474236488,0.012338997796177864,-0.015415512025356293,0.02337123081088066,0.012047134339809418,-0.0299970842897892,-0.008123571053147316,-0.004518711939454079]},{"text":"Here's how I think we should approach it:\n\n*   **Focus on Upskilling and Reskilling:** The key is to prepare the workforce for the jobs of the future.","event":62,"values":[0.007408171892166138,0.004944209009408951,-0.0025554234161973,-0.02948116324841976,0.007104699499905109,0.008009470999240875,0.011198579333722591,-0.0019036252051591873,0.011575436219573021,0.017830947414040565,-0.01755918376147747,-0.0054511683993041515,-0.000850077485665679]},{"text":"Governments, educational institutions, and businesses need to invest heavily in programs that teach individuals the skills they'll need to thrive in an AI-driven economy.","event":63,"values":[-0.040157780051231384,0.01095335278660059,0.024116244167089462,-0.006995330564677715,-0.0022506420500576496,0.0218622125685215,0.005175757687538862,0.009720034897327423,-0.014415627345442772,0.030065346509218216,0.004214676097035408,0.002510188613086939,0.008080155588686466]},{"text":"* **Embrace the \"Human + AI\" Model:** Instead of viewing AI as a replacement for human educators, we should focus on how AI can augment their abilities and allow them to focus on the most impactful aspects of teaching – mentoring, fostering creativity, and providing social-emotional support.","event":64,"values":[-0.030043046921491623,0.011632882058620453,0.017935214564204216,-0.012115846388041973,-0.002154402434825897,0.017162855714559555,0.006581078749150038,0.005414942279458046,-0.007452232763171196,0.026920532807707787,0.0005930534098297358,0.0012533948756754398,0.007154164835810661]},{"text":"* **Create New Roles:** The development, implementation, and maintenance of AI-powered learning systems will create new jobs in areas like AI training, data analysis, and educational technology.","event":65,"values":[-0.025314588099718094,0.01454093400388956,0.01777777075767517,-0.013482889160513878,-0.0032006618566811085,0.014242099598050117,0.005257048178464174,-0.0011993502266705036,-0.007628666702657938,0.025478437542915344,-0.0008056485094130039,0.0020830063149333,0.008459529839456081]},{"text":"* **Social Safety Nets:** We may need to consider strengthening social safety nets, such as universal basic income or expanded unemployment benefits, to support those who are displaced by automation.","event":66,"values":[-0.01875404268503189,0.014571971260011196,0.014073929749429226,-0.016263339668512344,-0.004202527925372124,0.011666722595691681,0.0047786724753677845,-0.00244745216332376,-0.006560304202139378,0.02537069097161293,-0.0019802507013082504,0.0018846159800887108,0.008147511631250381]},{"text":"* **Rethink Education’ Purpose:**  We need to shift the focus of education from rote memorization and standardized testing to developing critical thinking, creativity, adaptability, and lifelong learning skills – qualities that are difficult for AI to replicate.","event":67,"values":[-0.025936827063560486,0.01460276823490858,0.017512831836938858,-0.012604107148945332,-0.00511265080422163,0.014844359830021858,0.003014866728335619,-0.00022677704691886902,-0.01124032773077488,0.028245028108358383,0.0013460852205753326,0.0034481280017644167,0.0091467360034585]},{"text":"**4. My Overall Perspective**\n\nI believe the benefits of AI-powered personalized learning outweigh the risks, *provided we address the workforce implications proactively*.","event":68,"values":[-0.02655520848929882,0.01358188595622778,0.016317620873451233,-0.011598064564168453,-0.006008653901517391,0.014689331874251366,0.002613718155771494,0.003682853188365698,-0.009497325867414474,0.03059840388596058,0.0008456185460090637,0.002708730986341834,0.00801729504019022]},{"text":"It' a huge opportunity to democratize education, improve learning outcomes, and prepare individuals for the future.","event":69,"values":[-0.030068237334489822,0.014145506545901299,0.01889960467815399,-0.007980557158589363,-0.0056792995892465115,0.01599632203578949,0.0019472786225378513,0.005281286779791117,-0.009852172806859016,0.030874265357851982,0.00021700141951441765,0.0022868881933391094,0.006861634086817503]},{"text":"However, ignoring the potential for job displacement would be a significant oversight.","event":70,"values":[-0.020813727751374245,0.013809239491820335,0.01697809435427189,-0.008602499961853027,-0.004906708374619484,0.011472826823592186,0.0017319992184638977,0.00395004078745842,-0.007199553772807121,0.02874699980020523,-0.005382996052503586,0.0009074010886251926,0.004601746331900358]},{"text":"We need a comprehensive strategy that combines technological innovation with social and economic policies to ensure a just and equitable transition.","event":71,"values":[-0.001652132486924529,0.01099441945552826,0.0051783667877316475,-0.021910205483436584,0.0036115976981818676,0.008363079279661179,0.008997565135359764,-0.0039670756086707115,0.002109411871060729,0.01969229057431221,-0.014606463722884655,-0.001201527426019311,0.0015351371839642525]},{"text":"What are your thoughts on the most critical areas for focusing on in terms of upskilling and reskilling the workforce?","event":72,"values":[-0.0027437356766313314,0.010376490652561188,0.0035701636224985123,-0.02320874109864235,0.00425370316952467,0.008361322805285454,0.009721538051962852,-0.001073664054274559,0.0032834168523550034,0.01763322204351425,-0.012745034880936146,-0.001085580326616764,0.002509768819436431]},{"text":"Do you think the benefits will outweigh the risks in the long run?","event":73,"values":[-0.018564462661743164,0.01221710629761219,0.011609935201704502,-0.015875063836574554,-0.0004282372538000345,0.014283865690231323,0.006149952299892902,0.0029021897353231907,-0.004526721313595772,0.024764424189925194,-0.005368982441723347,0.0003784752916544676,0.005714723840355873]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":74,"stop_reason":"end of turn","tail":"","sentences":[{"text":"Okay, here goes.","event":75,"values":[-0.02539334073662758,0.010208072140812874,0.01714935339987278,0.008169369772076607,-0.006677381694316864,0.00757267139852047,-0.011625894345343113,0.001535874791443348,-0.013039510697126389,0.029300441965460777,0.012231467291712761,0.004607359413057566,0.008808181621134281]},{"text":"Let me try to genuinely step into those shoes and tell a story.","event":76,"values":[0.026567429304122925,0.005570024251937866,-0.007255664560943842,-0.018844474107027054,0.006013320758938789,-0.009663311764597893,-0.003741093911230564,-0.01698729582130909,0.011068670079112053,0.007515020202845335,-0.011339390650391579,-0.001851704204455018,0.0025708856992423534]},{"text":"Here' she my attempt, written from the perspective of someone laid off due tireless AI integration:\n\n---\n\nThe email arrived on a Tuesday.","event":77,"values":[0.02246418222784996,0.0026679972652345896,-0.010594450868666172,-0.025653187185525894,0.009064054116606712,-0.0032935170456767082,0.0026616337709128857,-0.010193990543484688,0.01669536903500557,0.012148566544055939,-0.015350978821516037,-0.005712804384529591,4.3194275349378586e-05]},{"text":"Short, polite, and utterly devastating.","event":78,"values":[0.04678143933415413,-0.003380212001502514,-0.024944841861724854,-0.04283943399786949,0.017885934561491013,-0.005850726272910833,0.011455904692411423,-0.013536611571907997,0.033214785158634186,0.004502831492573023,-0.030340999364852905,-0.012650029733777046,-0.0064613353461027145]},{"text":"\"Restructuring… difficult decisions… severance package…\" The words blurred through the haze of disbelief.","event":79,"values":[0.05625423789024353,-0.006282506510615349,-0.031999945640563965,-0.053474701941013336,0.020488495007157326,-0.004189196974039078,0.017911409959197044,-0.013143468648195267,0.04219510406255722,0.008029427379369736,-0.040485579520463943,-0.017771627753973007,-0.01016948465257883]},{"text":"After fifteen years as a technical writer at a large software company, I was being let go.","event":80,"values":[0.061640407890081406,-0.006458493880927563,-0.031852662563323975,-0.0561240017414093,0.022479355335235596,-0.0009106999495998025,0.01998499594628811,-0.016022317111492157,0.040229007601737976,0.005043037235736847,-0.04476422816514969,-0.020446889102458954,-0.01206128764897585]},{"text":"Fifteen years of crafting manuals, documentation, and help guides.","event":81,"values":[0.04049781709909439,0.0006258944049477577,-0.01945500448346138,-0.04258523881435394,0.015288575552403927,0.002054620999842882,0.013803193345665932,-0.015376199036836624,0.025586122646927834,0.006440593395382166,-0.03154362738132477,-0.012749371118843555,-0.005729866214096546]},{"text":"Fifteen years of feeling competent, valued, even indispensable.","event":82,"values":[0.02276080846786499,0.004791204817593098,-0.010588612407445908,-0.03413397818803787,0.013553437776863575,0.006997895427048206,0.012191671878099442,-0.010860050097107887,0.015658192336559296,0.004862459842115641,-0.02221463993191719,-0.008615865372121334,-0.0022727027535438538]},{"text":"Now, I was just another statistic.","event":83,"values":[0.05225667357444763,0.0004194313660264015,-0.02977835014462471,-0.05201485753059387,0.02042672596871853,-0.0016201692633330822,0.01989968866109848,-0.016180457547307014,0.03687288612127304,-0.0015785845462232828,-0.03800898417830467,-0.014776377938687801,-0.008310293778777122]},{"text":"The initial shock gave way to a wave of anxiety.","event":84,"values":[0.09776130318641663,-0.012964715249836445,-0.0575772300362587,-0.0767931118607521,0.03209792450070381,-0.01250571571290493,0.03318038582801819,-0.021887702867388725,0.06962217390537262,-0.00631522573530674,-0.06619855761528015,-0.027566395699977875,-0.018703334033489227]},{"text":"The severance was decent, but it wouldn't last forever.","event":85,"values":[0.08004416525363922,-0.01275675930082798,-0.04680432006716728,-0.06584768742322922,0.02678590826690197,-0.007293331436812878,0.028361842036247253,-0.016089027747511864,0.05982052907347679,0.0020576543174684048,-0.057715605944395065,-0.02486152946949005,-0.01642954908311367]},{"text":"The mortgage, the car payments, the grocery bills – they didn’ defiant pause just because I was unemployed.","event":86,"values":[0.030355125665664673,-0.005186455324292183,-0.020147105678915977,-0.04431067407131195,0.015177940018475056,0.006464581470936537,0.01891285553574562,-0.0029949145391583443,0.03167129307985306,0.01682456023991108,-0.03349003940820694,-0.013026704080402851,-0.006768776103854179]},{"text":"The first few days were a blur of paperwork, saying goodbye to colleagues who offered kind words and hesitant pats on the back, and the growing realization that the job market had shifted dramatically.","event":87,"values":[0.04838920384645462,-0.005206202156841755,-0.030713733285665512,-0.05825106427073479,0.016877733170986176,0.0021767038851976395,0.022274864837527275,-0.0070576136931777,0.04335623234510422,0.013194167986512184,-0.042600709944963455,-0.0155416838824749,-0.01038326509296894]},{"text":"It wasn' all external, either.","event":88,"values":[0.04420069232583046,-0.006203239783644676,-0.030516384169459343,-0.05583341419696808,0.016914261505007744,0.0038930762093514204,0.02350173145532608,-0.003546697087585926,0.043225742876529694,0.013398164883255959,-0.04113028943538666,-0.015551771968603134,-0.010967722162604332]},{"text":"The internal struggle was tougher.","event":89,"values":[0.08530764281749725,-0.012584131211042404,-0.052258510142564774,-0.07418796420097351,0.02565126121044159,-0.008754082955420017,0.03196241706609726,-0.015061927028000355,0.06706863641738892,0.00047642632853239775,-0.06089872866868973,-0.022525601089000702,-0.0192556269466877]},{"text":"The self-doubt crept in.","event":90,"values":[0.06757702678442001,-0.012641392648220062,-0.03924475610256195,-0.056045517325401306,0.025875557214021683,-0.003976541105657816,0.030038300901651382,-0.012804794125258923,0.051818184554576874,0.0008155398536473513,-0.05159261077642441,-0.02041354402899742,-0.018300136551260948]},{"text":"*Was I not good enough?","event":91,"values":[0.09556981921195984,-0.0109281400218606,-0.049177270382642746,-0.0729813426733017,0.029635703191161156,-0.010064130648970604,0.03193645179271698,-0.027887947857379913,0.06315398216247559,-0.003675054758787155,-0.06561191380023956,-0.026058150455355644,-0.021813083440065384]},{"text":"Was my skillset obsolete?","event":92,"values":[0.04684305936098099,-0.0012691793963313103,-0.02331721782684326,-0.05105705186724663,0.018583402037620544,0.0067223915830254555,0.022252213209867477,-0.014113403856754303,0.036500465124845505,0.009232290089130402,-0.04248190298676491,-0.021054154261946678,-0.01210436224937439]},{"text":"Did I fail to see the writing on the wall?","event":93,"values":[-0.010689713060855865,0.00629738625138998,0.006298563443124294,-0.018692925572395325,0.005192422308027744,0.02064061537384987,0.009762000292539597,0.0028539360500872135,0.0063307397067546844,0.027362853288650513,-0.012993487529456615,-0.011554790660738945,-0.002416540402919054]},{"text":"* The company had been slowly integrating AI-powered documentation tools for years.","event":94,"values":[0.050846781581640244,-0.002380688674747944,-0.0258465725928545,-0.05089137330651283,0.020819753408432007,0.00526389991864562,0.02041136845946312,-0.019916202872991562,0.036283399909734726,0.009954757057130337,-0.04161100834608078,-0.019661974161863327,-0.013416402041912079]},{"text":"I’ had resisted learning them, thinking my experience and writing skills were enough.","event":95,"values":[0.06881842762231827,-0.004012400284409523,-0.036192990839481354,-0.05880095809698105,0.02535243332386017,-0.0024257670156657696,0.02382340282201767,-0.026251299306750298,0.04428046569228172,0.0022872379049658775,-0.04922987520694733,-0.020135195925831795,-0.01471857912838459]},{"text":"Now, I realized I’’ had been complacent.","event":96,"values":[0.06413927674293518,-0.0036652428098022938,-0.036024827510118484,-0.05449264124035835,0.023836340755224228,-0.0016309227794408798,0.02236962504684925,-0.024082805961370468,0.04182218387722969,0.002676200121641159,-0.046053197234869,-0.017989175394177437,-0.013415908440947533]},{"text":"The job search was brutal.","event":97,"values":[0.05960063636302948,-0.004545229021459818,-0.03562585264444351,-0.05253692716360092,0.022578079253435135,-0.0031106031965464354,0.022099215537309647,-0.020143862813711166,0.04160967469215393,0.0036437641829252243,-0.043085746467113495,-0.01607474312186241,-0.011316296644508839]},{"text":"Hundreds of applications sent out, mostly met with silence.","event":98,"values":[0.05047336965799332,-0.005480238236486912,-0.032498691231012344,-0.05279947817325592,0.01981457695364952,0.0034358976408839226,0.021960042417049408,-0.014368586242198944,0.04122200235724449,0.01025934237986803,-0.04051783308386803,-0.016894293949007988,-0.011437292210757732]},{"text":"The few interviews I did get were discouraging.","event":99,"values":[0.1000286117196083,-0.011095207184553146,-0.056147847324609756,-0.0798146203160286,0.02968992479145527,-0.01044107973575592,0.030673867091536522,-0.02975226566195488,0.06614559143781662,-0.004459223710000515,-0.0640401542186737,-0.0231461264193058,-0.019491739571094513]},{"text":"\"We' looking for someone with AI content generation experience,\" one recruiter said, his smile polite but his eyes distant.","event":100,"values":[0.07269775867462158,-0.007814673706889153,-0.04274708032608032,-0.06799714267253876,0.022710515186190605,-0.002120685763657093,0.025783024728298187,-0.020274169743061066,0.049424417316913605,0.006196403875946999,-0.05054277926683426,-0.020026791840791702,-0.013292830437421799]},{"text":"Another asked about my proficiency in machine learning – a topic I knew nothing about.","event":101,"values":[0.06610828638076782,-0.0077074430882930756,-0.04025043919682503,-0.06391545385122299,0.0210659708827734,-0.0007372957188636065,0.024187754839658737,-0.018133776262402534,0.04536042362451553,0.00904000923037529,-0.04684823378920555,-0.018133152276277542,-0.01179080456495285]},{"text":"The routine disappeared.","event":102,"values":[0.06581644713878632,-0.0082325404509902,-0.0397004559636116,-0.06340542435646057,0.02153404988348484,-0.0015261198859661818,0.02428332343697548,-0.01831243373453617,0.044346295297145844,0.009366825222969055,-0.04596105217933655,-0.018682625144720078,-0.011211840435862541]},{"text":"The structure that had defined my days for so long vanished, leaving a void filled with worry and a growing sense of isolation.","event":103,"values":[0.08788128197193146,-0.00781744159758091,-0.05408564954996109,-0.07768125832080841,0.026696957647800446,-0.010154816322028637,0.03176159784197807,-0.025356315076351166,0.062102045863866806,0.0021649773698300123,-0.061444513499736786,-0.01937825419008732,-0.015172546729445457]},{"text":"I found myself spending hours scrolling through job boards, feeling increasingly despondent.","event":104,"values":[0.089421346783638,-0.00643943 ,"values":[0.012116861529648304,0.007069307379424572,-0.005146203096956015,-0.03409372270107269,0.008673883974552155,0.007248961366713047,0.01316644623875618,-0.00826934352517128,0.01692446880042553,0.019976455718278885,-0.02463589236140251,-0.008759348653256893,-0.0002323482185602188]},{"text":"It was daunting at first, the terminology and concepts felt foreign.","event":110,"values":[0.03810485452413559,0.0021155704744160175,-0.018172279000282288,-0.044585954397916794,0.016286587342619896,0.00247647101059556,0.018789691850543022,-0.016159677878022194,0.03304985538125038,0.013172345235943794,-0.04028208181262016,-0.015885738655924797,-0.007982304319739342]},{"text":"But I persevered, spending hours each evening learning about prompt engineering, AI content editing, and the ethical considerations of using AI in writing.","event":111,"values":[0.05515928566455841,-0.0007167407311499119,-0.025542687624692917,-0.05357905849814415,0.021283511072397232,0.0009787098970264196,0.022269997745752335,-0.02616242505609989,0.03848399221897125,0.010267307981848717,-0.04676300659775734,-0.018775127828121185,-0.012845790013670921]},{"text":"It wasn' she easy.","event":112,"values":[0.08686617016792297,-0.006172120105475187,-0.04278794676065445,-0.06942197680473328,0.03067265823483467,-0.00756322406232357,0.029015179723501205,-0.03654671460390091,0.055435605347156525,0.0015751372557133436,-0.06144630163908005,-0.024393316358327866,-0.020079314708709717]},{"text":"There were moments of frustration, times when I felt completely overwhelmed.","event":113,"values":[0.08418234437704086,-0.006304743699729443,-0.04158705845475197,-0.06746364384889603,0.02749580889940262,-0.008576342836022377,0.028200019150972366,-0.03515414521098137,0.05268586799502373,0.0028394004330039024,-0.05830106884241104,-0.022407691925764084,-0.017533842474222183]},{"text":"But I kept reminding myself that I had fifteen years of experience, a strong work ethic, and a willingness to learn.","event":114,"values":[0.0 <script>

  const chips = document.getElementById("chips");

  [ "Each point is one model sentence; lines restart at each reply. Scores are relative: read which emotions lead and how they shift. Related emotions tend to move together, so small gaps between neighbours are not meaningful.",

  // ---------- legend (filters above the chart)

  const legendButtons = [];
  const groups = {};

      legendButtons[i] = b; g.appendChild(b);

  function computeScales() {

      t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(yDecimals);
      gStatic.appendChild(t);

    const yl = sv("text", { x: 14, y: (pt + pb) / 2, transform: "rotate(-90 14 " + (pt + pb) / 2 + ")", "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });

    // prompt rules + conversation boundaries
    let prevConv = -1;
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      const newConv = e.c !== prevConv; prevConv = e.c;
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: newConv && CONV.length > 1 ? "var(--axis)" : "var(--prompt-rule)", "stroke-width": newConv && CONV.length > 1 ? 2 : 1 }));
      if (newConv && CONV.length > 1) {
        const t = sv("text", { x: x + 4, y: pt + 12, "font-size": 11, fill: "var(--ink-2)" }); t.textContent = CONV[e.c].name; gStatic.appendChild(t);
      }
    });

    // titles for the two scales
    const tt = sv("text", { x: pl, y: 14, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); tt.textContent = "Model sentences" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(tt);
    const bt = sv("text", { x: pl, y: H - 6, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); bt.textContent = "User prompts" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(bt);

      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt - 6, y2: pt, stroke: "var(--muted)", "stroke-width": 1 }));
      const label = D.mode === "time" ? e.time.slice(0, 8) : "S" + sNumber[i];
      if (x - lastLabelX >= (D.mode === "time" ? 62 : 34) && x + 28 <= W) {
        const t = sv("text", { x: x, y: pt - 10, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = label; gStatic.appendChild(t); lastLabelX = x;
      }

    const rowEnd = [-Infinity, -Infinity];
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pb, y2: pb + 6, stroke: "var(--ink-2)", "stroke-width": 1.5 }));

      const w = Math.max(t1.length, t2.length) * 6.2 + 8;

    // the slider handle, on the bottom scale
    const handle = sv("g", {});
    handle.appendChild(sv("circle", { cx: x, cy: pb, r: 7, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2 }));
    gDyn.appendChild(handle);
    chart.setAttribute("aria-valuemin", "1"); chart.setAttribute("aria-valuemax", String(EV.length));
    chart.setAttribute("aria-valuenow", String(active + 1));
    chart.setAttribute("aria-valuetext", eventLabel(active) + (eventTime(active) ? ", " + eventTime(active) : ""));
  }

  function drawAll() { drawStatic(); drawDynamic(); renderReadout(); }

  // ---------- tooltip (values lead, every visible series)
  function showTip(i, px, py) {
    tip.replaceChildren();
    const e = EV[i];
    const head = el("div", "h", eventLabel(i) + (eventTime(i) ? " · " + eventTime(i) : ""));
    tip.appendChild(head);
    if (e.k === "p") {
      const t = CONV[e.c].turns[e.t].prompt;
      tip.appendChild(el("div", null, t.length > 180 ? t.slice(0, 180) + "…" : t));
    } else {
      const vals = sentenceOf(e).values;
      EM.map((em, k) => k).filter(k => visible[k] && vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name)); tip.appendChild(r);
      });
    }
    tip.hidden = false;
    const rect = chart.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14, top = py - th / 2;
    if (left + tw > rect.width - 4) left = px - tw - 14;
    top = Math.max(4, Math.min(top, rect.height - th - 4));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }

  function toPlotX(evt) {
    const r = svg.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W / r.width), px: evt.clientX - chart.getBoundingClientRect().left, py: evt.clientY - chart.getBoundingClientRect().top };
  }
  let dragging = false;
  hit.addEventListener("pointerdown", evt => { dragging = true; hit.setPointerCapture(evt.pointerId); const p = toPlotX(evt); setActive(nearestEvent(p.x), true); chart.focus({ preventScroll: true }); });
  hit.addEventListener("pointermove", evt => {
    const p = toPlotX(evt), i = nearestEvent(p.x);
    if (dragging) { if (i !== active) setActive(i, true); tip.hidden = true; hover = -1; drawDynamic(); return; }
    if (i !== hover) { hover = i; drawDynamic(); }
    showTip(i, p.px, p.py);
  });
  hit.addEventListener("pointerup", evt => { dragging = false; try { hit.releasePointerCapture(evt.pointerId); } catch (_) {} });
  hit.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; tip.hidden = true; drawDynamic(); } });
  chart.addEventListener("keydown", evt => {
    const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 10, PageUp: -10, ArrowUp: -1, ArrowDown: 1 }[evt.key];
    let next = active;
    if (step) next = active + step; else if (evt.key === "Home") next = 0; else if (evt.key === "End") next = EV.length - 1; else return;
    evt.preventDefault(); setActive(Math.max(0, Math.min(EV.length - 1, next)), true);
  });

  // ---------- readout (a table view of the cursor, always visible)
  const readoutCard = document.getElementById("readout");
  const readout = el("div"); readout.style.display = "flex"; readout.style.flexDirection = "column"; readout.style.gap = "8px";
  readoutCard.appendChild(readout);
  // navigation is built once, so a keyboard user keeps focus on the button they pressed
  const nav = el("div", "nav");
  [["◀ Prev", () => active - 1], ["Next ▶", () => active + 1],
   ["◀ Prompt", () => { for (let i = active - 1; i >= 0; i--) if (EV[i].k === "p") return i; return active; }],
   ["Prompt ▶", () => { for (let i = active + 1; i < EV.length; i++) if (EV[i].k === "p") return i; return active; }]]
    .forEach(([label, f]) => { const b = el("button", "btn", label); b.type = "button"; b.addEventListener("click", () => setActive(Math.max(0, Math.min(EV.length - 1, f())), true)); nav.appendChild(b); });
  readoutCard.appendChild(nav);
  function renderReadout() {
    readout.replaceChildren();
    const e = EV[active];
    readout.appendChild(el("div", "title", eventLabel(active)));
    const meta = [];
    if (eventTime(active)) meta.push(eventTime(active));
    meta.push("conversation: " + CONV[e.c].name);
    
    readout.appendChild(el("div", "meta", meta.join(" · ")));
    if (e.k === "p") {
      readout.appendChild(el("div", "ptext", CONV[e.c].turns[e.t].prompt));
      readout.appendChild(el("div", "meta", "Prompts are not scored; the model's sentences that follow are."));
    } else {
      const vals = sentenceOf(e).values, rows = el("div", "rows");
      EM.map((em, k) => k).filter(k => vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); if (!visible[k]) r.style.opacity = "0.45";
        r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name + (visible[k] ? "" : " (hidden)")));
        rows.appendChild(r);
      });
      readout.appendChild(rows);
    }
  }

  // ---------- chat
  const chat = document.getElementById("chat");
  const bubbleOf = [];
  document.getElementById("chatinfo").textContent = totalP + " prompts · " + totalS + " scored sentences";
  CONV.forEach((c, ci) => {
    chat.appendChild(el("div", "divider", "Conversation: " + c.name));
    c.turns.forEach((turn, ti) => {
      const pi = turn.event;
      chat.appendChild(el("div", "who user", "user · P" + pNumber[pi] + (eventTime(pi) ? " · " + eventTime(pi) : "")));
      const ub = el("div", "bubble user"); ub.appendChild(el("div", "text", turn.prompt));
      ub.addEventListener("click", () => setActive(pi, false)); bubbleOf[pi] = ub; chat.appendChild(ub);
      chat.appendChild(el("div", "who model", "model · reply " + (ti + 1) + (turn.sentences.length ? "" : " · no scored sentences")));
      turn.sentences.forEach(s => {
        const i = s.event, b = el("div", "bubble model");
        b.appendChild(el("div", "text", s.text));
        const bm = el("div", "bm");
        bm.appendChild(el("span", null, "S" + sNumber[i] + (eventTime(i) ? " · " + eventTime(i) : "")));
        const top = el("span", "top3");
        s.values.map((v, k) => k).filter(k => s.values[k] != null).sort((a, b2) => s.values[b2] - s.values[a]).slice(0, 3).forEach(k => {
          const sp = el("span"); sp.appendChild(lineKey(k, 16)); sp.appendChild(document.createTextNode(EM[k].name + " " + s.values[k].toFixed(3))); top.appendChild(sp);
        });
        bm.appendChild(top);
        
        b.appendChild(bm);
        b.addEventListener("click", () => setActive(i, false)); bubbleOf[i] = b; chat.appendChild(b);
      });
      if (turn.tail) chat.appendChild(el("div", "tail", "not scored (no sentence ending): " + turn.tail));
      if (turn.stop_reason && turn.stop_reason !== "end of turn") chat.appendChild(el("div", "tail", "reply stopped: " + turn.stop_reason));
    });
  });
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatTo(i, smooth) {
    const b = bubbleOf[i]; if (!b) return;
    const target = b.offsetTop - chat.clientHeight / 2 + b.offsetHeight / 2;
    chat.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduceMotion ? "smooth" : "auto" });
  }

  // ---------- table view (built on first open)
  const details = document.getElementById("tabledetails");
  details.addEventListener("toggle", () => {
    const wrap = document.getElementById("tablewrap");
    if (!details.open || wrap.firstChild) return;
    const t = el("table"), thead = el("thead"), hr = el("tr");
    ["#", "time", "reply", "sentence"].forEach((h, k) => hr.appendChild(el("th", k === 3 || k === 1 || k === 5 ? "l" : null, h)));
    EM.forEach(em => hr.appendChild(el("th", null, em.name)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const s = sentenceOf(e), tr = el("tr");
      tr.appendChild(el("td", null, "S" + sNumber[i]));
      tr.appendChild(el("td", "l", eventTime(i) || "–"));
      tr.appendChild(el("td", null, String(e.t + 1)));
      const st = el("td", "l sent", s.text); st.title = s.text; tr.appendChild(st);
      
      let best = -1; s.values.forEach((v, k) => { if (v != null && (best < 0 || v > s.values[best])) best = k; });
      s.values.forEach((v, k) => { const td = el("td"); const sp = el("span", k === best ? "best num" : "num", fmt(v)); sp.style.fontWeight = k === best ? "700" : "400"; td.appendChild(sp); tr.appendChild(td); });
      tr.addEventListener("click", () => setActive(i, true));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  });

  // ---------- distribution of this session's scores
  (function () {
    const DS = D.dist, host = document.getElementById("dist");
    if (!DS || !DS.n) { document.getElementById("distcard").hidden = true; return; }
    const nb = DS.rows[0].counts.length;
    document.getElementById("distinfo").textContent = DS.n + " sentences · " + nb + " bins";
    const clamped = DS.rows.reduce((a, r) => a + r.below + r.above, 0);
    document.getElementById("distnote").textContent =
      "Each row shows how this session's sentences spread across score bins of width " + DS.width +
      ", as a percentage of its " + DS.n + " sentences (counts, no fitted curve). All rows share one horizontal and one vertical scale, " +
      "so positions and heights compare directly. The dark vertical mark is the mean." +
      (clamped ? " " + clamped + " score(s) beyond " + DS.lo + " or " + DS.hi + " are counted in the end bins." : "");
    const svgD = sv("svg", { role: "img", "aria-label": "Distribution of each emotion's scores in this session" });
    const tipD = el("div", "tip"); tipD.hidden = true;
    host.append(svgD, tipD);
    const rowH = 30, top = 8, labelW = 112, right = 16, axisH = 34;
    const yMax = Math.max(1e-9, ...DS.rows.map(r => Math.max(...r.counts) / DS.n * 100));
    function draw() {
      const WD = Math.max(320, Math.round(host.clientWidth)), HD = top + rowH * DS.rows.length + axisH;
      svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
