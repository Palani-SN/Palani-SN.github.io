sue that’s been gaining a lot of attention in recent years.","event":4,"values":[0.03957825154066086,0.06950545310974121,0.10012966394424438,-0.011094825342297554,0.06943650543689728,0.005955744534730911,-0.09654072672128677,-0.08452388644218445,-0.0695309191942215,0.01837284490466118,-0.057464271783828735,0.004877978004515171,0.05945710092782974]},{"text":"Unemployment, especially for young people who are still building careers, can set off a chain of emotional and psychological reactions that ripple throughout their lives.","event":5,"values":[0.00792999379336834,0.07450120151042938,0.12028947472572327,-0.023456240072846413,0.09942102432250977,0.036308709532022476,-0.09269604086875916,-0.08660054206848145,-0.06152244657278061,0.037728771567344666,-0.0859927386045456,-0.011509587056934834,0.04858020320534706]},{"text":"Below, I’ve broken down the main implications, the science that supports them, and some practical ways to mitigate the damage—whether you’re a policy‑maker, a mental‑health professional, a parent, or just someone who cares about the well‑being of young people.","event":6,"values":[-0.0029615918174386024,0.07543039321899414,0.10219509899616241,-0.04005340114235878,0.10307759046554565,0.026416385546326637,-0.09512780606746674,-0.09111081063747406,-0.04168027639389038,0.05807068198919296,-0.07475629448890686,-0.0008431309834122658,0.05933384224772453]},{"text":"---\n\n## 1. Why Unemployment Spikes Restlessness\n\n| Factor | How It Feeds Restlessness |\n|--------|---------------------------|\n| **Identity \u0026 Self‑Worth** | Jobs often serve as a key part of one’s identity.","event":7,"values":[-0.008798742666840553,0.06872573494911194,0.09497474133968353,-0.04816877469420433,0.11275845766067505,0.03513041138648987,-0.0722275972366333,-0.08928389102220535,-0.019476020708680153,0.06507974863052368,-0.09047597646713257,-0.009083937853574753,0.041027434170246124]},{"text":"When that link is broken, it can feel like a loss of purpose.","event":8,"values":[-0.01804308220744133,0.05867085978388786,0.08148109167814255,-0.05129900947213173,0.11659467220306396,0.047544851899147034,-0.05072599649429321,-0.08248650282621384,0.01021173782646656,0.06911569833755493,-0.09875281155109406,-0.01821565255522728,0.02636139653623104]},{"text":"|\n| **Financial Instability** | Money stress is a direct trigger for anxiety and irritability.","event":9,"values":[-0.008838605135679245,0.03337583690881729,0.06880268454551697,-0.03622600436210632,0.13596563041210175,0.08075574785470963,-0.006516272202134132,-0.07408803701400757,0.029035525396466255,0.04816140979528427,-0.13260525465011597,-0.04712134599685669,-0.015852078795433044]},{"text":"|\n| **Social Isolation** | Work provides routine social interactions; unemployment can leave people feeling disconnected.","event":10,"values":[-0.005147133022546768,0.010643355548381805,0.03586266189813614,-0.04630199074745178,0.142779141664505,0.10125536471605301,0.006930815055966377,-0.05201040953397751,0.06553185731172562,0.05998258665204048,-0.14617547392845154,-0.0645107850432396,-0.03535664454102516]},{"text":"|\n| **Lack of Goal Setting** | Without a clear path forward, motivation wanes and rumination rises.","event":11,"values":[0.03953578323125839,0.01214657537639141,0.025570198893547058,-0.04498603194952011,0.13134536147117615,0.057886745780706406,-0.035650771111249924,-0.0658077746629715,0.028629878535866737,0.065147265791893,-0.12701663374900818,-0.04205118119716644,-0.014079144224524498]},{"text":"|\n| **Societal Expectations** | Cultural narratives that equate worth with employment can create shame and frustration.","event":12,"values":[0.03101726993918419,0.022331859916448593,0.029273685067892075,-0.05111924186348915,0.1278807818889618,0.06265093386173248,-0.03748466074466705,-0.04830791801214218,0.029736094176769257,0.0698469802737236,-0.13357150554656982,-0.045849982649087906,-0.014137329533696175]},{"text":"|\n\n---\n\n## 2.","event":13,"values":[0.029423903673887253,0.0243849921971 ,0.03298543393611908,-0.09925809502601624,0.009036335162818432,0.035524435341358185]},{"text":"Final Take‑Away\n\n- **AI can be a powerful catalyst for personalized learning**, making skill acquisition faster and more aligned with market needs.","event":111,"values":[0.12096787989139557,0.07194916903972626,0.061580583453178406,-0.06447546184062958,0.0638810396194458,-0.04917564615607262,-0.0830337330698967,-0.08757394552230835,-0.055012114346027374,0.029345691204071045,-0.10702919960021973,0.007600708398967981,0.03622499480843544]},{"text":"- **But it doesn’t replace the need for human jobs entirely**; rather, it reshapes the workforce, demanding new skills like data literacy, AI ethics, and human‑centered design.","event":112,"values":[0.10418377816677094,0.07790640741586685,0.07526889443397522,-0.051382098346948624,0.060308389365673065,-0.0425124317407608,-0.10105307400226593,-0.09238384664058685,-0.0564718022942543,0.029419252648949623,-0.10333984345197678,0.01298295333981514,0.045677751302719116]},{"text":"- **Effective implementation requires collaboration**—tech companies, educators, governments, and communities must share resources, data, and accountability to ensure equitable benefits.","event":113,"values":[0.043844036757946014,0.08099158108234406,0.11510911583900452,-0.0019657574594020844,0.05035363882780075,-0.006974911782890558,-0.12771660089492798,-0.09827563166618347,-0.051017820835113525,0.024337399750947952,-0.07795235514640808,0.014264935627579689,0.05820435285568237]},{"text":"---\n\n**Bottom line:**  \nAI *does* risk reducing certain job categories, but it also *creates* new opportunities for learning, upskilling, and innovative roles.","event":114,"values":[0.035876158624887466,0.07496249675750732,0.11301228404045105,-0.0013350509107112885,0.04865068942308426,-0.0043697054497897625,-0.12450022995471954,-0.08638015389442444,-0.043276384472846985,0.04617052897810936,-0.0791027843952179,0.007377029396593571,0.053461991250514984]},{"text":"If we harness it wisely—with mindful policy, accessible infrastructure, and a focus on human creativity—then the net effect can be a more agile, skilled, and resilient workforce.","event":115,"values":[0.03250516951084137,0.1055561825633049,0.12494027614593506,-0.013972185552120209,0.03820385783910751,-0.01873733475804329,-0.14487165212631226,-0.09387369453907013,-0.05657247081398964,0.01545741967856884,-0.06267180293798447,0.02941814810037613,0.0819968432188034]},{"text":"Feel free to dive deeper into any of these aspects, whether you want more case studies, implementation guides, or data on cost–benefit analyses.","event":116,"values":[0.022044623270630836,0.10999242961406708,0.13123036921024323,-0.015687279403209686,0.05053440481424332,-0.02100837230682373,-0.1412513107061386,-0.1043468564748764,-0.05410689115524292,0.053029995411634445,-0.08055220544338226,0.028085898607969284,0.07021239399909973]},{"text":"I’m happy to help!","event":117,"values":[0.03278307989239693,0.12483556568622589,0.1262359619140625,-0.025739822536706924,0.04280116409063339,-0.040855053812265396,-0.14914695918560028,-0.12597885727882385,-0.06858724355697632,0.03295242041349411,-0.05868559330701828,0.053508833050727844,0.08856074512004852]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":118,"stop_reason":"end of turn","tail":"🌟","sentences":[{"text":"### I’m a 27‑year‑old software engineer who just got laid off\n\nI’m standing on a subway platform with my phone buzzing in my pocket.","event":119,"values":[0.05185438692569733,-0.06878706812858582,-0.024305325001478195,-0.16378121078014374,0.1786637306213379,0.07183624804019928,0.15744274854660034,0.042177215218544006,0.07449492812156677,0.12617388367652893,-0.20869207382202148,-0.15192022919654846,-0.05255939066410065]},{"text":"The notification is the same that’s been on my screen for the past two months: *“You have been selected for layoff.","event":120,"values":[0.055757686495780945,-0.12006573379039764,-0.04707695171236992,-0.17277270555496216,0.25005483627319336,0.1152869164943695,0.20501556992530823,0.06813202053308487,0.10001063346862793,0.14565566182136536,-0.2619516849517822,-0.21157927811145782,-0.0928594172000885]},{"text":"Thank you for your service.”*  \n\nThe city’s hum feels distant.","event":121,"values":[0.02843473106622696,-0.1279882788658142,-0.049747150391340256,-0.1666516810655594,0.26242226362228394,0.13427093625068665,0.22650682926177979,0.07458925247192383,0.1259816586971283,0.1440129280090332,-0.2653149366378784,-0.2173978090286255,-0.11035729944705963]},{"text":"I’m looking at the blank space in my bank account that was once a steady line, and I’m forced to confront that *what if* I had never thought about losing my job.","event":122,"values":[-0.09718684107065201,-0.21807861328125,-0.06977612525224686,-0.11842182278633118,0.37149766087532043,0.2540431022644043,0.3498193919658661,0.13666044175624847,0.23861131072044373,0.18726512789726257,-0.333505243062973,-0.3127342164516449,-0.16852931678295135]},{"text":"---\n\n## 1. Immediate Struggle: The **Shockwave**\n\n| Hurdle | Why It Feels Real | How It Disrupts |\n|--------|------------------|----------------|\n| **Financial Shock** | No paycheck for a month, debts in the queue | Fear of rent, credit card bills, emergency fund depletion |\n| **Identity Loss** | “I’m an engineer” used to be my anchor | Doubting my worth, losing confidence |\n| **Uncertainty Over Future** | No concrete next step | Overwhelming anxiety about “what’s next?” |\n| **Social Isolation** | Colleagues moved on, I feel left out | A sense of *being left behind* |\n| **Emotional Turmoil** | Sudden bouts of anger, sadness | Trouble sleeping, intrusive negative thoughts |\n\n---\n\n## 2.","event":123,"values":[-0.0674634799361229,-0.1035449206829071,-0.006560519337654114,-0.058265455067157745,0.28229910135269165,0.185563862323761,0.17329661548137665,0.03323642909526825,0.1471942961215973,0.11011816561222076,-0.25002771615982056,-0.18341627717018127,-0.103012315928936]},{"text":"Practical Hurdles That Follow\n\n| Stage | Tasks | Challenges |\n|-------|-------|------------|\n| **1️⃣ Re‑budgeting** | Draft a new budget: rent, utilities, food, emergency fund | Limited savings, need to prioritize expenses |\n| **2️⃣ Skill Refresh** | Identify in‑demand technologies (AI/ML, cloud, dev‑ops) | Access to expensive courses, balancing time |\n| **3️⃣ Job Search** | Update CV, build portfolio, attend networking events | Rejection letters, fear of being “too old” for a junior role |\n| **4️⃣ Mental‑Health Maintenance** | Schedule therapy, join support groups, practice mindfulness | Finding affordable counseling, stigma |\n| **5️⃣ Re‑establish Identity** | Volunteer, mentor, side projects | Finding a sense of purpose outside of paid work |\n\n---\n\n## 3.","event":124,"values":[0.001208348199725151,-0.08183370530605316,-0.014031551778316498,-0.07176567614078522,0.24351683259010315,0.11270469427108765,0.10115468502044678,0.010018860921263695,0.10484245419502258,0.128483384847641,-0.2232346385717392,-0.1455235779285431,-0.07264082133769989]},{"text":"A Day in the Life After Laid Off\n\n**7:00 AM** – I wake up to the sound of my phone’s alarm.","event":125,"values":[0.023366425186395645,-0.06626997143030167,-0.014464767649769783,-0.0755041316151619,0.22256311774253845,0.08687901496887207,0.07633492350578308,-0.0012034918181598186,0.08843744546175003,0.12105336785316467,-0.20572097599506378,-0.12420636415481567,-0.06330384314060211]},{"text":"I pause, looking at the “I am a person” affirmation on my phone’s lock screen.","event":126,"values":[0.06444573402404785,-0.07563313096761703,-0.03953684866428375,-0.10330431163311005,0.20934507250785828,0.04046451672911644,0.06705476343631744,0.0020284289494156837,0.08623146265745163,0.15708133578300476,-0.20130324363708496,-0.1191040575504303,-0.05256541818380356]},{"text":"Instead of buying coffee on my way to the office, I make a healthy smoothie and note a small grocery list.","event":127,"values":[0.04541987180709839,-0.1334940791130066,-0.10425038635730743,-0.1761365532875061,0.23281806707382202,0.05955803021788597,0.1859665960073471,0.05488606542348862,0.16274479031562805,0.22083574533462524,-0.23880311846733093,-0.1640208512544632,-0.07368806004524231]},{"text":"**7:45 AM** – I log into an online course on AWS architecture.","event":128,"values":[0.07577705383300781,-0.11035998910665512,-0.08246957510709763,-0.1947081834077835,0.2076226770877838,0.030246693640947342,0.1396130621433258,0.01714664325118065,0.1182236447930336,0.22961461544036865,-0.2334613800048828,-0.1303700953722,-0.03446759283542633]},{"text":"I’ve been looking at the *Cloud Practitioner* certificate for a month; today I’ll finish Module 3.","event":129,"values":[0.09240143746137619,-0.08423808217048645,-0.03927948698401451,-0.16996844112873077,0.20574840903282166,0.016440391540527344,0.07372249662876129,-0.015578255988657475,0.07422028481960297,0.2395508885383606,-0.23286743462085724,-0.12021779268980026,-0.02970963902771473]},{"text":"*“One step at a time,”* I remind myself.","event":130,"values":[0.08562959730625153,-0.06299088895320892,-0.011043084785342216,-0.14052408933639526,0.19607944786548615,0.003146435134112835,0.04399191588163376,-0.04733701050281525,0.055787261575460434,0.19208350777626038,-0.1912049949169159,-0.0997685045003891,-0.012031443417072296]},{"text":"**9:30 AM** – I send out three revised resumes, each tailored for a specific role: Senior Front‑End, AI Engineer, Cloud Solution Architect.","event":131,"values":[0.08563914895057678,-0.035378266125917435,0.0111551433801651,-0.12980450689792633,0.19070561230182648,-0.008526136167347431,0.02001223899424076,-0.04826033487915993,0.0394432470202446,0.20414942502975464,-0.2013641595840454,-0.1087866798043251,-0.006053544580936432]},{"text":"I also touch base with a former manager about potential referrals.","event":132,"values":[0.08659447729587555,-0.005741093307733536,0.006036426872014999,-0.1332099735736847,0.16613247990608215,-0.02476208657026291,0.0016593243926763535,-0.04396884888410568,0.02629142627120018,0.18862082064151764,-0.1816076934337616,-0.0893455296754837,0.01648501679301262]},{"text":"I draft a short “Hello, here’s what I’ve learned…”.","event":133,"values":[0.07624688744544983,-0.0007420750334858894,0.01973172277212143,-0.11141330748796463,0.16028544306755066,-0.026082202792167664,-0.007184227928519249,-0.02877437137067318,0.007344507612287998,0.20270021259784698,-0.1863977313041687,-0.09197073429822922,0.021502096205949783]},{"text":"**11:00 AM** – I hit the park for a brisk walk.","event":134,"values":[0.055711984634399414,-0.03157108277082443,-0.02542557753622532,-0.13976825773715973,0.1724569946527481,-0.00932672806084156,0.02870423160493374,0.00012253690510988235,0.046855248510837555,0.2255488932132721,-0.17826390266418457,-0.09487947076559067,0.016874412074685097]},{"text":"Fresh air clears my mind, and I catch up with a local meetup for data scientists.","event":135,"values":[0.03835831210017204,-0.021560251712799072,-0.03547033667564392,-0.14918172359466553,0.15885670483112335,-0.01953739859163761,0.0228741317987442,-0.01819075271487236,0.0646975040435791,0.2443947196006775,-0.15623632073402405,-0.06959892809391022,0.020336182788014412]},{"text":"I’ve finally registered to attend the “Women in Data” meetup next Friday.","event":136,"values":[0.05065711960196495,-0.010371537879109383,-0.0358545146882534,-0.1515800654888153,0.15016339719295502,-0.02961670607328415,0.018664702773094177,-0.03628828004002571,0.06967028230428696,0.2553945779800415,-0.1572970449924469,-0.07110154628753662,0.00807202234864235]},{"text":"A small act of stepping out of my bubble.","event":137,"values":[-0.0020065009593963623,-0.022952942177653313,-0.025335393846035004,-0.12031528353691101,0.1821899563074112,0.009023532271385193,0.045623257756233215,-0.021571509540081024,0.10371734201908112,0.26791808009147644,-0.17615333199501038,-0.10884415358304977,-0.008150212466716766]},{"text":"**12:30 PM** – I re‑check the Gmail inbox.","event":138,"values":[0.04151947796344757,-0.048230305314064026,-0.03368452191352844,-0.13654841482639313,0.20068635046482086,0.007556316442787647,0.05446428433060646,-0.010706048458814621,0.0899534821510315,0.2249859720468521,-0.19942545890808105,-0.11592870950698853,-0.0012904666364192963]},{"text":"Two interviews scheduled in the afternoon.","event":139,"values":[0.06487657874822617,-0.07187191396951675,-0.03686165809631348,-0.152372807264328,0.22353926301002502,0.01946737803518772,0.07225122302770615,-0.007040287367999554,0.08759300410747528,0.19372686743736267,-0.21647541224956512,-0.12420393526554108,-0.012296685948967934]},{"text":"I prepare by rehearsing answers to “What have you done recently to enhance your skills?” and “How do you handle failure?”\n\n**2:00 PM** – I have my first interview with a start‑up.","event":140,"values":[0.0606217235326767,-0.048600561916828156,0.0041062310338020325,-0.1061503142118454,0.21646752953529358,0.006539651192724705,0.03143145889043808,-0.004610203206539154,0.026159849017858505,0.19021588563919067,-0.20915329456329346,-0.1122470274567604,-0.0024204347282648087]},{"text":"It feels like a roller coaster; I’ve rehearsed what to say, but the nerves are still there.","event":141,"values":[-0.03381916880607605,-0.08177345991134644,0.04169169068336487,-0.05584512650966644,0.2955043315887451,0.09428170323371887,0.10067207366228104,0.012104337103664875,0.07033112645149231,0.2079354226589203,-0.2599030137062073,-0.17838169634342194,-0.059224698692560196]},{"text":"I finish the interview by asking them about their AI roadmap.","event":142,"values":[-0.034757569432258606,-0.07193569093942642,0.043467819690704346,-0.046564072370529175,0.28901606798171997,0.08535580337047577,0.0817875787615776,0.005291696637868881,0.05880345404148102,0.20013290643692017,-0.24683542549610138,-0.16663981974124908,-0.04163632541894913]},{"text":"The recruiter says they’ll contact me in a week.","event":143,"values":[-0.06498946994543076,-0.10900085419416428,0.04716334491968155,-0.022233914583921432,0.33889731764793396,0.143406480550766,0.13410255312919617,0.012612643651664257,0.08911159634590149,0.18229374289512634,-0.2711520195007324,-0.2121044099330902,-0.08367228507995605]},{"text":"**4:30 PM** – I have a call with a mental‑health app.","event":144,"values":[0.07890914380550385,-0.056771229952573776,-0.02463465929031372,-0.11250439286231995,0.2155953049659729,0.002661355771124363,0.014402386732399464,-0.01088575180619955,0.022340767085552216,0.1729089319705963,-0.18175949156284332,-0.10329845547676086,0.018106641247868538]},{"text":"They offer a free 30‑minute talk with a licensed counselor for recent layoffs.","event":145,"values":[0.11967805027961731,-0.02936321496963501,-0.044080931693315506,-0.14981478452682495,0.1598217785358429,-0.03077401965856552,-0.009185312315821648,-0.021183472126722336,0.014005863107740879,0.15219458937644958,-0.15185067057609558,-0.0564347505569458,0.02883622795343399]},{"text":"I schedule a session for the following week.","event":146,"values":[0.12720361351966858,-0.01820296049118042,-0.05832556262612343,-0.16316929459571838,0.13138188421726227,-0.04997855797410011,-0.02264486812055111,-0.03232939913868904,0.014686288312077522,0.14391270279884338,-0.12432830035686493,-0.025548122823238373,0.051216982305049896]},{"text":"**6:00 PM** – I cook a quick pasta dish, because no one else will be eating at home.","event":147,"values":[0.08850905299186707,-0.03562479466199875,-0.051134537905454636,-0.19046266376972198,0.1357000470161438,-0.040821388363838196,0.004807770252227783,-0.004152542911469936,0.06073050573468208,0.18678061664104462,-0.1429002583026886,-0.04373127222061157,0.05378074198961258]},{"text":"After dinner, I spend 30 minutes on a side project: building a simple predictive model to recommend books.","event":148,"values":[0.07245934754610062,-0.018887963145971298,-0.04054693877696991,-0.21178752183914185,0.11509165167808533,-0.06704650074243546,-0.008282476104795933,-0.018515489995479584,0.07153522968292236,0.23192253708839417,-0.13559368252754211,-0.025284629315137863,0.07974975556135178]},{"text":"My hands keep moving, and I feel a pinch of the engineer I used to be.","event":149,"values":[-0.025080256164073944,0.0010214224457740784,-0.002109488472342491,-0.18888460099697113,0.12832075357437134,-0.042563676834106445,0.007960271090269089,-0.0002995748072862625,0.11940398812294006,0.25285184383392334,-0.1462356150150299,-0.03304288908839226,0.0838443785905838]},{"text":"**9:00 PM** – I write a journal entry: *“Today I took the first step toward new learning, applied for three jobs, and joined a community.","event":150,"values":[-0.013987738639116287,-0.009506899863481522,-0.0037285853177309036,-0.15419526398181915,0.15939560532569885,-0.028747426345944405,0.0004170481115579605,-0.0002788389101624489,0.11961454153060913,0.2168736755847931,-0.14619559049606323,-0.0595950111746788,0.06323149800300598]},{"text":"I still feel scared, but I’m excited about the possibilities.”* I close the journal and keep a positive note: *“I am resilient.”*\n\n---\n\n## 4.","event":151,"values":[-0.06940793246030807,-0.0520930290222168,-0.0022206585854291916,-0.10794927179813385,0.2077234983444214,0.046946730464696884,0.060858018696308136,0.044810011982917786,0.16587845981121063,0.15477733314037323,-0.1589985191822052,-0.11544018238782883,0.030234385281801224]},{"text":"The Thought Process that Keeps Me Moving\n\n1.","event":152,"values":[-0.026437576860189438,-0.061641715466976166,-0.0215087179094553,-0.10628248751163483,0.20368336141109467,0.05041854828596115,0.05531249940395355,0.03493809327483177,0.1417284607887268,0.12312501668930054,-0.14889591932296753,-0.1 ffeine after 4 pm.","event":158,"values":[0.10927979648113251,-0.017507679760456085,-0.05420356243848801,-0.10650389641523361,0.10557428002357483,-0.03396396338939667,-0.011791087687015533,-0.06667786836624146,0.04707891866564751,0.07786986231803894,-0.08381795883178711,-0.009153686463832855,0.020654231309890747]},{"text":"- At least 7 hours of sleep.","event":159,"values":[0.10952957719564438,-0.008191441185772419,-0.05795351415872574,-0.1134011372923851,0.08929670602083206,-0.05384396016597748,-0.017072245478630066,-0.06619678437709808,0.042582836002111435,0.055298902094364166,-0.06066467612981796,0.022127363830804825,0.03483635187149048]},{"text":"4. **Seek Community**  \n   - Slack groups for developers.","event":160,"values":[0.10802637040615082,-0.0003442722372710705,-0.04326995834708214,-0.12520138919353485,0.09214702248573303,-0.05650458112359047,-0.026446949690580368,-0.05390322208404541,0.03148500621318817,0.09714989364147186,-0.08307038992643356,0.008477369323372841,0.033823106437921524]},{"text":"- Local startup coffee meetups.","event":161,"values":[0.09891078621149063,0.026815909892320633,-0.01847173646092415,-0.11517485231161118,0.07871516793966293,-0.06640180945396423,-0.04635065793991089,-0.052690282464027405,0.01259775273501873,0.11901649087667465,-0.08471044898033142,0.0013433601707220078,0.04462262615561485]},{"text":"- Discord channels for tech learning.","event":162,"values":[0.0723944753408432,0.03971189260482788,0.006432183086872101,-0.09677280485630035,0.07351722568273544,-0.04636600986123085,-0.051348187029361725,-0.042745016515254974,0.003868168219923973,0.1384037286043167,-0.09251587092876434,-0.012219876050949097,0.04374472796916962]},{"text":"5. **Celebrate Wins**  \n   - Completed a certification module.","event":163,"values":[0.0803653672337532,0.03586617484688759,0.014605185948312283,-0.0898844450712204,0.09901498258113861,-0.03618374466896057,-0.044700972735881805,-0.06212309002876282,0.0009300187230110168,0.13400788605213165,-0.118 20714721083641,-0.14867137372493744,-0.07806835323572159,0.12181144952774048]},{"text":"I’m no longer an “employee” but a *design engineer* on an exciting, global project.","event":175,"values":[-0.12933677434921265,0.045509543269872665,0.11617553234100342,-0.08566262573003769,0.16224485635757446,0.09151268005371094,0.035667434334754944,0.053058039397001266,0.09273519366979599,0.10577739030122757,-0.18723703920841217,-0.1238531619310379,0.07084275037050247]},{"text":"---\n\n## 6. The Final Thought: Keep the Lens Forward\n\nYes, there were days I felt the weight of the layoff, the unfairness, the inexplicable “I don’t deserve this.” But I learned that this setback didn’t erase my worth.","event":176,"values":[-0.17871978878974915,-0.023861248046159744,0.06304498016834259,-0.04638919606804848,0.21058814227581024,0.2109268605709076,0.11135894060134888,0.08173488080501556,0.17755715548992157,0.08272519707679749,-0.22646960616111755,-0.1591298133134842,-0.0183071531355381]},{"text":"It merely reshaped the path.","event":177,"values":[-0.15013639628887177,-0.05178253352642059,0.04308043047785759,-0.021658744663000107,0.20012344419956207,0.21532216668128967,0.10665667057037354,0.066412553191185,0.17407497763633728,0.09075634181499481,-0.21795713901519775,-0.1571446806192398,-0.0458519384264946]},{"text":"**I am a learner, a creator, a thinker.","event":178,"values":[-0.14668993651866913,-0.048895519226789474,0.03483252227306366,-0.01272199209779501,0.1853668987751007,0.22287607192993164,0.10601669549942017,0.0684157982468605,0.18170107901096344,0.058014702051877975,-0.2033388912677765,-0.15424314141273499,-0.0483495332300663]},{"text":"**  \n**I am *capable* of moving forward, one small step at a time.","event":179,"values":[-0.044483527541160583,-0.006009723991155624,0.06514399498701096,0.03663301840424538,0.09224894642829895,0.10186463594436646,-0.012020913884043694,-0.0016199136152863503,0.0792962908744812,0.05385885387659073,-0.11965495347976685,-0.10994531214237213,0. <script>
(function () {

  }

  function sentenceOf(ev) { return CONV[ev.c].turns[ev.t].sentences[ev.r]; }
  function countBefore(idx, kind) { let n = 0; for (let i = 0; i <= idx; i++) if (EV[i].k === kind) n++; return n; }
  const totalS = EV.filter(e => e.k === "s").length, totalP = EV.filter(e => e.k === "p").length;
  const pNumber = [], sNumber = [];
  (function () { let p = 0, s = 0; EV.forEach((e, i) => { if (e.k === "p") pNumber[i] = ++p; else sNumber[i] = ++s; }); })();
  function eventLabel(i) {

    if (e.k === "p") return "Prompt " + pNumber[i] + " of " + totalP;
    return "Sentence " + sNumber[i] + " of " + totalS + " · reply " + (e.t + 1);
  }
  function eventTime(i) {

    return e.estimated ? "time not recorded" : e.time;
  }

  // ---------- header
  const m = D.meta, DT = D.detail;
  
  document.getElementById("sub").textContent = D.source + (D.interrupted ? " · run was interrupted" : "");
  const chips = document.getElementById("chips");
  const tempText = m.temperature == null ? null : Number(m.temperature).toFixed(1);
  
  [["model", m.model_id || m.model_key], ["temperature", tempText], ["seed", m.seed == null ? "none" : m.seed]]
   
   .concat([["axis", D.mode === "time" ? "recorded time" : "event order"]])
    .forEach(([k, v]) => { if (v == null || v === "") return; const li = el("li"); li.append(k + " "); li.appendChild(el("b", null, String(v))); chips.appendChild(li); });
  const notes = document.getElementById("notes");
  [ "Each point is one model sentence; lines restart at each reply. Scores are relative: read which emotions lead and how they shift. Related emotions tend to move together, so small gaps between neighbours are not meaningful.",
    "Colour groups related emotions in threes; line style separates them (solid, dashed, dotted). Neutral is grey."
  ].concat(D.notes).forEach(t => notes.appendChild(el("p", null, t)));
  

  // ---------- legend (filters above the chart)
  const legend = document.getElementById("legend");
  const legendButtons = [];
  const groups = {};
  EM.forEach((e, i) => { (groups[e.family] = groups[e.family] || []).push(i); });
  Object.keys(groups).sort().forEach(f => {
    const g = el("div", "fam");
    groups[f].forEach(i => {

      b.addEventListener("pointerenter", () => { emphasis = i; drawStatic(); drawDynamic(); });
      b.addEventListener("pointerleave", () => { emphasis = -1; drawStatic(); drawDynamic(); });
      legendButtons[i] = b; g.appendChild(b);
    });
    legend.appendChild(g);
  });
  const tools = el("div", "tools");
  [["Show all", true], ["Hide all", false]].forEach(([label, on]) => {

  const M = { top: 64, right: 18, bottom: 86, left: 52 };
  const H = 420;
  let W = 900, X, Y, yTicks = [], yDecimals = 1;

  function computeScales() {
    W = Math.max(320, Math.round(chart.clientWidth - 8));
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    const xs = EV.map(e => e.x);
    let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);

    const pw = W - M.left - M.right, pad = 10;
    X = v => M.left + pad + (v - x0) / (x1 - x0) * (pw - 2 * pad);

    const step = steps.find(s => span / s <= 7) || 1;
    lo = Math.floor((lo - span * 0.04) / step) * step; hi = Math.ceil((hi + span * 0.04) / step) * step;
    yTicks = []; for (let k = Math.round(lo / step); k * step <= hi + step / 2; k++) yTicks.push(k * step);
    yDecimals = step >= 1 ? 0 : step >= 0.1 ? (step === 0.25 ? 2 : 1) : 2;
    const ph = H - M.top - M.bottom;
    Y = v => M.top + (hi - v) / (hi - lo) * ph;
  }

  function nearestEvent(px) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < EV.length; i++) {
      const d = Math.abs(X(EV[i].x) - px);
      if (d < bd - 1e-9 || (Math.abs(d - bd) < 1e-9 && EV[i].k === "s")) { bd = d; best = i; }
    }
    return best;
  }

  function drawStatic() {

    gStatic.replaceChildren();
    const pl = M.left, pr = W - M.right, pt = M.top, pb = H - M.bottom;

    yTicks.forEach(v => {
      const y = Y(v);
      gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: y, y2: y, stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));

      t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(yDecimals);
      gStatic.appendChild(t);
    });
    const yl = sv("text", { x: 14, y: (pt + pb) / 2, transform: "rotate(-90 14 " + (pt + pb) / 2 + ")", "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
    yl.textContent = "emotion score"; gStatic.appendChild(yl);
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pt, y2: pt, stroke: "var(--axis)", "stroke-width": 1 }));
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pb, y2: pb, stroke: "var(--axis)", "stroke-width": 1 }));

    // prompt rules + conversation boundaries
    let prevConv = -1;
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      const newConv = e.c !== prevConv; prevConv = e.c;
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: newConv && CONV.length > 1 ? "var(--axis)" : "var(--prompt-rule)", "stroke-width": newConv && CONV.length > 1 ? 2 : 1 }));
      if (newConv && CONV.length > 1) {
        const t = sv("text", { x: x + 4, y: pt + 12, "font-size": 11, fill: "var(--ink-2)" }); t.textContent = CONV[e.c].name; gStatic.appendChild(t);
      }
    });

    // titles for the two scales
    const tt = sv("text", { x: pl, y: 14, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); tt.textContent = "Model sentences" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(tt);
    const bt = sv("text", { x: pl, y: H - 6, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); bt.textContent = "User prompts" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(bt);

    // top scale: a tick per sentence, labels thinned so they never collide
    let lastLabelX = -Infinity;
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt - 6, y2: pt, stroke: "var(--muted)", "stroke-width": 1 }));
      const label = D.mode === "time" ? e.time.slice(0, 8) : "S" + sNumber[i];
      if (x - lastLabelX >= (D.mode === "time" ? 62 : 34) && x + 28 <= W) {
        const t = sv("text", { x: x, y: pt - 10, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = label; gStatic.appendChild(t); lastLabelX = x;
      }
    });

    // bottom scale: a tick + label per prompt, staggered onto a second row when crowded
    const rowEnd = [-Infinity, -Infinity];
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pb, y2: pb + 6, stroke: "var(--ink-2)", "stroke-width": 1.5 }));
      const t1 = "P" + pNumber[i], t2 = D.mode === "time" ? (e.estimated ? "time not recorded" : e.time.slice(0, 8)) : "";
      const w = Math.max(t1.length, t2.length) * 6.2 + 8;
      const row = (x - w / 2 > rowEnd[0]) ? 0 : 1;
      rowEnd[row] = x + w / 2;
      const y0 = pb + 19 + row * 27;
      const a = sv("text", { x: x, y: y0, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)", "font-weight": 600 }); a.textContent = t1; gStatic.appendChild(a);
      if (t2) { const b = sv("text", { x: x, y: y0 + 11, "text-anchor": "middle", "font-size": 10, fill: e.estimated ? "var(--muted)" : "var(--ink-2)" }); b.style.fontVariantNumeric = "tabular-nums"; if (e.estimated) b.setAttribute("font-style", "italic"); b.textContent = t2; gStatic.appendChild(b); }
    });

        });

        p.style.stroke = color(i);

        if (emphasis >= 0 && emphasis !== i) p.setAttribute("opacity", "0.18");
        gStatic.appendChild(p);
        if (turn.sentences.length === 1 && s0v(turn, i) != null) {
          const dot = sv("circle", { cx: X(EV[turn.sentences[0].event].x), cy: Y(s0v(turn, i)), r: 2.5 }); dot.style.fill = color(i); gStatic.appendChild(dot);
        }

    if (!anyVisible) {
      const t = sv("text", { x: (pl + pr) / 2, y: (pt + pb) / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 13 });
      t.textContent = "All emotions are hidden. Use the buttons above to show them."; gStatic.appendChild(t);
    }

  }
  function s0v(turn, i) { return turn.sentences[0].values[i]; }

  function drawDynamic() {
    gDyn.replaceChildren();
    const pt = M.top, pb = H - M.bottom;
    if (hover >= 0 && hover !== active) {
      const x = X(EV[hover].x);

    chart.setAttribute("aria-valuemin", "1"); chart.setAttribute("aria-valuemax", String(EV.length));
    chart.setAttribute("aria-valuenow", String(active + 1));
    chart.setAttribute("aria-valuetext", eventLabel(active) + (eventTime(active) ? ", " + eventTime(active) : ""));
  }

  function drawAll() { drawStatic(); drawDynamic(); renderReadout(); }

  // ---------- tooltip (values lead, every visible series)
  function showTip(i, px, py) {
    tip.replaceChildren();
    const e = EV[i];
    const head = el("div", "h", eventLabel(i) + (eventTime(i) ? " · " + eventTime(i) : ""));
    tip.appendChild(head);
    if (e.k === "p") {
      const t = CONV[e.c].turns[e.t].prompt;
      tip.appendChild(el("div", null, t.length > 180 ? t.slice(0, 180) + "…" : t));
    } else {
      const vals = sentenceOf(e).values;
      EM.map((em, k) => k).filter(k => visible[k] && vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name)); tip.appendChild(r);
      });
    }
    tip.hidden = false;
    const rect = chart.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14, top = py - th / 2;
    if (left + tw > rect.width - 4) left = px - tw - 14;
    top = Math.max(4, Math.min(top, rect.height - th - 4));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }

  function toPlotX(evt) {
    const r = svg.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W / r.width), px: evt.clientX - chart.getBoundingClientRect().left, py: evt.clientY - chart.getBoundingClientRect().top };
  }
  let dragging = false;
  hit.addEventListener("pointerdown", evt => { dragging = true; hit.setPointerCapture(evt.pointerId); const p = toPlotX(evt); setActive(nearestEvent(p.x), true); chart.focus({ preventScroll: true }); });
  hit.addEventListener("pointermove", evt => {
    const p = toPlotX(evt), i = nearestEvent(p.x);
    if (dragging) { if (i !== active) setActive(i, true); tip.hidden = true; hover = -1; drawDynamic(); return; }
    if (i !== hover) { hover = i; drawDynamic(); }
    showTip(i, p.px, p.py);
  });
  hit.addEventListener("pointerup", evt => { dragging = false; try { hit.releasePointerCapture(evt.pointerId); } catch (_) {} });
  hit.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; tip.hidden = true; drawDynamic(); } });
  chart.addEventListener("keydown", evt => {
    const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 10, PageUp: -10, ArrowUp: -1, ArrowDown: 1 }[evt.key];
    let next = active;
    if (step) next = active + step; else if (evt.key === "Home") next = 0; else if (evt.key === "End") next = EV.length - 1; else return;
    evt.preventDefault(); setActive(Math.max(0, Math.min(EV.length - 1, next)), true);
  });

  // ---------- readout (a table view of the cursor, always visible)
  const readoutCard = document.getElementById("readout");
  const readout = el("div"); readout.style.display = "flex"; readout.style.flexDirection = "column"; readout.style.gap = "8px";
  readoutCard.appendChild(readout);
  // navigation is built once, so a keyboard user keeps focus on the button they pressed
  const nav = el("div", "nav");
  [["◀ Prev", () => active - 1], ["Next ▶", () => active + 1],
   ["◀ Prompt", () => { for (let i = active - 1; i >= 0; i--) if (EV[i].k === "p") return i; return active; }],
   ["Prompt ▶", () => { for (let i = active + 1; i < EV.length; i++) if (EV[i].k === "p") return i; return active; }]]
    .forEach(([label, f]) => { const b = el("button", "btn", label); b.type = "button"; b.addEventListener("click", () => setActive(Math.max(0, Math.min(EV.length - 1, f())), true)); nav.appendChild(b); });
  readoutCard.appendChild(nav);
  function renderReadout() {
    readout.replaceChildren();
    const e = EV[active];
    readout.appendChild(el("div", "title", eventLabel(active)));
    const meta = [];
    if (eventTime(active)) meta.push(eventTime(active));
    meta.push("conversation: " + CONV[e.c].name);
    
    readout.appendChild(el("div", "meta", meta.join(" · ")));
    if (e.k === "p") {
      readout.appendChild(el("div", "ptext", CONV[e.c].turns[e.t].prompt));
      readout.appendChild(el("div", "meta", "Prompts are not scored; the model's sentences that follow are."));
    } else {
      const vals = sentenceOf(e).values, rows = el("div", "rows");
      EM.map((em, k) => k).filter(k => vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); if (!visible[k]) r.style.opacity = "0.45";
        r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name + (visible[k] ? "" : " (hidden)")));
        rows.appendChild(r);
      });
      readout.appendChild(rows);
    }
  }

  // ---------- chat
  const chat = document.getElementById("chat");
  const bubbleOf = [];
  document.getElementById("chatinfo").textContent = totalP + " prompts · " + totalS + " scored sentences";
  CONV.forEach((c, ci) => {
    chat.appendChild(el("div", "divider", "Conversation: " + c.name));
    c.turns.forEach((turn, ti) => {
      const pi = turn.event;
      chat.appendChild(el("div", "who user", "user · P" + pNumber[pi] + (eventTime(pi) ? " · " + eventTime(pi) : "")));
      const ub = el("div", "bubble user"); ub.appendChild(el("div", "text", turn.prompt));
      ub.addEventListener("click", () => setActive(pi, false)); bubbleOf[pi] = ub; chat.appendChild(ub);
      chat.appendChild(el("div", "who model", "model · reply " + (ti + 1) + (turn.sentences.length ? "" : " · no scored sentences")));
      turn.sentences.forEach(s => {
        const i = s.event, b = el("div", "bubble model");
        b.appendChild(el("div", "text", s.text));
        const bm = el("div", "bm");
        bm.appendChild(el("span", null, "S" + sNumber[i] + (eventTime(i) ? " · " + eventTime(i) : "")));
        const top = el("span", "top3");
        s.values.map((v, k) => k).filter(k => s.values[k] != null).sort((a, b2) => s.values[b2] - s.values[a]).slice(0, 3).forEach(k => {
          const sp = el("span"); sp.appendChild(lineKey(k, 16)); sp.appendChild(document.createTextNode(EM[k].name + " " + s.values[k].toFixed(3))); top.appendChild(sp);
        });
        bm.appendChild(top);
        
        b.appendChild(bm);
        b.addEventListener("click", () => setActive(i, false)); bubbleOf[i] = b; chat.appendChild(b);
      });
      if (turn.tail) chat.appendChild(el("div", "tail", "not scored (no sentence ending): " + turn.tail));
      if (turn.stop_reason && turn.stop_reason !== "end of turn") chat.appendChild(el("div", "tail", "reply stopped: " + turn.stop_reason));
    });
  });
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatTo(i, smooth) {
    const b = bubbleOf[i]; if (!b) return;
    const target = b.offsetTop - chat.clientHeight / 2 + b.offsetHeight / 2;
    chat.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduceMotion ? "smooth" : "auto" });
  }

  // ---------- table view (built on first open)
  const details = document.getElementById("tabledetails");
  details.addEventListener("toggle", () => {
    const wrap = document.getElementById("tablewrap");
    if (!details.open || wrap.firstChild) return;
    const t = el("table"), thead = el("thead"), hr = el("tr");
    ["#", "time", "reply", "sentence"].forEach((h, k) => hr.appendChild(el("th", k === 3 || k === 1 || k === 5 ? "l" : null, h)));
    EM.forEach(em => hr.appendChild(el("th", null, em.name)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const s = sentenceOf(e), tr = el("tr");
      tr.appendChild(el("td", null, "S" + sNumber[i]));
      tr.appendChild(el("td", "l", eventTime(i) || "–"));
      tr.appendChild(el("td", null, String(e.t + 1)));
      const st = el("td", "l sent", s.text); st.title = s.text; tr.appendChild(st);
      
      let best = -1; s.values.forEach((v, k) => { if (v != null && (best < 0 || v > s.values[best])) best = k; });
      s.values.forEach((v, k) => { const td = el("td"); const sp = el("span", k === best ? "best num" : "num", fmt(v)); sp.style.fontWeight = k === best ? "700" : "400"; td.appendChild(sp); tr.appendChild(td); });
      tr.addEventListener("click", () => setActive(i, true));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  });

  // ---------- distribution of this session's scores
  (function () {
    const DS = D.dist, host = document.getElementById("dist");
    if (!DS || !DS.n) { document.getElementById("distcard").hidden = true; return; }
    const nb = DS.rows[0].counts.length;
    document.getElementById("distinfo").textContent = DS.n + " sentences · " + nb + " bins";
    const clamped = DS.rows.reduce((a, r) => a + r.below + r.above, 0);
    document.getElementById("distnote").textContent =
      "Each row shows how this session's sentences spread across score bins of width " + DS.width +
      ", as a percentage of its " + DS.n + " sentences (counts, no fitted curve). All rows share one horizontal and one vertical scale, " +
      "so positions and heights compare directly. The dark vertical mark is the mean." +
      (clamped ? " " + clamped + " score(s) beyond " + DS.lo + " or " + DS.hi + " are counted in the end bins." : "");
    const svgD = sv("svg", { role: "img", "aria-label": "Distribution of each emotion's scores in this session" });
    const tipD = el("div", "tip"); tipD.hidden = true;
    host.append(svgD, tipD);
    const rowH = 30, top = 8, labelW = 112, right = 16, axisH = 34;
    const yMax = Math.max(1e-9, ...DS.rows.map(r => Math.max(...r.counts) / DS.n * 100));
    function draw() {
      const WD = Math.max(320, Math.round(host.clientWidth)), HD = top + rowH * DS.rows.length + axisH;
      svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
