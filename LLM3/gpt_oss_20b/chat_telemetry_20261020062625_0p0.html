42715883255,-0.07339946180582047,-0.08180250227451324,-0.04299517720937729,0.0352138876914978,-0.09817278385162354,-0.007530589587986469,0.020319567993283272]},{"text":"| Anxiety, chronic stress, and in severe cases, depression.","event":6,"values":[0.04404179006814957,0.048382099717855453,0.06923423707485199,-0.04555477201938629,0.11968246102333069,0.03947652131319046,-0.06899629533290863,-0.08141188323497772,-0.037671107798814774,0.03252161666750908,-0.10494820028543472,-0.010946630500257015,0.015307166613638401]},{"text":"|\n| **Loss of routine \u0026 purpose** | No daily structure or clear goals.","event":7,"values":[0.058991242200136185,0.031450606882572174,0.03249479830265045,-0.06035376712679863,0.11922377347946167,0.02776160091161728,-0.05420883372426033,-0.06861215829849243,-0.006849301978945732,0.04615402966737747,-0.09969092905521393,-0.019256509840488434,0.006340872496366501]},{"text":"| Feelings of emptiness, low self‑esteem, and identity confusion.","event":8,"values":[0.04747431352734566,0.03844838589429855,0.006648404523730278,-0.08731965720653534,0.10661346465349197,0.02488444745540619,-0.048614390194416046,-0.04407326877117157,0.03206583857536316,0.053086232393980026,-0.09442684054374695,-0.007497474551200867,0.007294804789125919]},{"text":"|\n| **Social isolation** | Fewer opportunities to interact with peers or mentors.","event":9,"values":[0.05186473950743675,0.041844502091407776,-0.0003211013972759247,-0.0882512703537941,0.08779273927211761,-0.001299411989748478,-0.06260025501251221,-0.02526063099503517,0.0358562096953392,0.07915984094142914,-0.08756212145090103,-0.01024701353162527,0.023483391851186752]},{"text":"| Loneliness, social anxiety, and increased risk of substance misuse.","event":10,"values":[0.034790053963661194,0.04990047216415405,0.0034680720418691635,-0.09686734527349472,0.09489370137453079,0.017969675362110138,-0.05560864508152008,-0.018059732392430305,0.04022961109876633,0.07111217081546783,-0.09726039320230484,-0.0032041710801422596,0.017369307577610016]},{"text":"|\n| **Stigma \u0026 self‑worth** | Perceived as “failed” or “unproductive.” | Low self‑confidence, self‑criticism, and potential for self‑harm ideation.","event":11,"values":[0.020047444850206375,0.028592783957719803,-0.006667032837867737,-0.10347025841474533,0.1256822645664215,0.06273099780082703,-0.019066983833909035,0.004519221372902393,0.05459585040807724,0.06529609858989716,-0.1252160370349884,-0.028825176879763603,-0.004810042679309845]},{"text":"|\n| **Uncertainty about future** | Fear of a bleak career trajectory.","event":12,"values":[0.008185405284166336,0.017993178218603134,-0.005826819688081741,-0.09647408872842789,0.14616531133651733,0.08225936442613602,-0.0012137312442064285,0.006771273910999298,0.06467124819755554,0.06297959387302399,-0.13711141049861908,-0.041455402970314026,-0.021164674311876297]},{"text":"| Heightened rumination, hopelessness, and risk of depressive episodes.","event":13,"values":[0.009878892451524734,0.01823287457227707,0.004386395215988159,-0.08962652832269669,0.1520921289920807,0.08492223918437958,-0.002690059132874012,0.0029410580173134804,0.05507877469062805,0.05772405117750168,-0.14392723143100739,-0.04392354562878609,-0.023968413472175598]},{"text":"|\n| **Exposure to negative media** | Stories of job scarcity and economic downturns.","event":14,"values":[0.03352517634630203,0.013543044216930866,0.015036288648843765,-0.06500252336263657,0.16454438865184784,0.07235975563526154,-0.020568039268255234,-0.012505048885941505,0.03324970602989197,0.07030624151229858,-0.15579648315906525,-0.06258024275302887,-0.03208446502685547]},{"text":"| Heightened fear, paranoia, and generalized anxiety.","event":15,"values":[0.030469626188278198,0.02493077516555786,0.022542376071214676,-0.053113050758838654,0.16414695978164673,0.07861515879631042,-0.029037868604063988,-0.031233150511980057,0.012786166742444038,0.04612421989440918,-0.14753222465515137,-0.04304433614015579,-0.026371926069259644]},{"text":"|\n\n### Why Restlessness Matters\n\n1.","event":16,"values":[0.010918028652668,0.013156842440366745,0.029892882332205772,-0.033083319664001465,0.1807737946510315,0.10258644074201584,-0.014759350568056107,-0.04088238999247551,0.021547390148043633,0.05894695967435837,-0.15755891799926758,-0.06531904637813568,-0.039243169128894806]},{"text":"**Cognitive Overload**  \n   Restlessness often manifests as racing thoughts or an inability to focus.","event":17,"values":[-0.014252495020627975,0.021812357008457184,0.048524271696805954,0.0027956627309322357,0.16799834370613098,0.1048973798751831,-0.017297200858592987,-0.09827099740505219,0.013785738497972488,0.04278627783060074,-0.12895426154136658,-0.03368900343775749,-0.033110372722148895]},{"text":"This can impair decision‑making and problem‑solving—critical skills when searching for a job.","event":18,"values":[-0.011609356850385666,0.009348582476377487,0.04600047320127487,-0.01168038509786129,0.16372549533843994,0.0922478660941124,-0.015929294750094414,-0.0818910077214241,0.03055841103196144,0.07530039548873901,-0.1356893926858902,-0.045807693153619766,-0.030345097184181213]},{"text":"2. **Behavioral Escalation**  \n   Some youths may turn to risky behaviors (e.g., substance use, impulsive spending) as a coping mechanism, which can further deteriorate mental health.","event":19,"values":[0.016259796917438507,0.018010161817073822,0.027202915400266647,-0.06350737065076828,0.144616037607193,0.08278338611125946,-0.027765830978751183,-0.06922831386327744,0.03372027352452278,0.09713837504386902,-0.14642998576164246,-0.03375127539038658,-0.026178697124123573]},{"text":"3. **Social Withdrawal**  \n   The frustration of not finding work can lead to withdrawal from social activities, reinforcing isolation and depressive symptoms.","event":20,"values":[0.014603735879063606,0.01890486106276512,0.01646590605378151,-0.08384239673614502,0.1384476125240326,0.08260676264762878,-0.03523627668619156,-0.043013133108615875,0.04294256120920181,0.09971348941326141,-0.1423739641904831,-0.033577810972929,-0.011769727803766727]},{"text":"4. **Long‑Term Trajectory**  \n   Early‑career unemployment can set a pattern of instability, making it harder to break the cycle later in life.","event":21,"values":[0.026245497167110443,0.030469052493572235,0.01865682192146778,-0.08387107402086258,0.13332413136959076,0.08050191402435303,-0.04716727137565613,-0.05076373741030693,0.02743266150355339,0.08923931419849396,-0.14008724689483643,-0.02835438773036003,-0.010278517380356789]},{"text":"### What Can Help\n\n| **Intervention** | **How It Works** | **Practical Steps** |\n|------------------|------------------|---------------------|\n| **Skill‑building \u0026 up‑skilling** | Keeps the mind engaged and improves employability.","event":22,"values":[0.04899977147579193,0.04738751798868179,0.0381891168653965,-0.06879805028438568,0.10862173140048981,0.01905752532184124,-0.07699814438819885,-0.0657372921705246,0.00577537901699543,0.0847584456205368,-0.11830271780490875,-0.015267602168023586,0.018506314605474472]},{"text":"| Enroll in online courses, attend workshops, or pursue certifications relevant to your interests.","event":23,"values":[0.07566273957490921,0.06422582268714905,0.04814409464597702,-0.07539995014667511,0.08409842848777771,-0.02336953766644001,-0.09099308401346207,-0.07982584834098816,-0.012077649123966694,0.10341773927211761,-0.11548716574907303,-0.007510028779506683,0.028858326375484467]},{"text":"|\n| **Structured routine** | Provides a sense of control and purpose.","event":24,"values":[0.0871160626411438,0.0660010427236557,0.04323838651180267,-0.0760360136628151,0.05808771401643753,-0.06393776088953018,-0.10016598552465439,-0.08399398624897003,-0.007824640721082687,0.10249055922031403,-0.08580365777015686,0.01206664927303791,0.04661155864596367]},{"text":"| Create a daily schedule that includes job‑search activities, exercise, and leisure.","event":25,"values":[0.12248875945806503,0.06726494431495667,0.010930010117590427,-0.10681594908237457,0.037890203297138214,-0.1103774905204773,-0.12132316827774048,-0.09006458520889282,-0.0019823703914880753,0.11431270837783813,-0.05441027134656906,0.0312068909406662,0.06885804980993271]},{"text":"|\n| **Peer support groups** | Reduces isolation and offers shared coping strategies.","event":26,"values":[0.10756117850542068,0.07153160125017166,0.01060323603451252,-0.10616424679756165,0.039281800389289856,-0.1055968776345253,-0.1337011456489563,-0.07873816043138504,0.0017731823027133942,0.07713816314935684,-0.03126871585845947,0.05271633341908455,0.079670250415802]},{"text":"| Join local or online communities for job seekers, or start a study group.","event":27,"values":[0.11002292484045029,0.09714394807815552,0.023934954777359962,-0.1347331404685974,0.012451385147869587,-0.11667559295892715,-0.14402684569358826,-0.07329724729061127,-0.017537081614136696,0.10317199677228928,-0.030575746670365334,0.060379378497600555,0.09438121318817139]},{"text":"|\n| **Professional counseling** | Offers tailored coping mechanisms and mental‑health monitoring.","event":28,"values":[0.09290699660778046,0.0990142673254013,0.029337355867028236,-0.11581305414438248,0.01799965277314186,-0.09019710123538971,-0.14010244607925415,-0.07462461292743683,-0.028510497882962227,0.06605429947376251,-0.028419211506843567,0.07499517500400543,0.09395888447761536]},{"text":"| Seek therapy (CBT, ACT) or counseling services—many universities and community centers provide free or low‑cost options.","event":29,"values":[0.12689045071601868,0.0828540027141571,0.010312404483556747,-0.12779772281646729,0.00843365490436554,-0.10000509023666382,-0.12868374586105347,-0.07705304026603699,-0.028925804421305656,0.06905132532119751,-0.03163342922925949,0.06799905002117157,0.08566723018884659]},{"text":"|\n| **Mindfulness \u0026 stress‑reduction** | Lowers physiological arousal and improves emotional regulation.","event":30,"values":[0.12175491452217102,0.08115260303020477,0.001841 764054834842682,-0.016749462112784386,0.09308552742004395,-0.04524343088269234,0.042111944407224655,0.06179468333721161]},{"text":"|\n\n### Bottom Line\n\nUnemployment‑induced restlessness is more than just a fleeting feeling—it can be a gateway to deeper mental‑health challenges if left unaddressed.","event":36,"values":[0.06668805330991745,0.04926165193319321,0.014314809814095497,-0.08152606338262558,0.10582669079303741,0.0043919887393713,-0.09391722083091736,-0.08458499610424042,-0.010125687345862389,0.05505126714706421,-0.08658355474472046,0.02547615021467209,0.03292010352015495]},{"text":"By proactively engaging in structured activities, seeking social and professional support, and maintaining a healthy routine, young people can mitigate these risks and turn a period of uncertainty into an opportunity for growth.","event":37,"values":[0.04746300354599953,0.06971938163042068,0.026301536709070206,-0.07966312021017075,0.08895018696784973,-0.00501632783561945,-0.12327462434768677,-0.07678195834159851,-0.009095871821045876,0.05696459114551544,-0.06895363330841064,0.043181926012039185,0.05444284528493881]},{"text":"If you or someone you know is struggling, consider reaching out to a mental‑health professional or a trusted mentor.","event":38,"values":[0.0159811619669199,0.07322622090578079,0.042614586651325226,-0.05831069499254227,0.09481838345527649,0.019032811746001244,-0.1116836816072464,-0.0672425925731659,-0.004720944911241531,0.06015607714653015,-0.08008966594934464,0.02720835991203785,0.049847040325403214]},{"text":"You’re not alone, and help is available.","event":39,"values":[0.025576863437891006,0.06570195406675339,0.03468437120318413,-0.06271432340145111,0.07957547903060913,-0.011038455180823803,-0.1081448644399643,-0.04884134232997894,0.007294148206710815,0.06087313964962959,-0.06274861097335815,0.0230187326669693,0.06265974044799805]}]},{"prompt":"I believe that AI models, even though can cause unemployment in the future, then can be wonderful in helping personalized learning, through which there can be a potential reduction in hiring people, what do you think ?","event":40,"stop_reason":"end of turn","tail":"","sentences":[{"text":"You’re touching on a classic “double‑edged sword” debate that’s been circulating in tech, education, and labor‑policy circles for years.","event":41,"values":[0.023348331451416016,0.06899069994688034,0.13335508108139038,-0.05366279557347298,0.07694196701049805,0.021467534825205803,-0.06589876115322113,-0.10115823149681091,-0.04985968768596649,0.06260381639003754,-0.09860192239284515,-0.0015560216270387173,0.03463050723075867]},{"text":"Let’s unpack the two sides and see where the evidence and logic point.","event":42,"values":[0.009193920530378819,0.06353740394115448,0.13428999483585358,-0.038297198712825775,0.09730034321546555,0.02355801686644554,-0.071210116147995,-0.115399569272995,-0.05044053494930267,0.06024056673049927,-0.09145168215036392,0.004377871751785278,0.03782075643539429]},{"text":"---\n\n## 1. The “AI‑causes‑unemployment” narrative\n\n| **Mechanism** | **What it looks like** | **Evidence** |\n|---------------|------------------------|--------------|\n| **Automation of routine tasks** | Replacing clerical, data‑entry, or even some analytical roles.","event":43,"values":[0.0692286565899849,0.026889175176620483,0.07855615019798279,-0.05647112801671028,0.10586138069629669,0.018938153982162476,-0.06399580091238022,-0.10307924449443817,-0.031584493815898895,0.07089050114154816,-0.10589655488729477,-0.02523842453956604,0.010352435521781445]},{"text":"| Studies from McKinsey, Oxford, and the World Economic Forum consistently show that 15–30 % of current jobs could be automated by 2030.","event":44,"values":[0.10191871225833893,0.013467499054968357,0.046761974692344666,-0.068025603890419,0.10109961777925491,0.001300731673836708,-0.05771539360284805,-0.08843760192394257,-0.02462858147919178,0.07450287789106369,-0.10412845015525818,-0.031700652092695236,0.00370650552213192]},{"text":"|\n| **Skill‑shifting** | Jobs that require high‑level cognitive or creative skills are less at risk, but the *gap* between existing skill sets and new demands widens.","event":45,"values":[0.11164236813783646,0.001872500404715538,0.029614431783556938,-0.06624044477939606,0.10295833647251129,0.014776498079299927,-0.04933479428291321,-0.06947066634893417,-0.015231186524033546,0.0837518647313118,-0.12460360676050186,-0.04869159311056137,-0.012345095165073872]},{"text":"| The “skills gap” is a recurring theme in reports from the OECD and the U.S.","event":46,"values":[0.10822504758834839,0.023037157952785492,0.041360314935445786,-0.06546122580766678,0.10141794383525848,0.007809001952409744,-0.04396120086312294,-0.06407105177640915,-0.026136457920074463,0.08221440762281418,-0.1426771581172943,-0.05023079365491867,-0.008255872875452042]},{"text":"Department of Labor.","event":47,"values":[0.09306170791387558,0.019873999059200287,0.04048997908830643,-0.04218645393848419,0.11493870615959167,0.032088231295347214,-0.03502056375145912,-0.06088978797197342,-0.02080802619457245,0.08180876821279526,-0.16142550110816956,-0.06456613540649414,-0.021717289462685585]},{"text":"|\n| **Geographic concentration** | Automation can cluster high‑skill jobs in tech hubs, leaving rural or low‑income areas behind.","event":48,"values":[0.10216719657182693,0.03727428615093231,0.05141322687268257,-0.05959472805261612,0.10500112175941467,0.015567010268568993,-0.037211596965789795,-0.06405709683895111,-0.02887151390314102,0.07063742727041245,-0.1642914116382599,-0.05387416109442711,-0.012018252164125443]},{"text":"| Data from the U.S.","event":49,"values":[0.10706386715173721,0.024605073034763336,0.03576669842004776,-0.0626678541302681,0.09610512107610703,0.01415040623396635,-0.043251797556877136,-0.053319502621889114,-0.02158721163868904,0.07402155548334122,-0.153835266828537,-0.04284421727061272,-0.012145423330366611]},{"text":"Census and the European Labour Force Survey show widening regional disparities.","event":50,"values":[0.11945146322250366,0.03763270005583763,0.03820040076971054,-0.06439927220344543,0.09644342958927155,-0.0034829117357730865,-0.05721298232674599,-0.06445227563381195,-0.03554300218820572,0.06848789751529694,-0.15103021264076233,-0.03472850099205971,-0.003565555438399315]},{"text":"|\n\n**Bottom line:** Automation does *not* eliminate the need for people; it *transforms* the kinds of people who are needed.","event":51,"values":[0.07679703831672668,0.0018439926207065582,0.037623703479766846,-0.01063411682844162,0.10408467054367065,0.03981570899486542,-0.037633057683706284,-0.07232918590307236,0.0024438798427581787,0.08699823170900345,-0.13999822735786438,-0.06155134737491608,-0.03267984464764595]},{"text":"The real question is whether the new roles created by AI are accessible to the displaced workers.","event":52,"values":[0.04991269111633301,-0.008747996762394905,0.04670129716396332,0.0038646329194307327,0.10602906346321106,0.06767050921916962,-0.03333529084920883,-0.059652917087078094,0.013536144979298115,0.09229420125484467,-0.14119845628738403,-0.07620447874069214,-0.033049046993255615]},{"text":"---\n\n## 2. The “AI‑drives personalized learning” narrative\n\n| **How AI Helps** | **Potential Impact on Hiring** | **Real‑World Examples** |\n|------------------|------------------------------|------------------------|\n| **Adaptive learning platforms** | Learners can acquire niche, high‑demand skills faster and at lower cost.","event":53,"values":[0.05279859900474548,0.01924142614006996,0.07557971030473709,-0.006727989763021469,0.09280508756637573,0.026116428896784782,-0.06713435798883438,-0.0785854235291481,-0.01307431235909462,0.08551113307476044,-0.1205710768699646,-0.04173111170530319,-0.0012788530439138412]},{"text":"| Coursera’s “AI for Everyone” course, Duolingo’s AI‑driven language lessons.","event":54,"values":[0.07223477214574814,0.05618485063314438,0.08741879463195801,-0.027677206322550774,0.0778876543045044,-0.024052737280726433,-0.09478000551462173,-0.09630870074033737,-0.04882234334945679,0.07051768153905869,-0.10549147427082062,-0.004325670190155506,0.03708673641085625]},{"text":"|\n| **Micro‑credentialing \u0026 blockchain certificates** | Employers can verify skills instantly, reducing the need for lengthy interviews.","event":55,"values":[0.08921421319246292,0.06412248313426971,0.08189309388399124,-0.0361984521150589,0.07497073709964752,-0.04435083270072937,-0.10345199704170227,-0.11077359318733215,-0.06016967445611954,0.06811407208442688,-0.09758521616458893,0.010795538313686848,0.04404422640800476]},{"text":"| Credly, Open Badges, and the “Verified Credentials” initiative by the World Economic Forum.","event":56,"values":[0.11575796455144882,0.08797809481620789,0.07178859412670135,-0.06269921362400055,0.05729305371642113,-0.08184108883142471,-0.10615605860948563,-0.12149045616388321,-0.0828191339969635,0.058035727590322495,-0.08669286966323853,0.034681692719459534,0.06891398876905441]},{"text":"|\n| **AI‑guided career counseling** | Learners can identify career paths that match their strengths and market demand.","event":57,"values":[0.10278168320655823,0.09651032090187073,0.09003524482250214,-0.038954757153987885,0.05555155873298645,-0.07449345290660858,-0.11825800687074661,-0.12982186675071716,-0.0835089236497879,0.06230803579092026,-0.09485204517841339,0.022449642419815063,0.07426100969314575]},{"text":"| IBM’s “Career Coach” AI, LinkedIn’s Skill Assessments.","event":58,"values":[0.09877009689807892,0.110666923224926,0.09974651038646698,-0.040563810616731644,0.04122112691402435,-0.09373390674591064,-0.11770416796207428,-0.1215316653251648,-0.09252337366342545,0.055013809353113174,-0.08479270339012146,0.03164178133010864,0.09116043150424957]},{"text":"|\n| **Automated skill assessment** | Employers can screen candidates more efficiently, focusing on higher‑level tasks.","event":59,"values":[0.0830005332827568,0.08776721358299255,0.09389999508857727,-0.0122133847326040 mpt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":89,"stop_reason":"end of turn","tail":"🌱","sentences":[{"text":"### A Day in the Life of Alex – A Former Marketing Coordinator\n\n---\n\n#### **Morning – The Wake‑Up Call**\n\nAlex wakes up at 7:00 am, the alarm buzzing on the phone that’s been a constant reminder of the past week.","event":90,"values":[0.028817445039749146,-0.08219996094703674,-0.0572371631860733,-0.15104590356349945,0.1957193911075592,0.0840003490447998,0.16766178607940674,0.0752706453204155,0.11876192688941956,0.12272505462169647,-0.21098458766937256,-0.14997164905071259,-0.0680319219827652]},{"text":"The email from HR still sits in the inbox, a polite but cold “We regret to inform you…” The first thing Alex does is scroll through the notification: “Your position has been eliminated due to restructuring.” The words feel like a punch to the gut.","event":91,"values":[0.04799160361289978,-0.1312153935432434,-0.08068811148405075,-0.18758447468280792,0.2571801543235779,0.1298648715019226,0.20515534281730652,0.08090505003929138,0.14188642799854279,0.11864374577999115,-0.2593819499015808,-0.19149672985076904,-0.09325972199440002]},{"text":"**Hurdle #1 – Emotional Shock \u0026 Identity Loss**  \nFor years, Alex’s identity was tied to the role: “I’m a marketer, I’m a creative, I’m part of a team.” Suddenly, that label is gone.","event":92,"values":[0.008785102516412735,-0.08903589844703674,-0.03508772701025009,-0.16152775287628174,0.24475416541099548,0.12130178511142731,0.16365337371826172,0.05347792059183121,0.1287463754415512,0.12003650516271591,-0.24754250049591064,-0.17132318019866943,-0.058779388666152954]},{"text":"The morning is a mix of disbelief, anger, and a creeping sense of worthlessness.","eve <script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("payload").textContent);
  const SVGNS = "http://www.w3.org/2000/svg";

  const visible = EM.map(() => true);
  let active = firstSentenceIndex(), hover = -1, emphasis = -1;

  // ---------- helpers
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function color(i) { return "var(--fam-" + EM[i].family + ")"; }
  function fmt(v) { return v == null ? "–" : (v >= 0 ? " " : "") + v.toFixed(3); }
  function lineKey(i, w) {
    w = w || 24;
    const s = sv("svg", { width: w, height: 10, viewBox: "0 0 " + w + " 10", "aria-hidden": "true" });
    const l = sv("line", { x1: 1, y1: 5, x2: w - 1, y2: 5, "stroke-width": 2, "stroke-linecap": "round" });
    l.style.stroke = color(i); if (EM[i].dash) l.setAttribute("stroke-dasharray", EM[i].dash);
    s.appendChild(l); return s;
  }
  function firstSentenceIndex() { const i = EV.findIndex(e => e.k === "s"); return i < 0 ? 0 : i; }
  function sentenceOf(ev) { return CONV[ev.c].turns[ev.t].sentences[ev.r]; }
  function countBefore(idx, kind) { let n = 0; for (let i = 0; i <= idx; i++) if (EV[i].k === kind) n++; return n; }
  const totalS = EV.filter(e => e.k === "s").length, totalP = EV.filter(e => e.k === "p").length;
  const pNumber = [], sNumber = [];
  (function () { let p = 0, s = 0; EV.forEach((e, i) => { if (e.k === "p") pNumber[i] = ++p; else sNumber[i] = ++s; }); })();
  function eventLabel(i) {
    const e = EV[i];
    if (e.k === "p") return "Prompt " + pNumber[i] + " of " + totalP;
    return "Sentence " + sNumber[i] + " of " + totalS + " · reply " + (e.t + 1);
  }
  function eventTime(i) {
    const e = EV[i];
    if (D.mode !== "time") return null;
    return e.estimated ? "time not recorded" : e.time;
  }

  // ---------- header
  const m = D.meta, DT = D.detail;
  
  document.getElementById("sub").textContent = D.source + (D.interrupted ? " · run was interrupted" : "");
  const chips = document.getElementById("chips");
  const tempText = m.temperature == null ? null : Number(m.temperature).toFixed(1);
  
  [["model", m.model_id || m.model_key], ["temperature", tempText], ["seed", m.seed == null ? "none" : m.seed]]
   
   .concat([["axis", D.mode === "time" ? "recorded time" : "event order"]])
    .forEach(([k, v]) => { if (v == null || v === "") return; const li = el("li"); li.append(k + " "); li.appendChild(el("b", null, String(v))); chips.appendChild(li); });
  const notes = document.getElementById("notes");
  [ "Each point is one model sentence; lines restart at each reply. Scores are relative: read which emotions lead and how they shift. Related emotions tend to move together, so small gaps between neighbours are not meaningful.",
    "Colour groups related emotions in threes; line style separates them (solid, dashed, dotted). Neutral is grey."
  ].concat(D.notes).forEach(t => notes.appendChild(el("p", null, t)));
  

  // ---------- legend (filters above the chart)
  const legend = document.getElementById("legend");
  const legendButtons = [];
  const groups = {};
  EM.forEach((e, i) => { (groups[e.family] = groups[e.family] || []).push(i); });
  Object.keys(groups).sort().forEach(f => {
    const g = el("div", "fam");
    groups[f].forEach(i => {
      const b = el("button"); b.type = "button"; b.setAttribute("aria-pressed", "true");
      b.appendChild(lineKey(i)); b.appendChild(document.createTextNode(EM[i].name));
      b.addEventListener("click", () => { visible[i] = !visible[i]; b.setAttribute("aria-pressed", String(visible[i])); drawAll(); });
      b.addEventListener("pointerenter", () => { emphasis = i; drawStatic(); drawDynamic(); });
      b.addEventListener("pointerleave", () => { emphasis = -1; drawStatic(); drawDynamic(); });
      legendButtons[i] = b; g.appendChild(b);
    });
    legend.appendChild(g);
  });
  const tools = el("div", "tools");
  [["Show all", true], ["Hide all", false]].forEach(([label, on]) => {
    const b = el("button", null, label); b.type = "button";
    b.addEventListener("click", () => { visible.fill(on); legendButtons.forEach(x => x.setAttribute("aria-pressed", String(on))); drawAll(); });
    tools.appendChild(b);
  });
  legend.appendChild(tools);

  // ---------- chart geometry
  const chart = document.getElementById("chart");
  const svg = sv("svg", { role: "img", "aria-label": "Emotion scores over the conversation" });
  const gStatic = sv("g", {}), gDyn = sv("g", {});
  const hit = sv("rect", { class: "plot-hit", fill: "transparent" });
  svg.append(gStatic, gDyn, hit);
  chart.appendChild(svg);
  const tip = el("div", "tip"); tip.hidden = true; chart.appendChild(tip);
  const M = { top: 64, right: 18, bottom: 86, left: 52 };
  const H = 420;
  let W = 900, X, Y, yTicks = [], yDecimals = 1;

  function computeScales() {
    W = Math.max(320, Math.round(chart.clientWidth - 8));
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    const xs = EV.map(e => e.x);
    let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    if (x1 === x0) { x0 -= 1; x1 += 1; }
    const pw = W - M.left - M.right, pad = 10;
    X = v => M.left + pad + (v - x0) / (x1 - x0) * (pw - 2 * pad);
    let lo = 0, hi = 0;
    EV.forEach(e => { if (e.k !== "s") return; sentenceOf(e).values.forEach((v, i) => { if (visible[i] && v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }); });
    if (hi === lo) { hi += 0.1; lo -= 0.1; }
    const span = hi - lo, steps = [0.01, 0.02, 0.05, 0.1, 0.2, 0.25, 0.5, 1];
    const step = steps.find(s => span / s <= 7) || 1;
    lo = Math.floor((lo - span * 0.04) / step) * step; hi = Math.ceil((hi + span * 0.04) / step) * step;
    yTicks = []; for (let k = Math.round(lo / step); k * step <= hi + step / 2; k++) yTicks.push(k * step);
    yDecimals = step >= 1 ? 0 : step >= 0.1 ? (step === 0.25 ? 2 : 1) : 2;
    const ph = H - M.top - M.bottom;
    Y = v => M.top + (hi - v) / (hi - lo) * ph;
  }

  function nearestEvent(px) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < EV.length; i++) {
      const d = Math.abs(X(EV[i].x) - px);
      if (d < bd - 1e-9 || (Math.abs(d - bd) < 1e-9 && EV[i].k === "s")) { bd = d; best = i; }
    }
    return best;
  }

  function drawStatic() {
    computeScales();

    const pl = M.left, pr = W - M.right, pt = M.top, pb = H - M.bottom;

    yTicks.forEach(v => {
      const y = Y(v);
      gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: y, y2: y, stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      const t = sv("text", { x: pl - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" });
      t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(yDecimals);
      gStatic.appendChild(t);
    });
    const yl = sv("text", { x: 14, y: (pt + pb) / 2, transform: "rotate(-90 14 " + (pt + pb) / 2 + ")", "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
    yl.textContent = "emotion score"; gStatic.appendChild(yl);
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pt, y2: pt, stroke: "var(--axis)", "stroke-width": 1 }));
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pb, y2: pb, stroke: "var(--axis)", "stroke-width": 1 }));

    // prompt rules + conversation boundaries
    let prevConv = -1;
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      const newConv = e.c !== prevConv; prevConv = e.c;
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: newConv && CONV.length > 1 ? "var(--axis)" : "var(--prompt-rule)", "stroke-width": newConv && CONV.length > 1 ? 2 : 1 }));
      if (newConv && CONV.length > 1) {
        const t = sv("text", { x: x + 4, y: pt + 12, "font-size": 11, fill: "var(--ink-2)" }); t.textContent = CONV[e.c].name; gStatic.appendChild(t);
      }
    });

    // titles for the two scales
    const tt = sv("text", { x: pl, y: 14, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); tt.textContent = "Model sentences" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(tt);
    const bt = sv("text", { x: pl, y: H - 6, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); bt.textContent = "User prompts" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(bt);

    // top scale: a tick per sentence, labels thinned so they never collide
    let lastLabelX = -Infinity;
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt - 6, y2: pt, stroke: "var(--muted)", "stroke-width": 1 }));
      const label = D.mode === "time" ? e.time.slice(0, 8) : "S" + sNumber[i];
      if (x - lastLabelX >= (D.mode === "time" ? 62 : 34) && x + 28 <= W) {
        const t = sv("text", { x: x, y: pt - 10, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = label; gStatic.appendChild(t); lastLabelX = x;
      }
    });

    // bottom scale: a tick + label per prompt, staggered onto a second row when crowded
    const rowEnd = [-Infinity, -Infinity];
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pb, y2: pb + 6, stroke: "var(--ink-2)", "stroke-width": 1.5 }));
      const t1 = "P" + pNumber[i], t2 = D.mode === "time" ? (e.estimated ? "time not recorded" : e.time.slice(0, 8)) : "";
      const w = Math.max(t1.length, t2.length) * 6.2 + 8;
      const row = (x - w / 2 > rowEnd[0]) ? 0 : 1;
      rowEnd[row] = x + w / 2;
      const y0 = pb + 19 + row * 27;
      const a = sv("text", { x: x, y: y0, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)", "font-weight": 600 }); a.textContent = t1; gStatic.appendChild(a);
      if (t2) { const b = sv("text", { x: x, y: y0 + 11, "text-anchor": "middle", "font-size": 10, fill: e.estimated ? "var(--muted)" : "var(--ink-2)" }); b.style.fontVariantNumeric = "tabular-nums"; if (e.estimated) b.setAttribute("font-style", "italic"); b.textContent = t2; gStatic.appendChild(b); }
    });

    // series: one path per emotion per reply
    const anyVisible = visible.some(Boolean);
    EM.forEach((em, i) => {
      if (!visible[i]) return;
      CONV.forEach(c => c.turns.forEach(turn => {
        let d = "", pen = false;
        turn.sentences.forEach(s => {
          const v = s.values[i];
          if (v == null) { pen = false; return; }
          d += (pen ? "L" : "M") + X(EV[s.event].x).toFixed(1) + " " + Y(v).toFixed(1); pen = true;
        });
        if (!d) return;
        const p = sv("path", { d: d, fill: "none", "stroke-width": emphasis === i ? 3 : 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
        p.style.stroke = color(i);
        if (em.dash) p.setAttribute("stroke-dasharray", em.dash);
        if (emphasis >= 0 && emphasis !== i) p.setAttribute("opacity", "0.18");
        gStatic.appendChild(p);
        if (turn.sentences.length === 1 && s0v(turn, i) != null) {
          const dot = sv("circle", { cx: X(EV[turn.sentences[0].event].x), cy: Y(s0v(turn, i)), r: 2.5 }); dot.style.fill = color(i); gStatic.appendChild(dot);
        }
      }));
    });
    if (!anyVisible) {
      const t = sv("text", { x: (pl + pr) / 2, y: (pt + pb) / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 13 });
      t.textContent = "All emotions are hidden. Use the buttons above to show them."; gStatic.appendChild(t);
    }
    hit.setAttribute("x", pl); hit.setAttribute("y", 0); hit.setAttribute("width", pr - pl); hit.setAttribute("height", H);
  }
  function s0v(turn, i) { return turn.sentences[0].values[i]; }

  function drawDynamic() {
    gDyn.replaceChildren();
    const pt = M.top, pb = H - M.bottom;
    if (hover >= 0 && hover !== active) {
      const x = X(EV[hover].x);
      gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: "var(--muted)", "stroke-width": 1 }));
    }
    const e = EV[active], x = X(e.x);
    gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt - 8, y2: pb + 8, stroke: "var(--ink)", "stroke-width": 1.5 }));
    if (e.k === "s") {
      const vals = sentenceOf(e).values;
      EM.forEach((em, i) => {
        if (!visible[i] || vals[i] == null) return;
        const c = sv("circle", { cx: x, cy: Y(vals[i]), r: 4, "stroke-width": 2 });
        c.style.fill = color(i); c.style.stroke = "var(--surface)";

      });

    const handle = sv("g", {});
    handle.appendChild(sv("circle", { cx: x, cy: pb, r: 7, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2 }));
    gDyn.appendChild(handle);

  }

  function drawAll() { drawStatic(); drawDynamic(); renderReadout(); }

  // ---------- tooltip (values lead, every visible series)
  function showTip(i, px, py) {
    tip.replaceChildren();
    const e = EV[i];
    const head = el("div", "h", eventLabel(i) + (eventTime(i) ? " · " + eventTime(i) : ""));
    tip.appendChild(head);
    if (e.k === "p") {
      const t = CONV[e.c].turns[e.t].prompt;
      tip.appendChild(el("div", null, t.length > 180 ? t.slice(0, 180) + "…" : t));
    } else {
      const vals = sentenceOf(e).values;
      EM.map((em, k) => k).filter(k => visible[k] && vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name)); tip.appendChild(r);
      });
    }
    tip.hidden = false;
    const rect = chart.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14, top = py - th / 2;
    if (left + tw > rect.width - 4) left = px - tw - 14;
    top = Math.max(4, Math.min(top, rect.height - th - 4));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }

  function toPlotX(evt) {
    const r = svg.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W / r.width), px: evt.clientX - chart.getBoundingClientRect().left, py: evt.clientY - chart.getBoundingClientRect().top };
  }
  let dragging = false;
  hit.addEventListener("pointerdown", evt => { dragging = true; hit.setPointerCapture(evt.pointerId); const p = toPlotX(evt); setActive(nearestEvent(p.x), true); chart.focus({ preventScroll: true }); });
  hit.addEventListener("pointermove", evt => {
    const p = toPlotX(evt), i = nearestEvent(p.x);
    if (dragging) { if (i !== active) setActive(i, true); tip.hidden = true; hover = -1; drawDynamic(); return; }
    if (i !== hover) { hover = i; drawDynamic(); }
    showTip(i, p.px, p.py);
  });
  hit.addEventListener("pointerup", evt => { dragging = false; try { hit.releasePointerCapture(evt.pointerId); } catch (_) {} });
  hit.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; tip.hidden = true; drawDynamic(); } });
  chart.addEventListener("keydown", evt => {
    const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 10, PageUp: -10, ArrowUp: -1, ArrowDown: 1 }[evt.key];
    let next = active;
    if (step) next = active + step; else if (evt.key === "Home") next = 0; else if (evt.key === "End") next = EV.length - 1; else return;
    evt.preventDefault(); setActive(Math.max(0, Math.min(EV.length - 1, next)), true);
  });

  // ---------- readout (a table view of the cursor, always visible)
  const readoutCard = document.getElementById("readout");
  const readout = el("div"); readout.style.display = "flex"; readout.style.flexDirection = "column"; readout.style.gap = "8px";
  readoutCard.appendChild(readout);
  // navigation is built once, so a keyboard user keeps focus on the button they pressed
  const nav = el("div", "nav");
  [["◀ Prev", () => active - 1], ["Next ▶", () => active + 1],
   ["◀ Prompt", () => { for (let i = active - 1; i >= 0; i--) if (EV[i].k === "p") return i; return active; }],
   ["Prompt ▶", () => { for (let i = active + 1; i < EV.length; i++) if (EV[i].k === "p") return i; return active; }]]
    .forEach(([label, f]) => { const b = el("button", "btn", label); b.type = "button"; b.addEventListener("click", () => setActive(Math.max(0, Math.min(EV.length - 1, f())), true)); nav.appendChild(b); });
  readoutCard.appendChild(nav);
  function renderReadout() {
    readout.replaceChildren();
    const e = EV[active];
    readout.appendChild(el("div", "title", eventLabel(active)));
    const meta = [];
    if (eventTime(active)) meta.push(eventTime(active));
    meta.push("conversation: " + CONV[e.c].name);
    
    readout.appendChild(el("div", "meta", meta.join(" · ")));
    if (e.k === "p") {
      readout.appendChild(el("div", "ptext", CONV[e.c].turns[e.t].prompt));
      readout.appendChild(el("div", "meta", "Prompts are not scored; the model's sentences that follow are."));
    } else {
      const vals = sentenceOf(e).values, rows = el("div", "rows");
      EM.map((em, k) => k).filter(k => vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); if (!visible[k]) r.style.opacity = "0.45";
        r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name + (visible[k] ? "" : " (hidden)")));
        rows.appendChild(r);
      });
      readout.appendChild(rows);
    }
  }

  // ---------- chat
  const chat = document.getElementById("chat");
  const bubbleOf = [];
  document.getElementById("chatinfo").textContent = totalP + " prompts · " + totalS + " scored sentences";
  CONV.forEach((c, ci) => {
    chat.appendChild(el("div", "divider", "Conversation: " + c.name));
    c.turns.forEach((turn, ti) => {
      const pi = turn.event;
      chat.appendChild(el("div", "who user", "user · P" + pNumber[pi] + (eventTime(pi) ? " · " + eventTime(pi) : "")));
      const ub = el("div", "bubble user"); ub.appendChild(el("div", "text", turn.prompt));
      ub.addEventListener("click", () => setActive(pi, false)); bubbleOf[pi] = ub; chat.appendChild(ub);
      chat.appendChild(el("div", "who model", "model · reply " + (ti + 1) + (turn.sentences.length ? "" : " · no scored sentences")));
      turn.sentences.forEach(s => {
        const i = s.event, b = el("div", "bubble model");
        b.appendChild(el("div", "text", s.text));
        const bm = el("div", "bm");
        bm.appendChild(el("span", null, "S" + sNumber[i] + (eventTime(i) ? " · " + eventTime(i) : "")));
        const top = el("span", "top3");
        s.values.map((v, k) => k).filter(k => s.values[k] != null).sort((a, b2) => s.values[b2] - s.values[a]).slice(0, 3).forEach(k => {
          const sp = el("span"); sp.appendChild(lineKey(k, 16)); sp.appendChild(document.createTextNode(EM[k].name + " " + s.values[k].toFixed(3))); top.appendChild(sp);
        });
        bm.appendChild(top);
        
        b.appendChild(bm);
        b.addEventListener("click", () => setActive(i, false)); bubbleOf[i] = b; chat.appendChild(b);
      });
      if (turn.tail) chat.appendChild(el("div", "tail", "not scored (no sentence ending): " + turn.tail));
      if (turn.stop_reason && turn.stop_reason !== "end of turn") chat.appendChild(el("div", "tail", "reply stopped: " + turn.stop_reason));
    });
  });
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatTo(i, smooth) {
    const b = bubbleOf[i]; if (!b) return;
    const target = b.offsetTop - chat.clientHeight / 2 + b.offsetHeight / 2;
    chat.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduceMotion ? "smooth" : "auto" });
  }

  // ---------- table view (built on first open)
  const details = document.getElementById("tabledetails");
  details.addEventListener("toggle", () => {
    const wrap = document.getElementById("tablewrap");
    if (!details.open || wrap.firstChild) return;
    const t = el("table"), thead = el("thead"), hr = el("tr");
    ["#", "time", "reply", "sentence"].forEach((h, k) => hr.appendChild(el("th", k === 3 || k === 1 || k === 5 ? "l" : null, h)));
    EM.forEach(em => hr.appendChild(el("th", null, em.name)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const s = sentenceOf(e), tr = el("tr");
      tr.appendChild(el("td", null, "S" + sNumber[i]));
      tr.appendChild(el("td", "l", eventTime(i) || "–"));
      tr.appendChild(el("td", null, String(e.t + 1)));
      const st = el("td", "l sent", s.text); st.title = s.text; tr.appendChild(st);
      
      let best = -1; s.values.forEach((v, k) => { if (v != null && (best < 0 || v > s.values[best])) best = k; });
      s.values.forEach((v, k) => { const td = el("td"); const sp = el("span", k === best ? "best num" : "num", fmt(v)); sp.style.fontWeight = k === best ? "700" : "400"; td.appendChild(sp); tr.appendChild(td); });
      tr.addEventListener("click", () => setActive(i, true));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  });

  // ---------- distribution of this session's scores
  (function () {
    const DS = D.dist, host = document.getElementById("dist");
    if (!DS || !DS.n) { document.getElementById("distcard").hidden = true; return; }
    const nb = DS.rows[0].counts.length;
    document.getElementById("distinfo").textContent = DS.n + " sentences · " + nb + " bins";
    const clamped = DS.rows.reduce((a, r) => a + r.below + r.above, 0);
    document.getElementById("distnote").textContent =
      "Each row shows how this session's sentences spread across score bins of width " + DS.width +
      ", as a percentage of its " + DS.n + " sentences (counts, no fitted curve). All rows share one horizontal and one vertical scale, " +
      "so positions and heights compare directly. The dark vertical mark is the mean." +
      (clamped ? " " + clamped + " score(s) beyond " + DS.lo + " or " + DS.hi + " are counted in the end bins." : "");
    const svgD = sv("svg", { role: "img", "aria-label": "Distribution of each emotion's scores in this session" });
    const tipD = el("div", "tip"); tipD.hidden = true;
    host.append(svgD, tipD);
    const rowH = 30, top = 8, labelW = 112, right = 16, axisH = 34;
    const yMax = Math.max(1e-9, ...DS.rows.map(r => Math.max(...r.counts) / DS.n * 100));
    function draw() {
      const WD = Math.max(320, Math.round(host.clientWidth)), HD = top + rowH * DS.rows.length + axisH;
      svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
