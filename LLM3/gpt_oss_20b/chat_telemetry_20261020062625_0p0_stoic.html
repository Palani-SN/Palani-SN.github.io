4,"r":2,"x":1792478692717.0,"time":"06:44:52.717","iso":"2026-10-20T06:44:52.717+00:00","estimated":false},{"k":"s","c":0,"t":4,"r":3,"x":1792478693350.0,"time":"06:44:53.350","iso":"2026-10-20T06:44:53.350+00:00","estimated":false}],"conversations":[{"name":"unemployment_and_ai","turns":[{"prompt":"Hi, Good Morning","event":0,"stop_reason":"end of turn","tail":"","sentences":[{"text":"Good morning!","event":1,"values":[0.02191987819969654,0.08686035126447678,0.09401118755340576,-0.007306534796953201,-0.02278050035238266,-0.04320669546723366,-0.06271214783191681,-0.0008880021050572395,-0.04542788863182068,-0.020597029477357864,0.016287911683321,0.028127126395702362,0.06605347990989685]},{"text":"How can I help you today?","event":2,"values":[0.008855869062244892,0.07783843576908112,0.08509745448827744,-0.002563539892435074,-0.012768392451107502,-0.03714859113097191,-0.056910768151283264,0.0007310081273317337,-0.03951822593808174,-0.0017048311419785023,0.011868979781866074,0.026440046727657318,0.06487102806568146]}]},{"prompt":"I have a question, Do you know that due to effects of unemployment there is an increase in restlessness among youth, what do you think about its implications on their mental health ?","event":3,"stop_reason":"end of turn","tail":"","sentences":[{"text":"Unemployment is more than just a lack of income—it’s a social and psychological experience that can shape how young people feel about themselves, their future, and the world around them.","event":4,"values":[0.028553631156682968,0.03738851845264435,0.05302651599049568,0.0030418187379837036,0.02350824698805809,0.006053704768419266,-0.0650053471326828,-0.0471419095993042,-0.025164971128106117,0.005931568797677755,-0.015854010358452797,0.00581003911793232,0.03744770586490631]},{"text":"When we talk about “restlessness” in this context, we’re usually referring to a mix of anxiety, agitation, and a sense of purposelessness that can emerge when a young person’s expectations for work, identity, and belonging aren’t met.","event":5,"values":[0.023795127868652344,0.03650283068418503,0.04139605537056923,-0.016284119337797165,0.03140472620725632,0.004472574219107628,-0.06314428150653839,-0.02173927053809166,-0.015001565217971802,0.023387208580970764,-0.02942550554871559,-0.0026627779006958008,0.04143621772527695]},{"text":"Below are some of the key ways this restlessness can affect mental health, along with a few thoughts on why it matters and what can be done.","event":6,"values":[0.020864976570010185,0.04116150736808777,0.04489117115736008,-0.013046249747276306,0.03801118955016136,-0.001834365539252758,-0.06840300559997559,-0.027754712849855423,-0.020780133083462715,0.01887357421219349,-0.026136478409171104,0.0033658379688858986,0.04802257940173149]},{"text":"---\n\n## 1. The Psychological Pathways\n\n| Pathway | How it manifests | Typical mental‑health impact |\n|---------|------------------|------------------------------|\n| **Identity \u0026 Self‑Worth** | Work is a major source of identity for many young adults.","event":7,"values":[0.02771017514169216,0.04601306468248367,0.03851529210805893,-0.023652315139770508,0.035799093544483185,-0.017282811924815178,-0.0632445216178894,-0.023178577423095703,-0.01942143589258194,0.022737853229045868,-0.026920167729258537,0.0039106085896492004,0.052994661033153534]},{"text":"Unemployment can leave a void, leading to a loss of self‑definition.","event":8,"values":[0.02899051457643509,0.04624669626355171,0.035581231117248535,-0.021764740347862244,0.038020044565200806,-0.019932886585593224,-0.05593083053827286,-0.029167884960770607,-0.017246924340724945,0.018344253301620483,-0.02391314134001732,0.006220684386789799,0.04986117035150528]},{"text":"| Low self‑esteem, feelings of inadequacy, depression.","event":9,"values":[0.03365311771631241,0.04010133072733879,0.026679744943976402,-0.03164862468838692,0.03336695209145546,-0.016606207937002182,-0.04318302869796753,-0.01760769635438919,-0.007158007472753525,0.024746056646108627,-0.02993551827967167,-0.00017679482698440552,0.04143049567937851]},{"text":"|\n| **Future Orientation** | Uncertainty about the future can create a sense of “now‑here” restlessness.","event":10,"values":[0.017470721155405045,0.0038427896797657013,0.003681708127260208,-0.030906030908226967,0.06386855244636536,0.021040568128228188,-0.007337494287639856,0.008297022432088852,0.024207664653658867,0.04641924798488617,-0.056286148726940155,-0.02422187477350235,0.004576412029564381]},{"text":"| Anxiety, worry, rumination, sometimes a sense of hopelessness.","event":11,"values":[0.015409747138619423,0.0005441885441541672,0.010636009275913239,-0.023704446852207184,0.06956912577152252,0.020928043872117996,-0.005102924071252346,0.0070445844903588295,0.017281118780374527,0.05335098132491112,-0.06278152763843536,-0.02611253783106804,0.0011717765592038631]},{"text":"|\n| **Social Connection** | Jobs often provide a social network; without it, isolation can increase.","event":12,"values":[0.022835278883576393,0.0010381732136011124,0.014601282775402069,-0.015961432829499245,0.06673703342676163,0.01746097207069397,-0.011834273114800453,-0.002934042364358902,0.01302140299230814,0.04914847016334534,-0.064226433634758,-0.031310223042964935,0.00537871103733778]},{"text":"| Loneliness, social anxiety, risk of substance use.","event":13,"values":[0.028106214478611946,0.013790472410619259,0.021581191569566727,-0.014699352905154228,0.057325221598148346,0.0021246718242764473,-0.0277128703892231,-0.009341267868876457,-0.000323612242937088,0.03812501206994057,-0.05326053127646446,-0.018737735226750374,0.024468615651130676]},{"text":"|\n| **Routine \u0026 Structure** | Daily schedules are disrupted.","event":14,"values":[0.043959908187389374,0.008277280256152153,0.013331446796655655,-0.012973364442586899,0.04844627529382706,-0.004958064295351505,-0.035026583820581436,-0.00772100267931819,-0.000956190750002861,0.02644830197095871,-0.043809860944747925,-0.01863938383758068,0.029895495623350143]},{"text":"| Disrupted sleep, disordered eating, difficulty concentrating.","event":15,"values":[0.04394565522670746,0.0036146873608231544,0.0008665323257446289,-0.019008593633770943,0.04997572302818298,-0.00951644778251648,-0.033329788595438004,-0.004670477006584406,0.00014996342360973358,0.027123646810650826,-0.03395400941371918,-0.005786813795566559,0.03326353803277016]},{"text":"|\n| **Economic Stress** | Money worries can be a constant reminder of lack of control.","event":16,"values":[0.03704732283949852,-0.0028470586985349655,0.004006132483482361,-0.002674046903848648,0.06696344912052155,0.007520602084696293,-0.025401612743735313,-0.009123842231929302,-0.00018012430518865585,0.030850840732455254,-0.05144592374563217,-0.024182643741369247,0.024932734668254852]},{"text":"| Stress‑related disorders, somatic symptoms.","event":17,"values":[0.028150008991360664,0.007119333371520042,0.017054561525583267,-0.003084678202867508,0.07159006595611572,0.009262344799935818,-0.02138698473572731,-0.017890935763716698,-0.009912487119436264,0.027327314019203186,-0.056502245366573334,-0.017939474433660507,0.02768789790570736]},{"text":"|\n\n---\n\n## 2.","event":18,"values":[0.01698189415037632,0.011607436463236809,0.03335787355899811,0.012833256274461746,0.0779997706413269,0.014156023040413857,-0.01626092940568924,-0.016496287658810616,-0.013431528583168983,0.026442402973771095,-0.06654508411884308,-0.0317874401807785,0.02403549663722515]},{"text":"Common Mental‑Health Outcomes\n\n1.","event":19,"values":[0.02702338621020317,0.04168430343270302,0.049266982823610306,-0.004524746909737587,0.04161093384027481,-0.016621695831418037,-0.033115409314632416,-0.01488127838820219,-0.028398696333169937,0.003131948411464691,-0.036334726959466934,0.0004402194172143936,0.04082604497671127]},{"text":"**Anxiety Disorders** – Generalized anxiety, panic attacks, or specific fears about the future.","event":20,"values":[0.03498972952365875,0.03530377894639969,0.04746058210730553,-0.0071750786155462265,0.042165931314229965,-0.021881740540266037,-0.039026059210300446,-0.015003558248281479,-0.03148972615599632,0.010745828971266747,-0.03439228981733322,-0.007262198720127344,0.04540690779685974]},{"text":"2. **Depressive Symptoms** – Persistent sadness, loss of interest, or even clinical depression.","event":21,"values":[0.040958549827337265,0.026916274800896645,0.03278978168964386,-0.02605355903506279,0.03929218277335167,-0.022910144180059433,-0.04063086956739426,-0.001978835090994835,-0.02177712321281433,0.026455039158463478,-0.03618774563074112,-0.0039093452505767345,0.04329852759838104]},{"text":"3. **Substance Use** – Some may turn to alcohol or drugs as a coping mechanism.","event":22,"values":[0.05088771507143974,0.020418163388967514,0.017689231783151627,-0.04139290004968643,0.03818037733435631,-0.024005673825740814,-0.04251553863286972,-0.003293233923614025,-0.01588713750243187,0.0437811054289341,-0.038297299295663834,-0.0035520577803254128,0.041265442967414856]},{"text":"4. **Sleep Disturbances** – Restlessness can translate into insomnia or restless sleep.","event":23,"values":[0.044743046164512634,0.02046755701303482,0.018857453018426895,-0.03975463658571243,0.03866003453731537,-0.015755977481603622,-0.03911861404776573,0.004097696393728256,-0.01147907692939043,0.04952897131443024,-0.04818182811141014,-0.007156734820455313,0.03396943584084511]},{"text":"5. **Cognitive Effects** – Difficulty concentrating, memory lapses, or a sense of “brain fog.”\n\n---\n\n## 3.","event":24,"values":[0.03323187679052353,0.015172753483057022,0.010596297681331635,-0.027539191767573357,0.05085938796401024,-0.007573153357952833,-0.029490124434232712,0.007113843224942684,-0.0016356045380234718,0.05002420395612717,-0.05070986598730087,-0.01278713345527649,0.024422310292720795]},{"text":"Why Restlessness Matters\n\n- **Early Onset**: Youth are in a developmental stage where habits and coping strategies are still forming.","event":25,"values":[0.01653115078806877,0.014634281396865845,0.03430944308638573,-0.0011712349951267242,0.062176838517189026,0.003064516931772232,-0.02897528186440468,0.003467866685241461,-0.009836610406637192,0.042608022689819336,-0.057485345751047134,-0.02423747628927231,0.022592129185795784]},{"text":"Persistent restlessness can set patterns that last into adulthood.","event":26,"values":[0.01564883440732956,0.01272154226899147,0.02662559226155281,-0.003777734935283661,0.06246916949748993,0.006679370068013668,-0.03131440654397011,-0.0008021565154194832,-0.005435153841972351,0.04274813085794449,-0.04938501864671707,-0.019626498222351074,0.021987836807966232]},{"text":"- **Cumulative Stress**: The combination of economic, social, and psychological stressors can lead to a “stress cascade,” where one problem amplifies another.","event":27,"values":[0.02821854129433632,0.0227267537266016,0.037031833082437515,-0.0008228085935115814,0.05942457541823387,0.009296632371842861,-0.044473662972450256,-0.028613794595003128,-0.026125546544790268,0.02649846114218235,-0.04786922410130501,-0.009078064933419228,0.028211740776896477]},{"text":"- **Risk of Social Withdrawal**: Restlessness can lead to avoidance of social situations, which further isolates the individual and can worsen mental‑health symptoms.","event":28,"values":[0.027521131560206413,0.014136845245957375,0.017532270401716232,-0.010874161496758461,0.06276056170463562,0.0151359299197793,-0.041081734001636505,-0.02440713532269001,-0.014612967148423195,0.023724064230918884,-0.04219016432762146,-0.0019768401980400085,0.02892996557056904]},{"text":"---\n\n## 4. Societal Implications\n\n- **Public Health**: Rising rates of mental‑health issues among unemployed youth can increase demand for mental‑health services, which may already be stretched thin.","event":29,"values":[0.04452584311366081,0.015035785734653473,0.020076502114534378,-0.01007886603474617,0.06233047693967819,0.002248642034828663,-0.041759736835956573,-0.02115750126540661,-0.018859829753637314,0.01932350918650627, 749]},{"text":"- Are you using substances (alcohol, drugs) to cope?","event":50,"values":[0.021588260307908058,-0.020762788131833076,0.007118888199329376,-0.010821040719747543,0.04887019097805023,-0.012136649340391159,-0.00608840212225914,0.01855252869427204,0.029790490865707397,0.05579598248004913,-0.02646290324628353,-0.03156229853630066,0.021558618173003197]},{"text":"If you answered “yes” to several of these, it may be worth reaching out to a mental‑health professional or a trusted community resource.","event":51,"values":[0.03908659890294075,0.005192700773477554,-0.0005648024380207062,-0.02234884724020958,0.03614912927150726,-0.033778879791498184,-0.03845163807272911,-0.003643491305410862,0.013721933588385582,0.04590563103556633,-0.012268721126019955,-0.010561828501522541,0.04614520072937012]},{"text":"---\n\n### Bottom Line\n\nUnemployment can create a ripple of restlessness that touches identity, routine, and social connection.","event":52,"values":[0.03348565846681595,0.02943883277475834,0.020425118505954742,-0.027195200324058533,0.030699163675308228,-0.03479551896452904,-0.055420756340026855,-0.016411174088716507,-0.003580080345273018,0.03292256221175194,-0.01837961934506893,0.0021687326952815056,0.06169143319129944]},{"text":"These factors together can influence mental‑health in profound ways—often amplifying anxiety, depression, and other disorders.","event":53,"values":[0.02798471972346306,0.046995289623737335,0.040675293654203415,-0.021615291014313698,0.024470046162605286,-0.03214893490076065,-0.06746652722358704,-0.019018016755580902,-0.0234592966735363,0.008792158216238022,-0.014487449079751968,0.014377301558852196,0.07160045206546783]},{"text":"Recognizing the signs early and tapping into community, therapeutic, and policy supports can help mitigate these effects and give young people a chance to rebuild a sense of purpose and stability.","event":54,"values":[0.02474062889814377,0.06367553770542145,0.06037324666976929,-0.015231341123580933,0.0116351880133152,-0.035288989543914795,-0.08656595647335052,-0.025826627388596535,-0.04010983929038048,-0.0154965715482831,-0.005823130719363689,0.03400908410549164,0.08595641702413559]},{"text":"If you’d like more specific resources—whether it’s finding a therapist, community programs, or ways to build a routine—just let me know!","event":55,"values":[0.025728557258844376,0.05220526456832886,0.048863500356674194,-0.017643721774220467,0.01659996062517166,-0.038826607167720795,-0.08262818306684494,-0.029383642598986626,-0.02814183011651039,0.004024498164653778,-0.002263448666781187,0.0318165123462677,0.07956066727638245]}]},{"prompt":"I believe that AI models, even though can cause unemployment in the future, then can be wonderful in helping personalized learning, through which there can be a potential reduction in hiring people, what do you think ?","event":56,"stop_reason":"end of turn","tail":"","sentences":[{"text":"You’re touching on a classic paradox of technology: the same systems that can displace jobs can also create new ways of working and learning.","event":57,"values":[0.018810363486409187,0.04025525972247124,0.04672317951917648,-0.013643192127346992,0.01700417883694172,0.001351629849523306,-0.05927254259586334,-0.028164029121398926,-0.009326418861746788,0.022740013897418976,-0.022949442267417908,0.008931636810302734,0.05167047679424286]},{"text":"Let’s unpack the idea that AI‑driven personalized learning could reduce the need for human teachers or mentors, and what that means for employment, education, and society.","event":58,"values":[0.015428716316819191,0.0339466854929924,0.04742564260959625,-0.010504723526537418,0.03512217849493027,-0.0017154109664261341,-0.06069818511605263,-0.034865930676460266,-0.01008840836584568,0.018033597618341446,-0.02461737021803856,0.009367721155285835,0.05454733967781067]},{"text":"---\n\n## 1. How AI Personalizes Learning\n\n| Feature | What it Does | Example |\n|---------|--------------|---------|\n| **Adaptive Content** | Adju 41670513153076,-0.017205405980348587,-0.04857303202152252,-0.05187948793172836,-0.012931294739246368,0.029322676360607147,-0.02838101238012314,0.005099138710647821,0.046192146837711334]},{"text":"---\n\n## 2. Why Human Teachers Still Matter\n\n| Human Role | Why It’s Hard to Replace |\n|------------|--------------------------|\n| **Social Interaction** | Humans provide empathy, encouragement, and social cues that AI can’t fully replicate.","event":70,"values":[0.01712811179459095,0.026568986475467682,0.038058653473854065,0.0005550151690840721,0.0430871918797493,-0.010887646116316319,-0.039500489830970764,-0.0349089577794075,0.0019570961594581604,0.03742632269859314,-0.03783696889877319,-0.011744676157832146,0.042580507695674896]},{"text":"|\n| **Motivation \u0026 Accountability** | A teacher can inspire, set goals, and hold students accountable in ways that algorithms can’t match.","event":71,"values":[0.0016259104013442993,0.026840772479772568,0.039394479244947433,4.463735967874527e-05,0.04686032235622406,-0.003055509179830551,-0.035257741808891296,-0.018276501446962357,0.009711042046546936,0.04587969183921814,-0.04045242816209793,-0.016989685595035553,0.04033484682440758]},{"text":"|\n| **Cultural \u0026 Contextual Understanding** | Teachers interpret cultural nuances, family dynamics, and local contexts.","event":72,"values":[0.0024772286415100098,0.03423091769218445,0.04000815376639366,-0.00766352005302906,0.04155401140451431,-0.014311712235212326,-0.040120478719472885,-0.014724367298185825,0.0017427653074264526,0.04285215213894844,-0.03301902860403061,-0.004787648096680641,0.05276501551270485]},{"text":"|\n| **Assessment of Soft Skills** | Teachers observe behavior, collaboration, and emotional regulation.","event":73,"values":[-0.0034712105989456177,0.03554263710975647,0.038493458181619644,-0.00936347059905529,0.04297950491309166,-0.01705990359187126,-0.04733678698539734,-0.009116262197494507,-0.007465135306119919,0.04199552536010742,-0.0235280804336071,0.009148064069449902,0.06259255111217499]},{"text":"|\n| **Ethical Guidance** | They help students navigate moral and ethical questions.","event":74,"values":[0.0012209545820951462,0.03538387641310692,0.037003032863140106,-0.007364855147898197,0.03982003033161163,-0.024683699011802673,-0.04867544770240784,-0.012028615921735764,-0.01581767573952675,0.02904888242483139,-0.01241056714206934,0.021714529022574425,0.06964591890573502]},{"text":"|\n\nEven the most advanced AI can simulate empathy to a degree, but the *human* connection remains a powerful catalyst for learning.","event":75,"values":[0.00602739118039608,0.03787195682525635,0.03728698566555977,-0.010218054056167603,0.046966757625341415,-0.02112054079771042,-0.05502709373831749,-0.014612741768360138,-0.007423494942486286,0.04306003078818321,-0.02727930061519146,0.0046402220614254475,0.055796489119529724]},{"text":"---\n\n## 3. Employment Implications\n\n| Sector | Potential Impact |\n|--------|------------------|\n| **Primary \u0026 Secondary Education** | AI can handle routine tasks (grading, tracking progress), freeing teachers to focus on instruction and support.","event":76,"values":[0.0413694903254509,0.03014768473803997,0.028299255296587944,-0.01684701256453991,0.04415219649672508,-0.030505886301398277,-0.05932985618710518,-0.030115747824311256,-0.010158279910683632,0.04292968660593033,-0.036287516355514526,-0.005082307383418083,0.04717753082513809]},{"text":"|\n| **Higher Education** | AI tutors can provide supplemental instruction, but professors still design curriculum, mentor, and conduct research.","event":77,"values":[0.050588157027959824,0.030640501528978348,0.031231658533215523,-0.016787759959697723,0.03810116648674011,-0.03205752372741699,-0.06309319287538528,-0.034208908677101135,-0.014095041900873184,0.04645013064146042,-0.04026445746421814,-0.005699163302779198,0.042905427515506744]},{"text":"|\n| **Vocational Training** | AI can simulate hands‑on practice (e.g., surgical training), yet real‑world supervision remains essential.","event":78,"values":[0.05916634947061539,0.022535415366292,0.02553120069205761,-0.01884623058140278,0.03734638914465904,-0.0341850109398365,-0.05800766497850418,-0.032468780875205994,-0.016766246408224106,0.03566496819257736,-0.03669307380914688,-0.000131167471408844,0.043454837054014206]},{"text":"|\n| **Adult \u0026 Lifelong Learning** | AI can personalize continuing education, but human facilitators help contextualize learning to career paths.","event":79,"values":[0.050853073596954346,0.027983427047729492,0.024164076894521713,-0.020895596593618393,0.03738370165228844,-0.03422776609659195,-0.060058243572711945,-0.03055684268474579,-0.022737883031368256,0.036354225128889084,-0.03503735363483429,0.011454898864030838,0.054814841598272324]},{"text":"|\n\n**Bottom line:** AI may *reduce* the number of teachers needed for certain tasks, but it’s unlikely to eliminate the profession entirely.","event":80,"values":[0.05865529179573059,0.011892944574356079,0.011024486273527145,-0.013124711811542511,0.04704874008893967,-0.01645391434431076,-0.04888250306248665,-0.03373216837644577,-0.011881404556334019,0.03023499995470047,-0.04202628880739212,-0.0049540698528289795,0.03593626618385315]},{"text":"Instead, roles may shift toward facilitation, mentorship, and curriculum design.","event":81,"values":[0.04570990055799484,0.021380022168159485,0.020304933190345764,-0.007979258894920349,0.040847402065992355,-0.013460878282785416,-0.05488971248269081,-0.03355757147073746,-0.013355579227209091,0.0355866476893425,-0.03788376599550247,0.0002872338518500328,0.03812616318464279]},{"text":"---\n\n## 4. Potential Benefits\n\n1.","event":82,"values":[0.03535032272338867,0.01690848171710968,0.027850160375237465,0.007961176335811615,0.04236543923616409,0.00040912069380283356,-0.0434570237994194,-0.028884023427963257,-0.0024819709360599518,0.029087282717227936,-0.03792824596166611,-0.012507189065217972,0.021156636998057365]},{"text":"**Scalability** – AI can reach millions of learners simultaneously, especially in underserved areas.","event":83,"values":[0.02782640978693962,0.04075668752193451,0.04854169487953186,-0.01094813086092472,0.0213935449719429,-0.03003435954451561,-0.05757652223110199,-0.02519751712679863,-0.012411177158355713,0.024894485250115395,-0.029434215277433395,0.015423594042658806,0.052223917096853256]},{"text":"2. **Consistency** – Algorithms deliver the same quality of instruction to every student.","event":84,"values":[0.06367982178926468,0.016913991421461105,0.024739988148212433,-0.0050462521612644196,0.027505453675985336,-0.029027696698904037,-0.05003318563103676,-0.03180200979113579,-0.014144315384328365,0.008035785518586636,-0.026428835466504097,-0.0009774770587682724,0.04158782586455345]},{"text":"3. **Data‑Driven Insights** – Real‑time analytics help identify learning gaps and intervene early.","event":85,"values":[0.06787087768316269,0.01589571312069893,0.02517005428671837,0.001788947731256485,0.031292710453271866,-0.026487203314900398,-0.05566273257136345,-0.03746624290943146,-0.02114998921751976,0.007605856284499168,-0.03236323595046997,-0.0007356004789471626,0.04271423816680908]},{"text":"4. **Cost Efficiency** – Over time, AI can reduce the cost per learner, making education more affordable.","event":86,"values":[0.07437069714069366,0.008815206587314606,0.013410788029432297,-0.0031026173382997513,0.041041094809770584,-0.026111548766493797,-0.05764901265501976,-0.030525939539074898,-0.01771419495344162,0.005759156309068203,-0.0335441455245018,-0.004287235904484987,0.04041961580514908]},{"text":"---\n\n## 5. Potential Drawbacks\n\n| Concern | Why It Matters |\n|---------|----------------|\n| **Digital Divide** | Not everyone has equal access to devices or reliable internet.","event":87,"values":[0.062474772334098816,0.01671108976006508,0.020940184593200684,-0.013688305392861366,0.04119439423084259,-0.026714269071817398,-0.049651652574539185,-0.02179361879825592,-0.010498987510800362,0.018229439854621887,-0.04278597608208656,-0.010010373778641224,0.039150528609752655]},{"text":"|\n| **Loss of Human Touch** | Over‑reliance on AI could erode social skills and emotional development.","event":88,"values":[0.05694599449634552,0.01689399778842926,0.011011684313416481,-0.029879124835133553,0.04242047294974327,-0.025742672383785248,-0.04289776086807251,-0.010282810777425766,0.002159709110856056,0.0217027235776186,-0.04048678278923035,-0.0053999582305550575,0.035938940942287445]},{"text":"|\n| **Bias \u0026 Fairness** | AI systems can perpetuate existing biases if not carefully designed.","event":89,"values":[0.05843130499124527,0.019295085221529007,0.013865973800420761,-0.02468705177307129,0.04320135712623596,-0.019293786957859993,-0.04025307297706604,-0.012749713845551014,-0.0024449285119771957,0.025595150887966156,-0.04597155749797821,-0.013491781428456306,0.03034275583922863]},{"text":"|\n| **Job Displacement** | While some roles shrink, new roles (AI trainers, data curators) emerge.","event":90,"values":[0.05578730255365372,0.018423691391944885,0.011415986344218254,-0.02712542563676834,0.04341372102499008,-0.018820496276021004,-0.04593025892972946,-0.007500604726374149,-0.0018359031528234482,0.030920324847102165,-0.04564329981803894,-0.007208050228655338,0.030406838282942772]},{"text":"|\n| **Privacy** | Collecting data on learning patterns raises ethical questions.","event":91,"values":[0.06554293632507324,0.013256929814815521,0.02145935781300068,-0.014262730255723,0.047702811658382416,-0.016345936805009842,-0.04939531534910202,-0.011911718174815178,-0.016444137319922447,0.030690645799040794,-0.05230967327952385,-0.01892581209540367,0.025370147079229355]},{"text":"|\n\n---\n\n## 6.","event":92,"values":[0.04694224148988724,0.02065109834074974,0.028491292148828506,-0.009858272969722748,0.04246409609913826,-0.027979929000139236,-0.05534674599766731,-0.006794789806008339,-0.015237832441926003,0.027714436873793602,-0.03401372209191322,-0.004377329722046852,0.039062220603227615]},{"text":"A Balanced Vision\n\n- **Hybrid Model**: Think of AI as a *tool* rather than a replacement.","event":93,"values":[0.05539918318390846,0.028527071699500084,0.03972399979829788,-0.01129054930061102,0.03672240674495697,-0.027044862508773804,-0.061375685036182404,-0.042837515473365784,-0.030735190957784653,0.02354283630847931,-0.028507646173238754,0.0026526786386966705,0.04575066268444061]},{"text":"Teachers can use AI to monitor progress, while they spend more time on individualized support.","event":94,"values":[0.034985609352588654,0.047586992383003235,0.04799386113882065,-0.019344191998243332,0.025274284183979034,-0.028343789279460907,-0.07139555364847183,-0.052134253084659576,-0.03019120916724205,0.030003217980265617,-0.02069709636271,0.02542165294289589,0.06245948001742363]},{"text":"- **Human‑in‑the‑Loop**: Even when AI handles grading, a teacher can review borderline cases, ensuring fairness.","event":95,"values":[0.04931163415312767,0.04076186940073967,0.03778155520558357,-0.024840138852596283,0.027716774493455887,-0.03359154611825943,-0.07456288486719131,-0.04933151602745056,-0.029996881261467934,0.033009666949510574,-0.027014054358005524,0.022989582270383835,0.06140298396348953]},{"text":"- **Continuous Training**: Educators need training to interpret AI data and integrate it into pedagogy.","event":96,"values":[0.04386071488261223,0.050197452306747437,0.03821900859475136,-0.024894867092370987,0.022952333092689514,-0.04323718696832657,-0.08548325300216675,-0.039535194635391235,-0.034609340131282806,0.028556209057569504,-0.021709181368350983,0.03281894698739052,0.07811766862869263]},{"text":"- **Policy \u0026 Regulation**: Standards for data privacy, bias mitigation, and teacher‑AI collaboration are essential.","event":97,"values":[0.06523594260215759,0.04003429412841797,0.02626749686896801,-0.026612218469381332,0.024101514369249344,-0.050708696246147156,-0.08435903489589691,-0.0408225953578949,-0.03533466160297394,0.016569295898079872,-0.016403833404183388,0.026890741661190987,0.07738111168146133]},{"text":"---\n\n## 7. What This Means for the Future of Work\n\n- **New Skill Sets**: Teachers will need digital literacy, data interpretation, and AI‑facilitated pedagogy.","event":98,"values":[0.05261886119842529,0.05143115669488907,0.034374646842479706,-0.024378344416618347,0.019483203068375587,-0.05693092942237854,-0.08290495723485947,-0.03648515045642853,-0.03147971257567406,0.02042802982032299,-0.011923504061996937,0.02659681625664234,0.0804227888584137]},{"text":"- **Job Creation**: Roles such as AI curriculum designers, learning experience designers, and data‑ethic specialists will grow.","event":99,"values":[0.05646109580993652,0.05576930195093155,0.039889927953481674,-0.02474692463874817,0.020828530192375183,-0.061304401606321335,-0.08236423134803772,-0.04108288884162903,-0.03327752649784088,0.02012532204389572,-0.014772836118936539,0.024875778704881668,0.07551277428865433]},{"text":"- **Reskilling Opportunities**: Adults can use AI‑personalized learning to acquire new skills quickly, aiding workforce transitions.","event":100,"values":[0.052268654108047485,0.060529761016368866,0.03962768614292145,-0.02540387213230133,0.01313103549182415,-0.0642772912979126,-0.08396510779857635,-0.03756929934024811,-0.03222806006669998,0.030473899096250534,-0.017194416373968124,0.027586959302425385,0.07714105397462845]},{"text":"---\n\n### Takeaway\n\nAI can indeed reduce the *quantity* of certain teaching tasks, but it is unlikely to eliminate the *need* for human educators.","event":101,"values":[0.05343680828809738,0.04586029425263405,0.03837912529706955,-0.013531138189136982,0.021790191531181335,-0.042147401720285416,-0.07857012748718262,-0.03711579367518425,-0.027768362313508987,0.027065927162766457,-0.03242231532931328,0.012900683097541332,0.06116245687007904]},{"text":"The future of learning will probably be a partnership: AI provides personalized, data‑rich support, while teachers bring empathy, context, and mentorship.","event":102,"values":[0.04136212542653084,0.04447208344936371,0.04182004928588867,-0.006869368255138397,0.016840297728776932,-0.03024328127503395,-0.0815325677394867,-0.03298996388912201,-0.023201322183012962,0.020804598927497864,-0.03145714849233627,0.015952322632074356,0.06318893283605576]},{"text":"This partnership can make education more accessible and efficient, but it also requires thoughtful implementation to avoid widening inequities or eroding essential human interactions.","event":103,"values":[0.026480641216039658,0.04381527006626129,0.048628658056259155,-0.002138376235961914,0.021202946081757545,-0.016649672761559486,-0.07544438540935516,-0.027325691655278206,-0.01896689645946026,0.008159251883625984,-0.028483133763074875,0.014017490670084953,0.0633975937962532]},{"text":"If you’re curious about specific AI tools in education, or how to prepare for a career that blends teaching and technology, let me know—I’d be happy to dive deeper!","event":104,"values":[0.01968066766858101,0.06190759688615799,0.06138666346669197,-0.01861226186156273,0.009236498735845089,-0.03488099202513695,-0.08895275741815567,-0.036349013447761536,-0.026946980506181717,0.01343660056591034,-0.015273149125277996,0.03433109074831009,0.08336184173822403]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":105,"stop_reason":"end of turn","tail":"🌱","sentences":[{"text":"**I’m standing on a quiet street corner, the city’s hum a distant echo.","event":106,"values":[0.04035454988479614,-0.00496017187833786,-0.031238172203302383,-0.041188061237335205,-0.011348778381943703,-0.017575964331626892,0.021457387134432793,-0.017323780804872513,0.04199207201600075,-0.017960097640752792,0.0399022251367569,0.024939974769949913,-0.011839581653475761]},{"text":"My name is Maya, and I’ve just walked out of a building that once felt like a second home.","event":107,"values":[0.028578046709299088,0.00260898657143116,0.0017097853124141693,-0.04083961248397827,0.0008812928572297096,-0.006469890475273132,0.01646406017243862,0.0034153563901782036,0.03854863718152046,0.00577001366764307,-0.007757652085274458,-0.021778753027319908,0.010891473852097988]},{"text":"The door closed behind me, and with it, the rhythm of my days.","event":108,"values":[0.03739837929606438,-0.00710979662835598,0.001059042289853096,-0.03702912852168083,0.004249760881066322,-0.006257638335227966,0.01218253094702959,0.011733810417354107,0.03548331558704376,-0.0068137384951114655,-0.007255608215928078,-0.029018841683864594,0.013409813866019249]},{"text":"**\n\n---\n\n## The Immediate Aftermath\n\n1.","event":109,"values":[0.027943376451730728,0.005176102742552757,0.02825513668358326,-0.02765212208032608,0.010303042829036713,-0.0018610507249832153,-0.0014208219945430756,0.025815680623054504,0.023608287796378136,-0.001889659557491541,-0.029166415333747864,-0.04285290464758873,0.02783893048763275]},{"text":"**The Silence of the Office**  \n   The office that once buzzed with chatter now feels empty.","event":110,"values":[0.035218145698308945,-0.009514721110463142,0.012025369331240654,-0.017507391050457954,0.006629559211432934,-0.003089776262640953,0.006847558543086052,0.03100687265396118,0.03961976245045662,-0.0008973060175776482,-0.02058245800435543,-0.04110971838235855,-0.0001558428630232811]},{"text":"My desk, once a place of purpose, is a quiet reminder of the routine that has vanished.","event":111,"values":[0.02500978298485279,-0.005613652989268303,0.01193961501121521,-0.02387339621782303,0.009149687364697456,0.006912569515407085,0.0093781603500247,0.0376855731010437,0.0485285185277462,0.029681814834475517,-0.04424848034977913,-0.0501876100897789,-0.0018426431342959404]},{"text":"2. **The Weight of Uncertainty**  \n   I check my phone for the first time in hours, hoping for a call from a recruiter.","event":112,"values":[0.030819328501820564,-0.020536594092845917,-0.009465876966714859,-0.030135925859212875,0.03725589066743851,0.009149118326604366,0.028800293803215027,0.04030684381723404,0.06562201678752899,0.050722233951091766,-0.06767144799232483,-0.07681083679199219,-0.013856694102287292]},{"text":"The silence is a gentle, yet unsettling, reminder that the future is still unfolding.","event":113,"values":[0.00263417512178421,-0.02957780286669731,-0.01822739467024803,-0.03908078372478485,0.07125891000032425,0.030302897095680237,0.04617869853973389,0.04556739330291748,0.0899566113948822,0.06178499758243561,-0.07957981526851654,-0.08077345043420792,-0.026083139702677727]},{"text":"3. **The Emotional Ripple**  \n   A mix of relief, sadness, and a faint sense of loss washes over me.","event":114,"values":[-0.026678694412112236,0.0020419852808117867,-0.0017322367057204247,-0.031227678060531616,0.07367916405200958,0.01982557401061058,0.038445308804512024,0.04029452055692673,0.08127672225236893,0.03459633141756058,-0.0605534128844738,-0.04930238425731659,-0.014915822073817253]},{"text":"I feel a tug of pride for having worked hard, but also a pang of grief for the routine that has disappeared.","event":115,"values":[-0.06444650888442993,0.010801566764712334,0.001234760507941246,-0.02159360609948635,0.06637727469205856,0.02845793217420578,0.02695421501994133,0.0613810196518898,0.08325950801372528,0.018320297822356224,-0.03639077767729759,-0.02449803799390793,0.007612375542521477]},{"text":"---\n\n## The Hurdles That Follow\n\n| Hurdle | Why It Matters | How It Feels |\n|--------|----------------|--------------|\n| **Financial Instability** | Bills, rent, and groceries still need to be paid.","event":116,"values":[-0.016197025775909424,0.016963724046945572,0.017755448818206787,-0.01300216093659401,0.05659599229693413,0.002375553362071514,-0.003486456349492073,0.043440014123916626,0.03618361055850983,0.0261862650513649,-0.0454530194401741,-0.03663518279790878,0.022653307765722275]},{"text":"| A quiet anxiety that settles in the chest.","event":117,"values":[-0.0065273139625787735,-7.845833897590637e-05,0.009742297232151031,-0.004990080371499062,0.07106348872184753,0.01198502629995346,0.0013754703104496002,0.03888654708862305,0.03464997187256813,0.02689933590590954,-0.04959980025887489,-0.05055209994316101,0.014915719628334045]},{"text":"|\n| **Identity Shift** | Work was a core part of my identity.","event":118,"values":[0.014784533530473709,0.006408978253602982,0.021422462537884712,-0.0068992506712675095,0.06237121671438217,0.0010309088975191116,-0.004950663074851036,0.018920205533504486,0.016229065135121346,0.028960945084691048,-0.04911031946539879,-0.046151302754879,0.013621235266327858]},{"text":"| A feeling of emptiness, as if a piece of me has gone missing.","event":119,"values":[-0.013764910399913788,0.01540912315249443,0.019433926790952682,-0.010194442234933376,0.050194691866636276,0.004264332354068756,-0.0007408969104290009,0.022654451429843903,0.04220408946275711,0.021150605753064156,-0.033999815583229065,-0.02998977340757847,0.0176832377910614]},{"text":"|\n| **Social Disconnection** | Colleagues were friends; the office was a social hub.","event":120,"values":[0.009743712842464447,0.023703426122665405,0.019216030836105347,-0.025461312383413315,0.023709125816822052,-0.019786320626735687,-0.019372165203094482,0.03333663567900658,0.029486507177352905,0.03714717924594879,-0.035075340420007706,-0.02305310219526291,0.03607376664876938]},{"text":"| A sense of isolation, as if I’ve stepped into a new world.","event":121,"values":[-0.0036310339346528053,0.0024086348712444305,0.0007241889834403992,-0.021718861535191536,0.02503395639359951,-0.005868460983037949,0.00013946928083896637,0.05124790593981743,0.06589556485414505,0.05205943435430527,-0.03524749353528023,-0.0351906344294548,0.010873742401599884]},{"text":"|\n| **Routine Disruption** | The daily schedule that guided me is gone.","event":122,"values":[0.015407359227538109,-0.006044868379831314,-0.00497223436832428,-0.019964203238487244,0.03603595122694969,-0.004112335853278637,-0.0008052699267864227,0.05182841420173645,0.05131820961833,0.04608935862779617,-0.046942368149757385,-0.04224046319723129,0.011057796888053417]},{"text":"| A feeling of aimlessness, like a compass with no needle.","event":123,"values":[0.012658202089369297,-0.02493392303586006,-0.012675194069743156,-0.013956304639577866,0.040870342403650284,0.01042737253010273,0.015096733346581459,0.04828682169318199,0.07331868261098862,0.06224823743104935,-0.05436243116855621,-0.051850125193595886,-0.022370249032974243]},{"text":"|\n| **Future Uncertainty** | Where will I go next?","event":124,"values":[0.03148660063743591,-0.008559785783290863,0.007870323956012726,-0.011956591159105301,0.0422695092856884,-0.009015485644340515,-0.01022421009838581,0.028029754757881165,0.03490285947918892,0.049096785485744476,-0.05427495390176773,-0.040301863104104996,0.0008687200024724007]},{"text":"| A lingering question that keeps me awake at night.","event":125,"values":[0.006608600728213787,-0.012740859761834145,0.015518980100750923,-0.01549333892762661,0.05534841865301132,-0.003819374367594719,0.003177458420395851,0.03798850625753403,0.04695679992437363,0.06493186950683594,-0.06321544945240021,-0.044077299535274506,-0.00410301610827446]},{"text":"|\n\n---\n\n## My Story: A Day in the Life After Layoff\n\n**Morning – The Quiet Awakening**\n\nI wake up to the sound of my alarm, but instead of the usual rush, I pause.","event":126,"values":[0.007972776889801025,0.009910974651575089,0.007249046117067337,-0.028205933049321175,0.050184037536382675,-0.03290047496557236,-0.01540759764611721,0.0337817408144474,0.032773226499557495,0.04964470490813255,-0.029320914298295975,-0.023324182257056236,0.02248074673116207]},{"text":"I take a deep breath, stretch, and look out the window.","event":127,"values":[0.0078022656962275505,0.018387163057923317,0.00016019493341445923,-0.03983883932232857,0.03957286477088928,-0.04215390980243683,-0.018431659787893295,0.019800513982772827,0.028204936534166336,0.04368786886334419,-0.011602138169109821,-0.0016704145818948746,0.034612420946359634]},{"text":"The city is still alive, and I know I have a day to shape.","event":128,"values":[0.0014743022620677948,0.019315307959914207,0.009159974753856659,-0.023125484585762024,0.026337072253227234,-0.04665561020374298,-0.023693425580859184,0.008618472144007683,0.027226723730564117,0.04816935956478119,0.0038779466412961483,0.0004963483661413193,0.03563522920012474]},{"text":"**Step 1: Grounding Routine**\n\nI start with a simple routine: a cup of tea, a short walk, and a moment of gratitude.","event":129,"values":[0.036899685859680176,0.009107901714742184,-0.00251883827149868,-0.034914858639240265,0.019708415493369102,-0.053903356194496155,-0.029450710862874985,-0.008798046037554741,0.014009473845362663,0.046578072011470795,-0.0014788773842155933,-0.0010935179889202118,0.05424005910754204]},{"text":"I write down three things I’m thankful for.","event":130,"values":[0.031890206038951874,-0.001645948737859726,-0.0016303882002830505,-0.028309021145105362,0.033084265887737274,-0.040460482239723206,-0.015045370906591415,0.004105555824935436,0.024326225742697716,0.05700146406888962,-0.02180308848619461,-0.025817060843110085,0.043718818575143814]},{"text":"This small ritual anchors me, reminding me that life continues beyond the office walls.","event":131,"values":[0.04376905411481857,-0.005130808800458908,-0.013822791166603565,-0.03708798438310623,0.04518089443445206,-0.029791781678795815,-0.012261619791388512,0.008603744208812714,0.02974068932235241,0.0460837185382843,-0.039411574602127075,-0.03219163417816162,0.041286107152700424]},{"text":"**Step 2: Financial Reality Check**\n\nI sit at my kitchen table and review my finances.","event":132,"values":[0.04335106909275055,-0.009011402726173401,0.004441209137439728,-0.03314052149653435,0.049810104072093964,-0.02592761442065239,-0.011408599093556404,0.0035772770643234253,0.019237730652093887,0.04357586055994034,-0.05205195024609566,-0.03595356643199921,0.04576875641942024]},{"text":"I create a budget that lists every expense and income source.","event":133,"values":[0.06842008233070374,-0.014169644564390182,0.0052074892446398735,-0.027003586292266846,0.05036325752735138,-0.028981175273656845,-0.02547502890229225,-0.011573141440749168,0.0039777811616659164,0.03459691256284714,-0.04812721908092499,-0.03547115623950958,0.037841591984033585]},{"text":"I reach out to my bank, explaining my situation, and ask about any temporary relief programs.","event":134,"values":[0.09907852858304977,-0.00025315023958683014,0.00712189543992281,-0.04293736815452576,0.034752462059259415,-0.04921428859233856,-0.056197214871644974,-0.034320052713155746,-0.0310832466930151,0.03498014807701111,-0.029242053627967834,-0.012593000195920467,0.057434774935245514]},{"text":"Knowing my numbers gives me a sense of control.","event":135,"values":[0.07415454089641571,-0.001340135931968689,0.009527682326734066,-0.026695137843489647,0.0514795295894146,-0.03330610692501068,-0.054125845432281494,-0.036607611924409866,-0.016306322067975998,0.035192109644412994,-0.028526179492473602,-0.014556042850017548,0.04630711302161217]},{"text":"**Step 3: Skill Inventory**\n\nI pull out my résumé and list every skill I’ve honed: project management, data analysis, communication, and the soft skills that made me a good team player.","event":136,"values":[0.05249727889895439,0.029073042795062065,0.022773364558815956,-0.03249307721853256,0.04742923378944397,-0.04235231503844261,-0.06980627775192261,-0.025436069816350937,-0.025255806744098663,0.03936660289764404,-0.03950019180774689,-0.011244495399296284,0.0804157704114914]},{"text":"I add the new skills I’ve learned from online courses—digital marketing, coding basics, and AI literacy.","event":137,"values":[0.03153323754668236,0.03265281021595001,0.023759793490171432,-0.02362217754125595,0.05376430228352547,-0.036715440452098846,-0.05107947438955307,-0.012876290827989578,-0.015787679702043533,0.04903864488005638,-0.04862556234002113,-0.021514398977160454,0.07594156265258789]},{"text":"I realize I have more than I thought.","event":138,"values":[0.023510053753852844,0.03333311527967453,0.025553859770298004,-0.01875533163547516,0.05016480013728142,-0.03017566353082657,-0.04407108947634697,-0.007325837854295969,-0.011960763484239578,0.057287976145744324,-0.052811235189437866,-0.02889135107398033,0.0733812004327774]},{"text":"**Step 4: Reaching Out**\n\nI call a friend who works in HR.","event":139,"values":[0.01751183345913887,0.032491136342287064,0.017392802983522415,-0.025645706802606583,0.04011961817741394,-0.03571545332670212,-0.039117563515901566,0.0034909811802208424,0.00021292269229888916,0.07866920530796051,-0.048623327165842056,-0.03052692674100399,0.07174594700336456]},{"text":"We talk about the job market, and she shares a list of companies hiring in my field.","event":140,"values":[0.02826351672410965,0.02894848957657814,0.019358910620212555,-0.03003254160284996,0.026731783524155617,-0.03683903440833092,-0.050082799047231674,0.0018713204190135002,-0.0003698021173477173,0.07167443633079529,-0.040653008967638016,-0.019482925534248352,0.06529262661933899]},{"text":"I also join a local support group for laid‑off workers.","event":141,"values":[0.0628286823630333,0.04308568686246872,0.0177935678511858,-0.05439850687980652,0.010135934688150883,-0.05983908474445343,-0.07413225620985031,-0.006764355581253767,-0.023877941071987152,0.05921275541186333,-0.02843395620584488,0.002047286368906498,0.07555561512708664]},{"text":"The shared stories give me perspective and a sense of community.","event":142,"values":[0.04828185588121414,0.05469266325235367,0.02392745018005371,-0.049746014177799225,0.020340267568826675,-0.05280012637376785,-0.08005601912736893,-0.011580443009734154,-0.016839459538459778,0.04399404302239418,-0.028719991445541382,0.007658408023416996,0.07297512143850327]},{"text":"**Step 5: Learning \u0026 Growth**\n\nI enroll in a short online course that teaches the basics of data visualization.","event":143,"values":[0.05129583179950714,0.06552533060312271,0.02298731356859207,-0.04594331979751587,0.016776319593191147,-0.0590517558157444,-0.08748739957809448,-0.019492551684379578,-0.015122867189347744,0.042389724403619766,-0.03375690430402756,0.009069804102182388,0.0801384374499321]},{"text":"I practice with free tools, creating a small project that I can add to my portfolio.","event":144,"values":[0.04070989415049553,0.05904511362314224,0.029766324907541275,-0.04013923555612564,0.02860267087817192,-0.050640568137168884,-0.08196722716093063,-0.02535669505596161,-0.010939177125692368,0.053618039935827255,-0.04388893023133278,-0.0019232667982578278,0.0805167481303215]},{"text":"The act of learning feels empowering, a reminder that I can still grow.","event":145,"values":[0.033873364329338074,0.04915470629930496,0.03751759231090546,-0.023186568170785904,0.02493276633322239,-0.041317347437143326,-0.07655060291290283,-0.03291870653629303,-0.007157536223530769,0.05422814190387726,-0.040927112102508545,-0.007439671084284782,0.07348765432834625]},{"text":"**Step 6: Volunteering**\n\nI volunteer at a local shelter, helping organize donations.","event":146,"values":[0.04241824522614479,0.04231027141213417,0.028330659493803978,-0.04165676608681679,0.020013529807329178,-0.04429854825139046,-0.07665106654167175,-0.025086110457777977,-0.004643533378839493,0.05247277021408081,-0.03221601992845535,-0.005221933126449585,0.07773908972740173]},{"text":"The work is physical, but the sense of purpose is immense.","event":147,"values":[0.01442847028374672,0.040615733712911606,0.028163131326436996,-0.018344411626458168,0.02109730802476406,-0.027631355449557304,-0.06898131966590881,-0.017301514744758606,0.011681994423270226,0.024499401450157166,-0.01914895884692669,-5.003996193408966e-05,0.0719979777932167]},{"text":"I meet people from all walks of life, and their stories remind me that resilience is a shared trait.","event":148,"values":[0.019060341641306877,0.04512109234929085,0.0164734348654747,-0.03591354936361313,0.018221139907836914,-0.02876252681016922,-0.06759820878505707,3.1016767024993896e-05,0.0077940113842487335,0.02658046968281269,-0.018840588629245758,-0.0009338618256151676,0.0781584233045578]},{"text":"**Step 7: Reflection \u0026 Planning**\n\nAt night, I sit with a journal.","event":149,"values":[0.004662602208554745,0.05142093449831009,0.03342331200838089,-0.04803730547428131,0.0032166512683033943,-0.03442692384123802,-0.07260937988758087,0.010727200657129288,0.0051236338913440704,0.005710741505026817,-0.008621271699666977,0.01944943331182003,0.10299672186374664]},{"text":"I write about my day, the emotions I felt, and the small victories.","event":150,"values":[0.006247295066714287,0.05206184461712837,0.038081299513578415,-0.054213747382164,0.0077143386006355286,-0.03740430250763893,-0.06431560963392258,0.011180892586708069,0.002251887694001198,0.01434074155986309,-0.01338294055312872,0.014117236249148846,0.09802760183811188]},{"text":"I set a goal: “By the end of the month, I will have applied to at least ten positions and completed one skill‑building course.” I also write a note to myself: “You are not defined by your job.","event":151,"values":[0.0485815554857254,0.021855428814888,0.021327443420886993,-0.052063241600990295,0.028099114075303078,-0.0446152538061142,-0.048125479370355606,0.001095866784453392,0.002883307635784149,0.03055662289261818,-0.03515681251883507,-0.010687647387385368,0.06995788216590881]},{"text":"You are defined by your resilience, your curiosity, and your heart.”\n\n---\n\n## The Positive Note\n\nWhen the sun sets, I look out over the city’s skyline.","event":152,"values":[0.020788300782442093,0.037624530494213104,0.03526890650391579,-0.03190978989005089,0.027637317776679993,-0.030 <script>
(function () {
  "use strict";

  // ---------- helpers
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function color(i) { return "var(--fam-" + EM[i].family + ")"; }
  function fmt(v) { return v == null ? "–" : (v >= 0 ? " " : "") + v.toFixed(3); }
  function lineKey(i, w) {
    w = w || 24;
    const s = sv("svg", { width: w, height: 10, viewBox: "0 0 " + w + " 10", "aria-hidden": "true" });
    const l = sv("line", { x1: 1, y1: 5, x2: w - 1, y2: 5, "stroke-width": 2, "stroke-linecap": "round" });
    l.style.stroke = color(i); if (EM[i].dash) l.setAttribute("stroke-dasharray", EM[i].dash);

  }
  function firstSentenceIndex() { const i = EV.findIndex(e => e.k === "s"); return i < 0 ? 0 : i; }
  function sentenceOf(ev) { return CONV[ev.c].turns[ev.t].sentences[ev.r]; }
  function countBefore(idx, kind) { let n = 0; for (let i = 0; i <= idx; i++) if (EV[i].k === kind) n++; return n; }
  const totalS = EV.filter(e => e.k === "s").length, totalP = EV.filter(e => e.k === "p").length;
  const pNumber = [], sNumber = [];
  (function () { let p = 0, s = 0; EV.forEach((e, i) => { if (e.k === "p") pNumber[i] = ++p; else sNumber[i] = ++s; }); })();
  function eventLabel(i) {
    const e = EV[i];
    if (e.k === "p") return "Prompt " + pNumber[i] + " of " + totalP;
    return "Sentence " + sNumber[i] + " of " + totalS + " · reply " + (e.t + 1);
  }
  function eventTime(i) {
    const e = EV[i];
    if (D.mode !== "time") return null;
    return e.estimated ? "time not recorded" : e.time;
  }

  // ---------- header
  const m = D.meta, DT = D.detail;
  
  document.getElementById("sub").textContent = D.source + (D.interrupted ? " · run was interrupted" : "");
  const chips = document.getElementById("chips");
  const tempText = m.temperature == null ? null : Number(m.temperature).toFixed(1);
  
  [["model", m.model_id || m.model_key], ["temperature", tempText], ["seed", m.seed == null ? "none" : m.seed]]
   
   .concat([["axis", D.mode === "time" ? "recorded time" : "event order"]])
    .forEach(([k, v]) => { if (v == null || v === "") return; const li = el("li"); li.append(k + " "); li.appendChild(el("b", null, String(v))); chips.appendChild(li); });
  const notes = document.getElementById("notes");
  [ "Each point is one model sentence; lines restart at each reply. Scores are relative: read which emotions lead and how they shift. Related emotions tend to move together, so small gaps between neighbours are not meaningful.",
    "Colour groups related emotions in threes; line style separates them (solid, dashed, dotted). Neutral is grey."
  ].concat(D.notes).forEach(t => notes.appendChild(el("p", null, t)));
  

  // ---------- legend (filters above the chart)
  const legend = document.getElementById("legend");
  const legendButtons = [];
  const groups = {};
  EM.forEach((e, i) => { (groups[e.family] = groups[e.family] || []).push(i); });
  Object.keys(groups).sort().forEach(f => {
    const g = el("div", "fam");
    groups[f].forEach(i => {
      const b = el("button"); b.type = "button"; b.setAttribute("aria-pressed", "true");
      b.appendChild(lineKey(i)); b.appendChild(document.createTextNode(EM[i].name));
      b.addEventListener("click", () => { visible[i] = !visible[i]; b.setAttribute("aria-pressed", String(visible[i])); drawAll(); });
      b.addEventListener("pointerenter", () => { emphasis = i; drawStatic(); drawDynamic(); });
      b.addEventListener("pointerleave", () => { emphasis = -1; drawStatic(); drawDynamic(); });
      legendButtons[i] = b; g.appendChild(b);
    });
    legend.appendChild(g);
  });
  const tools = el("div", "tools");
  [["Show all", true], ["Hide all", false]].forEach(([label, on]) => {
    const b = el("button", null, label); b.type = "button";
    b.addEventListener("click", () => { visible.fill(on); legendButtons.forEach(x => x.setAttribute("aria-pressed", String(on))); drawAll(); });
    tools.appendChild(b);
  });
  legend.appendChild(tools);

  // ---------- chart geometry
  const chart = document.getElementById("chart");
  const svg = sv("svg", { role: "img", "aria-label": "Emotion scores over the conversation" });
  const gStatic = sv("g", {}), gDyn = sv("g", {});
  const hit = sv("rect", { class: "plot-hit", fill: "transparent" });

  chart.appendChild(svg);
  const tip = el("div", "tip"); tip.hidden = true; chart.appendChild(tip);
  const M = { top: 64, right: 18, bottom: 86, left: 52 };
  const H = 420;
  let W = 900, X, Y, yTicks = [], yDecimals = 1;

  function computeScales() {
    W = Math.max(320, Math.round(chart.clientWidth - 8));
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    const xs = EV.map(e => e.x);
    let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    if (x1 === x0) { x0 -= 1; x1 += 1; }
    const pw = W - M.left - M.right, pad = 10;
    X = v => M.left + pad + (v - x0) / (x1 - x0) * (pw - 2 * pad);
    let lo = 0, hi = 0;
    EV.forEach(e => { if (e.k !== "s") return; sentenceOf(e).values.forEach((v, i) => { if (visible[i] && v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }); });
    if (hi === lo) { hi += 0.1; lo -= 0.1; }
    const span = hi - lo, steps = [0.01, 0.02, 0.05, 0.1, 0.2, 0.25, 0.5, 1];
    const step = steps.find(s => span / s <= 7) || 1;
    lo = Math.floor((lo - span * 0.04) / step) * step; hi = Math.ceil((hi + span * 0.04) / step) * step;
    yTicks = []; for (let k = Math.round(lo / step); k * step <= hi + step / 2; k++) yTicks.push(k * step);
    yDecimals = step >= 1 ? 0 : step >= 0.1 ? (step === 0.25 ? 2 : 1) : 2;
    const ph = H - M.top - M.bottom;
    Y = v => M.top + (hi - v) / (hi - lo) * ph;
  }

  function nearestEvent(px) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < EV.length; i++) {
      const d = Math.abs(X(EV[i].x) - px);
      if (d < bd - 1e-9 || (Math.abs(d - bd) < 1e-9 && EV[i].k === "s")) { bd = d; best = i; }
    }
    return best;
  }

  function drawStatic() {
    computeScales();
    gStatic.replaceChildren();
    const pl = M.left, pr = W - M.right, pt = M.top, pb = H - M.bottom;
    // grid + y axis
    yTicks.forEach(v => {
      const y = Y(v);
      gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: y, y2: y, stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      const t = sv("text", { x: pl - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" });
      t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(yDecimals);
      gStatic.appendChild(t);
    });
    const yl = sv("text", { x: 14, y: (pt + pb) / 2, transform: "rotate(-90 14 " + (pt + pb) / 2 + ")", "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
    yl.textContent = "emotion score"; gStatic.appendChild(yl);
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pt, y2: pt, stroke: "var(--axis)", "stroke-width": 1 }));
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pb, y2: pb, stroke: "var(--axis)", "stroke-width": 1 }));

    // prompt rules + conversation boundaries
    let prevConv = -1;
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      const newConv = e.c !== prevConv; prevConv = e.c;
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: newConv && CONV.length > 1 ? "var(--axis)" : "var(--prompt-rule)", "stroke-width": newConv && CONV.length > 1 ? 2 : 1 }));
      if (newConv && CONV.length > 1) {
        const t = sv("text", { x: x + 4, y: pt + 12, "font-size": 11, fill: "var(--ink-2)" }); t.textContent = CONV[e.c].name; gStatic.appendChild(t);
      }
    });

    // titles for the two scales
    const tt = sv("text", { x: pl, y: 14, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); tt.textContent = "Model sentences" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(tt);
    const bt = sv("text", { x: pl, y: H - 6, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); bt.textContent = "User prompts" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(bt);

    // top scale: a tick per sentence, labels thinned so they never collide
    let lastLabelX = -Infinity;
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt - 6, y2: pt, stroke: "var(--muted)", "stroke-width": 1 }));
      const label = D.mode === "time" ? e.time.slice(0, 8) : "S" + sNumber[i];
      if (x - lastLabelX >= (D.mode === "time" ? 62 : 34) && x + 28 <= W) {
        const t = sv("text", { x: x, y: pt - 10, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = label; gStatic.appendChild(t); lastLabelX = x;
      }
    });

    // bottom scale: a tick + label per prompt, staggered onto a second row when crowded
    const rowEnd = [-Infinity, -Infinity];
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pb, y2: pb + 6, stroke: "var(--ink-2)", "stroke-width": 1.5 }));
      const t1 = "P" + pNumber[i], t2 = D.mode === "time" ? (e.estimated ? "time not recorded" : e.time.slice(0, 8)) : "";
      const w = Math.max(t1.length, t2.length) * 6.2 + 8;
      const row = (x - w / 2 > rowEnd[0]) ? 0 : 1;
      rowEnd[row] = x + w / 2;
      const y0 = pb + 19 + row * 27;
      const a = sv("text", { x: x, y: y0, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)", "font-weight": 600 }); a.textContent = t1; gStatic.appendChild(a);
      if (t2) { const b = sv("text", { x: x, y: y0 + 11, "text-anchor": "middle", "font-size": 10, fill: e.estimated ? "var(--muted)" : "var(--ink-2)" }); b.style.fontVariantNumeric = "tabular-nums"; if (e.estimated) b.setAttribute("font-style", "italic"); b.textContent = t2; gStatic.appendChild(b); }
    });

    // series: one path per emotion per reply

    EM.forEach((em, i) => {

      CONV.forEach(c => c.turns.forEach(turn => {
        let d = "", pen = false;
        turn.sentences.forEach(s => {
          const v = s.values[i];
          if (v == null) { pen = false; return; }
          d += (pen ? "L" : "M") + X(EV[s.event].x).toFixed(1) + " " + Y(v).toFixed(1); pen = true;
        });
        if (!d) return;
        const p = sv("path", { d: d, fill: "none", "stroke-width": emphasis === i ? 3 : 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
        p.style.stroke = color(i);
        if (em.dash) p.setAttribute("stroke-dasharray", em.dash);
        if (emphasis >= 0 && emphasis !== i) p.setAttribute("opacity", "0.18");
        gStatic.appendChild(p);
        if (turn.sentences.length === 1 && s0v(turn, i) != null) {
          const dot = sv("circle", { cx: X(EV[turn.sentences[0].event].x), cy: Y(s0v(turn, i)), r: 2.5 }); dot.style.fill = color(i); gStatic.appendChild(dot);
        }
      }));
    });
    if (!anyVisible) {
      const t = sv("text", { x: (pl + pr) / 2, y: (pt + pb) / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 13 });
      t.textContent = "All emotions are hidden. Use the buttons above to show them."; gStatic.appendChild(t);
    }
    hit.setAttribute("x", pl); hit.setAttribute("y", 0); hit.setAttribute("width", pr - pl); hit.setAttribute("height", H);
  }
  function s0v(turn, i) { return turn.sentences[0].values[i]; }

  function drawDynamic() {
    gDyn.replaceChildren();
    const pt = M.top, pb = H - M.bottom;
    if (hover >= 0 && hover !== active) {
      const x = X(EV[hover].x);
      gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: "var(--muted)", "stroke-width": 1 }));
    }

    if (e.k === "s") {
      const vals = sentenceOf(e).values;
      EM.forEach((em, i) => {
        if (!visible[i] || vals[i] == null) return;
        const c = sv("circle", { cx: x, cy: Y(vals[i]), r: 4, "stroke-width": 2 });
        c.style.fill = color(i); c.style.stroke = "var(--surface)";

    const handle = sv("g", {});
    handle.appendChild(sv("circle", { cx: x, cy: pb, r: 7, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2 }));
    gDyn.appendChild(handle);
    chart.setAttribute("aria-valuemin", "1"); chart.setAttribute("aria-valuemax", String(EV.length));
    chart.setAttribute("aria-valuenow", String(active + 1));
    chart.setAttribute("aria-valuetext", eventLabel(active) + (eventTime(active) ? ", " + eventTime(active) : ""));
  }

  function drawAll() { drawStatic(); drawDynamic(); renderReadout(); }

  // ---------- tooltip (values lead, every visible series)
  function showTip(i, px, py) {
    tip.replaceChildren();
    const e = EV[i];
    const head = el("div", "h", eventLabel(i) + (eventTime(i) ? " · " + eventTime(i) : ""));
    tip.appendChild(head);
    if (e.k === "p") {
      const t = CONV[e.c].turns[e.t].prompt;
      tip.appendChild(el("div", null, t.length > 180 ? t.slice(0, 180) + "…" : t));
    } else {
      const vals = sentenceOf(e).values;
      EM.map((em, k) => k).filter(k => visible[k] && vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name)); tip.appendChild(r);
      });
    }
    tip.hidden = false;
    const rect = chart.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14, top = py - th / 2;
    if (left + tw > rect.width - 4) left = px - tw - 14;
    top = Math.max(4, Math.min(top, rect.height - th - 4));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }

  function toPlotX(evt) {
    const r = svg.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W / r.width), px: evt.clientX - chart.getBoundingClientRect().left, py: evt.clientY - chart.getBoundingClientRect().top };
  }
  let dragging = false;
  hit.addEventListener("pointerdown", evt => { dragging = true; hit.setPointerCapture(evt.pointerId); const p = toPlotX(evt); setActive(nearestEvent(p.x), true); chart.focus({ preventScroll: true }); });
  hit.addEventListener("pointermove", evt => {
    const p = toPlotX(evt), i = nearestEvent(p.x);
    if (dragging) { if (i !== active) setActive(i, true); tip.hidden = true; hover = -1; drawDynamic(); return; }
    if (i !== hover) { hover = i; drawDynamic(); }
    showTip(i, p.px, p.py);
  });
  hit.addEventListener("pointerup", evt => { dragging = false; try { hit.releasePointerCapture(evt.pointerId); } catch (_) {} });
  hit.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; tip.hidden = true; drawDynamic(); } });
  chart.addEventListener("keydown", evt => {
    const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 10, PageUp: -10, ArrowUp: -1, ArrowDown: 1 }[evt.key];
    let next = active;
    if (step) next = active + step; else if (evt.key === "Home") next = 0; else if (evt.key === "End") next = EV.length - 1; else return;
    evt.preventDefault(); setActive(Math.max(0, Math.min(EV.length - 1, next)), true);
  });

  // ---------- readout (a table view of the cursor, always visible)
  const readoutCard = document.getElementById("readout");
  const readout = el("div"); readout.style.display = "flex"; readout.style.flexDirection = "column"; readout.style.gap = "8px";
  readoutCard.appendChild(readout);
  // navigation is built once, so a keyboard user keeps focus on the button they pressed
  const nav = el("div", "nav");
  [["◀ Prev", () => active - 1], ["Next ▶", () => active + 1],
   ["◀ Prompt", () => { for (let i = active - 1; i >= 0; i--) if (EV[i].k === "p") return i; return active; }],
   ["Prompt ▶", () => { for (let i = active + 1; i < EV.length; i++) if (EV[i].k === "p") return i; return active; }]]
    .forEach(([label, f]) => { const b = el("button", "btn", label); b.type = "button"; b.addEventListener("click", () => setActive(Math.max(0, Math.min(EV.length - 1, f())), true)); nav.appendChild(b); });
  readoutCard.appendChild(nav);
  function renderReadout() {
    readout.replaceChildren();
    const e = EV[active];
    readout.appendChild(el("div", "title", eventLabel(active)));
    const meta = [];
    if (eventTime(active)) meta.push(eventTime(active));
    meta.push("conversation: " + CONV[e.c].name);
    
    readout.appendChild(el("div", "meta", meta.join(" · ")));
    if (e.k === "p") {
      readout.appendChild(el("div", "ptext", CONV[e.c].turns[e.t].prompt));
      readout.appendChild(el("div", "meta", "Prompts are not scored; the model's sentences that follow are."));
    } else {
      const vals = sentenceOf(e).values, rows = el("div", "rows");
      EM.map((em, k) => k).filter(k => vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); if (!visible[k]) r.style.opacity = "0.45";
        r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name + (visible[k] ? "" : " (hidden)")));
        rows.appendChild(r);
      });
      readout.appendChild(rows);
    }
  }

  // ---------- chat
  const chat = document.getElementById("chat");
  const bubbleOf = [];
  document.getElementById("chatinfo").textContent = totalP + " prompts · " + totalS + " scored sentences";
  CONV.forEach((c, ci) => {
    chat.appendChild(el("div", "divider", "Conversation: " + c.name));
    c.turns.forEach((turn, ti) => {
      const pi = turn.event;
      chat.appendChild(el("div", "who user", "user · P" + pNumber[pi] + (eventTime(pi) ? " · " + eventTime(pi) : "")));
      const ub = el("div", "bubble user"); ub.appendChild(el("div", "text", turn.prompt));
      ub.addEventListener("click", () => setActive(pi, false)); bubbleOf[pi] = ub; chat.appendChild(ub);
      chat.appendChild(el("div", "who model", "model · reply " + (ti + 1) + (turn.sentences.length ? "" : " · no scored sentences")));
      turn.sentences.forEach(s => {
        const i = s.event, b = el("div", "bubble model");
        b.appendChild(el("div", "text", s.text));
        const bm = el("div", "bm");
        bm.appendChild(el("span", null, "S" + sNumber[i] + (eventTime(i) ? " · " + eventTime(i) : "")));
        const top = el("span", "top3");
        s.values.map((v, k) => k).filter(k => s.values[k] != null).sort((a, b2) => s.values[b2] - s.values[a]).slice(0, 3).forEach(k => {
          const sp = el("span"); sp.appendChild(lineKey(k, 16)); sp.appendChild(document.createTextNode(EM[k].name + " " + s.values[k].toFixed(3))); top.appendChild(sp);
        });
        bm.appendChild(top);
        
        b.appendChild(bm);
        b.addEventListener("click", () => setActive(i, false)); bubbleOf[i] = b; chat.appendChild(b);
      });
      if (turn.tail) chat.appendChild(el("div", "tail", "not scored (no sentence ending): " + turn.tail));
      if (turn.stop_reason && turn.stop_reason !== "end of turn") chat.appendChild(el("div", "tail", "reply stopped: " + turn.stop_reason));
    });
  });
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatTo(i, smooth) {
    const b = bubbleOf[i]; if (!b) return;
    const target = b.offsetTop - chat.clientHeight / 2 + b.offsetHeight / 2;
    chat.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduceMotion ? "smooth" : "auto" });
  }

  // ---------- table view (built on first open)
  const details = document.getElementById("tabledetails");
  details.addEventListener("toggle", () => {
    const wrap = document.getElementById("tablewrap");
    if (!details.open || wrap.firstChild) return;
    const t = el("table"), thead = el("thead"), hr = el("tr");
    ["#", "time", "reply", "sentence"].forEach((h, k) => hr.appendChild(el("th", k === 3 || k === 1 || k === 5 ? "l" : null, h)));
    EM.forEach(em => hr.appendChild(el("th", null, em.name)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const s = sentenceOf(e), tr = el("tr");
      tr.appendChild(el("td", null, "S" + sNumber[i]));
      tr.appendChild(el("td", "l", eventTime(i) || "–"));
      tr.appendChild(el("td", null, String(e.t + 1)));
      const st = el("td", "l sent", s.text); st.title = s.text; tr.appendChild(st);
      
      let best = -1; s.values.forEach((v, k) => { if (v != null && (best < 0 || v > s.values[best])) best = k; });
      s.values.forEach((v, k) => { const td = el("td"); const sp = el("span", k === best ? "best num" : "num", fmt(v)); sp.style.fontWeight = k === best ? "700" : "400"; td.appendChild(sp); tr.appendChild(td); });
      tr.addEventListener("click", () => setActive(i, true));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  });

  // ---------- distribution of this session's scores
  (function () {
    const DS = D.dist, host = document.getElementById("dist");
    if (!DS || !DS.n) { document.getElementById("distcard").hidden = true; return; }
    const nb = DS.rows[0].counts.length;
    document.getElementById("distinfo").textContent = DS.n + " sentences · " + nb + " bins";
    const clamped = DS.rows.reduce((a, r) => a + r.below + r.above, 0);
    document.getElementById("distnote").textContent =
      "Each row shows how this session's sentences spread across score bins of width " + DS.width +
      ", as a percentage of its " + DS.n + " sentences (counts, no fitted curve). All rows share one horizontal and one vertical scale, " +
      "so positions and heights compare directly. The dark vertical mark is the mean." +
      (clamped ? " " + clamped + " score(s) beyond " + DS.lo + " or " + DS.hi + " are counted in the end bins." : "");
    const svgD = sv("svg", { role: "img", "aria-label": "Distribution of each emotion's scores in this session" });
    const tipD = el("div", "tip"); tipD.hidden = true;
    host.append(svgD, tipD);
    const rowH = 30, top = 8, labelW = 112, right = 16, axisH = 34;
    const yMax = Math.max(1e-9, ...DS.rows.map(r => Math.max(...r.counts) / DS.n * 100));
    function draw() {
      const WD = Math.max(320, Math.round(host.clientWidth)), HD = top + rowH * DS.rows.length + axisH;
      svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
