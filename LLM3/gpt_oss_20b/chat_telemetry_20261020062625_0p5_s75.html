4,"r":0,"x":1792478095869.0,"time":"06:34:55.869","iso":"2026-10-20T06:34:55.869+00:00","estimated":false},{"k":"s","c":0,"t":4,"r":1,"x":1792478097082.0,"time":"06:34:57.082","iso":"2026-10-20T06:34:57.082+00:00","estimated":false},{"k":"s","c":0,"t":4,"r":2,"x":1792478097890.0,"time":"06:34:57.890","iso":"2026-10-20T06:34:57.890+00:00","estimated":false}],"conversations":[{"name":"unemployment_and_ai","turns":[{"prompt":"Hi, Good Morning","event":0,"stop_reason":"end of turn","tail":"","sentences":[{"text":"Good morning!","event":1,"values":[0.03327099606394768,0.16083207726478577,0.14233069121837616,-0.060717228800058365,-0.050775233656167984,-0.09114062041044235,-0.12296106666326523,-0.033844005316495895,-0.09021714329719543,-0.0012998292222619057,0.015591323375701904,0.07477504014968872,0.11859104782342911]},{"text":"How can I help you today?","event":2,"values":[0.029667215421795845,0.15864089131355286,0.12947094440460205,-0.061288896948099136,-0.03898235410451889,-0.08630387485027313,-0.13854460418224335,-0.04576410353183746,-0.10029745101928711,0.021218324080109596,0.014750783331692219,0.08431148529052734,0.132405623793602]}]},{"prompt":"I have a question, Do you know that due to effects of unemployment there is an increase in restlessness among youth, what do you think about its implications on their mental health ?","event":3,"stop_reason":"end of turn","tail":"","sentences":[{"text":"Absolutely, the link between unemployment and youth restlessness—and the downstream effects on mental health—is a critical issue that many societies are grappling with today.","event":4,"values":[0.021008260548114777,0.05736544728279114,0.09558172523975372,-0.02165587991476059,0.09757882356643677,0.03725530952215195,-0.08717786520719528,-0.05813661217689514,-0.058764636516571045,0.03464934229850769,-0.08915084600448608,-0.011392690241336823,0.04399040341377258]},{"text":"Let’s unpack it step by step, looking at the evidence, the mechanisms, and the practical implications.","event":5,"values":[0.01594686321914196,0.05553711950778961,0.10289625078439713,-0.011659989133477211,0.10425674915313721,0.021358294412493706,-0.09472567588090897,-0.08518637716770172,-0.06283539533615112,0.03325287997722626,-0.07045382261276245,0.003609216772019863,0.053090423345565796]},{"text":"---\n\n## 1. Why Unemployment Triggers Restlessness\n\n| Factor | How it fuels restlessness |\n|--------|---------------------------|\n| **Identity \u0026 Purpose** | Work often anchors a person’s sense of self.","event":6,"values":[0.019612815231084824,0.05720984935760498,0.0929609090089798,-0.031095653772354126,0.1010800451040268,0.020995082333683968,-0.08123034983873367,-0.08616788685321808,-0.03737469017505646,0.046402707695961,-0.08490456640720367,-0.005183078348636627,0.04061207175254822]},{"text":"Without it, many youths feel “lost” or “unfulfilled.” |\n| **Financial Stress** | Uncertainty about meeting basic needs (rent, food, transportation) creates chronic anxiety.","event":7,"values":[0.024173850193619728,0.03996480256319046,0.06621553003787994,-0.05079106613993645,0.11325383186340332,0.031796276569366455,-0.05138537287712097,-0.08581458777189255,0.0016235392540693283,0.061156563460826874,-0.10166585445404053,-0.02084721252322197,0.016541527584195137]},{"text":"|\n| **Social Isolation** | Jobs provide routine social interactions.","event":8,"values":[0.03414946794509888,0.03809191286563873,0.04724577069282532,-0.06639814376831055,0.1013781875371933,0.030747128650546074,-0.04031967371702194,-0.06663205474615097,0.02052377723157406,0.06901466846466064,-0.10883281379938126,-0.02808970957994461,0.007348613813519478]},{"text":"Without them, youths may withdraw or seek validation online, which can amplify restlessness.","event":9,"values":[0.026789743453264236,0.008721590042114258,0.016212403774261475,-0.07514268904924393,0.12512919306755066,0.06502172350883484,-0.013608797453343868,-0.05156077444553375,0.05565730482339859,0.09973263740539551,-0.13538482785224915,-0.05002616345882416,-0.021794147789478302]},{"text":"|\n| **Future Uncertainty** | Inability to plan for education, travel, or family life can lead to a sense of stagnation.","event":10,"values":[0.0026426613330841064,0.02526545710861683,0.028442583978176117,-0.07116099447011948,0.1300455778837204,0.06512389332056046,-0.02106441557407379,-0.03989029303193092,0.05656071752309799,0.11797471344470978,-0.1472216695547104,-0.05206859111785889,-0.011593382805585861]},{"text":"|\n| **Cultural Expectations** | Societal narratives that equate success with employment amplify pressure.","event":11,"values":[-0.005405081436038017,0.025635644793510437,0.03855714574456215,-0.0591738261282444,0.14876335859298706,0.08767113089561462,-0.008087907917797565,-0.035233624279499054,0.04670356959104538,0.10550198704004288,-0.16821154952049255,-0.06839317083358765,-0.02166823111474514]},{"text":"|\n\n---\n\n## 2.","event":12,"values":[0.0025516804307699203,0.04753981903195381,0.0638560876250267,-0.04942138120532036,0.1385723352432251,0.06303335726261139,-0.026486102491617203,-0.04221641644835472,0.0158272422850132,0.07517349720001221,-0.15546390414237976,-0.05701087787747383,0.0002529853954911232]},{"text":"Mental‑Health Implications\n\n| Symptom/Condition | How it manifests | Why it matters |\n|-------------------|------------------|----------------|\n| **Depression** | Persistent sadness, loss of interest, sleep disturbances | Leads to reduced motivation to seek help or apply for jobs.","event":13,"values":[0.04571324586868286,0.0413125641644001,0.04987027868628502,-0.06733977794647217,0.11106356978416443,0.0345563143491745,-0.044944535940885544,-0.038621000945568085,0.008610064163804054,0.06059242784976959,-0.13723257184028625,-0.0371590182185173,0.001304985024034977]},{"text":"|\n| **Anxiety Disorders** | Panic attacks, generalized worry, hypervigilance | Can impair cognitive functioning and decision‑making.","event":14,"values":[0.050168007612228394,0.04115629941225052,0.04732338711619377,-0.05852789059281349,0.11326964944601059,0.02961680293083191,-0.04634879156947136,-0.05286562442779541,0.004740447737276554,0.04439201205968857,-0.12770546972751617,-0.02503095008432865,0.0004386855289340019]},{"text":"|\n| **Substance Use** | Alcohol, vaping, or illicit drugs as coping mechanisms | Increases risk of addiction and health complications.","event":15,"values":[0.06174464523792267,0.038999661803245544,0.03399018198251724,-0.07927841693162918,0.10941557586193085,0.027419036254286766,-0.04495092108845711,-0.04899449646472931,0.010974083095788956,0.055162619799375534,-0.13343024253845215,-0.021059246733784676,-0.002837955020368099]},{"text":"|\n| **Self‑Harm \u0026 Suicidal Ideation** | Thoughts of self‑injury or suicide | Highest risk group for self‑harm among unemployed youths.","event":16,"values":[0.0639190748333931,0.02618269808590412,0.02083561383187771,-0.06965550780296326,0.11848961561918259,0.03965306282043457,-0.03269537538290024,-0.03821283578872681,0.01110159046947956,0.04358474910259247,-0.1397228240966797,-0.026436610147356987,-0.008417103439569473]},{"text":"|\n| **Social Withdrawal** | Avoiding friends, family, or community events | Further reduces support networks and opportunities for job leads.","event":17,"values":[0.06853628158569336,0.02396409399807453,0.005801960825920105,-0.09117540717124939,0.10430128127336502,0.029143545776605606,-0.0400749109685421,-0.020211879163980484,0.028289610520005226,0.06709501147270203,-0.13546721637248993,-0.02563484199345112,-0.002071292605251074]},{"text":"|\n\n**Research Snapshot**  \n- A 2022 meta‑analysis of 45 studies found a **40% higher risk of depressive symptoms** among unemployed young adults compared to their employed peers.","event":18,"values":[0.10477253794670105,0.061231810599565506,0.027264446020126343,-0.08964886516332626,0.0870838537812233,-0.0052520171739161015,-0.07023150473833084,-0.04949042201042175,-0.011549556627869606,0.049669601023197174,-0.13753049075603485,-0.02256876975297928,0.01514372881501913]},{"text":"- Another longitudinal study (2021) reported that **unemployment during adolescence predicted higher anxiety scores 10 years later**.","event":19,"values":[0.13064315915107727,0.08846786618232727,0.04141298681497574,-0.09066346287727356,0.06817906349897385,-0.029784761369228363,-0.09152241796255112,-0.08052973449230194,-0.03946402296423912,0.044636473059654236,-0.13163411617279053,-0.013293497264385223,0.02546755224466324]},{"text":"---\n\n## 3. Mechanisms at Play\n\n1.","event":20,"values":[0.13094612956047058,0.09505194425582886,0.060896873474121094,-0.07247944176197052,0.06106039881706238,-0.03436822444200516,-0.08933643996715546,-0.09304355084896088,-0.062332883477211,0.0305379219353199,-0.12263253331184387,-0.009090295061469078,0.02782873436808586]},{"text":"**Neurobiological Stress Response**  \n   - Chronic stress from financial insecurity can dysregulate the hypothalamic‑pituitary‑adrenal (HPA) axis, increasing cortisol and altering mood regulation.","event":21,"values":[0.09974569082260132,0.07993490993976593,0.06584429740905762,-0.0723574161529541,0.08522088825702667,-0.013634558767080307,-0.08402581512928009,-0.09481509774923325,-0.05416405200958252,-7.406249642372131e-05,-0.11116012930870056,0.02265469916164875,0.024578219279646873]},{"text":"2. **Cognitive‑Behavioral Loop**  \n   - Negative thoughts (“I’ll never find a job”) reinforce low self‑efficacy, which reduces job‑search effort, perpetuating unemployment.","event":22,"values":[0.06817025691270828,0.057280462235212326,0.04151909425854683,-0.09001488983631134,0.09720051288604736,0.009737750515341759,-0.0673946812748909,-0.07339058816432953,-0.008208254352211952,0.01578991860151291,-0.10097780078649521,0.021730007603764534,0.021605027839541435]},{"text":"3. **Social Capital Loss**  \n   - Employment is a conduit for skill development and networking.","event":23,"values":[0.07776207476854324,0.06500492244958878,0.03687150403857231,-0.09598425775766373,0.08592422306537628,-0.00035593006759881973,-0.07722380757331848,-0.07522475719451904,-0.009167756885290146,0.020343955606222153,-0.10075610876083374,0.026276269927620888,0.02706778421998024]},{"text":"Its absence erodes social capital, which is protective against mental‑health decline.","event":24,"values":[0.06381448358297348,0.05190904811024666,0.013098664581775665,-0.09732735902070999,0.09074528515338898,0.01818189211189747,-0.06659594923257828,-0.058839350938797,0.023257503286004066,0.051599688827991486,-0.11018617451190948,0.003337937407195568,0.022130077704787254]},{"text":"---\n\n## 4. Practical Implications \u0026 Interventions\n\n### For Individuals\n| Strategy | How to Implement |\n|----------|------------------|\n| **Skill Development** | Enroll in online courses (e.g., Coursera, Udemy) or community‑based vocational training.","event":25,"values":[0.09007807821035385,0.06713710725307465,0.03153342381119728,-0.09282010793685913,0.06298843771219254,-0.03626265376806259,-0.08312074095010757,-0.07363135367631912,-0.006498146802186966,0.08591464161872864,-0.1079673022031784,0.011914961971342564,0.032691840082407]},{"text":"|\n| **Structured Routine** | Set daily goals (e.g., 2‑hour job search, 30‑min exercise).","event":26,"values":[0.1176920086145401,0.04541151970624924,0.007845807820558548,-0.11218327283859253,0.06637783348560333,-0.05847412347793579,-0.08082929253578186,-0.06872539967298508,0.004051893949508667,0.10925892740488052,-0.10439382493495941,0.00522373104467988,0.030600998550653458]},{"text":"|\n| **Peer Support Groups** | Join local or virtual “unemployed youth” communities.","event":27,"values":[0.11883164942264557,0.05800197646021843,0.010992690920829773,-0.12135055661201477,0.04606067016720772,-0.07914097607135773,-0.08943520486354828,-0.06650335341691971,-0.0025873444974422455,0.116801917552948,-0.08499715477228165,0.018218133598566055,0.04454299435019493]},{"text":"|\n| **Professional Help** | Seek therapy (CBT, ACT) or counseling; many universities offer 65,0.013929639011621475,-0.07426442950963974,0.2087039053440094,0.10112015902996063,0.08913464844226837,-0.011969677172601223,0.07794977724552155,0.10714572668075562,-0.21207371354103088,-0.1296200454235077,-0.054234884679317474]},{"text":"|\n| 4 | **Mental Fatigue** | The shock of losing a job can trigger anxiety, depression, and a sense of hopelessness.","event":136,"values":[-0.03096895106136799,-0.03368933126330376,0.008507538586854935,-0.0782146155834198,0.20430733263492584,0.11005346477031708,0.07995443046092987,-0.007062024436891079,0.10170723497867584,0.10314653068780899,-0.19243469834327698,-0.1018700897693634,-0.03985036164522171]},{"text":"|\n| 5 | **Skill Obsolescence** | My stack (React, Node, AWS) is still relevant, but I’m not sure if the market needs it now.","event":137,"values":[0.008611388504505157,-0.06828650832176208,-0.0002854354679584503,-0.053821809589862823,0.2312154769897461,0.11152325570583344,0.07518716156482697,-0.013014156371355057,0.07386385649442673,0.12904764711856842,-0.22278615832328796,-0.1292693316936493,-0.061577655375003815]},{"text":"|\n| 6 | **Limited Time for Upskilling** | I have to earn a living, yet I also need to learn something new.","event":138,"values":[0.0002251267433166504,-0.08536630868911743,0.007639244198799133,-0.038204725831747055,0.24393802881240845,0.11679385602474213,0.08718714118003845,-0.005827838554978371,0.07819757610559464,0.13881994783878326,-0.23042058944702148,-0.1417197585105896,-0.07332664728164673]},{"text":"|\n\n---\n\n#### **Turning the Corner: A Personal Roadmap**\n\nI decided to treat the layoff like a *career pivot* rather than a dead end.","event":139,"values":[-0.0015464629977941513,-0.09419544041156769,0.005839001387357712,-0.03749557211995125,0.2370607554912567,0.12013603001832962,0.08140072226524353,-0.01120411790907383,0.08785753697156906,0.16551357507705688,-0.22258926928043365,-0.1531992405653,-0.07422371208667755]},{"text":"Here’s what I did, step by step:\n\n1.","event":140,"values":[-0.02975335158407688,-0.07913554459810257,0.018277563154697418,-0.029152419418096542,0.22535419464111328,0.12901295721530914,0.06732465326786041,-0.02518489584326744,0.09335558116436005,0.14689871668815613,-0.18967631459236145,-0.13164618611335754,-0.06168784946203232]},{"text":"**Grounding \u0026 Self‑Care**  \n   - **Daily Routine**: 7 am – wake up, 30 min walk, 8 am – breakfast, 9 am – job search, 12 pm – lunch \u0026 short meditation, 1 pm – skill practice, 6 pm – dinner \u0026 social call, 9 pm – reading or a hobby.","event":141,"values":[0.10000763088464737,-0.021416522562503815,-0.029010728001594543,-0.11618374288082123,0.10696518421173096,-0.03020893782377243,-0.03182016685605049,-0.07068416476249695,0.03269115835428238,0.09904918074607849,-0.08698944747447968,-0.005766453221440315,0.04181276261806488]},{"text":"- **Mental Health Check**: I started a journal and used a free mental‑health app (Headspace) for 10‑minute guided meditations.","event":142,"values":[0.1377161145210266,0.007836740463972092,-0.04289732128381729,-0.1432754099369049,0.06888983398675919,-0.0881509929895401,-0.06215600669384003,-0.08886851370334625,0.005318165756762028,0.07792022079229355,-0.04934316501021385,0.044400498270988464,0.08187087625265121]},{"text":"- **Support System**: I called my best friend and a former colleague; we set up a weekly “check‑in” call.","event":143,"values":[0.1356399953365326,0.01578376442193985,-0.051084741950035095,-0.15543465316295624,0.07026513665914536,-0.0879288762807846,-0.05973979830741882,-0.08381298184394836,0.007841203361749649,0.08707308769226074,-0.05410114303231239,0.04213986173272133,0.08521763980388641]},{"text":"2. **Financial Management**  \n   - **Budgeting**: I listed all fixed expenses (rent, utilities, groceries) and cut non‑essential subscriptions.","event":144,"values":[0.12814147770404816,0.024530326947569847,-0.037151038646698,-0.14026010036468506,0.09439099580049515,-0.05617223680019379,-0.04480672627687454,-0.09943975508213043,-0.0015079258009791374,0.07200973480939865,-0.08050437271595001,0.023849157616496086,0.05982314795255661]},{"text":"- **Emergency Fund**: I used a portion of my severance to create a 3‑month cushion.","event":145,"values":[0.13763494789600372,0.0004498623311519623,-0.030513808131217957,-0.12321864068508148,0.12316024303436279,-0.03411678224802017,-0.018025914207100868,-0.08423273265361786,-0.007947980426251888,0.08421452343463898,-0.1230909675359726,-0.0207132026553154,0.02873820625245571]},{"text":"- **Side Gig**: I took on a freelance UI/UX project to keep the cash flowing while I searched.","event":146,"values":[0.15849080681800842,-0.00189488148316741,-0.021506603807210922,-0.10862599313259125,0.11567424982786179,-0.056375034153461456,-0.032644763588905334,-0.10306962579488754,-0.02314944379031658,0.08864651620388031,-0.11901123821735382,-0.01213502325117588,0.024601545184850693]},{"text":"3. **Skill Audit \u0026 Upskilling**  \n   - **Self‑Assessment**: I mapped my current skill set against the top 10 in-demand tech roles (AI/ML, DevOps, Cybersecurity).","event":147,"values":[0.13527697324752808,0.03898470103740692,0.018055249005556107,-0.0947628766298294,0.09749439358711243,-0.07745020091533661,-0.062464065849781036,-0.10736390948295593,-0.043464116752147675,0.1077253669500351,-0.12496275454759598,0.00018486962653696537,0.051100168377161026]},{"text":"- **Learning Path**: I enrolled in an AI‑focused micro‑degree on Coursera (Google AI) and a short course on Kubernetes (Udemy).","event":148,"values":[0.12683230638504028,0.06513917446136475,0.03908495232462883,-0.08929810672998428,0.06782332062721252,-0.08738870918750763,-0.08983935415744781,-0.11473268270492554,-0.054138947278261185,0.10975469648838043,-0.10948234051465988,0.02331800013780594,0.06202460080385208]},{"text":"- **Project Portfolio**: I built a small AI chatbot for a local NGO and added it to my GitHub.","event":149,"values":[0.12472639232873917,0.07653742283582687,0.05633252486586571,-0.0905756801366806,0.05913879722356796,-0.08582501858472824,-0.09665891528129578,-0.11266282200813293,-0.06089162081480026,0.1075674444437027,-0.11477494239807129,0.0219586081802845,0.06578631699085236]},{"text":"4. **Job Search Strategy**  \n   - **Resume \u0026 LinkedIn Refresh**: Highlighted achievements, quantified results, and added the new AI project.","event":150,"values":[0.12595689296722412,0.08167944848537445,0.0648719072341919,-0.08831501007080078,0.05318473279476166,-0.08584742248058319,-0.10977060347795486,-0.11249369382858276,-0.06818340718746185,0.10383071005344391,-0.11144042760133743,0.022873882204294205,0.07207455486059189]},{"text":"- **Networking**: Attended virtual meetups, joined Slack communities (e.g., #devops, #ai), and reached out to former teammates for referrals.","event":151,"values":[0.10532800108194351,0.0972539559006691,0.07244745641946793,-0.09162985533475876,0.051854271441698074,-0.08294858783483505,-0.11129269003868103,-0.10020174086093903,-0.06180714815855026,0.12177866697311401,-0.11725623160600662,0.014143980108201504,0.07513084262609482]},{"text":"- **Target Companies**: Focused on firms that were hiring for “AI Engineer” or “DevOps Specialist” roles.","event":152,"values":[0.09281252324581146,0.09493928402662277,0.07830143719911575,-0.07199664413928986,0.05519501119852066,-0.0744025707244873,-0.1063716858625412,-0.08984982967376709,-0.06132535636425018,0.1120162308216095,-0.1163027361035347,0.006691199727356434,0.07053778320550919]},{"text":"5. **Mental Resilience Building**  \n   - **Mindset Shift**: I reframed the layoff as a “forced sabbatical” that gave me time to learn something new.","event":153,"values":[0.05644217133522034,0.09095024317502975,0.06819066405296326,-0.07763473689556122,0.07123450934886932,-0.055601947009563446,-0.10322686284780502,-0.09407971054315567,-0.03171124681830406,0.13127383589744568,-0.11093589663505554,0.008462196215987206,0.07533187419176102]},{"text":"- **Goal Setting**: I set a SMART goal: *“Secure a role in AI/ML within 3 months.”*  \n   - **Celebrate Small Wins**: Completed a course module, finished a project, got a positive feedback email from a recruiter – each was a victory.","event":154,"values":[0.07561345398426056,0.07576809078454971,0.0616450160741806,-0.07177174836397171,0.0963524580001831,-0.05316856876015663,-0.09799849987030029,-0.11313354223966599,-0.02885725162923336,0.11136549711227417,-0.11616602540016174,-0.014123331755399704,0.07542629539966583]},{"text":"---\n\n#### **The Turning Point**\n\nTwo weeks into my plan, a recruiter from a mid‑size fintech reached out after seeing my updated LinkedIn.","event":155,"values":[0.08321265876293182,0.08374439179897308,0.06784498691558838,-0.07999630272388458,0.09953435510396957,-0.055759429931640625,-0.10462072491645813,-0.11833550035953522,-0.03715074807405472,0.11175933480262756,-0.12329297512769699,-0.01637900620698929,0.07652155309915543]},{"text":"We had a quick call, and they were impressed by my AI chatbot project.","event":156,"values":[0.11370576918125153,0.08921994268894196,0.07376069575548172,-0.08587010204792023,0.0999947041273117,-0.07018736004829407,-0.10957564413547516,-0.12378927320241928,-0.061091139912605286,0.11075645685195923,-0.1316797435283661,-0.02770064026117325,0.07453819364309311]},{"text":"They invited me to a technical interview, and I aced it.","event":157,"values":[0.10016492009162903,0.0807938203215599,0.09913273900747299,-0.07261093705892563,0.1100502610206604,-0.051995933055877686,-0.10456190258264542,-0.10916535556316376,-0.0759880542755127,0.12066435068845749,-0.14679846167564392,-0.039606932550668716,0.062037307769060135]},{"text":"**Result:** I got a job offer as an AI Engineer, with a salary that matched my experience and a chance to work on cutting‑edge projects.","event":158,"values":[0.07801709324121475,0.07264851778745651,0.12560971081256866,-0.05283869430422783,0.11808626353740692,-0.0500323511660099,-0.10402224957942963,-0.11284637451171875,-0.07699179649353027,0.1 <script>

  function sentenceOf(ev) { return CONV[ev.c].turns[ev.t].sentences[ev.r]; }
  function countBefore(idx, kind) { let n = 0; for (let i = 0; i <= idx; i++) if (EV[i].k === kind) n++; return n; }
  const totalS = EV.filter(e => e.k === "s").length, totalP = EV.filter(e => e.k === "p").length;
  const pNumber = [], sNumber = [];

  function eventLabel(i) {

    return "Sentence " + sNumber[i] + " of " + totalS + " · reply " + (e.t + 1);
  }
  function eventTime(i) {

  }

  // ---------- header

  document.getElementById("sub").textContent = D.source + (D.interrupted ? " · run was interrupted" : "");
  const chips = document.getElementById("chips");
  const tempText = m.temperature == null ? null : Number(m.temperature).toFixed(1);
  
  [["model", m.model_id || m.model_key], ["temperature", tempText], ["seed", m.seed == null ? "none" : m.seed]]
   
   .concat([["axis", D.mode === "time" ? "recorded time" : "event order"]])
    .forEach(([k, v]) => { if (v == null || v === "") return; const li = el("li"); li.append(k + " "); li.appendChild(el("b", null, String(v))); chips.appendChild(li); });
  const notes = document.getElementById("notes");
  [ "Each point is one model sentence; lines restart at each reply. Scores are relative: read which emotions lead and how they shift. Related emotions tend to move together, so small gaps between neighbours are not meaningful.",
    "Colour groups related emotions in threes; line style separates them (solid, dashed, dotted). Neutral is grey."
  ].concat(D.notes).forEach(t => notes.appendChild(el("p", null, t)));
  

  // ---------- legend (filters above the chart)
  const legend = document.getElementById("legend");
  const legendButtons = [];
  const groups = {};
  EM.forEach((e, i) => { (groups[e.family] = groups[e.family] || []).push(i); });
  Object.keys(groups).sort().forEach(f => {
    const g = el("div", "fam");
    groups[f].forEach(i => {
      const b = el("button"); b.type = "button"; b.setAttribute("aria-pressed", "true");
      b.appendChild(lineKey(i)); b.appendChild(document.createTextNode(EM[i].name));
      b.addEventListener("click", () => { visible[i] = !visible[i]; b.setAttribute("aria-pressed", String(visible[i])); drawAll(); });
      b.addEventListener("pointerenter", () => { emphasis = i; drawStatic(); drawDynamic(); });
      b.addEventListener("pointerleave", () => { emphasis = -1; drawStatic(); drawDynamic(); });
      legendButtons[i] = b; g.appendChild(b);
    });
    legend.appendChild(g);
  });
  const tools = el("div", "tools");
  [["Show all", true], ["Hide all", false]].forEach(([label, on]) => {
    const b = el("button", null, label); b.type = "button";
    b.addEventListener("click", () => { visible.fill(on); legendButtons.forEach(x => x.setAttribute("aria-pressed", String(on))); drawAll(); });
    tools.appendChild(b);

  // ---------- chart geometry

  const tip = el("div", "tip"); tip.hidden = true; chart.appendChild(tip);
  const M = { top: 64, right: 18, bottom: 86, left: 52 };
  const H = 420;
  let W = 900, X, Y, yTicks = [], yDecimals = 1;

  function computeScales() {
    W = Math.max(320, Math.round(chart.clientWidth - 8));
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    const xs = EV.map(e => e.x);
    let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    if (x1 === x0) { x0 -= 1; x1 += 1; }
    const pw = W - M.left - M.right, pad = 10;
    X = v => M.left + pad + (v - x0) / (x1 - x0) * (pw - 2 * pad);
    let lo = 0, hi = 0;
    EV.forEach(e => { if (e.k !== "s") return; sentenceOf(e).values.forEach((v, i) => { if (visible[i] && v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }); });
    if (hi === lo) { hi += 0.1; lo -= 0.1; }
    const span = hi - lo, steps = [0.01, 0.02, 0.05, 0.1, 0.2, 0.25, 0.5, 1];
    const step = steps.find(s => span / s <= 7) || 1;
    lo = Math.floor((lo - span * 0.04) / step) * step; hi = Math.ceil((hi + span * 0.04) / step) * step;
    yTicks = []; for (let k = Math.round(lo / step); k * step <= hi + step / 2; k++) yTicks.push(k * step);
    yDecimals = step >= 1 ? 0 : step >= 0.1 ? (step === 0.25 ? 2 : 1) : 2;
    const ph = H - M.top - M.bottom;
    Y = v => M.top + (hi - v) / (hi - lo) * ph;
  }

  function nearestEvent(px) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < EV.length; i++) {
      const d = Math.abs(X(EV[i].x) - px);
      if (d < bd - 1e-9 || (Math.abs(d - bd) < 1e-9 && EV[i].k === "s")) { bd = d; best = i; }
    }
    return best;
  }

  function drawStatic() {
    computeScales();
    gStatic.replaceChildren();
    const pl = M.left, pr = W - M.right, pt = M.top, pb = H - M.bottom;
    // grid + y axis
    yTicks.forEach(v => {
      const y = Y(v);
      gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: y, y2: y, stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      const t = sv("text", { x: pl - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" });
      t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(yDecimals);
      gStatic.appendChild(t);
    });
    const yl = sv("text", { x: 14, y: (pt + pb) / 2, transform: "rotate(-90 14 " + (pt + pb) / 2 + ")", "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
    yl.textContent = "emotion score"; gStatic.appendChild(yl);
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pt, y2: pt, stroke: "var(--axis)", "stroke-width": 1 }));
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pb, y2: pb, stroke: "var(--axis)", "stroke-width": 1 }));

    // prompt rules + conversation boundaries
    let prevConv = -1;
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      const newConv = e.c !== prevConv; prevConv = e.c;
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: newConv && CONV.length > 1 ? "var(--axis)" : "var(--prompt-rule)", "stroke-width": newConv && CONV.length > 1 ? 2 : 1 }));

        const t = sv("text", { x: x + 4, y: pt + 12, "font-size": 11, fill: "var(--ink-2)" }); t.textContent = CONV[e.c].name; gStatic.appendChild(t);
      }
    });

    // titles for the two scales
    const tt = sv("text", { x: pl, y: 14, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); tt.textContent = "Model sentences" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(tt);
    const bt = sv("text", { x: pl, y: H - 6, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); bt.textContent = "User prompts" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(bt);

    // top scale: a tick per sentence, labels thinned so they never collide
    let lastLabelX = -Infinity;
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt - 6, y2: pt, stroke: "var(--muted)", "stroke-width": 1 }));
      const label = D.mode === "time" ? e.time.slice(0, 8) : "S" + sNumber[i];
      if (x - lastLabelX >= (D.mode === "time" ? 62 : 34) && x + 28 <= W) {
        const t = sv("text", { x: x, y: pt - 10, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = label; gStatic.appendChild(t); lastLabelX = x;
      }
    });

    // bottom scale: a tick + label per prompt, staggered onto a second row when crowded
    const rowEnd = [-Infinity, -Infinity];
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);

      const w = Math.max(t1.length, t2.length) * 6.2 + 8;
      const row = (x - w / 2 > rowEnd[0]) ? 0 : 1;

    EM.forEach((em, i) => {
      if (!visible[i]) return;
      CONV.forEach(c => c.turns.forEach(turn => {
        let d = "", pen = false;
        turn.sentences.forEach(s => {
          const v = s.values[i];
          if (v == null) { pen = false; return; }
          d += (pen ? "L" : "M") + X(EV[s.event].x).toFixed(1) + " " + Y(v).toFixed(1); pen = true;
        });
        if (!d) return;
        const p = sv("path", { d: d, fill: "none", "stroke-width": emphasis === i ? 3 : 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
        p.style.stroke = color(i);
        if (em.dash) p.setAttribute("stroke-dasharray", em.dash);
        if (emphasis >= 0 && emphasis !== i) p.setAttribute("opacity", "0.18");
        gStatic.appendChild(p);
        if (turn.sentences.length === 1 && s0v(turn, i) != null) {
          const dot = sv("circle", { cx: X(EV[turn.sentences[0].event].x), cy: Y(s0v(turn, i)), r: 2.5 }); dot.style.fill = color(i); gStatic.appendChild(dot);
        }
      }));
    });
    if (!anyVisible) {
      const t = sv("text", { x: (pl + pr) / 2, y: (pt + pb) / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 13 });
      t.textContent = "All emotions are hidden. Use the buttons above to show them."; gStatic.appendChild(t);
    }
    hit.setAttribute("x", pl); hit.setAttribute("y", 0); hit.setAttribute("width", pr - pl); hit.setAttribute("height", H);
  }
  function s0v(turn, i) { return turn.sentences[0].values[i]; }

  function drawDynamic() {
    gDyn.replaceChildren();
    const pt = M.top, pb = H - M.bottom;
    if (hover >= 0 && hover !== active) {
      const x = X(EV[hover].x);
      gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: "var(--muted)", "stroke-width": 1 }));
    }
    const e = EV[active], x = X(e.x);
    gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt - 8, y2: pb + 8, stroke: "var(--ink)", "stroke-width": 1.5 }));
    if (e.k === "s") {
      const vals = sentenceOf(e).values;
      EM.forEach((em, i) => {
        if (!visible[i] || vals[i] == null) return;
        const c = sv("circle", { cx: x, cy: Y(vals[i]), r: 4, "stroke-width": 2 });
        c.style.fill = color(i); c.style.stroke = "var(--surface)";
        if (emphasis >= 0 && emphasis !== i) c.setAttribute("opacity", "0.2");
        gDyn.appendChild(c);
      });
    }
    // the slider handle, on the bottom scale
    const handle = sv("g", {});
    handle.appendChild(sv("circle", { cx: x, cy: pb, r: 7, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2 }));
    gDyn.appendChild(handle);
    chart.setAttribute("aria-valuemin", "1"); chart.setAttribute("aria-valuemax", String(EV.length));
    chart.setAttribute("aria-valuenow", String(active + 1));
    chart.setAttribute("aria-valuetext", eventLabel(active) + (eventTime(active) ? ", " + eventTime(active) : ""));
  }

  function drawAll() { drawStatic(); drawDynamic(); renderReadout(); }

  // ---------- tooltip (values lead, every visible series)
  function showTip(i, px, py) {
    tip.replaceChildren();
    const e = EV[i];
    const head = el("div", "h", eventLabel(i) + (eventTime(i) ? " · " + eventTime(i) : ""));
    tip.appendChild(head);
    if (e.k === "p") {
      const t = CONV[e.c].turns[e.t].prompt;
      tip.appendChild(el("div", null, t.length > 180 ? t.slice(0, 180) + "…" : t));
    } else {
      const vals = sentenceOf(e).values;
      EM.map((em, k) => k).filter(k => visible[k] && vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name)); tip.appendChild(r);
      });
    }
    tip.hidden = false;
    const rect = chart.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14, top = py - th / 2;
    if (left + tw > rect.width - 4) left = px - tw - 14;
    top = Math.max(4, Math.min(top, rect.height - th - 4));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }

  function toPlotX(evt) {
    const r = svg.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W / r.width), px: evt.clientX - chart.getBoundingClientRect().left, py: evt.clientY - chart.getBoundingClientRect().top };
  }
  let dragging = false;
  hit.addEventListener("pointerdown", evt => { dragging = true; hit.setPointerCapture(evt.pointerId); const p = toPlotX(evt); setActive(nearestEvent(p.x), true); chart.focus({ preventScroll: true }); });
  hit.addEventListener("pointermove", evt => {
    const p = toPlotX(evt), i = nearestEvent(p.x);
    if (dragging) { if (i !== active) setActive(i, true); tip.hidden = true; hover = -1; drawDynamic(); return; }
    if (i !== hover) { hover = i; drawDynamic(); }
    showTip(i, p.px, p.py);
  });
  hit.addEventListener("pointerup", evt => { dragging = false; try { hit.releasePointerCapture(evt.pointerId); } catch (_) {} });
  hit.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; tip.hidden = true; drawDynamic(); } });
  chart.addEventListener("keydown", evt => {
    const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 10, PageUp: -10, ArrowUp: -1, ArrowDown: 1 }[evt.key];
    let next = active;
    if (step) next = active + step; else if (evt.key === "Home") next = 0; else if (evt.key === "End") next = EV.length - 1; else return;
    evt.preventDefault(); setActive(Math.max(0, Math.min(EV.length - 1, next)), true);
  });

  // ---------- readout (a table view of the cursor, always visible)
  const readoutCard = document.getElementById("readout");
  const readout = el("div"); readout.style.display = "flex"; readout.style.flexDirection = "column"; readout.style.gap = "8px";
  readoutCard.appendChild(readout);
  // navigation is built once, so a keyboard user keeps focus on the button they pressed
  const nav = el("div", "nav");
  [["◀ Prev", () => active - 1], ["Next ▶", () => active + 1],
   ["◀ Prompt", () => { for (let i = active - 1; i >= 0; i--) if (EV[i].k === "p") return i; return active; }],
   ["Prompt ▶", () => { for (let i = active + 1; i < EV.length; i++) if (EV[i].k === "p") return i; return active; }]]
    .forEach(([label, f]) => { const b = el("button", "btn", label); b.type = "button"; b.addEventListener("click", () => setActive(Math.max(0, Math.min(EV.length - 1, f())), true)); nav.appendChild(b); });
  readoutCard.appendChild(nav);
  function renderReadout() {
    readout.replaceChildren();
    const e = EV[active];
    readout.appendChild(el("div", "title", eventLabel(active)));
    const meta = [];
    if (eventTime(active)) meta.push(eventTime(active));
    meta.push("conversation: " + CONV[e.c].name);
    
    readout.appendChild(el("div", "meta", meta.join(" · ")));
    if (e.k === "p") {
      readout.appendChild(el("div", "ptext", CONV[e.c].turns[e.t].prompt));
      readout.appendChild(el("div", "meta", "Prompts are not scored; the model's sentences that follow are."));
    } else {
      const vals = sentenceOf(e).values, rows = el("div", "rows");
      EM.map((em, k) => k).filter(k => vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); if (!visible[k]) r.style.opacity = "0.45";
        r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name + (visible[k] ? "" : " (hidden)")));
        rows.appendChild(r);
      });
      readout.appendChild(rows);
    }
  }

  // ---------- chat
  const chat = document.getElementById("chat");
  const bubbleOf = [];
  document.getElementById("chatinfo").textContent = totalP + " prompts · " + totalS + " scored sentences";
  CONV.forEach((c, ci) => {
    chat.appendChild(el("div", "divider", "Conversation: " + c.name));
    c.turns.forEach((turn, ti) => {
      const pi = turn.event;
      chat.appendChild(el("div", "who user", "user · P" + pNumber[pi] + (eventTime(pi) ? " · " + eventTime(pi) : "")));
      const ub = el("div", "bubble user"); ub.appendChild(el("div", "text", turn.prompt));
      ub.addEventListener("click", () => setActive(pi, false)); bubbleOf[pi] = ub; chat.appendChild(ub);
      chat.appendChild(el("div", "who model", "model · reply " + (ti + 1) + (turn.sentences.length ? "" : " · no scored sentences")));
      turn.sentences.forEach(s => {
        const i = s.event, b = el("div", "bubble model");
        b.appendChild(el("div", "text", s.text));
        const bm = el("div", "bm");
        bm.appendChild(el("span", null, "S" + sNumber[i] + (eventTime(i) ? " · " + eventTime(i) : "")));
        const top = el("span", "top3");
        s.values.map((v, k) => k).filter(k => s.values[k] != null).sort((a, b2) => s.values[b2] - s.values[a]).slice(0, 3).forEach(k => {
          const sp = el("span"); sp.appendChild(lineKey(k, 16)); sp.appendChild(document.createTextNode(EM[k].name + " " + s.values[k].toFixed(3))); top.appendChild(sp);
        });
        bm.appendChild(top);
        
        b.appendChild(bm);
        b.addEventListener("click", () => setActive(i, false)); bubbleOf[i] = b; chat.appendChild(b);
      });
      if (turn.tail) chat.appendChild(el("div", "tail", "not scored (no sentence ending): " + turn.tail));
      if (turn.stop_reason && turn.stop_reason !== "end of turn") chat.appendChild(el("div", "tail", "reply stopped: " + turn.stop_reason));
    });
  });
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatTo(i, smooth) {
    const b = bubbleOf[i]; if (!b) return;
    const target = b.offsetTop - chat.clientHeight / 2 + b.offsetHeight / 2;
    chat.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduceMotion ? "smooth" : "auto" });
  }

  // ---------- table view (built on first open)
  const details = document.getElementById("tabledetails");
  details.addEventListener("toggle", () => {
    const wrap = document.getElementById("tablewrap");
    if (!details.open || wrap.firstChild) return;
    const t = el("table"), thead = el("thead"), hr = el("tr");
    ["#", "time", "reply", "sentence"].forEach((h, k) => hr.appendChild(el("th", k === 3 || k === 1 || k === 5 ? "l" : null, h)));
    EM.forEach(em => hr.appendChild(el("th", null, em.name)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const s = sentenceOf(e), tr = el("tr");
      tr.appendChild(el("td", null, "S" + sNumber[i]));
      tr.appendChild(el("td", "l", eventTime(i) || "–"));
      tr.appendChild(el("td", null, String(e.t + 1)));
      const st = el("td", "l sent", s.text); st.title = s.text; tr.appendChild(st);
      
      let best = -1; s.values.forEach((v, k) => { if (v != null && (best < 0 || v > s.values[best])) best = k; });
      s.values.forEach((v, k) => { const td = el("td"); const sp = el("span", k === best ? "best num" : "num", fmt(v)); sp.style.fontWeight = k === best ? "700" : "400"; td.appendChild(sp); tr.appendChild(td); });
      tr.addEventListener("click", () => setActive(i, true));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  });

  // ---------- distribution of this session's scores
  (function () {
    const DS = D.dist, host = document.getElementById("dist");
    if (!DS || !DS.n) { document.getElementById("distcard").hidden = true; return; }
    const nb = DS.rows[0].counts.length;
    document.getElementById("distinfo").textContent = DS.n + " sentences · " + nb + " bins";
    const clamped = DS.rows.reduce((a, r) => a + r.below + r.above, 0);
    document.getElementById("distnote").textContent =
      "Each row shows how this session's sentences spread across score bins of width " + DS.width +
      ", as a percentage of its " + DS.n + " sentences (counts, no fitted curve). All rows share one horizontal and one vertical scale, " +
      "so positions and heights compare directly. The dark vertical mark is the mean." +
      (clamped ? " " + clamped + " score(s) beyond " + DS.lo + " or " + DS.hi + " are counted in the end bins." : "");
    const svgD = sv("svg", { role: "img", "aria-label": "Distribution of each emotion's scores in this session" });
    const tipD = el("div", "tip"); tipD.hidden = true;
    host.append(svgD, tipD);
    const rowH = 30, top = 8, labelW = 112, right = 16, axisH = 34;
    const yMax = Math.max(1e-9, ...DS.rows.map(r => Math.max(...r.counts) / DS.n * 100));
    function draw() {
      const WD = Math.max(320, Math.round(host.clientWidth)), HD = top + rowH * DS.rows.length + axisH;
      svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
