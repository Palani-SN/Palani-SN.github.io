451059728860855,0.0018742270767688751,-0.14214059710502625,0.17041566967964172,0.037147194147109985,0.045862965285778046,0.00579660851508379,0.03665595501661301,0.1102793738245964,-0.18178477883338928,-0.0943000316619873,-0.0124114491045475]},{"text":"I hit snooze because the day feels *unfinished*.","event":105,"values":[0.035406291484832764,-0.11260630935430527,-0.044801801443099976,-0.1260412037372589,0.2540714740753174,0.1157132089138031,0.1442258507013321,0.033064696937799454,0.12035775184631348,0.12172310054302216,-0.24104098975658417,-0.16038274765014648,-0.08632636070251465]},{"text":"- **7:00 AM** – I scroll through the email I received: “We’re sorry to inform you…” The words echo in my head.","event":106,"values":[0.021910300478339195,-0.13233570754528046,-0.06321043521165848,-0.15325993299484253,0.27216836810112,0.12244491279125214,0.18471994996070862,0.05590254068374634,0.1528417319059372,0.1287497878074646,-0.24931687116622925,-0.16994263231754303,-0.0955856591463089]},{"text":"- **7:15 AM** – I make coffee, but the taste is off.","event":107,"values":[0.005830784328281879,-0.1723046600818634,-0.11587351560592651,-0.2005920112133026,0.28110048174858093,0.14663997292518616,0.24682986736297607,0.08934585750102997,0.2302013635635376,0.16553226113319397,-0.26379820704460144,-0.18509405851364136,-0.1255175769329071]},{"text":"I stare at the screen, feeling the *weight* of the lay‑off notification.","event":108,"values":[0.021222081035375595,-0.16732986271381378,-0.10650794208049774,-0.19388195872306824,0.2829589247703552,0.14102984964847565,0.24133354425430298,0.08151943236589432,0.20819546282291412,0.15231460332870483,-0.27039864659309387,-0.19085752964019775,-0.11880041658878326]},{"text":"**Hurdle #1: Financial Instability**  \n- No salary.","event":109,"values":[-0.0016945721581578255,-0.14181983470916748,-0.08772645890712738,-0.1420229822397232,0.26206398010253906,0.12950162589550018,0.21887293457984924,0.06410355120897293,0.19686558842658997,0.13699528574943542,-0.24943572282791138,-0.16854891180992126,-0.10975013673305511]},{"text":"My savings are just enough to cover rent and groceries for the next month.","event":110,"values":[0.0429777055978775,-0.13625594973564148,-0.059357430785894394,-0.10173735022544861,0.2778061628341675,0.10677732527256012,0.18151867389678955,0.025064688175916672,0.11959148943424225,0.10665573179721832,-0.23879744112491608,-0.1710435450077057,-0.10159382969141006]},{"text":"- Uncertainty about future expenses (health insurance, car payments).","event":111,"values":[0.07464557141065598,-0.088446706533432,-0.03409210965037346,-0.07792166620492935,0.2305183708667755,0.051343560218811035,0.10051988065242767,-0.000665400642901659,0.054460957646369934,0.08061367273330688,-0.18732038140296936,-0.12357963621616364,-0.05740221589803696]},{"text":"**Hurdle #2: Identity Crisis**  \n- My professional identity is tied to my job title.","event":112,"values":[0.042078226804733276,-0.084782674908638,-0.015344223007559776,-0.08822765946388245,0.24294115602970123,0.06519392877817154,0.10472746938467026,0.011798770166933537,0.07277626544237137,0.10344728827476501,-0.20700553059577942,-0.1379169523715973,-0.05156649649143219]},{"text":"Suddenly, “software engineer” feels like a label I no longer hold.","event":113,"values":[-0.026345163583755493,-0.08738526701927185,-0.010709680616855621,-0.09329701960086823,0.2317442148923874,0.11124584078788757,0.13155674934387207,0.0515068918466568,0.1389905959367752,0.13434402644634247,-0.2191619724035263,-0.1547023355960846,-0.06592624634504318]},{"text":"- I worry about how friends, family, and future employers will perceive me.","event":114,"values":[-0.07019903510808945,-0.07508009672164917,-0.0002701766788959503,-0.09554535150527954,0.22477911412715912,0.13989147543907166,0.1328953206539154,0.07320988178253174,0.1623322069644928,0.1491086483001709,-0.21710315346717834,-0.15956340730190277,-0.06979711353778839]},{"text":"**Hurdle #3: Emotional Turmoil**  \n- Restlessness, irritability.","event":115,"values":[-0.07621645927429199,-0.07964644581079483,-0.014946497976779938,-0.10264156758785248,0.24374717473983765,0.16118744015693665,0.13782766461372375,0.07203429937362671,0.17180797457695007,0.14103522896766663,-0.2256222665309906,-0.1526632308959961,-0.08284665644168854]},{"text":"I can’t focus on anything for more than 20 minutes.","event":116,"values":[-0.04408920183777809,-0.06999245285987854,-0.029124166816473007,-0.09306292235851288,0.2356569468975067,0.13063092529773712,0.10784519463777542,0.024931523948907852,0.13570378720760345,0.1380016803741455,-0.1972314566373825,-0.12041034549474716,-0.06763666868209839]},{"text":"- Fear of the unknown: Will I find another job?","event":117,"values":[-0.03945073112845421,-0.09086467325687408,-0.042704224586486816,-0.0848788246512413,0.24128518998622894,0.12696902453899384,0.11962386965751648,0.020844949409365654,0.14903894066810608,0.14072920382022858,-0.19213470816612244,-0.12534980475902557,-0.07220258563756943]},{"text":"Will I be able to pay my bills?","event":118,"values":[-0.03144199028611183,-0.14740951359272003,-0.08746491372585297,-0.09141375124454498,0.24843452870845795,0.1433843970298767,0.1593271791934967,0.04694291204214096,0.19613173604011536,0.18545188009738922,-0.19539955258369446,-0.1713552325963974,-0.09379345178604126]},{"text":"---\n\n### Mid‑Morning – The Search Begins\n\n- **9:00 AM** – I log onto LinkedIn, update my profile, and start searching for roles.","event":119,"values":[0.06261353939771652,-0.10491073876619339,-0.04581586644053459,-0.13573682308197021,0.23029541969299316,0.07120721787214279,0.08849848806858063,0.02715308591723442,0.11605506390333176,0.18170969188213348,-0.22626420855522156,-0.15304704010486603,-0.06803470849990845]},{"text":"- **9:30 AM** – I apply to three positions that match my skill set.","event":120,"values":[0.10330266505479813,-0.08759315311908722,-0.04068610072135925,-0.15712139010429382,0.20935805141925812,0.0353664830327034,         r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
