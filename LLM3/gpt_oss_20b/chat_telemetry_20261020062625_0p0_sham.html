 by some practical suggestions for individuals, families, and communities.","event":6,"values":[-0.012911236844956875,0.058674924075603485,0.117585688829422,-0.015241935849189758,0.12913265824317932,0.07133804261684418,-0.07569979131221771,-0.08202871680259705,-0.04246199503540993,0.041835665702819824,-0.1106327697634697,-0.018656926229596138,0.013284016400575638]},{"text":"---\n\n## 1. The Psychological Pathway: From Unemployment to Restlessness\n\n| Factor | How It Contributes to Restlessness | Typical Mental‑Health Consequences |\n|--------|------------------------------------|------------------------------------|\n| **Loss of Purpose \u0026 Identity** | Work often provides a sense of self‑worth and direction.","event":7,"values":[0.010354595258831978,0.048109427094459534,0.08972521126270294,-0.033222831785678864,0.12071183323860168,0.04396643862128258,-0.06842464208602905,-0.07432019710540771,-0.02178378775715828,0.0491672083735466,-0.10805317759513855,-0.01318265125155449,0.010830502025783062]},{"text":"Without it, youth may feel “empty” or “lost.” | Anxiety, depression, identity confusion |\n| **Social Isolation** | Workplaces are a primary source of social interaction.","event":8,"values":[0.020077569410204887,0.043814174830913544,0.06782928854227066,-0.05349353700876236,0.11210969090461731,0.032966624945402145,-0.05844590812921524,-0.06758684664964676,0.007825111038982868,0.0631449818611145,-0.11118834465742111,-0.014218098483979702,0.002370227128267288]},{"text":"Unemployed youth may withdraw from friends or family.","event":9,"values":[0.02644040435552597,0.03182923048734665,0.04199306294322014,-0.06987890601158142,0.10058610141277313,0.035486653447151184,-0.03760633245110512,-0.04912985488772392,0.03491339087486267,0.07666400074958801,-0.11425353586673737,-0.0220191553235054,-0.010017008520662785]},{"text":"| Loneliness, social anxiety, depressive symptoms |\n| **Financial Stress** | Money worries can keep the mind racing, especially when bills or rent loom.","event":10,"values":[0.027897536754608154,0.005636947229504585,0.012112516909837723,-0.0790407657623291,0.1412319839000702,0.07689615339040756,-0.004060924518853426,-0.029400797560811043,0.06499584019184113,0.07957344502210617,-0.15719763934612274,-0.05595817789435387,-0.04245935380458832]},{"text":"| Chronic stress, insomnia, irritability |\n| **Reduced Self‑Efficacy** | Repeated job rejections can erode confidence.","event":11,"values":[0.036370836198329926,0.0025580497458577156,0.0036782827228307724,-0.07963637262582779,0.1627476066350937,0.08914433419704437,-0.006830985192209482,-0.02897130697965622,0.0451882928609848,0.047665804624557495,-0.1583092212677002,-0.05053049325942993,-0.03438472002744675]},{"text":"| Low self‑esteem, hopelessness, risk‑taking behaviors |\n| **Unstructured Time** | Lack of routine can lead to aimless wandering or “fidgeting.” | Restlessness, compulsive behaviors, substance use |\n\n---\n\n## 2.","event":12,"values":[0.031398527324199677,-0.001988908275961876,0.009358944371342659,-0.06371299177408218,0.15297794342041016,0.08022794127464294,-0.015296541154384613,-0.045107439160346985,0.04070281237363815,0.06755421310663223,-0.14533424377441406,-0.03813371807336807,-0.03536365181207657]},{"text":"Restlessness as a Symptom: What It Looks Like\n\n- **Physical**: pacing, fidgeting, difficulty sitting still, constant movement.","event":13,"values":[0.026888277381658554,0.0017224876210093498,0.023371489718556404,-0.044075895100831985,0.13756030797958374,0.06986088305711746,-0.02333904802799225,-0.058560214936733246,0.028663814067840576,0.08073536306619644,-0.13173745572566986,-0.031236326321959496,-0.03817276656627655]},{"text":"- **Cognitive**: racing thoughts, difficulty concentrating, intrusive worries.","event":14,"values":[0.021055925637483597,-0.00986789632588625,0.02303939312696457,-0.026348259299993515,0.1410902440547943,0.07180412113666534,-0.01451079361140728,-0.06144760921597481,0.0327829085290432,0.09592968970537186,-0.13261060416698456,-0.03771292790770531,-0.052086420357227325]},{"text":"- **Emotional**: irritability, mood swings, feeling “on edge.”\n- **Behavioral**: impulsive decisions, increased risk‑taking, substance experimentation.","event":15,"values":[0.003102380782365799,-0.011944634839892387,0.03401894494891167,-0.005209274590015411,0.16106519103050232,0.09237533807754517,0.0076603274792432785,-0.04544509947299957,0.035609979182481766,0.08787323534488678,-0.1518745720386505,-0.060160376131534576,-0.07487461715936661]},{"text":"When these symptoms persist, they can evolve into more serious disorders such as generalized anxiety disorder, major depressive disorder, or even substance‑use disorders.","event":16,"values":[0.01809791289269924,0.004813185892999172,0.037225112318992615,-0.03710891678929329,0.15107877552509308,0.08589710295200348,-0.01573578640818596,-0.04340748488903046,0.021878864616155624,0.07575924694538116,-0.15104614198207855,-0.04385298117995262,-0.05045456811785698]},{"text":"---\n\n## 3. Broader Implications for Youth Mental Health\n\n| Issue | Impact |\n|-------|--------|\n| **Increased Risk of Depression** | Persistent restlessness can be an early warning sign of depressive episodes.","event":17,"values":[0.03499410301446915,0.024192895740270615,0.06051960960030556,-0.034126412123441696,0.14182701706886292,0.07379545271396637,-0.04071468114852905,-0.0544624850153923,-0.00739634782075882,0.05411285161972046,-0.15268006920814514,-0.040192537009716034,-0.03472355753183365]},{"text":"|\n| **Anxiety Disorders** | Uncertainty about the future fuels generalized anxiety and panic attacks.","event":18,"values":[0.0510859452188015,0.040344443172216415,0.07467189431190491,-0.032000571489334106,0.12911143898963928,0.05832869932055473,-0.061266083270311356,-0.07260016351938248,-0.033889371901750565,0.027958489954471588,-0.13959777355194092,-0.026793062686920166,-0.012539569288492203]},{"text":"|\n| **Substance Use** | Some youth turn to alcohol or drugs as a coping mechanism.","event":19,"values":[0.05394873768091202,0.031954698264598846,0.054417598992586136,-0.06027490273118019,0.12935671210289001,0.05497962236404419,-0.049638666212558746,-0.050509966909885406,-0.0070630814880132675,0.04976250231266022,-0.14811211824417114,-0.031068406999111176,-0.021706195548176765]},{"text":"|\n| **Academic/Professional Decline** | Restlessness can impair concentration, leading to poorer academic or job performance.","event":20,"values":[0.061040036380290985,0.01881660521030426,0.009636443108320236,-0.0844740942120552,0.13117274641990662,0.05470459535717964,-0.04359811544418335,-0.031414538621902466,0.022211221978068352,0.06437479704618454,-0.14264549314975739,-0.03158317878842354,-0.01769103854894638]},{"text":"|\n| **Social Withdrawal** | Isolation can reinforce negative self‑perception and worsen mood.","event":21,"values":[0.06125001609325409,0.015797587111592293,-0.014161799103021622,-0.10845451802015305,0.11763515323400497,0.0536482110619545,-0.044799815863370895,-0.014371633529663086,0.04213951155543327,0.06215059012174606,-0.1257583498954773,-0.01872880384325981,-0.009949268773198128]},{"text":"|\n| **Long‑Term Health** | Chronic stress can affect cardiovascular health, immune function, and overall well‑being.","event":22,"values":[0.06798455864191055,0.03352271020412445,0.007198493927717209,-0.0708950087428093,0.116737499833107,0.039742887020111084,-0.06378674507141113,-0.03599771112203598,0.00397089496254921,0.007348584942519665,-0.10717577487230301,-0.008683983236551285,0.013018129393458366]},{"text":"|\n\n---\n\n## 4.","event":23,"values":[0.062368184328079224,0.04462948814034462,0.027217645198106766,-0.07138536870479584,0.1081605851650238,0.02897602505981922,-0.07059908658266068,-0.041592877358198166,-0.0058338455855846405,-0.004134077578783035,-0.09756134450435638,0.0045143356546759605,0.022372370585799217]},{"text":"Coping Strategies \u0026 Interventions\n\n### For the Individual\n1.","event":24,"values":[0.06732602417469025,0.05395248532295227,0.05300041288137436,-0.057532526552677155,0.09660166501998901,-0.0012798188254237175,-0.0815177634358406,-0.049400001764297485,-0.025983354076743126,0.011877583339810371,-0.09421908110380173,0.0026471223682165146,0.031552840024232864]},{"text":"**Create a Structured Routine**  \n   - Set a daily schedule that includes job‑search activities, exercise, and leisure.","event":25,"values":[0.10388188064098358,0.022164789959788322,0.007526922971010208,-0.09255357086658478,0.06673911213874817,-0.07089800387620926,-0.08424890041351318,-0.04174966365098953,0.018805550411343575,0.10524609684944153,-0.07030946016311646,-0.0017445012927055359,0.03362594544887543]},{"text":"- Even small, consistent actions (e.g., a 10‑minute walk) can reduce restlessness.","event":26,"values":[0.11926524341106415,0.024846555665135384,-0.01180228404700756,-0.11578124761581421,0.06082194298505783,-0.08020762354135513,-0.08979053050279617,-0.06140260025858879,0.024630194529891014,0.10695408284664154,-0.06354428827762604,0.01504645124077797,0.037576597183942795]},{"text":"2. **Mindfulness \u0026 Relaxation Techniques**  \n   - Practice deep breathing, progressive muscle relaxation, or guided imagery.","event":27,"values":[0.12665583193302155,0.0400686077773571,-0.0228885505348444,-0.1378108263015747,0.038224391639232635,-0.10761751234531403,-0.10302378982305527,-0.08060097694396973,0.012261033058166504,0.08938232064247131,-0.023569071665406227,0.0636688768863678,0.06058832257986069]},{"text":"- Apps like Headspace or Calm can be useful for beginners.","event":28,"values":[0.11444199085235596,0.056563496589660645,-0.013602448627352715,-0.14655941724777222,0.027304911985993385,-0.1027723178267479,-0.10686464607715607,-0.09385721385478973,-0.003456294536590576,0.06684844195842743,-0.007129207253456116,0.09232717007398605,0.07588924467563629]},{"text":"3. **Physical Activity**  \n   - Exercise releases endorphins and reduces anxiety.","event":29,"values":[0.09842801094055176,0.0749013721 75,0.05032871291041374,0.013548063114285469,-0.11939221620559692,0.0404268279671669,-0.06542935967445374,-0.10329046100378036,-0.0374479815363884,0.01364714652299881,0.14584630727767944,-0.07138187438249588,0.018346576020121574,0.05174911022186279]},{"text":"- **Supportive Environment**: Offer a calm, non‑judgmental space for the youth to vent.","event":35,"values":[0.08532989770174026,0.04007212072610855,-0.003638163208961487,-0.1237843781709671,0.05588904023170471,-0.05892207846045494,-0.10643310844898224,-0.0416128896176815,0.012907573953270912,0.11138477921485901,-0.05489889159798622,0.03514888137578964,0.05337397754192352]},{"text":"- **Encourage Professional Help**: If restlessness persists, consider a mental‑health professional or counseling service.","event":36,"values":[0.09556977450847626,0.03378155454993248,-0.01665923371911049,-0.1116647943854332,0.06767261028289795,-0.04789423942565918,-0.11117984354496002,-0.04076216369867325,0.0010749856010079384,0.053480248898267746,-0.03343404456973076,0.0439605675637722,0.05252837389707565]},{"text":"### For Schools \u0026 Community Organizations\n- **Career Counseling \u0026 Job‑Search Workshops**: Provide guidance on resume writing, interview skills, and networking.","event":37,"values":[0.10845910757780075,0.04651115834712982,0.018743149936199188,-0.10321541130542755,0.06464214622974396,-0.06282354891300201,-0.11125123500823975,-0.05251080542802811,-0.01711447536945343,0.07225252687931061,-0.07008650153875351,0.028287824243307114,0.0479775108397007]},{"text":"- **Mental‑Health Screening**: Offer periodic screenings for anxiety and depression.","event":38,"values":[0.12421383708715439,0.06218687444925308,0.04215950518846512,-0.09009893238544464,0.04705275967717171,-0.07616493105888367,-0.11877595633268356,-0.06524577736854553,-0.03782802075147629,0.06837765127420425,-0.08185483515262604,0.02526778355240822,0.051543012261390686]},{"text":"- **Peer‑Support Groups**: Facilitate groups where youth can share experienc 324778079987,-0.09987536072731018,-0.07349534332752228,0.02551926113665104,-0.0935792475938797,0.0294669046998024,0.04971340298652649]},{"text":"3. **Regulate AI in Hiring**  \n   - Enforce transparency in algorithms to avoid bias and discrimination.","event":74,"values":[0.15405839681625366,0.08413305133581161,0.07338964939117432,-0.0699944943189621,0.03793950751423836,-0.07072977721691132,-0.13585352897644043,-0.09470789134502411,-0.07168327271938324,0.026165569201111794,-0.09577970206737518,0.02055959776043892,0.038111940026283264]},{"text":"4. **Support Transition Programs**  \n   - Create “AI‑ready” training for workers displaced by automation.","event":75,"values":[0.1456066519021988,0.08113370835781097,0.06788386404514313,-0.07735304534435272,0.03093826025724411,-0.07719609886407852,-0.14060264825820923,-0.07392717152833939,-0.07201820611953735,0.05402698367834091,-0.09216567873954773,0.02376250922679901,0.04857392981648445]},{"text":"5. **Encourage Human‑AI Collaboration**  \n   - Design jobs that combine human creativity with AI efficiency.","event":76,"values":[0.12699072062969208,0.08127795904874802,0.06972883641719818,-0.06891138851642609,0.03240511566400528,-0.07275263965129852,-0.14654359221458435,-0.08031082898378372,-0.0696336030960083,0.04715429246425629,-0.07286418974399567,0.03541186824440956,0.05864178389310837]},{"text":"---\n\n## 6. Bottom Line\n\n- **AI can indeed reduce the need for certain types of labor**, especially in routine, low‑skill roles.","event":77,"values":[0.11070436239242554,0.06189505010843277,0.07510262727737427,-0.0716831162571907,0.05028614401817322,-0.050426676869392395,-0.1333228498697281,-0.06514015793800354,-0.052139487117528915,0.06609823554754257,-0.0947803258895874,0.016230935230851173,0.04509599134325981]},{"text":"- **Personalized learning powered by AI offers a powerful counter‑balance**: it can accelerate skill acquisition, making workers more adaptable to the changing job market.","event":78,"values":[0.08475534617900848,0.0538506880402565,0.09441059082746506,-0.04057880863547325,0.07309858500957489,-0.02274705283343792,-0.13318423926830292,-0.0631236806511879,-0.04638438671827316,0.0571226142346859,-0.11039440333843231,0.0022140266373753548,0.03200092911720276]},{"text":"- **The net effect on employment depends on how society chooses to deploy AI**: if we invest in education, infrastructure, and ethical AI practices, we can transform the labor market into one that values creativity, critical thinking, and continuous learning.","event":79,"values":[0.06859128177165985,0.03914358466863632,0.0924948900938034,-0.0283091701567173,0.08551457524299622,0.005373785272240639,-0.12051692605018616,-0.05129570513963699,-0.03549334779381752,0.04895574599504471,-0.11479020118713379,-0.0126875601708889,0.02257748693227768]},{"text":"---\n\n### Take‑away\n\nAI is a double‑edged sword.","event":80,"values":[0.0460224375128746,0.05426354706287384,0.10871636867523193,-0.010062342509627342,0.08030085265636444,0.010666425339877605,-0.12421289086341858,-0.058103226125240326,-0.03965877369046211,0.03872216120362282,-0.1106870025396347,-0.005413674283772707,0.03156634047627449]},{"text":"While it can displace some jobs, it also creates opportunities for **upskilling** and **innovation**.","event":81,"values":[0.03568335995078087,0.04872177168726921,0.11077969521284103,-0.0033587776124477386,0.07746399939060211,0.023199908435344696,-0.11835990846157074,-0.052214574068784714,-0.037339672446250916,0.04106992855668068,-0.10984565317630768,-0.007866060361266136,0.026668226346373558]},{"text":"The key is to **align AI development with human-centered policies** that prioritize education, equity, and well‑being.","event":82,"values":[0.0333801694214344,0.06555406004190445,0.12064054608345032,0.0006442926824092865,0.06807651370763779,0.019352085888385773,-0.12525978684425354,-0.05516144633293152,-0.05060365051031113,0.02060231752693653,-0.10542072355747223,0.004911832977086306,0.03676589950919151]},{"text":"By doing so, we can harness AI’s potential to **reduce unemployment** rather than exacerbate it.","event":83,"values":[0.030808746814727783,0.06800714135169983,0.11593779176473618,-0.01378130167722702,0.06614471971988678,0.023912962526082993,-0.1298305094242096,-0.051215752959251404,-0.048271194100379944,0.018167313188314438,-0.09616870433092117,0.013240527361631393,0.04033145308494568]},{"text":"---\n\n**Want to explore specific AI tools for learning or strategies to upskill in a particular field?","event":84,"values":[0.043537478893995285,0.07205454260110855,0.10306742042303085,-0.040407732129096985,0.07691864669322968,-0.0005182260647416115,-0.1273791790008545,-0.057620517909526825,-0.04676598310470581,0.04434596747159958,-0.09991027414798737,0.012874720618128777,0.04819784685969353]},{"text":"** Let me know, and I’ll dive deeper!","event":85,"values":[0.035574112087488174,0.05965682864189148,0.10986961424350739,-0.043081942945718765,0.08581231534481049,0.010089468210935593,-0.10615798830986023,-0.05934501066803932,-0.03997879475355148,0.07906399667263031,-0.1173933893442154,-0.002614385914057493,0.027534928172826767]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":86,"stop_reason":"end of turn","tail":"🌟","sentences":[{"text":"---\n\n## **A Day in the Life of a Laid‑Off Worker**\n\n\u003e *I’m Alex, 29, a junior graphic designer who just lost a job at a small marketing agency.","event":87,"values":[0.027921132743358612,0.02859344705939293,0.03185056522488594,-0.1426856964826584,0.09538987278938293,0.00855417363345623,0.018635723739862442,0.04219352453947067,0.020782098174095154,0.1441456377506256,-0.14366984367370605,-0.06916531175374985,0.01872880384325981]},{"text":"The news hit me like a wave—my savings are dwindling, my confidence is shaking, and the future feels… uncertain.*\n\n---\n\n### **Morning – The First Shock**\n\n- **8:00 AM** – I open my email, and the subject line reads *“Notice of Termination.”*  \n- **8:15 AM** – I stare at the screen, trying to find a rational explanation.","event":88,"values":[0.006144309416413307,-0.07889963686466217,-0.012777457013726234,-0.18035703897476196,0.2228335440158844,0.1179373636841774,0.16018885374069214,0.07039172202348709,0.12704995274543762,0.12777018547058105,-0.24503932893276215,-0.15566515922546387,-0.07961811125278473]},{"text":"- **8:30 AM** – I call my phone, hoping to hear a friendly voice, but it’s just the silence of a cold inbox.","event":89,"values":[0.006325406953692436,-0.11569076031446457,-0.04143652319908142,-0.19817334413528442,0.2512137293815613,0.14359048008918762,0.19988900423049927,0.09501555562019348,0.1601945459842682,0.14639812707901,-0.2719515562057495,-0.18754929304122925,-0.10368768870830536]},{"text":"**Hurdle #1: Emotional Turmoil**  \nThe initial panic is a mix of anger, sadness, and disbelief.","event":90,"values":[-0.024349981918931007,-0.13999749720096588,-0.047644540667533875,-0.18098706007003784,0.28804343938827515,0.19619782269001007,0.23942717909812927,0.09713853895664215,0.19237028062343597,0.11104979366064072,-0.2906067371368408,-0.19757147133350372,-0.1348772943019867]},{"text":"The mind keeps replaying the last meeting, the “budget cuts” that sounded like a threat, and the sudden silence of the office.","event":91,"values":[-0.0832008570432663,-0.18244710564613342,-0.06712309271097183,-0.15671506524085999,0.3556637763977051,0.2740021347999573,0.2874072790145874,0.1421116590499878,0.23284567892551422,0.15106649696826935,-0.3354605436325073,-0.2560218274593353,-0.17452764511108398]},{"text":"---\n\n### **Mid‑Morning – The Reality Check**\n\n- **9:00 AM** – I scroll through my bank account.","event":92,"values":[-0.046787865459918976,-0.11810437589883804,-0.02168319001793861       svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
