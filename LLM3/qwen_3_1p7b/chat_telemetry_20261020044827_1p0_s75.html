532248705625534,-0.03864583745598793,-0.0003976002335548401]},{"text":"Here’s a breakdown of the potential impacts:\n\n### 1.","event":6,"values":[0.02237243577837944,-0.11841803789138794,-0.06582392007112503,0.11685355752706528,0.06657090783119202,0.04270615428686142,0.15501901507377625,0.02731233462691307,-0.01643957570195198,0.019083864986896515,-0.14819717407226562,-0.036931149661540985,0.0009481478482484818]},{"text":"**Increased Stress and Anxiety**  \n   - Unemployment can lead to financial stress, which is a major contributor to anxiety and depression.","event":7,"values":[0.0009309630841016769,-0.14968463778495789,-0.0865868628025055,0.07099907100200653,0.10449360311031342,0.06630590558052063,0.214877650141716,0.04894963651895523,0.029477043077349663,0.043201953172683716,-0.18616335093975067,-0.0769568458199501,-0.026586689054965973]},{"text":"- Youth may feel anxious about the future, leading to chronic stress.","event":8,"values":[-0.01661253161728382,-0.18709009885787964,-0.10892650485038757,0.030556773766875267,0.14643290638923645,0.08674012869596481,0.2625446915626526,0.07890645414590836,0.07331830263137817,0.08026627451181412,-0.21890652179718018,-0.12398417294025421,-0.056317441165447235]},{"text":"### 2. **Low Self-Esteem and Confidence**  \n   - Without a job, youth may feel worthless or lack a sense of purpose.","event":9,"values":[-0.03162666782736778,-0.1830284297466278,-0.11419529467821121,0.005997467786073685,0.13456343114376068,0.09185202419757843,0.287591814994812,0.08870421350002289,0.09765385091304779,0.10962887108325958,-0.2385311722755432,-0.1419076919555664,-0.055214010179042816]},{"text":"- This can lead to lower self-esteem and a decreased motivation to engage in activities they once enjoyed.","event":10,"values":[-0.039122287184000015,-0.16230960190296173,-0.10942746698856354,0.016210120171308517,0.10770862549543381,0.07780931890010834,0.27629542350769043,0.0823066458106041,0.09534263610839844,0.12274453788995743,-0.2350834608078003,-0.13213756680488586,-0.03481012582778931]},{"text":"### 3. **Social Isolation**  \n   - Unemployment can lead to loneliness and a lack of social interaction, which is harmful to mental health.","event":11,"values":[-0.024505537003278732,-0.15511012077331543,-0.12866805493831635,0.03244397044181824,0.08588775992393494,0.06036306917667389,0.2563510239124298,0.07589846849441528,0.0923207551240921,0.12485670298337936,-0.22615885734558105,-0.1073438972234726,-0.02387792244553566]},{"text":"- Young people may withdraw from social groups, worsening their isolation.","event":12,"values":[-0.023835288360714912,-0.16348078846931458,-0.14420254528522491,0.043215446174144745,0.08925412595272064,0.048182617872953415,0.24570173025131226,0.0838591456413269,0.09825268387794495,0.13315260410308838,-0.22175566852092743,-0.09534090757369995,-0.024922389537096024]},{"text":"### 4. **Increased Risk of Psychiatric Disorders**  \n   - Prolonged unemployment is linked to higher risks of depression, anxiety, and even suicidal thoughts.","event":13,"values":[-0.00645532738417387,-0.17843316495418549,-0.14361485838890076,0.05039277672767639,0.09111009538173676,0.06576507538557053,0.2349233329296112,0.08446498215198517,0.1002650111913681,0.11911365389823914,-0.20889773964881897,-0.09959349036216736,-0.049185849726200104]},{"text":"- It can also contribute to the development of post-traumatic stress disorder (PTSD) if the unemployment is linked to a traumatic event.","event":14,"values":[-0.015480213798582554,-0.1827487200498581,-0.12266292423009872,0.04858476668596268,0.0953114852309227,0.09049617499113083,0.23841823637485504,0.0951220840215683,0.09830744564533234,0.09403126686811447,-0.20429061353206635,-0.11140062659978867,-0.06437666714191437]},{"text":"### 5. **Cognitive and Behavioral Effects**  \n   - Restlessness and lack of direction can affect concentration and academic performance.","event":15,"values":[-0.009729286655783653,-0.17372384667396545,-0.11050518602132797,0.06009349226951599,0.09121469408273697,0.09579083323478699,0.23067986965179443,0.07701840251684189,0.08220729976892471,0.08230507373809814,-0.1910402476787567,-0.10834822058677673,-0.06554637104272842]},{"text":"- Youth may become distracted, leading to lower productivity and a lack of focus.","event":16,"values":[-0.02082710713148117,-0.18237990140914917,-0.11749495565891266,0.055573493242263794,0.10183195769786835,0.10144513845443726,0.24767544865608215,0.0783078595995903,0.08321668207645416,0.10123268514871597,-0.19631507992744446,-0.11731161922216415,-0.07233995944261551]},{"text":"### 6. **Long-Term Mental Health Consequences**  \n   - Chronic unemployment can lead to long-term mental health issues, such as persistent depressive disorder (PDD) or bipolar disorder in severe cases.","event":17,"values":[-0.008912988007068634,-0.17446070909500122,-0.12702062726020813,0.060535088181495667,0.09001313149929047,0.0953168272972107,0.23140238225460052,0.07233314961194992,0.08084718883037567,0.09433432668447495,-0.18162167072296143,-0.10921206325292587,-0.06606175005435944]},{"text":"- It can also contribute to a cycle of poverty and mental health deterioration.","event":18,"values":[-0.015131117776036263,-0.1841580867767334,-0.13139212131500244,0.04215143993496895,0.09344305098056793,0.10566055774688721,0.23680996894836426,0.08890669047832489,0.09723831713199615,0.09526804834604263,-0.18631291389465332,-0.11726637184619904,-0.07299242913722992]},{"text":"### How to Support Youth in This Situation:\n- **Job Training and Education:** Providing vocational training and education can help youth gain the skills needed to find employment.","event":19,"values":[0.006394926458597183,-0.14912919700145721,-0.10983981192111969,0.0677395910024643,0.07060295343399048,0.07201595604419708,0.20853984355926514,0.0615411102771759,0.06197784096002579,0.06716027855873108,-0.18479621410369873,-0.08948710560798645,-0.031879521906375885]},{"text":"- **Mental Health Support:** Access to counseling and psychological support is crucial.","event":20,"values":[0.022422872483730316,-0.11285170912742615,-0.0902201384305954,0.084815114736557,0.04805361479520798,0.03303808718919754,0.17756624519824982,0.032752711325883865,0.03485308960080147,0.05235002189874649,-0.17194007337093353,-0.05822598189115524,0.008008617907762527]},{"text":"- **Community and Social Programs:** Programs that foster social connection and provide a sense of purpose can help reduce restlessness.","event":21,"values":[0.02763994224369526,-0.07241590321063995,-0.07803860306739807,0.1065806970000267,0.01956380158662796,-0.009591719135642052,0.14579284191131592,0.008610773831605911,0.0060415249317884445,0.04729467257857323,-0.1537947654724121,-0.022410079836845398,0.0528554804623127]},{"text":"- **Policy Interventions:** Governments and organizations should implement policies that reduce unemployment and provide support systems for those in need.","event":22,"values":[0.026758920401334763,-0.08586987107992172,-0.09854098409414291,0.10365761816501617,0.02007884904742241,-0.0002565346658229828,0.14619845151901245,0.0202416330575943,0.014633335173130035,0.0514734610915184,-0.14842557907104492,-0.02118055894970894,0.04233553633093834]},{"text":"If you'd like, I can help you explore specific strategies or resources for supporting youth affected by unemployment.","event":23,"values":[0.019862467423081398,-0.09442779421806335,-0.10385911166667938,0.11865405738353729,0.028120962902903557,-0.00019139237701892853,0.15115727484226227,0.024280425161123276,0.007291936315596104,0.05694553256034851,-0.1574804186820984,-0.02003668248653412,0.04314982891082764]}]},{"prompt":"I believe that AI models, even though can cause unemployment in the future, then can be wonderful in helping personalized learning, through which there can be a potential reduction in hiring people, what do you think ?","event":24,"stop_reason":"end of turn","tail":"😊","sentences":[{"text":"You're absolutely right—AI has the potential to revolutionize education and learning, and while it may displace certain jobs, it can also create new opportunities and improve the quality of education for all.","event":25,"values":[0.007473209872841835,-0.05620691925287247,0.0004439074546098709,0.12875349819660187,0.004157727584242821,0.004620143212378025,0.09452474117279053,-0.027107371017336845,-0.05536888167262077,0.06404799968004227,-0.09198931604623795,9.89772379398346e-05,0.047111574560403824]},{"text":"Let’s break this down:\n\n---\n\n### **AI in Education: A Double-Edged Sword**\n\n#### **1.","event":26,"values":[0.025338701903820038,-0.051016177982091904,-0.010693826712667942,0.14075642824172974,0.007653620559722185,-0.008420477621257305,0.08927670121192932,-0.04050974175333977,-0.06456347554922104,0.04564114287495613,-0.0944562554359436,0.009328005835413933,0.056237202137708664]},{"text":"Benefits of AI in Education**\n- **Personalized Learning:** AI can analyze a student's learning style, pace, and performance to tailor educational content, making learning more effective and engaging.","event":27,"values":[0.03988996148109436,-0.06777289509773254,-0.023386865854263306,0.13077157735824585,0.010098172351717949,-0.0023409752175211906,0.09393001347780228,-0.04236031696200371,-0.05845300853252411,0.05689554288983345,-0.09730541706085205,-0.00070175901055336,0.049308206886053085]},{"text":"- **Accessibility:** AI can help bridge the gap in education by providing resources to students in remote or underserved areas.","event":28,"values":[0.054134465754032135,-0.085228331387043,-0.049794428050518036,0.11274709552526474,0.02270612120628357,0.0021107569336891174,0.09930896759033203,-0.031488288193941116,-0.034264493733644485,0.055044326931238174,-0.10049986839294434,-0.00982971303164959,0.03612354397773743]},{"text":"- **Efficiency:** AI can automate grading, lesson planning, and administrative tasks, allowing teachers to focus more on teaching and student support.","event":29,"values":[0.04660210758447647,-0.0920395478606224,-0.057345226407051086,0.10626857727766037,0.022535692900419235,0.008403577841818333,0.10433781147003174,-0.020599760115146637,-0.023328833281993866,0.07697845995426178,-0.09661437571048737,-0.021161498501896858,0.02761569246649742]},{"text":"- **Early Detection of Learning Difficulties:** AI can identify students who are struggling early on, enabling timely interventions.","event":30,"values":[0.04008997231721878,-0.10506884753704071,-0.06572634726762772,0.10215410590171814,0.04031289368867874,0.014966611750423908,0.12091340124607086,0.0008410811424255371,-0.0038917160127311945,0.06924890726804733,-0.11169688403606415,-0.03261827677488327,0.010953964665532112]},{"text":"#### **2. Addressing the Unemployment Concern**\n- **Job Transformation, Not Replacement:** AI is not a replacement for teachers, counselors, and other educators.","event":31,"values":[0.045698367059230804,-0.10816193372011185,-0.07014601677656174,0.1139746606349945,0.036791928112506866,0.01769539713859558,0.12335166335105896,-0.004376644268631935,-0.01292968075722456,0.07656023651361465,-0.11743612587451935,-0.03607127070426941,0.009954158216714859]},{"text":"Instead, it can augment their roles, allowing them to focus on more complex, human-centered tasks.","event":32,"values":[0.03715191036462784,-0.09738299995660782,-0.06422311812639236,0.12847968935966492,0.026409931480884552,0.008107364177703857,0.11620553582906723,-0.00632487703114748,-0.02149174176156521,0.07188916206359863,-0.10951827466487885,-0.0253286249935627,0.021474407985806465]},{"text":"- **New Job Markets:** The rise of AI will create new careers in fields like data science, AI ethics, education technology, and AI maintenance.","event":33,"values":[0.030494505539536476,-0.0647483542561531,-0.035872943699359894,0.14263300597667694,0.0019601769745349884,-0.009316150099039078,0.08675307780504227,-0.03160296380519867,-0.04442514851689339,0.07626943290233612,-0.08589693903923035,0.0003000069409608841,0.04516461491584778]},{"text":"These jobs 16,0.11261697113513947,-0.00579284131526947,-0.035467155277729034,0.07019537687301636,-0.09277079999446869,-0.027009136974811554,0.01650748960673809]},{"text":"Teachers are essential in nurturing critical thinking, empathy, and moral development.","event":39,"values":[-0.0017161741852760315,-0.08844386041164398,-0.054621364921331406,0.13428233563899994,0.02897784858942032,0.026089336723089218,0.10952804237604141,0.005346505902707577,-0.0340927317738533,0.06705515086650848,-0.08550635725259781,-0.02756279706954956,0.029454484581947327]},{"text":"- **Digital Divide:** Not all students will have equal access to AI tools, which could widen educational inequalities if not addressed.","event":40,"values":[-0.010809098370373249,-0.07340360432863235,-0.046131037175655365,0.13537158071994781,0.009315798059105873,0.006654433906078339,0.10864108800888062,0.006299596279859543,-0.02808639034628868,0.08297716826200485,-0.09275372326374054,-0.021133366972208023,0.047650568187236786]},{"text":"---\n\n### **Conclusion**\n\nAI **can** lead to job displacement in certain sectors, but it also has the potential to **transform** education and learning in ways that improve outcomes for students and society as a whole.","event":41,"values":[-0.01163649931550026,-0.0889514684677124,-0.03348036855459213,0.12368912994861603,0.015156292356550694,0.02846958488225937,0.12858521938323975,-0.002253308892250061,-0.023963073268532753,0.08898547291755676,-0.11190111190080643,-0.03158187121152878,0.03195846080780029]},{"text":"The key lies in **how we implement** AI in education and **how we support** the workforce in adapting to these changes.","event":42,"values":[0.002111397683620453,-0.08646529912948608,-0.033189818263053894,0.12774400413036346,0.015845738351345062,0.027282100170850754,0.11314448714256287,-0.013412229716777802,-0.035623565316200256,0.07877442240715027,-0.09727267920970917,-0.020977776497602463,0.02996700070798397]},{"text":"Your point is well-taken: while AI may reduce the need for some jobs, it can also create new opportunities and enhance the quality of education.","event":43,"values":[-0.003021780401468277,-0.07769220322370529,-0.02612677589058876,0.13194617629051208,0.001479974016547203,0.022602923214435577,0.10453402251005173,-0.015873366966843605,-0.04709625244140625,0.07758314162492752,-0.08609099686145782,-0.016756216064095497,0.046699803322553635]},{"text":"The challenge is to **nurture the potential** of AI to be a **helper**, not a replacement, in the evolving landscape of education and work.","event":44,"values":[-0.00047725997865200043,-0.05945459380745888,-0.019719649106264114,0.14893171191215515,-0.010023458860814571,0.004967648535966873,0.08808797597885132,-0.03120296075940132,-0.0644100159406662,0.06674765795469284,-0.06524039059877396,-0.0001779794692993164,0.06234492361545563]},{"text":"Would you like to explore specific examples of AI in education or ways to prepare for the future of work?","event":45,"values":[0.0015255995094776154,-0.058991070836782455,-0.022600596770644188,0.15153974294662476,-0.005188588052988052,-0.006522445008158684,0.08948613703250885,-0.03618166595697403,-0.06540777534246445,0.06819669902324677,-0.07340433448553085,0.005549095571041107,0.0707954615354538]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":46,"stop_reason":"end of turn","tail":"** 💪","sentences":[{"text":"**Title: \"A Day in the Life of a Laid-Off Worker: Finding Hope in the Storm\"**\n\n---\n\n**Morning: The Shock of the Layoff**\n\nIt started with a letter.","event":47,"values":[-0.004109703004360199,-0.13051635026931763,-0.10175886005163193,-0.016076862812042236,0.06944775581359863,0.06645859777927399,0.20321550965309143,0.12212755531072617,0.12689396739006042,0.0536687895655632,-0.25243082642555237,-0.12121811509132385,0.0011420398950576782]},{"text":"A simple letter from the company, saying we were being laid off.","event":48,"values":[0.014526506885886192,-0.17445039749145508,-0.12703083455562592,-0.03086407296359539,0.09775897860527039,0.09231807291507721,0.22207702696323395,0.13800375163555145,0.13403698801994324,0.06075693294405937,-0.2729400396347046,-0.14046573638916016,-0.029416419565677643]},{"text":"I was working in a tech firm, part of a team that was being phased out due to a shift in the industry.","event":49,"values":[0.022588133811950684,-0.204361230134964,-0.12148458510637283,-0.0068639125674963,0.12162865698337555,0.09789882600307465,0.2421334981918335,0.11456631869077682,0.11553686857223511,0.0870223417878151,-0.2860020399093628,-0.1497761607170105,-0.0450817346572876]},{"text":"The news hit me like a thunderclap.","event":50,"values":[0.03384125977754593,-0.2534569799900055,-0.11354866623878479,-0.04232562333345413,0.1865157037973404,0.14439338445663452,0.272285521030426,0.11156854778528214,0.1199442595243454,0.0782088115811348,-0.29323941469192505,-0.1725817769765854,-0.10784600675106049]},{"text":"I had been working for five years, building a stable life, a home, and a sense of purpose.","event":51,"values":[-0.026803936809301376,-0.21472755074501038,-0.07594823837280273,-0.02248784527182579,0.1525561511516571,0.11043376475572586,0.29133960604667664,0.09609733521938324,0.10342748463153839,0.1216830164194107,-0.3029676675796509,-0.17447887361049652,-0.037535227835178375]},{"text":"Now, I was suddenly out of work.","event":52,"values":[-0.08286772668361664,-0.24229615926742554,-0.09713664650917053,-0.0890006422996521,0.15979567170143127,0.15508686006069183,0.3517065942287445,0.16970354318618774,0.1824367344379425,0.14807157218456268,-0.35692328214645386,-0.2294866293668747,-0.05341964215040207]},{"text":"The first few days were a whirlwind of emotions.","event":53,"values":[-0.1059538871049881,-0.2596360445022583,-0.11300083249807358,-0.07804438471794128,0.1563374251127243,0.145833820104599,0.3785440921783447,0.17626625299453735,0.19914668798446655,0.19333705306053162,-0.35242581367492676,-0.24178217351436615,-0.057046130299568176]},{"text":"I felt a mix of disbelief, sadness, and uncertainty.","event":54,"values":[-0.14612743258476257,-0.33979934453964233,-0.13368961215019226,-0.17339584231376648,0.24629561603069305,0.23264305293560028,0.4637107849121094,0.27541911602020264,0.3252900540828705,0.17056648433208466,-0.40695029497146606,-0.3138774037361145,-0.1850375533103943]},{"text":"I didn’t know what to do next.","event":55,"values":[-0.1412239968776703,-0.3314798176288605,-0.13823452591896057,-0.16128531098365784,0.24943968653678894,0.22490935027599335,0.46276426315307617,0.27488943934440613,0.3171113133430481,0.15245746076107025,-0.41558918356895447,-0.31206098198890686,-0.17117740213871002]},{"text":"I was worried about my future, my savings, and my family.","event":56,"values":[-0.12732459604740143,-0.3446047902107239,-0.16223295032978058,-0.13434714078903198,0.23100769519805908,0.22883735597133636,0.45089948177337646,0.2802891135215759,0.30180540680885315,0.17636486887931824,-0.42971885204315186,-0.31426072120666504,-0.14984482526779175]},{"text":"I was terrified of what lay ahead.","event":57,"values":[-0.08670275658369064,-0.34715789556503296,-0.19162774085998535,-0.08647958934307098,0.19858483970165253,0.21859799325466156,0.4180357754230499,0.25439244508743286,0.2785656452178955,0.2006671130657196,-0.415730744600296,-0.2977730333805084,-0.13816344738006592]},{"text":"---\n\n**Mid-Morning: The Struggle Begins**\n\nI tried to call my boss, but he was unreachable.","event":58,"values":[-0.03723093494772911,-0.3693927526473999,-0.22668106853961945,-0.0822807028889656,0.21602948009967804,0.21186327934265137,0.42229193449020386,0.2483425736427307,0.2793986201286316,0.1753772497177124,-0.43034905195236206,-0.2932914197444916,-0.15634489059448242]},{"text":"I called the HR department, and they told me I had to apply for a job on my own.","event":59,"values":[0.029376830905675888,-0.36317044496536255,-0.21417862176895142,-0.06522310525178909,0.22358208894729614,0.20349708199501038,0.370072603225708,0.2134777307510376,0.23302173614501953,0.14550195634365082,-0.4058372378349304,-0.270548939704895,-0.16998153924942017]},{"text":"I reached out to friends and family, but they were too busy or too emotional to help.","event":60,"values":[0.0353475846350193,-0.3558025658130646,-0.22190289199352264,-0.06482627242803574,0.21961523592472076,0.1798163503408432,0.35561609268188477,0.21399633586406708,0.22352103888988495,0.13930054008960724,-0.38494420051574707,-0.2536253333091736,-0.15533480048179626]},{"text":"I felt alone.","event":61,"values":[0.021574703976511955,-0.3601887822151184,-0.20965799689292908,-0.0775047317147255,0.22226181626319885,0.18328630924224854,0.35253649950027466,0.225407212972641,0.22812949120998383,0.15510699152946472,-0.37501293420791626,-0.2592923939228058,-0.1610032320022583]},{"text":"I spent hours on the internet, searching for jobs.","event":62,"values":[-0.0007975883781909943,-0.36449044942855835,-0.22355830669403076,-0.09033092856407166,0.20984289050102234,0.16801044344902039,0.37657299637794495,0.24104100465774536,0.2714488208293915,0.195652574300766,-0.3860887885093689,-0.27109163999557495,-0.16028687357902527]},{"text":"I applied to dozens of positions, but most were in fields I hadn’t even considered.","event":63,"values":[0.026558060199022293,-0.3200603723526001,-0.1647874265909195,-0.05996520444750786,0.16569557785987854,0.16179750859737396,0.32474666833877563,0.16589853167533875,0.21610987186431885,0.2088557630777359,-0.34221789240837097,-0.24556119740009308,-0.1493411660194397]},{"text":"The applications were rejected, and the offers were too small.","event":64,"values":[0.043656378984451294,-0.31318771839141846,-0.15973249077796936,-0.07562559098005295,0.16465412080287933,0.1655590981245041,0.31432434916496277,0.15092165768146515,0.2020510733127594,0.20471125841140747,-0.3325459957122803,-0.24121399223804474,-0.15103590488433838]},{"text":"I was desperate.","event":65,"values":[0.02218182384967804,-0.32087498903274536,-0.15597009658813477,-0.0859774723649025,0.16941781342029572,0.19018982350826263,0.33007577061653137,0.16881807148456573,0.21116438508033752,0.20659813284873962,-0.34226366877555847,-0.254440039396286,-0.16288438439369202]},{"text":"---\n\n**Afternoon: The Descent into Despair**\n\nI started to feel like I was going through a phase of depression.","event":66,"values":[-0.04516356438398361,-0.3883851170539856,-0.2493826150894165,-0.13139034807682037,0.21066279709339142,0.23477566242218018,0.4508588910102844,0.26993855834007263,0.3383641242980957,0.23352447152137756,-0.4331827461719513,-0.3187437057495117,-0.21264000236988068]},{"text":"I missed my routine, my colleagues, and the sense of community I had.","event":67,"values":[-0.09621594101190567,-0.32043009996414185,-0.23955750465393066,-0.08294889330863953,0.15082043409347534,0.16216418147087097,0.41676950454711914,0.2571312189102173,0.3045330047607422,0.24339154362678528,-0.40672993659973145,-0.26305148005485535,-0.10852456092834473]},{"text":"I stopped going to the gym, stopped eating properly, and even stopped showering.","event":68,"values":[-0.06565062701702118,-0.302392840385437,-0.2605133354663849,-0.08116442710161209,0.13194139301776886,0.14485397934913635,0.38660675287246704,0.24985355138778687,0.3020707368850708,0.2252269685268402,-0.39848828315734863,-0.2458902895450592,-0.089628204703331]},{"text":"My health deteriorated, and I felt like a ghost in a room.","event":69,"values":[-0.07499329000711441,-0.28621870279312134,-0.24859941005706787,-0.09259839355945587,0.1274455189704895,0.13145337998867035,0.37379851937294006,0.24554871022701263,0.3013532757759094,0.22633546590805054,-0.38702061772346497,-0.23903575539588928,-0.07334589958190918]},{"text":"I had a few friends who were also laid off, and we started to connect.","event":70,"values":[-0.05013469606637955,-0.3481590747833252,-0.28389298915863037,-0.11635872721672058,0.1767614334821701,0.18068107962608337,0.4020445942878723,0.29814475774765015,0.34198394417762756,0.2048368602991104,-0.4202280044555664,-0.2761537432670593,-0.14664192497730255]},{"text":"We talked about our fears, our hopes, and our dreams.","event":71,"values":[-0.09069045633077621,-0.3746996819972992,-0.2750539779663086,-0.14028525352478027,0.19699935615062714,0.20224899053573608,0.43591850996017456,0.33728909492492676,0.3560371994972229,0.22578346729278564,-0.4327087998390198,-0.30368533730506897,-0.16177064180374146]},{"text":"It was in those conversations that I began to find strength.","event":72,"values":[-0.10681606829166412,-0.26410114765167236,-0.20613332092761993,-0.08566389232873917,0.13215512037277222,0.13353289663791656,0.3427509665489197,0.29790693521499634,0.27088600397109985,0.17919513583183289,-0.3697299659252167,-0.23032397031784058,-0.06227969005703926]},{"text":"We realized we weren’t alone.","event":73,"values":[-0.1448765993118286,-0.2222718596458435,-0.1707126945257187,-0.06631810963153839,0.09713341295719147,0.12836560606956482,0.3326238989830017,0.28396087884902954,0.25681620836257935,0.1775948405265808,-0.35365360975265503,-0.22295430302619934,-0.028322266414761543]},{"text":"---\n\n**Evening: A New Beginning**\n\nOne night, I decided to take a break.","event":74,"values":[-0.09174802899360657,-0.16071248054504395,-0.10352915525436401,0.031334828585386276,0.07273197174072266,0.07511209696531296,0.2621883749961853,0.1807110607624054,0.16472667455673218,0.11756090074777603,-0.3220425248146057,-0.1571914702653885,0.014614647254347801]},{"text":"I walked into the city, and for the first time in weeks, I felt a bit of freedom.","event":75,"values":[-0.005792778916656971,-0.1591511219739914,-0.10753349959850311,0.05801483988761902,0.05252604931592941,0.019822541624307632,0.21955177187919617,0.11107586324214935,         tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
