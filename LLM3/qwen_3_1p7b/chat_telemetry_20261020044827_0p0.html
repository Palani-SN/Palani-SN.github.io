.12975578010082245,0.05842079222202301,0.09061138331890106,0.07538439333438873,0.24023547768592834,0.08343980461359024,0.07983144372701645,0.08567962795495987,-0.20496806502342224,-0.09655548632144928,-0.04844389855861664]},{"text":"**\n\n- **Education and Job Training**: Providing access to education, vocational training, and job placement programs can help young people gain the skills needed to find employment.","event":18,"values":[0.019939513877034187,-0.12620961666107178,-0.10476182401180267,0.07762658596038818,0.05929297208786011,0.04333891719579697,0.20485499501228333,0.042123690247535706,0.04143158718943596,0.08290188759565353,-0.20077766478061676,-0.06813415884971619,-0.01382509060204029]},{"text":"- **Mental Health Support**: Access to counseling and psychological support is crucial.","event":19,"values":[0.046316731721162796,-0.07580165565013885,-0.06681101769208908,0.11614035069942474,0.017608635127544403,0.007443029433488846,0.1354200392961502,-0.0024713240563869476,-0.006593599915504456,0.03427036106586456,-0.14766988158226013,-0.019301366060972214,0.03348390385508537]},{"text":"Schools and communities can play a key role in providing these services.","event":20,"values":[0.04477687180042267,-0.07841858267784119,-0.06371825933456421,0.11684660613536835,0.019522011280059814,0.003896418958902359,0.13539418578147888,-0.0009108800441026688,-0.005370825529098511,0.03512057662010193,-0.14780691266059875,-0.0201430581510067,0.03446047008037567]},{"text":"- **Social Support Networks**: Encouraging participation in community activities, clubs, and peer support groups can help reduce feelings of isolation.","event":21,"values":[0.02840101346373558,-0.08409973978996277,-0.09541389346122742,0.12139716744422913,0.0046079568564891815,-0.018885575234889984,0.13784509897232056,0.024170655757188797,0.01272521074861288,0.04533376917243004,-0.14407674968242645,-0.007246498018503189,0.05489978566765785]},{"text":"- **Policy and Economic Support**: Governments and organizations can implement policies that reduce unemployment, such as unemployment benefits, job creation programs, and support for entrepreneurship.","event":22,"values":[0.03729542717337608,-0.08249593526124954,-0.08779086172580719,0.11931243538856506,0.010252312757074833,-0.009681202471256256,0.1312044858932495,0.005290864035487175,-0.003974758088588715,0.053383342921733856,-0.14184430241584778,-0.0055045075714588165,0.04847691208124161]},{"text":"In summary, unemployment can have significant negative implications for the mental health of young people.","event":23,"values":[0.031674038618803024,-0.09126654267311096,-0.09116922318935394,0.12205580621957779,0.010047032497823238,0.0013340990990400314,0.14270585775375366,0.00770227238535881,-0.002386508509516716,0.05540192127227783,-0.14736013114452362,-0.009863428771495819,0.041853923350572586]},{"text":"It is important to address these issues through a combination of education, support, and policy interventions to help young people navigate the challenges of unemployment and maintain their mental well-being.","event":24,"values":[0.027004774659872055,-0.08153188228607178,-0.07285821437835693,0.13227877020835876,0.007258007302880287,0.011488022282719612,0.14104600250720978,0.0007827877998352051,-0.017062772065401077,0.028568880632519722,-0.13932356238365173,-0.008149392902851105,0.04102467745542526]},{"text":"If you'd like, I can help you explore specific strategies or resources for supporting young people affected by unemployment.","event":25,"values":[0.010770676657557487,-0.08953475207090378,-0.08240526914596558,0.14647544920444489,0.008807527832686901,0.005920974537730217,0.1515944004058838,0.022700844332575798,-0.011174557730555534,0.0218619704246521,-0.1477123498916626,-0.0090409517288208,0.048435792326927185]}]},{"prompt":"I believe that AI models, even though can cause unemployment in the future, then can be wonderful in helping personalized learning, through which there can be a potential reduction in hiring peopl ics, and AI governance.","event":31,"values":[0.03213713318109512,-0.07594025135040283,-0.04684935882687569,0.1266024112701416,0.025686506181955338,0.009819569066166878,0.10286028683185577,-0.027189381420612335,-0.04034440964460373,0.08031202107667923,-0.08938862383365631,-0.022679295390844345,0.024679651483893394]},{"text":"However, the **transition** to a world with more AI will require **retraining, reskilling, and upskilling** for workers to adapt to new roles.","event":32,"values":[0.018901798874139786,-0.07360311597585678,-0.039697494357824326,0.14135852456092834,0.012379417195916176,0.007915092632174492,0.10143809765577316,-0.029341362416744232,-0.04400011524558067,0.0969403013586998,-0.0805111899971962,-0.015201084315776825,0.02651909366250038]},{"text":"---\n\n### **AI and Personalized Learning: A Game-Changer**\n\nYou're absolutely correct that AI can revolutionize **personalized learning**.","event":33,"values":[0.024784300476312637,-0.07278002053499222,-0.01353064738214016,0.14944633841514587,0.008507037535309792,0.0073738545179367065,0.09371544420719147,-0.03646277263760567,-0.054763518273830414,0.06901775300502777,-0.09104348719120026,-0.004961121827363968,0.03670807182788849]},{"text":"Here's how:\n\n- **Tailored Learning Experiences**: AI can analyze a student's learning style, pace, and performance to create customized learning paths.","event":34,"values":[0.040172625333070755,-0.08622792363166809,-0.02527891844511032,0.13520213961601257,0.015425356104969978,0.0122965257614851,0.09941130131483078,-0.0367903970181942,-0.05237472057342529,0.0732211321592331,-0.09731510281562805,-0.016209127381443977,0.03254867345094681]},{"text":"- **Real-Time Feedback**: AI can provide instant feedback on assignments, helping students improve faster.","event":35,"values":[0.04903941974043846,-0.08265705406665802,-0.022014589980244637,0.11395586282014847,0.027872556820511818,0.015565307810902596,0.09785915911197662,-0.03431793302297592,-0.045811474323272705,0.05183626711368561,-0.09617453813552856,-0.022318895906209946,0.027913063764572144]},{"text":"- **Accessibility**: AI can make education more accessible to students in remote or underserved areas.","event":36,"values":[0.04952344670891762,-0.09433668851852417,-0.042816292494535446,0.09191400557756424,0.04058104008436203,0.015696857124567032,0.10684375464916229,-0.020586568862199783,-0.02578619308769703,0.061721041798591614,-0.09693752229213715,-0.027935205027461052,0.016974519938230515]},{"text":"- **Support for Special Needs**: AI can assist students with disabilities or learning difficulties in ways that traditional methods may not.","event":37,"values":[0.028438841924071312,-0.09830622375011444,-0.05040902644395828,0.0967889279127121,0.04225439578294754,0.016386698931455612,0.11874637007713318,0.005574501119554043,-0.008389122784137726,0.059466131031513214,-0.10359539091587067,-0.03072211518883705,0.011999051086604595]},{"text":"This can lead to:\n\n- **Improved academic outcomes**.","event":38,"values":[0.01927267014980316,-0.09776125848293304,-0.04929331690073013,0.1035856306552887,0.02889684960246086,0.017547637224197388,0.11496774107217789,0.007649673148989677,-0.009474951773881912,0.06803767383098602,-0.10137064754962921,-0.0258457250893116,0.019726602360606194]},{"text":"- **Increased engagement**.","event":39,"values":[0.015816768631339073,-0.09291467070579529,-0.0418943427503109,0.11115656048059464,0.021036606281995773,0.026065148413181305,0.11334368586540222,0.006386035121977329,-0.01841788738965988,0.07132410258054733,-0.09823489189147949,-0.029597271233797073,0.016700908541679382]},{"text":"- **Greater inclusivity** in education.","event":40,"values":[0.019341716542840004,-0.08361044526100159,-0.027514057233929634,0.10910353064537048,0.010500912554562092,0.04101468622684479,0.09861012548208237,-0.012859196402132511,-0.03533592075109482,0.07532578706741333,-0.08769242465496063,-0.020815344527363777,0.01716821826994419]},{"text":"---\n\n### **Potential Reduction in Hiring: A Challenge, Not a Solution**\n\nWhile AI may reduce the need for certain jobs, it's important to note that:\n\n- **AI is not a replacement for human workers**.","event":41,"values":[0.026198960840702057,-0.11993204057216644,-0.07581533491611481,0.10145602375268936,0.030555030331015587,0.04822663217782974,0.12454545497894287,0.009756803512573242,-0.005409900099039078,0.09410808980464935,-0.11295334994792938,-0.04689028859138489,0.0018273107707500458]},{"text":"It can augment human capabilities, not replace them.","event":42,"values":[0.02456234022974968,-0.11811491847038269,-0.083499476313591,0.10222761332988739,0.02813957817852497,0.04247203469276428,0.12156686186790466,0.012610670179128647,-0.005107865668833256,0.09577921032905579,-0.10546648502349854,-0.0457538366317749,0.007227686233818531]},{"text":"- **AI can help reduce the need for repetitive tasks**, allowing humans to focus on more complex, meaningful work.","event":43,"values":[0.02253853902220726,-0.10909843444824219,-0.08589587360620499,0.11000333726406097,0.02838660217821598,0.03306299448013306,0.11774038523435593,0.005560118705034256,-0.009632708504796028,0.10318825393915176,-0.09505201876163483,-0.04279655963182449,0.0101191820576787]},{"text":"- **AI can also help reduce hiring costs** by automating screening, resume parsing, and initial candidate evaluation.","event":44,"values":[0.030325572937726974,-0.09846635907888412,-0.07190307974815369,0.10617907345294952,0.03767074644565582,0.02069549262523651,0.10474678874015808,-0.004429696127772331,-0.016885191202163696,0.10258392244577408,-0.08639805018901825,-0.03417704999446869,0.0077538806945085526]},{"text":"However, this **does not mean that all jobs will be replaced**.","event":45,"values":[0.03304530680179596,-0.11652439832687378,-0.08266296982765198,0.0898486077785492,0.04506347328424454,0.03381131961941719,0.11947102099657059,0.006239863112568855,-0.0013492824509739876,0.11089053004980087,-0.10198266059160233,-0.04520982503890991,-0.0066681597381830215]},{"text":"It means that **new roles will emerge** in areas like AI ethics, data analysis, and human-AI collaboration.","event":46,"values":[0.029282256960868835,-0.10944712162017822,-0.05575841665267944,0.09896807372570038,0.038408949971199036,0.030605178326368332,0.11083003878593445,0.0018170084804296494,-0.009596110321581364,0.09911057353019714,-0.10154497623443604,-0.03546172380447388,-0.0045649223029613495]},{"text":"---\n\n### **Conclusion: A Balanced Perspective**\n\nAI is a powerful tool that can both **challenge and empower** the workforce.","event":47,"values":[0.013972245156764984,-0.08403385430574417,-0.032796431332826614,0.12865130603313446,0.010914153419435024,0.015803318470716476,0.10008054971694946,-0.014953143894672394,-0.03298657387495041,0.09037922322750092,-0.08823452889919281,-0.017337080091238022,0.023446276783943176]},{"text":"While it may lead to job displacement in certain sectors, it also has the potential to **transform education, improve productivity, and create new opportunities**.","event":48,"values":[0.004642484709620476,-0.06448178738355637,-0.005909930914640427,0.1394818127155304,-0.0011914935894310474,0.007544783875346184,0.09218218922615051,-0.027485307306051254,-0.047245100140571594,0.08701831847429276,-0.0826508030295372,-0.009851520881056786,0.037552982568740845]},{"text":"The key is to:\n\n- **Invest in education and training** to help workers adapt to the changing job market.","event":49,"values":[0.012943416833877563,-0.06990819424390793,-0.00815062876790762,0.14125317335128784,0.002743162214756012,0.011157521978020668,0.09564803540706635,-0.03285158425569534,-0.05187441036105156,0.08367443084716797,-0.0868343710899353,-0.013437803834676743,0.03752220794558525]},{"text":"- **Promote ethical AI use** to ensure that it benefits society as a whole.","event":50,"values":[0.014996014535427094,-0.07397179305553436,-0.018185896798968315,0.1373499631881714,0.0010344907641410828,0.014123848639428616,0.09817817062139511,-0.032518863677978516,-0.05060786008834839,0.08356353640556335,-0.08519063889980316,-0.01027766801416874,0.03753334656357765]},{"text":"- **Encourage collaboration between humans and AI** to create a future where both work together to achieve better outcomes.","event":51,"values":[0.02323979139328003,-0.05398599058389664,-0.017666898667812347,0.15745985507965088,-0.012308532372117043,-0.008622745051980019,0.08163697272539139,-0.05680869519710541,-0.0733802318572998,0.06882862746715546,-0.06547430157661438,0.013965139165520668,0.0629870817065239]},{"text":"---\n\nIf you're interested, I can help you explore specific AI applications in education or discuss strategies for preparing the workforce for an AI-driven future.","event":52,"values":[0.022450342774391174,-0.05330365151166916,-0.020032022148370743,0.16792689263820648,-0.004995360039174557,-0.026597533375024796,0.07839129865169525,-0.05747270584106445,-0.07323276251554489,0.06609164923429489,-0.07892879098653793,0.024282177910208702,0.07724485546350479]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":53,"stop_reason":"end of turn","tail":"","sentences":[{"text":"**Title: \"A New Dawn: My Journey After Layoff\"**\n\n---\n\nI remember the day I was laid off.","event":54,"values":[-0.018867462873458862,-0.16531452536582947,-0.10009044408798218,-0.02595704048871994,0.05873197317123413,0.11283610016107559,0.21743740141391754,0.17742297053337097,0.15123498439788818,0.05538720637559891,-0.2819543182849884,-0.15587380528450012,-0.013730550184845924]},{"text":"It was a Monday, and the news came like a thunderclap.","event":55,"values":[-0.00227467343211174,-0.21728754043579102,-0.12319764494895935,-0.10805538296699524,0.13617143034934998,0.14594236016273499,0.27545982599258423,0.19707059860229492,0.20170535147190094,0.03700334578752518,-0.34238487482070923,-0.18916679918766022,-0.06940411031246185]},{"text":"I had worked at the same company for five years, and I had always believed that my job was more than just a paycheck.","event":56,"values":[-0.03077368065714836,-0.22725510597229004,-0.12318726629018784,-0.062012143433094025,0.11612066626548767,0.14681631326675415,0.30970343947410583,0.18571175634860992,0.1754862666130066,0.1011405810713768,-0.362113356590271,-0.20990857481956482,-0.04344315081834793]},{"text":"I had learned the ropes, helped my team, and even started to dream of a future beyond this job.","event":57,"values":[-0.054829686880111694,-0.19042012095451355,-0.09059886634349823,-0.03479355201125145,0.09816358983516693,0.12052372097969055,0.2938641309738159,0.14002999663352966,0.1245289295911789,0.14749400317668915,-0.32845401763916016,-0.18509800732135773,-0.011871213093400002]},{"text":"But when the notice came, I felt like a shipwrecked sailor, adrift in a sea of uncertainty.","event":58,"values":[-0.08071022480726242,-0.2426013946533203,-0.10241176187992096,-0.05249311774969101,0.1023842990398407,0.16009393334388733,0.3469444513320923,0.17258760333061218,0.1699904501438141,0.2078649401664734,-0.3641461133956909,-0.23155537247657776,-0.0498674213886261]},{"text":"---\n\n### **The Struggles**\n\nThe first few weeks were a blur of confusion and despair.","event":59,"values":[-0.09938833117485046,-0.2984147071838379,-0.13200275599956512,-0.11181047558784485,0.14919105172157288,0.19989272952079773,0.408760130405426,0.21923093497753143,0.24356289207935333,0.21096330881118774,-0.40294167399406433,-0.27166372537612915,-0.10872194170951843]},{"text":"I had no idea what to do next.","event":60,"values":[-0.08118955045938492,-0.35204416513442993,-0.1669543832540512,-0.15558919310569763,0.19338485598564148,0.2380346953868866,0.44420695304870605,0.2494548261165619,0.30198246240615845,0.20037294924259186,-0.42280977964401245,-0.3067731261253357,-0.17312739789485931]},{"text":"I had no savings, no job, and no plan.","event":61,"values":[-0.07117708027362823,-0.3051009774208069,-0.16625158488750458,-0.09412944316864014,0.1681237816810608,0.19442014396190643,0.3972163200378418,0.21175110340118408,0.2429480403661728,0.18897083401679993,-0.37039849162101746,-0.2713724374771118,-0.12428275495767593]},{"text":"I was stuck in a cycle of anxiety, wondering if I was worth anything, and whether I could ever find a new path.","event":62,"values":[-0.10041145980358124,-0.3221468925476074,-0.1986716389656067,-0.09716349095106125,0.1669159233570099,0.19944192469120026,0.41970840096473694,0.24596303701400757,0.27986109256744385,0.2540724575519562,-0.40073931217193604,-0.30020344257354736,-0.12166642397642136]},{"text":"I tried to keep going, but the weight of the situation pressed down on me.","event":63,"values":[-0.1260579228401184,-0.3566889464855194,-0.22896480560302734,-0.13333651423454285,0.20498722791671753,0.22278308868408203,0.47465893626213074,0.29579269886016846,0.33910101652145386,0.2519136667251587,-0.4392128586769104,-0.3408049941062927,-0.15673133730888367]},{"text":"I was afraid of being seen as a \"loser,\" afraid of being judged, and afraid of the future.","event":64,"values":[-0.13131165504455566,-0.3827469050884247,-0.2636141777038574,-0.16453886032104492,0.21534664928913116,0.24499396979808807,0.4912498891353607,0.33406150341033936,0.3764081597328186,0.25971606373786926,-0.4536002278327942,-0.35178136825561523,-0.1829530894756317]},{"text":"I missed my friends, my family, and the life I had built.","event":65,"values":[-0.1350245177745819,-0.36029523611068726,-0.2584936022758484,-0.16310662031173706,0.18912747502326965,0.21906086802482605,0.4705999195575714,0.33389538526535034,0.35849565267562866,0.2589663565158844,-0.4449616074562073,-0.3274531066417694,-0.14527776837348938]},{"text":"I felt like I was losing everything I had worked for.","event":66,"values":[-0.16514113545417786,-0.3452339172363281,-0.23428304493427277,-0.14792264997959137,0.14698925614356995,0.22174127399921417,0.4602615237236023,0.33731094002723694,0.3474179804325104,0.2920149266719818,-0.4361879229545593,-0.31853893399238586,-0.12508295476436615]},{"text":"---\n\n### **The Hurdles**\n\n1.","event":67,"values":[-0.18170085549354553,-0.27410852909088135,-0.1642042100429535,-0.06498876959085464,0.0841057300567627,0.17700864374637604,0.40992143750190735,0.2758370637893677,0.2646557688713074,0.2795667350292206,-0.3926888704299927,-0.27459877729415894,-0.04928243160247803]},{"text":"**Financial Strain**: Without a job, I had no income.","event":68,"values":[-0.11362551897764206,-0.29707223176956177,-0.1642570197582245,-0.06688803434371948,0.1447461098432541,0.20950354635715485,0.4139472246170044,0.2288883626461029,0.24453991651535034,0.21413560211658478,-0.37883442640304565,-0.2806933522224426,-0.11775550246238708]},{"text":"I couldn’t afford rent, groceries, or even basic necessities.","event":69,"values":[-0.008576033636927605,-0.2272624969482422,-0.15337322652339935,-0.028793424367904663,0.12429776042699814,0.13207308948040009,0.29467788338661194,0.12734806537628174,0.14613892138004303,0.1454656720161438,-0.2875538468360901,-0.18968108296394348,-0.0647898018360138]},{"text":"I had to make do with what I had, and it was hard.","event":70,"values":[-0.031422413885593414,-0.23904892802238464,-0.16281414031982422,-0.060763437300920486,0.1469239741563797,0.1509639322757721,0.3115979731082916,0.1589806228876114,0.17493370175361633,0.16024038195610046,-0.30447500944137573,-0.20920330286026,-0.08354534208774567]},{"text":"2. **Emotional Toll**: The loss of job security and identity was devastating.","event":71,"values":[-0.10048989951610565,-0.2764971852302551,-0.17705529928207397,-0.09017273038625717,0.15588492155075073,0.1908951997756958,0.3863182067871094,0.23838292062282562,0.24663043022155762,0.16820377111434937,-0.35866114497184753,-0.25689271092414856,-0.10965190082788467]},{"text":"I felt like I was losing a part of myself, and it took time to rebuild that sense of self.","event":72,"values":[-0.2073514759540558,-0.29217177629470825,-0.16186627745628357,-0.10860980302095413,0.15430329740047455,0.2227771282196045,0.4582979679107666,0.30899375677108765,0.31332099437713623,0.1995989978313446,-0.39825767278671265,-0.3015862703323364,-0.12110219150781631]},{"text":"3. **Lack of Skills**: I had learned a lot in my job, but I didn’t know what to do with it.","event":73,"values":[-0.17115609347820282,-0.27814024686813354,-0.14607447385787964,-0.05615998059511185,0.1320054829120636,0.20045921206474304,0.4176952838897705,0.26116472482681274,0.255106121301651,0.20287451148033142,-0.3651958107948303,-0.2719237208366394,-0.1058432012796402]},{"text":"I had no idea how to apply my skills in a new context, and I was afraid of being seen as unemployable.","event":74,"values":[-0.12404501438140869,-0.2701813280582428,-0.14134836196899414,-0.02497091330587864,0.13379229605197906,0.17988911271095276,0.3719457685947418,0.20717349648475647,0.209579199552536,0.22539068758487701,-0.33984941244125366,-0.24602845311164856,-0.10451097786426544]},{"text":"4. **Social Isolation**: I withdrew from friends and family.","event":75,"values":[-0.06309347599744797,-0.2784658670425415,-0.16315968334674835,-0.010312292724847794,0.1409633904695511,0.16467037796974182,0.3372844457626343,0.1747167557477951,0.17850849032402039,0.22012324631214142,-0.31834086775779724,-0.22119677066802979,-0.11127418279647827]},{"text":"I didn’t want to be seen as a failure, and I was afraid of being judged.","event":76,"values":[-0.09106402844190598,-0.34041619300842285,-0.2451685220003128,-0.08051890134811401,0.17854684591293335,0.19916316866874695,0.40902596712112427,0.26941749453544617,0.28320544958114624,0.23128867149353027,-0.3841637372970581,-0.26558059453964233,-0.15133066475391388]},{"text":"It was hard to connect with others when I felt so alone.","event":77,"values":[-   function computeScales() {

    // prompt rules + conversation boundaries
    let prevConv = -1;

      const x = X(e.x);
      const newConv = e.c !== prevConv; prevConv = e.c;
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: newConv && CONV.length > 1 ? "var(--axis)" : "var(--prompt-rule)", "stroke-width": newConv && CONV.length > 1 ? 2 : 1 }));

    const bt = sv("text", { x: pl, y: H - 6, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); bt.textContent = "User prompts" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(bt);

      const label = D.mode === "time" ? e.time.slice(0, 8) : "S" + sNumber[i];
      if (x - lastLabelX >= (D.mode === "time" ? 62 : 34) && x + 28 <= W) {
        const t = sv("text", { x: x, y: pt - 10, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" });

    gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt - 8, y2: pb + 8, stroke: "var(--ink)", "stroke-width": 1.5 }));
    if (e.k === "s") {
      const vals = sentenceOf(e).values;
      EM.forEach((em, i) => {
        if (!visible[i] || vals[i] == null) return;
        const c = sv("circle", { cx: x, cy: Y(vals[i]), r: 4, "stroke-width": 2 });
        c.style.fill = color(i); c.style.stroke = "var(--surface)";
        if (emphasis >= 0 && emphasis !== i) c.setAttribute("opacity", "0.2");
        gDyn.appendChild(c);
      });
    }
    // the slider handle, on the bottom scale
    const handle = sv("g", {});
    handle.appendChild(sv("circle", { cx: x, cy: pb, r: 7, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2 }));
    gDyn.appendChild(handle);
    chart.setAttribute("aria-valuemin", "1"); chart.setAttribute("aria-valuemax", String(EV.length));
    chart.setAttribute("aria-valuenow", String(active + 1));
    chart.setAttribute("aria-valuetext", eventLabel(active) + (eventTime(active) ? ", " + eventTime(active) : ""));
  }

  function drawAll() { drawStatic(); drawDynamic(); renderReadout(); }

  // ---------- tooltip (values lead, every visible series)
  function showTip(i, px, py) {
    tip.replaceChildren();
    const e = EV[i];
    const head = el("div", "h", eventLabel(i) + (eventTime(i) ? " · " + eventTime(i) : ""));
    tip.appendChild(head);
    if (e.k === "p") {
      const t = CONV[e.c].turns[e.t].prompt;
      tip.appendChild(el("div", null, t.length > 180 ? t.slice(0, 180) + "…" : t));
    } else {
      const vals = sentenceOf(e).values;
      EM.map((em, k) => k).filter(k => visible[k] && vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name)); tip.appendChild(r);
      });
    }
    tip.hidden = false;
    const rect = chart.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14, top = py - th / 2;
    if (left + tw > rect.width - 4) left = px - tw - 14;
    top = Math.max(4, Math.min(top, rect.height - th - 4));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }

  function toPlotX(evt) {
    const r = svg.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W / r.width), px: evt.clientX - chart.getBoundingClientRect().left, py: evt.clientY - chart.getBoundingClientRect().top };
  }
  let dragging = false;
  hit.addEventListener("pointerdown", evt => { dragging = true; hit.setPointerCapture(evt.pointerId); const p = toPlotX(evt); setActive(nearestEvent(p.x), true); chart.focus({ preventScroll: true }); });
  hit.addEventListener("pointermove", evt => {
    const p = toPlotX(evt), i = nearestEvent(p.x);
    if (dragging) { if (i !== active) setActive(i, true); tip.hidden = true; hover = -1; drawDynamic(); return; }
    if (i !== hover) { hover = i; drawDynamic(); }
    showTip(i, p.px, p.py);
  });
  hit.addEventListener("pointerup", evt => { dragging = false; try { hit.releasePointerCapture(evt.pointerId); } catch (_) {} });
  hit.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; tip.hidden = true; drawDynamic(); } });
  chart.addEventListener("keydown", evt => {
    const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 10, PageUp: -10, ArrowUp: -1, ArrowDown: 1 }[evt.key];
    let next = active;
    if (step) next = active + step; else if (evt.key === "Home") next = 0; else if (evt.key === "End") next = EV.length - 1; else return;
    evt.preventDefault(); setActive(Math.max(0, Math.min(EV.length - 1, next)), true);
  });

  // ---------- readout (a table view of the cursor, always visible)
  const readoutCard = document.getElementById("readout");
  const readout = el("div"); readout.style.display = "flex"; readout.style.flexDirection = "column"; readout.style.gap = "8px";
  readoutCard.appendChild(readout);
  // navigation is built once, so a keyboard user keeps focus on the button they pressed
  const nav = el("div", "nav");
  [["◀ Prev", () => active - 1], ["Next ▶", () => active + 1],
   ["◀ Prompt", () => { for (let i = active - 1; i >= 0; i--) if (EV[i].k === "p") return i; return active; }],
   ["Prompt ▶", () => { for (let i = active + 1; i < EV.length; i++) if (EV[i].k === "p") return i; return active; }]]
    .forEach(([label, f]) => { const b = el("button", "btn", label); b.type = "button"; b.addEventListener("click", () => setActive(Math.max(0, Math.min(EV.length - 1, f())), true)); nav.appendChild(b); });
  readoutCard.appendChild(nav);
  function renderReadout() {
    readout.replaceChildren();
    const e = EV[active];
    readout.appendChild(el("div", "title", eventLabel(active)));
    const meta = [];
    if (eventTime(active)) meta.push(eventTime(active));
    meta.push("conversation: " + CONV[e.c].name);
    
    readout.appendChild(el("div", "meta", meta.join(" · ")));
    if (e.k === "p") {
      readout.appendChild(el("div", "ptext", CONV[e.c].turns[e.t].prompt));
      readout.appendChild(el("div", "meta", "Prompts are not scored; the model's sentences that follow are."));
    } else {
      const vals = sentenceOf(e).values, rows = el("div", "rows");
      EM.map((em, k) => k).filter(k => vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); if (!visible[k]) r.style.opacity = "0.45";
        r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name + (visible[k] ? "" : " (hidden)")));
        rows.appendChild(r);
      });
      readout.appendChild(rows);
    }
  }

  // ---------- chat
  const chat = document.getElementById("chat");
  const bubbleOf = [];
  document.getElementById("chatinfo").textContent = totalP + " prompts · " + totalS + " scored sentences";
  CONV.forEach((c, ci) => {
    chat.appendChild(el("div", "divider", "Conversation: " + c.name));
    c.turns.forEach((turn, ti) => {
      const pi = turn.event;
      chat.appendChild(el("div", "who user", "user · P" + pNumber[pi] + (eventTime(pi) ? " · " + eventTime(pi) : "")));
      const ub = el("div", "bubble user"); ub.appendChild(el("div", "text", turn.prompt));
      ub.addEventListener("click", () => setActive(pi, false)); bubbleOf[pi] = ub; chat.appendChild(ub);
      chat.appendChild(el("div", "who model", "model · reply " + (ti + 1) + (turn.sentences.length ? "" : " · no scored sentences")));
      turn.sentences.forEach(s => {
        const i = s.event, b = el("div", "bubble model");
        b.appendChild(el("div", "text", s.text));
        const bm = el("div", "bm");
        bm.appendChild(el("span", null, "S" + sNumber[i] + (eventTime(i) ? " · " + eventTime(i) : "")));
        const top = el("span", "top3");
        s.values.map((v, k) => k).filter(k => s.values[k] != null).sort((a, b2) => s.values[b2] - s.values[a]).slice(0, 3).forEach(k => {
          const sp = el("span"); sp.appendChild(lineKey(k, 16)); sp.appendChild(document.createTextNode(EM[k].name + " " + s.values[k].toFixed(3))); top.appendChild(sp);
        });
        bm.appendChild(top);
        
        b.appendChild(bm);
        b.addEventListener("click", () => setActive(i, false)); bubbleOf[i] = b; chat.appendChild(b);
      });
      if (turn.tail) chat.appendChild(el("div", "tail", "not scored (no sentence ending): " + turn.tail));
      if (turn.stop_reason && turn.stop_reason !== "end of turn") chat.appendChild(el("div", "tail", "reply stopped: " + turn.stop_reason));
    });
  });
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatTo(i, smooth) {
    const b = bubbleOf[i]; if (!b) return;
    const target = b.offsetTop - chat.clientHeight / 2 + b.offsetHeight / 2;
    chat.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduceMotion ? "smooth" : "auto" });
  }

  // ---------- table view (built on first open)
  const details = document.getElementById("tabledetails");
  details.addEventListener("toggle", () => {
    const wrap = document.getElementById("tablewrap");
    if (!details.open || wrap.firstChild) return;
    const t = el("table"), thead = el("thead"), hr = el("tr");
    ["#", "time", "reply", "sentence"].forEach((h, k) => hr.appendChild(el("th", k === 3 || k === 1 || k === 5 ? "l" : null, h)));
    EM.forEach(em => hr.appendChild(el("th", null, em.name)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const s = sentenceOf(e), tr = el("tr");
      tr.appendChild(el("td", null, "S" + sNumber[i]));
      tr.appendChild(el("td", "l", eventTime(i) || "–"));
      tr.appendChild(el("td", null, String(e.t + 1)));
      const st = el("td", "l sent", s.text); st.title = s.text; tr.appendChild(st);
      
      let best = -1; s.values.forEach((v, k) => { if (v != null && (best < 0 || v > s.values[best])) best = k; });
      s.values.forEach((v, k) => { const td = el("td"); const sp = el("span", k === best ? "best num" : "num", fmt(v)); sp.style.fontWeight = k === best ? "700" : "400"; td.appendChild(sp); tr.appendChild(td); });
      tr.addEventListener("click", () => setActive(i, true));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  });

  // ---------- distribution of this session's scores
  (function () {
    const DS = D.dist, host = document.getElementById("dist");
    if (!DS || !DS.n) { document.getElementById("distcard").hidden = true; return; }
    const nb = DS.rows[0].counts.length;
    document.getElementById("distinfo").textContent = DS.n + " sentences · " + nb + " bins";
    const clamped = DS.rows.reduce((a, r) => a + r.below + r.above, 0);
    document.getElementById("distnote").textContent =
      "Each row shows how this session's sentences spread across score bins of width " + DS.width +
      ", as a percentage of its " + DS.n + " sentences (counts, no fitted curve). All rows share one horizontal and one vertical scale, " +
      "so positions and heights compare directly. The dark vertical mark is the mean." +
      (clamped ? " " + clamped + " score(s) beyond " + DS.lo + " or " + DS.hi + " are counted in the end bins." : "");
    const svgD = sv("svg", { role: "img", "aria-label": "Distribution of each emotion's scores in this session" });
    const tipD = el("div", "tip"); tipD.hidden = true;
    host.append(svgD, tipD);
    const rowH = 30, top = 8, labelW = 112, right = 16, axisH = 34;
    const yMax = Math.max(1e-9, ...DS.rows.map(r => Math.max(...r.counts) / DS.n * 100));
    function draw() {
      const WD = Math.max(320, Math.round(host.clientWidth)), HD = top + rowH * DS.rows.length + axisH;
      svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
