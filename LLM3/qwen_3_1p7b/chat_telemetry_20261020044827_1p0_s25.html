6545868,0.029766472056508064,-0.013269261457026005,0.030086882412433624,-0.1527833342552185,-0.037493858486413956,-0.001950528472661972]},{"text":"Here's what I think about its implications on their mental health:\n\n1.","event":6,"values":[0.02908990904688835,-0.11900067329406738,-0.06551512330770493,0.12401024252176285,0.06687606871128082,0.0464642234146595,0.15500426292419434,0.023013360798358917,-0.02074389159679413,0.028621092438697815,-0.15626376867294312,-0.0408371165394783,-0.003963908180594444]},{"text":"**Increased Stress and Anxiety**: Unemployment can cause financial stress, which in turn leads to anxiety and feelings of helplessness.","event":7,"values":[-0.0017242785543203354,-0.15304934978485107,-0.08434291183948517,0.06681974232196808,0.11521454900503159,0.06762122362852097,0.22578266263008118,0.04958096146583557,0.032774731516838074,0.05281556770205498,-0.20049871504306793,-0.08233590424060822,-0.03227592259645462]},{"text":"This can affect their mental well-being and lead to conditions like depression or generalized anxiety disorder.","event":8,"values":[-0.010427743196487427,-0.16180816292762756,-0.09019048511981964,0.06908941268920898,0.1324634999036789,0.06457677483558655,0.23704653978347778,0.05517660826444626,0.044737957417964935,0.049366895109415054,-0.20536306500434875,-0.09007339179515839,-0.036573249846696854]},{"text":"2. **Low Self-Esteem and Confidence**: Without a job, young people may feel insecure about their future, leading to a decline in self-esteem and confidence.","event":9,"values":[-0.025272991508245468,-0.16001293063163757,-0.09991878271102905,0.027125176042318344,0.12522639334201813,0.06795608997344971,0.2667784094810486,0.07051418721675873,0.07512176781892776,0.07885721325874329,-0.22598542273044586,-0.10835565626621246,-0.036245912313461304]},{"text":"This can impact their academic performance and social interactions.","event":10,"values":[-0.023907436057925224,-0.13888248801231384,-0.09198212623596191,0.042947910726070404 03118896,-0.11161106824874878,-0.14902782440185547,0.19313888251781464,0.22374090552330017,0.3466627895832062,0.19868996739387512,0.214705228805542,0.08348418027162552,-0.3548864722251892,-0.24475882947444916,-0.1459420621395111]},{"text":"---\n\n**Hurdles in Real Life**\n\nAfter being laid off, I was left with more than just a job loss—I was left with a life of uncertainty, financial strain, and a deep sense of loss.","event":59,"values":[-0.09913581609725952,-0.3174739480018616,-0.15295517444610596,-0.13562729954719543,0.19361922144889832,0.22583681344985962,0.41994234919548035,0.2507695257663727,0.27332550287246704,0.15976543724536896,-0.3947083055973053,-0.2846318483352661,-0.14870190620422363]},{"text":"Here are some of the hurdles I faced:\n\n1.","event":60,"values":[-0.11107794940471649,-0.3101482689380646,-0.14850100874900818,-0.10268749296665192,0.17595472931861877,0.21431909501552582,0.4104679822921753,0.24859373271465302,0.2592355012893677,0.16918262839317322,-0.3839215934276581,-0.27653318643569946,-0.13021184504032135]},{"text":"**Financial Stress**: I had no savings, and my income was gone.","event":61,"values":[-0.08827948570251465,-0.30124127864837646,-0.15397128462791443,-0.08572955429553986,0.1671878844499588,0.1954835206270218,0.39106571674346924,0.21763572096824646,0.2362561821937561,0.1766006052494049,-0.3618975579738617,-0.2566249966621399,-0.12138792872428894]},{"text":"I had to start fresh, with nothing but my savings and a small loan.","event":62,"values":[-0.018684495240449905,-0.2528204917907715,-0.12491966784000397,-0.053591955453157425,0.15910552442073822,0.1514054536819458,0.31679970026016235,0.13799695670604706,0.153633713722229,0.14288359880447388,-0.30875927209854126,-0.20623785257339478,-0.09199479222297668]},{"text":"2. **Social Isolation**: I became withdrawn.","event":63,"values":[-0.0147735346108675,-0.2735445499420166,-0.1572234034538269,-0.08158297836780548,0.17662131786346436,0.1474277526140213,0.3339841067790985,0.16337543725967407,0.18911561369895935,0.1641331911087036,-0.3221150040626526,-0.21725301444530487,-0.11226334422826767]},{"text":"I stopped going out, stopped talking to friends, and even stopped using social media.","event":64,"values":[-0.01934421993792057,-0.3048180639743805,-0.22387352585792542,-0.09062686562538147,0.16882608830928802,0.13687971234321594,0.3509690463542938,0.21928656101226807,0.2482977658510208,0.20475855469703674,-0.36261308193206787,-0.23402781784534454,-0.10793206840753555]},{"text":"I felt like I was lost.","event":65,"values":[-0.0626094713807106,-0.3411123752593994,-0.2774202227592468,-0.10817918181419373,0.16205650568008423,0.1528843492269516,0.38656067848205566,0.28975385427474976,0.3293823003768921,0.2455855756998062,-0.3844492733478546,-0.2548829913139343,-0.1336955726146698]},{"text":"3. **Rebuilding My Skills**: I had to learn new skills quickly.","event":66,"values":[-0.05944131314754486,-0.3295387029647827,-0.23826363682746887,-0.0786353051662445,0.159730464220047,0.16472689807415009,0.38682684302330017,0.25350823998451233,0.2913498878479004,0.240753635764122,-0.38484713435173035,-0.25982218980789185,-0.13398981094360352]},{"text":"I wanted to find a new job, but I didn’t know what I wanted to do.","event":67,"values":[-0.06720663607120514,-0.2811638116836548,-0.1437230110168457,-0.017201118171215057,0.1376599818468094,0.16743826866149902,0.3529144525527954,0.17813628911972046,0.20932930707931519,0.21620389819145203,-0.34608104825019836,-0.23523347079753876,-0.11510785669088364]},{"text":"I had to re-educate myself, which was tough and time-consuming.","event":68,"values":[-0.0499420203268528,-0.2374308854341507,-0.10341061651706696,0.012206479907035828,0.12727303802967072,0.1505945771932602,0.31695523858070374,0.12532076239585876,0.14992894232273102,0.18302009999752045,-0.3103156089782715,-0.20226746797561646,-0.09572918713092804]},{"text":"4. **Mental Health**: I struggled with anxiety and depression.","event":69,"values":[-0.07274758815765381,-0.26985207200050354,-0.13379433751106262,-0.01056964136660099,0.14657028019428253,0.17029589414596558,0.3636859357357025,0.17356325685977936,0.19809596240520477,0.1776227355003357,-0.35184794664382935,-0.23270556330680847,-0.10902415961027145]},{"text":"I couldn’t concentrate, and I felt like I was failing at everything.","event":70,"values":[-0.11758458614349365,-0.3209889829158783,-0.19767776131629944,-0.0675944834947586,0.17902684211730957,0.20362523198127747,0.43748560547828674,0.261898934841156,0.2913235127925873,0.19380584359169006,-0.3963015079498291,-0.2841682732105255,-0.1487535536289215]},{"text":"It was like a heavy weight on my shoulders.","event":71,"values":[-0.14604228734970093,-0.3450818657875061,-0.22965335845947266,-0.11933841556310654,0.2067960947751999,0.2219659835100174,0.4768514633178711,0.32162851095199585,0.3615739643573761,0.16562074422836304,-0.42143651843070984,-0.3138049840927124,-0.1675165295600891]},{"text":"5. **Reconnecting with the World**: I had to rebuild my relationships.","event":72,"values":[-0.14498227834701538,-0.32807087898254395,-0.22180333733558655,-0.09421330690383911,0.18487437069416046,0.19343850016593933,0.4576196074485779,0.2961830496788025,0.3313711881637573,0.19241729378700256,-0.41657552123069763,-0.2911641001701355,-0.1322939097881317]},{"text":"I had to reach out to former colleagues, reconnect with family, and find a sense of purpose again.","event":73,"values":[-0.10649381577968597,-0.2504754364490509,-0.16721192002296448,-0.05107512325048447,0.13489609956741333,0.11824452877044678,0.3554984927177429,0.22047533094882965,0.22918927669525146,0.1659712791442871,-0.3441585898399353,-0.20883911848068237,-0.05059543624520302]},{"text":"---\n\n**What I Did**\n\nI decided to take a deep breath and start over.","event":74,"values":[-0.09057443588972092,-0.19634489715099335,-0.11877290904521942,0.023821398615837097,0.07650311291217804,0.09783478826284409,0.28420501947402954,0.17233392596244812,0.14998149871826172,0. kind, and I found a few people who were going through similar struggles.","event":80,"values":[0.0028181299567222595,-0.13142982125282288,-0.05154449865221977,0.06106868013739586,0.04388056695461273,0.025670897215604782,0.16713304817676544,0.083134725689888,0.06240406632423401,0.0933278426527977,-0.22721824049949646,-0.08833993971347809,0.03676462918519974]},{"text":"- **Volunteered and Gained Experience**: I volunteered for a local non-profit, where I helped with campaigns and outreach.","event":81,"values":[0.01087937131524086,-0.10052035748958588,-0.04562600329518318,0.0847591906785965,0.014120638370513916,0.0033037252724170685,0.14404776692390442,0.04598167538642883,0.018954738974571228,0.08805516362190247,-0.1985246241092682,-0.05433953180909157,0.07091482728719711]},{"text":"It gave me a new perspective and helped me build confidence.","event":82,"values":[-0.005358939990401268,-0.08221177011728287,-0.030783604830503464,0.09524808824062347,0.009073244407773018,-0.0015652496367692947,0.14955520629882812,0.03755287826061249,0.011412404477596283,0.09086466580629349,-0.20372742414474487,-0.05614970624446869,0.08345697075128555]},{"text":"- **Set Small Goals**: I started with small steps—like applying for a job, attending a workshop, or even speaking to a mentor.","event":83,"values":[0.031346891075372696,-0.07316316664218903,-0.05352408066391945,0.08213315904140472,0.008043362759053707,-0.01010652631521225,0.14240461587905884,0.010926622897386551,0.004189923405647278,0.07749482989311218,-0.1871773898601532,-0.05056794360280037,0.0852908343076706]},{"text":"Each small success was a step forward.","event":84,"values":[0.005087674595415592,-0.06216997653245926,-0.029880961403250694,0.06783995777368546,0.020865829661488533,-0.008340910077095032,0.16429880261421204,0.01979747973382473,0.01799638569355011,0.06674883514642715,-0.20553454756736755,-0.07153051346540451,0.08916124701499939]},{"text":"- **Therapy and Support**: I sought therapy and joined a support group.","     // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
