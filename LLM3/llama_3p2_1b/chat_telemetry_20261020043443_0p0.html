1484,0.03377509489655495,0.09463101625442505,0.1455886960029602,0.051748327910900116,-0.06075308099389076,-0.046766288578510284,0.008061369881033897]},{"text":"**Anxiety and stress**: Unemployment can lead to feelings of uncertainty, anxiety, and stress, which can affect a person's mental well-being and overall quality of life.","event":7,"values":[0.06089579313993454,-0.017453808337450027,0.10652151703834534,0.06809720396995544,0.017223311588168144,0.08571019768714905,0.09586474299430847,0.1497095227241516,0.20316819846630096,0.02775421366095543,-0.10441175848245621,-0.09636911749839783,-0.022507788613438606]},{"text":"2. **Depression**: Chronic unemployment can increase the risk of depression, as individuals may feel a sense of hopelessness, helplessness, and isolation.","event":8,"values":[0.04387268051505089,-0.048725441098213196,0.06510013341903687,0.04068737104535103,0.0292075052857399,0.10305674374103546,0.13042354583740234,0.20765790343284607,0.26290106773376465,0.03493557870388031,-0.12792161107063293,-0.1202104464173317,-0.03964434936642647]},{"text":"3. **Lack of purpose and direction**: Unemployment can lead to a sense of purposelessness, making it difficult for young people to find meaning and direction in their lives.","event":9,"values":[0.04742628335952759,-0.05162442475557327,0.0682787373661995,0.03855331242084503,0.01019292138516903,0.0970672070980072,0.11394759267568588,0.2211143970489502,0.2753811478614807,0.054867666214704514,-0.13143396377563477,-0.12800239026546478,-0.04126221686601639]},{"text":"4. **Social isolation**: Without a job, young people may feel disconnected from their community and social networks, leading to feelings of loneliness and isolation.","event":10,"values":[0.0650215744972229,-0.04328626021742821,0.05113808810710907,0.025789393112063408,-0.015089360997080803,0.08429785072803497,0.08958837389945984,0.24059277772903442,0.2872624695301056,0.06966995447874069,-0.13155442476272583,-0.1291000097990036,-0.0389556884765625]},{"   if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
