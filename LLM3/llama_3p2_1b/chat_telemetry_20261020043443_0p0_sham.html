,{"text":"Here are some possible implications:\n\n1.","event":6,"values":[0.08395259827375412,0.001133936457335949,0.11895424127578735,0.05629144608974457,-0.017798397690057755,0.08118326216936111,0.06130743771791458,0.1225084662437439,0.17648610472679138,0.07674452662467957,-0.11104941368103027,-0.07640766352415085,-0.018558885902166367]},{"text":"**Anxiety and depression**: Unemployment can lead to feelings of uncertainty, insecurity, and a lack of purpose, which can contribute to anxiety and depression.","event":7,"values":[0.019209852442145348,-0.04462628811597824,0.10716673731803894,0.04097510874271393,0.026168838143348694,0.10977939516305923,0.14463922381401062,0.20748144388198853,0.26402539014816284,0.05965736135840416,-0.1656450629234314,-0.12735989689826965,-0.04973515495657921]},{"text":"Young people may feel like they're losing their identity, and this can be especially challenging during a time of transition.","event":8,"values":[-0.021763725206255913,-0.09263379871845245,0.08804446458816528,0.014903998002409935,0.060618773102760315,0.1626313030719757,0.19967886805534363,0.28577107191085815,0.33717313408851624,0.08859114348888397,-0.22059214115142822,-0.18497930467128754,-0.09587126970291138]},{"text":"2. **Social isolation**: Unemployment can disrupt social connections and relationships, which are crucial for emotional well-being.","event":9,"values":[-0.015174007043242455,-0.07561791688203812,0.07830104231834412,0.0123038524761796,0.037438102066516876,0.1451106071472168,0.16735322773456573,0.2844846844673157,0.3305395841598511,0.09195882081985474,-0.2040916383266449,-0.17057766020298004,-0.07550770044326782]},{"text":"Young people may feel disconnected from friends, family, and community, leading to feelings of loneliness and isolation.","event":10,"values":[-0.0016185417771339417,-0.0457424633204937,0.06681856513023376,-0.004475429188460112,-0.0011642100289463997,0.13448801636695862,0.12883642315864563,0.29656797647476196,0.32843104004859924,0.1132793053984642,-0.203745037317276,-0.1632193624973297,-0.0688069611787796]},{"text":"3. **Loss of identity**: Unemployment can make it difficult for young people to define themselves and their place in the world.","event":11,"values":[0.030099881812930107,-0.020859766751527786,0.08939763158559799,0.012100845575332642,-0.03174253925681114,0.0970546156167984,0.08598406612873077,0.26681748032569885,0.295473575592041,0.10284823179244995,-0.17992037534713745,-0.1473408341407776,-0.04843052849173546]},{"text":"They may struggle to find meaning and purpose, leading to a sense of disorientation and restlessness.","event":12,"values":[0.01420641876757145,-0.05495587736368179,0.09105093032121658,0.00954069010913372,-0.0192265547811985,0.11993500590324402,0.1206059530377388,0.2897989749908447,0.32403895258903503,0.12191823124885559,-0.20284608006477356,-0.1744135171175003,-0.0709121972322464]},{"text":"4. **Substance abuse**: Some individuals may turn to substance use as a coping mechanism to escape the emotional pain and restlessness caused by unemployment.","event":13,"values":[0.008110277354717255,-0.09163303673267365,0.08344387263059616,0.018428009003400803,0.013764564879238605,0.15060488879680634,0.1556909680366516,0.2794596552848816,0.3385055661201477,0.11751827597618103,-0.21754273772239685,-0.18137307465076447,-0.09740443527698517]},{"text":"This can exacerbate mental health issues and create a vicious cycle.","event":14,"values":[-0.00965762510895729,-0.1095295399427414,0.05515288561582565,0.004822994582355022,0.038552962243556976,0.1734982132911682,0.1921512931585312,0.2776215076446533,0.35178861021995544,0.09963622689247131,-0.22096595168113708,-0.16198822855949402,-0.10190139710903168]},{"text":"5. **Impulsivity and risk-taking**: Unemployment can lead to a sense of desperation, which can manifest as impulsive behavior, such as reckless spending, substance abuse, or reckless driving.","event":15,"values":[0.022117512300610542,-0.07235938310623169,0.08749914169311523,0.0       const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
