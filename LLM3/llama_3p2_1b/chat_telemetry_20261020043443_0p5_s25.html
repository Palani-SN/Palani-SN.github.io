k and AI?","event":51,"values":[0.09391579031944275,0.09749914705753326,0.19994713366031647,0.07077458500862122,-0.05578352510929108,0.005374007858335972,-0.02132372185587883,0.07379066944122314,0.09187927842140198,-0.009638700634241104,-0.016908805817365646,0.007918376475572586,0.05522416532039642]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":52,"stop_reason":"end of turn","tail":"","sentences":[{"text":"I'm sitting in my small, cluttered apartment, surrounded by boxes and memories.","event":53,"values":[0.20358765125274658,-0.033256497234106064,-0.06418810784816742,-0.13672620058059692,-0.05197100713849068,0.059464260935783386,0.15100622177124023,0.23645183444023132,0.30747392773628235,0.18366360664367676,-0.2010267674922943,-0.15710189938545227,-0.09849132597446442]},{"text":"It's been three months since I lost my job due to company restructuring.","event":54,"values":[0.14734521508216858,-0.04858142137527466,-0.008135903626680374,-0.0972481220960617,-0.013266557827591896,0.08989505469799042,0.17338886857032776,0.257498562335968,0.32261914014816284,0.1700013279914856,-0.2452789545059204,-0.19499528408050537,-0.12105349451303482]},{"text":"I've tried to adjust to a new routine, but it's tough.","event":55,"values":[0.11606486886739731,-0.06941995024681091,-0.012509757652878761,-0.08315583318471909,-0.008936969563364983,0.10195428133010864,0.1764863133430481,0.279106080532074,0.36081886291503906,0.20661452412605286,-0.26913660764694214,-0.20905736088752747,-0.141069695353508]},{"text":"I've been applying to various jobs, but nothing seems to stick.","event":56,"values":[0.07139302045106888,-0.07285312563180923,0.024459658190608025,-0.03020182065665722,0.03957522660493851,0.12881162762641907,0.1754983812 ection or a sense of purpose.","event":67,"values":[-0.043947432190179825,-0.16704821586608887,-0.058028168976306915,-0.09872955083847046,0.0699496790766716,0.2325175702571869,0.22731170058250427,0.3987950086593628,0.4824787378311157,0.19567647576332092,-0.30248820781707764,-0.2246403694152832,-0.14974059164524078]},{"text":"I've tried to reach out to friends and family, but it's hard to connect with anyone when I'm feeling so low.","event":68,"values":[-0.06770023703575134,-0.12860658764839172,-0.041576188057661057,-0.08107204735279083,0.06631060689687729,0.2148277461528778,0.22312793135643005,0.4053688049316406,0.47969871759414673,0.17462646961212158,-0.30504029989242554,-0.21551650762557983,-0.14147093892097473]},{"text":"One day, I received an email from a local non-profit organization that's working with people who have been laid off.","event":69,"values":[0.011357579380273819,-0.06951463222503662,0.0029626116156578064,-0.0768185555934906,0.0226507019251585,0.15841682255268097,0.16602058708667755,0.3493722081184387,0.40957939624786377,0.178422749042511,-0.2849879562854767,-0.20413784682750702,-0.13690434396266937]},{"text":"They're offering free job training and counseling to help people get back on their feet.","event":70,"values":[0.07203388214111328,0.00766565278172493,0.04664459452033043,-0.05294671654701233,-0.004241665825247765,0.11007493734359741,0.1135811060667038,0.25168120861053467,0.3034474551677704,0.13222576677799225,-0.21459615230560303,-0.13986289501190186,-0.10329185426235199]},{"text":"I was hesitant at first, but something about it resonated with me.","event":71,"values":[0.10186319798231125,0.0525486022233963,0.10178793221712112,-0.011873263865709305,-0.001414082944393158,0.06917917728424072,0.08357200771570206,0.171747624874115,0.21123357117176056,0.09058687090873718,-0.16106964647769928,-0.1012219488620758,-0.07285023480653763]},{"text":"Maybe it was the idea of having a purpose again, or maybe it was the prospect of finally feeling like I'       for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
