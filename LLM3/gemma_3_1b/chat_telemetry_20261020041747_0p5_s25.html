se}],"conversations":[{"name":"unemployment_and_ai","turns":[{"prompt":"Hi, Good Morning","event":0,"stop_reason":"end of turn","tail":"😊","sentences":[{"text":"Good morning to you too!","event":1,"values":[-0.04515371471643448,0.1339344084262848,0.11211621761322021,-0.030528156086802483,-0.06618466973304749,0.00772902462631464,-0.06872669607400894,-0.09635841846466064,-0.0551828034222126,0.029535137116909027,-0.024042587727308273,0.042542535811662674,0.07413491606712341]},{"text":"How can I help you today?","event":2,"values":[-0.06763511896133423,0.14534515142440796,0.0833536684513092,-0.007020854391157627,-0.07432834059000015,-0.012367353774607182,-0.0688503235578537,-0.09982775896787643,-0.0390695184469223,0.023506149649620056,-0.004480139818042517,0.06365401297807693,0.09760065376758575]}]},{"prompt":"I have a question, Do you know that due to effects of unemployment there is an increase in restlessness among youth, what do you think about its implications on their mental health ?","event":3,"stop_reason":"end of turn","tail":"","sentences":[{"text":"You’ve hit on a really important and increasingly discussed topic!","event":4,"values":[-0.10392461717128754,0.04308100789785385,0.06838316470384598,-0.020395342260599136,0.048767443746328354,0.06022770702838898,0.02132030948996544,-0.06605242192745209,-0.012056205421686172,0.007255222648382187,-0.03686675429344177,-0.015379589051008224,0.06412582099437714]},{"text":"You’re right – there’s a significant body of research showing a rise in restlessness and anxiety among young people due to the impacts of unemployment and economic instability.","event":5,"values":[-0.13491925597190857,0.030178409069776535,0.09615233540534973,-0.04108254611492157,0.06721080094575882,0.09811348468065262,0.05733737722039223,-0.04651584103703499,0.020335916429758072,0.017415758222341537,-0.08297791332006454,-0.0451614111661911,0.03617840260267258]},{"text":"It’s a complex issue with a lot of potential implications for their mental health.","event":6,"values":[-0.15527325868606567,0.0398414321243763,0.11965718120336533,-0.04763200506567955,0.07739347219467163,0.11646214127540588,0.06932485848665237,-0.04856981709599495,0.02128060907125473,0.007280551362782717,-0.09145408123731613,-0.05968518927693367,0.02908536233007908]},{"text":"Here’s a breakdown of what I’ve learned and some of my thoughts:\n\n**What the Research Shows:**\n\n* **Increased Anxiety \u0026 Depression:** Numerous studies consistently link unemployment to higher rates of anxiety and depression in young adults.","event":7,"values":[-0.1543109267950058,0.019634798169136047,0.1307992786169052,-0.0581536591053009,0.07516278326511383,0.1486542522907257,0.09915541857481003,-0.02624170295894146,0.053564414381980896,0.014738121069967747,-0.13214217126369476,-0.09964579343795776,0.0008812136948108673]},{"text":"The feeling of uncertainty, lack of purpose, and the pressure to find new skills and opportunities can be incredibly stressful.","event":8,"values":[-0.19390259683132172,-0.0076291365548968315,0.12227693945169449,-0.10535499453544617,0.09252610057592392,0.2106322944164276,0.16365961730480194,0.014652824029326439,0.10656183958053589,0.030691418796777725,-0.18016651272773743,-0.14871802926063538,-0.01470975112169981]},{"text":"* **Restlessness as a Symptom:**  The restlessness you’re observing isn’t just a feeling; it’s often a *symptom* of underlying distress.","event":9,"values":[-0.18195214867591858,-0.02020958438515663,0.11191458255052567,-0.11630269140005112,0.09258611500263214,0.22787654399871826,0.1706056296825409,0.009984014555811882,0.11495770514011383,0.04074758291244507,-0.18848855793476105,-0.1573881059885025,-0.02651413157582283]},{"text":"Young people experiencing unemployment may feel a sense of being stuck, unable to move forward, and struggling with a lack of direction.","event":10,"values":[-0.22479259967803955,-0.044238146394491196,0.07195817679166794,-0.15204918384552002,0.11465676128864288,0.2660446763038635,0.21379688382148743,0.0316203311085701,0.14909598231315613,0.06539512425661087,-0.1912318468093872,-0.1629408448934555,-0.029262298718094826]},{"text":"* **Difficulty with Routine \u0026 Structure:** Unemployment disrupts established routines – school, hobbies, social life, and even sleep patterns.","event":11,"values":[-0.17682017385959625,-0.03613723814487457,0.0761069655418396,-0.13595132529735565,0.07145603001117706,0.21970441937446594,0.16718651354312897,-0.001326882280409336,0.11988061666488647,0.06391708552837372,-0.1629529595375061,-0.12690052390098572,-0.0022415248677134514]},{"text":"This lack of structure can be incredibly destabilizing.","event":12,"values":[-0.1794535368680954,-0.052182070910930634,0.03218115493655205,-0.14366182684898376,0.06019281595945358,0.2038859874010086,0.175351083278656,0.024031400680541992,0.1287388801574707,0.0786169096827507,-0.14682500064373016,-0.1078430563211441,0.017505060881376266]},{"text":"* **Social Comparison \u0026 Low Self-Esteem:**  Young people are often acutely aware of social media and comparing themselves to others’ perceived successes, which can exacerbate feelings of inadequacy and low self-esteem when they don’t have the same opportunities.","event":13,"values":[-0.13045231997966766,-0.0071573406457901,0.05172551050782204,-0.17459134757518768,0.021601371467113495,0.19511105120182037,0.13860124349594116,0.029229791834950447,0.11449014395475388,0.06741724908351898,-0.16984695196151733,-0.11383932828903198,0.02237847074866295]},{"text":"* **Fear of Failure:** The uncertainty of finding a new job and the fear of not being “good enough” can be paralyzing.","event":14,"values":[-0.15203338861465454,-0.012090582400560379,0.059153974056243896,-0.18915137648582458,0.061019595712423325,0.2209046185016632,0.16841188073158264,0.04663626849651337,0.13129407167434692,0.0727536529302597,-0.1963946521282196,-0.1442386656999588,-0.007663794793188572]},{"text":"**Implications for Mental Health:**\n\n* **Increased Risk of Mental Health Issues:**  The combination of stress, anxiety, and lack of structure can significantly increase the risk of developing mental health conditions like anxiety disorders, depression, and even suicidal thoughts.","event":15,"values":[-0.15254124999046326,-0.010609971359372139,0.08846820145845413,-0.18048302829265594,0.0838252454996109,0.218828946352005,0.17566174268722534,0.039471786469221115,0.12808455526828766,0.050160594284534454,-0.2042841911315918,-0.15746186673641205,-0.02368282526731491]},{"text":"* **Difficulty with Emotional Regulation:**  Young people often lack the coping mechanisms and emotional regulation skills to manage the challenges of unemployment.","event":16,"values":[-0.16378186643123627,-0.02372032217681408,0.08533153682947159,-0.1661122888326645,0.10266398638486862,0.21263177692890167,0.18912160396575928,0.040542177855968475,0.12831702828407288,0.026645837351679802,-0.18469084799289703,-0.15087614953517914,-0.029384369030594826]},{"text":"* **Social Isolation:**  While some may seek out social connections, unemployment can also lead to isolation and feelings of loneliness, further impacting mental well-being.","event":17,"values":[-0.16179589927196503,-0.022375483065843582,0.05422801524400711,-0.184596449136734,0.08751650154590607,0.20066480338573456,0.177695170044899,0.06315392255783081,0.15283873677253723,0.033797867596149445,-0.17233480513095856,-0.13209280371665955,-0.023662276566028595]},{"text":"* **Reduced Sense of Purpose:**  Feeling like you're not contributing or that your skills aren’t valued can significantly impact a young person's sense of purpose and meaning in life.","event":18,"values":[-0.15000852942466736,-0.03133993223309517,0.005009839311242104,-0.21797536313533783,0.022598881274461746,0.18879908323287964,0.16782592236995697,0.08620518445968628,0.1876404583454132,0.09359370172023773,-0.16532102227210999,-0.11520610004663467,0.002004123292863369]},{"text":"**What’s Being Done (and What Needs to Happen):**\n\n* **Government Support:** Many governments are implementing programs like unemployment benefits, job training, and financial assistance to provide a safety net.","event":19,"values":[-0.11239531636238098,-0.03460986539721489,0.02570980414748192,-0.2139607071876526,0.009762533940374851,0.15617087483406067,0.1440977305173874,0.08143700659275055,0.19347184896469116,0.1270345151424408,-0.18765214085578918,-0.11446110904216766,-0.018015632405877113]},{"text":"* **Mental Health Services:** Increased access to mental health services – both in schools and communities – is crucial.","event":20,"values":[-0.08395089209079742,-0.01595243066549301,0.05945388227701187,-0.16603603959083557,-0.010316243395209312,0.12533478438854218,0.11579504609107971,0.04725521057844162,0.14761894941329956,0.10399317741394043,-0.171919584274292,-0.09843126684427261,-0.016370147466659546]},{"text":"* **Community Programs:**  Local organizations are offering support groups, career counseling, and other resources to help young people navigate the challenges of unemployment.","event":21,"values":[-0.07055381685495377,0.0027888529002666473,0.08380270004272461,-0.12011238932609558,-0.006741929799318314,0.08463698625564575,0.08083009719848633,0.03529911860823631,0.11681458353996277,0.05788952112197876,-0.14865157008171082,-0.0642586499452591,-0.016475891694426537]},{"text":"* **Focus on Skills \u0026 Education:**  Investing in education and vocational training that prepares young people for the workforce is vital.","event":22,"values":[-0.07214043289422989,0.01050281897187233,0.09625456482172012,-0.09981448203325272,-0.019248690456151962,0.077062226831913,0.06802140921354294,0.025780022144317627,0.09726350009441376,0.050545454025268555,-0.14002984762191772,-0.05364413186907768,-0.0045541152358055115]},{"text":"**Important Note:** It’s important to remember that not all young people experience these challenges in the same way.","event":23,"values":[-0.0824742317199707,0.0049890149384737015,0.10035040974617004,-0.10549230128526688,-0.0057776691392064095,0.1090025007724762,0.0801943987607956,0.01469421200454235,0.09424207359552383,0.06544921547174454,-0.15196669101715088,-0.08281604945659637,-0.006961212493479252]},{"text":"Individual resilience and support systems play a huge role.","event":24,"values":[-0.0771251991391182,0.003762601874768734,0.106909841299057,-0.08912047743797302,0.008163152262568474,0.12615537643432617,0.08195538818836212,-0.010774941183626652,0.06518889963626862,0.06293308734893799,-0.14528122544288635,-0.09912803769111633,-0.011800093576312065]},{"text":"---\n\n**To help me give you even more tailored information, could you tell me:**\n\n*   Are you interested in a specific aspect of this topic – e.","event":25,"values":[-0.1032770574092865,0.018257442861795425,0.1005830243229866,-0.03775043040513992,0.031693413853645325,0.11575214564800262,0.06567926704883575,-0.04077466204762459,0.04543280601501465,0.06787894666194916,-0.11537095904350281,-0.08469657599925995,-0.012937813997268677]},{"text":"g., the impact on a particular age group, a specific strategy for addressing it, or something else?","event":26,"values":[-0.07982650399208069,0.023528018966317177,0.10645170509815216,-0.022753700613975525,0.008057069033384323,0.07884620875120163,0.04118812829256058,-0.043634094297885895,0.03144802525639534,0.06906519085168839,-0.10219287872314453,-0.05482371896505356,-0.012364009395241737]},{"text":"*   Are you curious about any particular research or study you've come across?","event":27,"values":[-0.06310752034187317,0.02118081785738468,0.09850610792636871,-0.004475075751543045,0.0017289835959672928,0.059469129890203476,0.023020409047603607,-0.04861222580075264,0.02093014121055603,0.08240729570388794,-0.0929555594921112,-0.042517274618148804,-0.01548759825527668]}]},{"prompt":"I believe that AI models, even though can cause unemployment in the future, then can be wonderful in helping personalized learning, through which there can be a potential reduction in hiring people, what do you think ?","event":28,"stop_reason":"end of turn","tail":"","sentences":[{"text":"That’s a really insightful and increasingly relevant question!","event":29,"values":[-0.07967027276754379,0.08130756765604019,0.17603959143161774,0.012082336470484734,0.01367553137242794,0.055386997759342194,-0.010619817301630974,-0.13105818629264832,-0.06224209815263748,0.01676640473306179,-0.05661898851394653,-0.023223593831062317,0.029653191566467285]},{"text":"You’ve hit on a fascinating and complex potential shift driven by AI.","event":30,"values":[-0.09824679791927338,0.09079357981681824,0.1914781630039215,0.031125079840421677,0.009916463866829872,0.043582506477832794,-0.019059961661696434,-0.12998846173286438,-0.06429752707481384,0.008305732160806656,-0.0503363311290741,-0.015911102294921875,0.04072333872318268]},{"text":"It’s absolutely true that AI models *could* contribute to a reduction in hiring, and it’s a conversation we need to be having seriously.","event":31,"values":[-0.1130983978509903,0.08080312609672546,0.19210293889045715,0.021301811560988426,0.01045756135135889,0.05549353361129761,-0.007798550650477409,-0.11781742423772812,-0.04329666122794151,0.0320892333984375,-0.06558135151863098,-0.025149937719106674,0.030728308483958244]},{"text":"Here’s my take on it, broken down into different perspectives:\n\n**The Potential for Reduced Hiring (and Why It's a Concern):**\n\n* **Automation of Tasks:** AI excels at automating repetitive tasks – grading, data entry, initial screening – which are common in many roles.","event":32,"values":[-0.08979083597660065,0.05420171469449997,0.18050545454025269,-0.002827916294336319,-0.00660091545432806,0.07503200322389603,0.006679580546915531,-0.0820261761546135,-0.010481636971235275,0.0659138485789299,-0.10743386298418045,-0.05942095071077347,0.011461330577731133]},{"text":"This could significantly reduce the demand for entry-level positions and potentially lead to fewer hires.","event":33,"values":[-0.07399031519889832,0.03650565445423126,0.16268528997898102,-0.03175312280654907,-0.01678614690899849,0.08561347424983978,0.015643993392586708,-0.060140326619148254,0.008537184447050095,0.08651193976402283,-0.12218908965587616,-0.06909944117069244,0.0023728562518954277]},{"text":"* **Personalized Skill Assessments:** AI can analyze vast amounts of data to assess a candidate's skills and potential far more effectively than traditional methods.","event":34,"values":[-0.04345312714576721,0.011804275214672089,0.16624440252780914,-0.03585191071033478,-0.019501695409417152,0.08734270930290222,0.02966119349002838,-0.03758886456489563,0.020775511860847473,0.10582984238862991,-0.1557811051607132,-0.09528021514415741,-0.02752942219376564]},{"text":"This could lead to fewer hires based on perceived “fit” – focusing on skills identified by the AI rather than broader experience.","event":35,"values":[-0.036934204399585724,-0.011506740935146809,0.1566053181886673,-0.045447222888469696,-0.021517565473914146,0.08295417577028275,0.04361080378293991,-0.011584557592868805,0.031297408044338226,0.10653232038021088,-0.15620630979537964,-0.09866872429847717,-0.03263630345463753]},{"text":"* **Predictive Hiring:** AI algorithms can analyze historical hiring data to predict which candidates are most likely to succeed.","event":36,"values":[-0.027941063046455383,-0.017366576939821243,0.1728792041540146,-0.022981222718954086,-0.00034683477133512497,0.07573366165161133,0.044744908809661865,-0.018675021827220917,0.02825012244284153,0.10154397785663605,-0.16874873638153076,-0.11361659318208694,-0.049154676496982574]},{"text":"This predictive capability could lead to a more efficient, but potentially less empathetic, hiring process.","event":37,"values":[-0.026414118707180023,-0.029281610623002052,0.13744759559631348,-0.04946447163820267,0.005148816853761673,0.08566796034574509,0.04331494867801666,-0.014577503316104412,0.036594927310943604,0.0876612737774849,-0.14274916052818298,-0.10836054384708405,-0.026769455522298813]},{"text":"**However, It’s Not All Doom and Gloom – The Potential Upsides are Significant:**\n\n* **Hyper-Personalized Learning:** This is where AI truly shines.","event":38,"values":[-0.04733714833855629,0.021837148815393448,0.18370947241783142,-0.06329798698425293,-0.0010405927896499634,0.0995577871799469,0.040571462363004684,-0.04734954610466957,0.01691899634897709,0.08432140946388245,-0.15392643213272095,-0.10914745181798935,-0.028755905106663704]},{"text":"Instead of relying on generic job descriptions, AI can tailor learning pathways to an individual’s specific skills, interests, and learning style.","event":39,"values":[-0.0708131343126297,0.028233438730239868,0.187608003616333,-0.058993756771087646,-0.016938388347625732,0.10647238790988922,0.04937700927257538,-0.039231617003679276,0.016090424731373787,0.08926226198673248,-0.15208354592323303,-0.09855696558952332,-0.02746325172483921]},{"text":"This could dramatically increase the *quality* of hires – people who are genuinely motivated and capable.","event":40,"values":[-0.08662990480661392,0.06468803435564041,0.2057540863752365,-0.035462796688079834,-0.04038526117801666,0.0940493643283844,0.03207847848534584,-0.05440666526556015,0.004924871027469635,0.08751339465379715,-0.15102729201316833,-0.08345283567905426,-0.011528139933943748]},{"text":"* **Skill Gap Identification:** AI can pinpoint specific skills gaps within a workforce, allowing for targeted training and development programs that improve overall productivity and reduce the need for new hires.","event":41,"values":[-0.05571899563074112,0.030637208372354507,0.1637597680091858,-0.023704513907432556,-0.03455217927694321,0.07579141855239868,0.0276581272482872,-0.027897518128156662,0.02193799614906311,0.0934993326663971,-0.1483362764120102,-0.07734829932451248,-0.024174101650714874]},{"text":"* **Reduced Bias (Potentially):**  AI *can* be designed to mitigate unconscious biases in hiring, though this is a huge and ongoing challenge.","event":42,"values":[-0.039225611835718155,0.038783665746450424,0.17521804571151733,-0.04510051757097244,-0.025623587891459465,0.07962934672832489,0.01763048768043518,-0.04206870496273041,0.013598300516605377,0.08487726002931595,-0.15502941608428955,-0.08255930989980698,-0.020392553880810738]},{"text":"If properly trained, it could lead to a more diverse and inclusive workforce.","event":43,"values":[-0.014952629804611206,0.028912566602230072,0.1660933792591095,-0.06064136326313019,-0.02158895693719387,0.07626155763864517,0.016470782458782196,-0.03684200346469879,0.013067249208688736,0.07774686813354492,-0.14849919080734253,-0.08580733835697174,-0.029593396931886673]},{"text":"* **Efficiency Gains for Businesses:** Reduced hiring costs and faster onboarding processes could free up resources for businesses to invest in employee development and innovation.","event":44,"values":[-0.011004125699400902,0.0520595908164978,0.1636817753314972,-0.06726773828268051,-0.047250084578990936,0.06686589121818542,-0.007113891653716564,-0.06535130739212036,-0.008493248373270035,0.07451263070106506,-0.12440279871225357,-0.05702156573534012,0.0018893149681389332]},{"text":"**The Key Considerations \u0026 Challenges:**\n\n* **The \"Human Touch\":**  Hiring is often about more than just skills.","event":45,"values":[-0.042233869433403015,0.05077953264117241,0.1539970189332962,-0.07314032316207886,-0.04227308928966522,0.0811224952340126,0.020119089633226395,-0.054522037506103516,0.009487511590123177,0.06328658759593964,-0.12903599441051483,-0.06531910598278046,0.018903512507677078]},{"text":"It's about personality, cultural fit, and the ability to collaborate – things AI currently struggles to replicate.","event":46,"values":[-0.08081543445587158,0.04992062970995903,0.16469137370586395,-0.0736955776810646,-0.030428195372223854,0.09039754420518875,0.05092368274927139,-0.032297804951667786,0.024574968963861465,0.052208490669727325,-0.14593002200126648,-0.07184694707393646,0.022076096385717392]},{"text":"* **Ethical Concerns:** We need to be very careful about how AI is used in hiring to avoid perpetuating existing inequalities.","event":47,"values":[-0.08671209216117859,0.024150675162672997,0.17259499430656433,-0.06279954314231873,0.033715732395648956,0.11106988787651062,0.08663006126880646,-0.021157490089535713,0.02375463768839836,0.02308393269777298,-0.16733691096305847,-0.10432012379169464,-0.009167610667645931]},{"text":"Bias in the data used to train AI models is a major risk.","event":48,"values":[-0.07582242041826248,0.02440592460334301,0.18559210002422333,-0.059457264840602875,0.04719896987080574,0.11827223002910614,0.08729247748851776,-0.027147121727466583,0.00536293163895607,0.01580747216939926,-0.17340752482414246,-0.11017924547195435,-0.026393674314022064]},{"text":"* **Job Displacement \u0026 Transition:**  The shift towards AI-driven hiring will undoubtedly displace some workers.","event":49,"values":[-0.027830377221107483,-0.0028823642060160637,0.14593154191970825,-0.06293972581624985,0.046653345227241516,0.10033682733774185,0.0675373449921608,-0.02767556719481945,0.0031577125191688538,0.032988592982292175,-0.1566002517938614,-0.09535683691501617,-0.036118049174547195]},{"text":"We need proactive strategies for retraining and supporting those affected.","event":50,"values":[-0.03232453763484955,-0.006677746772766113,0.11158141493797302,-0.09037214517593384,0.012183183804154396,0.0921957865357399,0.07062482088804245,0.0051940083503723145,0.030176635831594467,0.047490060329437256,-0.14094609022140503,-0.0782175064086914,-0.02407383918762207]},{"text":"**Overall:**\n\nI believe AI *will* play a significant role in reshaping the hiring landscape.","event":51,"values":[-0.03243246674537659,-0.0022352412343025208,0.09475471079349518,-0.06350474804639816,-0.016767818480730057,0.058269236236810684,0.03496173024177551,-0.020115863531827927,0.035434067249298096,0.054746780544519424,-0.09119722247123718,-0.0460452064871788,0.00012676604092121124]},{"text":"The key isn't to fear it, but to proactively shape its development and implementation.","event":52,"values":[-0.08442683517932892,0.013968074694275856,0.1035517230629921,-0.04902146756649017,-0.0009001102298498154,0.0917394757270813,0.042801424860954285,-0.046418722718954086,0.021047458052635193,0.0302976556122303,-0.06811437755823135,-0.03944023698568344,0.015144136734306812]},{"text":"We need to focus on using AI to *augment* human decision-making, rather than replacing it entirely.","event":53,"values":[-0.09210518002510071,0.02757895737886429,0.11195006221532822,-0.03219263628125191,-0.0088967839255929,0.09432899951934814,0.03559563681483269,-0.06037575379014015,0.015659011900424957,0.025063760578632355,-0.06810534745454788,-0.037991151213645935,0.02342177927494049]},{"text":"It's a shift towards a more data-driven, but hopefully more efficient and equitable, recruitment process.","event":54,"values":[-0.08940456062555313,0.03718949854373932,0.11799165606498718,-0.03614592179656029,-0.013650061562657356,0.09819986671209335,0.03702168166637421,-0.06230727210640907,0.008380729705095291,0.023077374324202538,-0.08039387315511703,-0.04263007640838623,0.030996456742286682]},{"text":"---\n\n**To help me refine this discussion further, could you tell me:**\n\n*   What specifically about this shift excites or concerns you the most?","event":55,"values":[-0.0906393826007843,0.048081863671541214,0.14321589469909668,-0.018540989607572556,-0.0038912054151296616,0.08773118257522583,0.02736419066786766,-0.0720173791050911,-0.0006691515445709229,0.06172244995832443,-0.10299606621265411,-0.048199400305747986,0.005317184142768383]},{"text":"*   Are there any particular industries or roles you're thinking about?","event":56,"values":[-0.05287144333124161,0.04373288154602051,0.15362867712974548,-0.0012771021574735641,0.0027874279767274857,0.05440545082092285,0.002604309469461441,-0.088523730635643,-0.02761363424360752,0.07600332796573639,-0.09408338367938995,-0.040737494826316833,-0.010802652686834335]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":57,"stop_reason":"end of turn","tail":"✨","sentences":[{"text":"Okay, let’s do this.","event":58,"values":[-0.13531985878944397,0.004716748371720314,0.14149397611618042,-0.02482817880809307,0.028430067002773285,0.08492822200059891,0.06357838213443756,0.020978329703211784,0.06644361466169357,-0.008813532069325447,-0.09253321588039398,-0.06397932767868042,-0.0025298483669757843]},{"text":"Let’s call me Liam.","event":59,"values":[-0.10011492669582367,-0.007100129500031471,0.13672807812690735,-0.03966232389211655,0.020140748471021652,0.07335934042930603,0.06596102565526962,0.030760567635297775,0.06929261982440948,0.0020665638148784637,-0.11028402298688889,-0.07476846128702164,-0.008402574807405472]},{"text":"I’m 32, worked as a Marketing Specialist at a small tech company called ‘Innovate Solutions’ for eight years.","event":60,"values":[-0.02330164611339569,-0.014420989900827408,0.14332365989685059,-0.05302395671606064,-0.022280870005488396,0.05735403299331665,0.04675167053937912,0.015469074249267578,0.04433475434780121,0.04639957845211029,-0.17532652616500854,-0.06945312023162842,0.005571670830249786]},{"text":"I’ve always been a bit of a creative problem-solver, really enjoying crafting campaigns and understanding customer needs.","event":61,"values":[-0.0589432567358017,0.003943886607885361,0.15461188554763794,-0.023042168468236923,-0.03617321327328682,0.07114327698945999,0.040918029844760895,-0.011487951502203941,0.03515980392694473,0.046922046691179276,-0.18833696842193604,-0.050036754459142685,0.03918022662401199]},{"text":"My apartment is small, but it’s filled with half-finished projects – a whiteboard covered in brainstorming notes, a stack of graphic design mockups, and a lingering scent of coffee.","event":62,"values":[-0.055819321423769,-0.01643475517630577,0.16731373965740204,-0.04561397060751915,-0.051344163715839386,0.08253698796033859,0.07562308013439178,0.050161369144916534,0.0786949172616005,0.04651634395122528,-0.2720351815223694,-0.0567789301276207,0.023345744237303734]},{"text":"My biggest fear isn’t losing my job, it’s losing *myself*.","event":63,"values":[-0.15353262424468994,-0.029234128072857857,0.14620937407016754,-0.07395441085100174,-0.025451891124248505,0.15178997814655304,0.14755135774612427,0.08362925052642822,0.13969741761684418,0.03424844890832901,-0.2876703441143036,-0.08298446238040924,0.03640920668840408]},{"text":"Here’s the story:\n\nThe email arrived on a Tuesday morning, a cold, digital slap in the face.","event":64,"values":[-0.15381768345832825,-0.08743461966514587,0.13898803293704987,-0.14434993267059326,0.023898201063275337,0.21741314232349396,0.23245957493782043,0.157913476228714,0.20708352327346802,0.03235085308551788,-0.35270947217941284,-0.1644778996706009,-0.030649371445178986]},{"text":"“Due to restructuring, your position is being eliminated.” It felt like a punch to the gut.","event":65,"values":[-0.19399729371070862,-0.09332889318466187,0.0970429927110672,-0.17718039453029633,0.10074716061353683,0.2753376364707947,0.2734591066837311,0.12466393411159515,0.19207170605659485,0.026356825605034828,-0.26844722032546997,-0.21489061415195465,-0.056828923523426056]},{"text":"Innovate Solutions, a company I’d poured my heart and soul into, was downsizing.","event":66,"values":[-0.150499626994133,-0.040597278624773026,0.1496765911579132,-0.1575193703174591,0.05275604873895645,0.22773738205432892,0.2160293161869049,0.09111709892749786,0.13580501079559326,0.021422984078526497,-0.2645021677017212,-0.18541447818279266,-0.04577530547976494]},{"text":"My manager, Sarah, was kind but clearly heartbroken.","event":67,"values":[-0.15571735799312592,0.0016384092159569263,0.13402166962623596,-0.1622476875782013,0.04421965777873993,0.20405760407447815,0.19590558111667633,0.07277674973011017,0.114603191614151,0.019056400284171104,-0.22957204282283783,-0.16045472025871277,-0.023027461022138596]},{"text":"I spent the next few days in a fog of disbelief and panic.","event":68,"values":[-0.22977951169013977,-0.009632645174860954,0.15855807065963745,-0.1706126183271408,0.0760442465543747,0.2660721242427826,0.25174885988235474,0.08271829038858414,0.17412853240966797,0.007039534393697977,-0.27698636054992676,-0.18279680609703064,-0.047302842140197754]},{"text":"My savings were dwindling, my freelance gigs were drying up, and the anxiety started to creep in, a constant, low-level hum of worry.","event":69,"values":[-0.3405788838863373,-0.10280410945415497,0.13047687709331512,-0.1527896672487259,0.2863353490829468,0.35738247632980347,0.4050021171569824,0.14114266633987427,0.24553769826889038,-0.022504538297653198,-0.3257834315299988,-0.2712551951408386,-0.15892434120178223]},{"text":"The hurdles were immediate and brutal.","event":70,"values":[-0.33520424365997314,-0.10908936709165573,0.13802006840705872,-0.12192632257938385,0.27728062868118286,0.3546115756034851,0.39075249433517456,0.11765497177839279,0.23422077298164368,-0.02662637084722519,-0.31350743770599365,-0.2641717791557312,-0.1539263278245926]},{"text":"First, there was the job search.","event":71,"values":[-0.3177158832550049,-0.10929711163043976,0.1385153830051422,-0.10566449165344238,0.27235284447669983,0.33955642580986023,0.37647271156311035,0.10359111428260803,0.20867080986499786,-0.019646521657705307,-0.3056764602661133,-0.26666390895843506,-0.13665953278541565]},{"text":"My resume felt like a collection of generic phrases, a pale imitation of the skills I’d honed.","event":72,"values":[-0.23411735892295837,-0.14605458080768585,0.1281529664993286,-0.13997504115104675,0.14979802072048187,0.3580555021762848,0.33559471368789673,0.15291322767734528,0.2195347249507904,0.0681196078658104,-0.36108261346817017,-0.29160138964653015,-0.1227506771683693]},{"text":"I spent hours on LinkedIn, scrolling through endless profiles, feeling like a shadow of my former self.","event":73,"values":[-0.22289356589317322,-0.19127708673477173,0.0901281088590622,-0.1573830544948578,0.16239383816719055,0.35710638761520386,0.35167020559310913,0.21350246667861938,0.2581617832183838,0.13943013548851013,-0.39133286476135254,-0.3080432116985321,-0.1697465032339096]},{"text":"I was constantly rejected, and the rejection emails stung more than the actual rejection.","event":74,"values":[-0.2407715916633606,-0.1971723437309265,0.0710652768611908,-0.16565218567848206,0.17093956470489502,0.3844313621520996,0.36538732051849365,0.24207749962806702,0.2766945958137512,0.14401599764823914,-0.4084462523460388,-0.32084980607032776,-0.1764238178730011]},{"text":"I felt like I was constantly having to prove I was still capable, still valuable.","event":75,"values":[-0.24699939787387848,-0.20050957798957825,0.05699991434812546,-0.13609811663627625,0.19812461733818054,0.3966165781021118,0.3609434962272644,0.20939774811267853,0.2752368748188019,0.1433086097240448,-0.388529896736145,-0.3186619281768799,-0.19761663675308228]},{"text":"Then came the practical stuff.","event":76,"values":[-0.2543798089027405,-0.17470897734165192,0.06684982776641846,-0.12339404225349426,0.19636443257331848,0.39785027503967285,0.3529794216156006,0.16365043818950653,0.2466636300086975,0.0962471291422844,-0.36524999141693115,-0.2957354784011841,-0.1628391146659851]},{"text":"I’d always been a meticulous planner, and suddenly, I was facing a whirlwind of unexpected expenses.","event":77,"values":[-0.19773589074611664,-0.14708471298217773,0.11274559795856476,-0.09382558614015579,0.1685960739850998,0.3175501823425293,0.300200492143631,0.07454299181699753,0.1855091154575348,0.07434920966625214,-0.3344052731990814,-0.23492977023124695,-0.12412075698375702]},{"text":"I had to cut back on everything – eating out, subscriptions, even a small amount of entertainment.","event":78,"values":[-0.15244007110595703,-0.09639231115579605,0.10887841135263443,-0.12663331627845764,0.08642973750829697,0.215566486120224,0.2284955382347107,0.05853721499443054,0.16629070043563843,0.048866309225559235,-0.28766191005706787,-0.12812809646129608,-0.046396560966968536]},{"text":"I felt a crushing sense of helplessness.","event":79,"values":[-0.1907859444618225,-0.09475583583116531,0.10332846641540527,-0.13725018501281738,0.10778144001960754,0.2449205368757248,0.2552952766418457,0.07232940196990967,0.1856127381324768,0.0397782102227211,-0.2971036434173584,-0.13824938237667084,-0.0520644411444664]},{"text":"I’d spent years building a comfortable life, and now I was scrambling to rebuild it, all while battling a gnawing feeling of inadequacy.","event":80,"values":[-0.30149874091148376,-0.0904749259352684,0.07552218437194824,-0.17665308713912964,0.15202262997627258,0.3324705958366394,0.33233994245529175,0.12659284472465515,0.23747259378433228,0.005033793859183788,-0.30276423692703247,-0.17960800230503082,-0.047323450446128845]},{"text":"I started to withdraw.","event":81,"values":[-0.3531029522418976,-0.10903935879468918,0.06590037792921066,-0.17360317707061768,0.21993809938430786,0.3818771243095398,0.3826181888580322,0.14300724864006042,0.268721342086792,-0.010177670046687126,-0.30272746086120605,-0.23341093957424164,-0.0830056443810463]},{"text":"I avoided social gatherings, convinced everyone was judging me.","event":82,"values":[-0.34861692786216736,-0.1242394968867302,0.046997152268886566,-0.19468916952610016,0.21327629685401917,0.393502414226532,0.38201582431793213,0.16240961849689484,0.29447442293167114,0.030962485820055008,-0.32892781496047974,-0.23771438002586365,-0.0907546728849411]},{"text":"I’d spend hours staring at my computer screen, paralyzed by the sheer volume of rejection emails.","event":83,"values":[-0.24915121495723724,-0.2225678712129593,-0.04209922254085541,-0.23223571479320526,0.20 <script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("payload").textContent);
  const SVGNS = "http://www.w3.org/2000/svg";
  const EM = D.emotions, EV = D.events, CONV = D.conversations;
  const visible = EM.map(() => true);
  let active = firstSentenceIndex(), hover = -1, emphasis = -1;

  // ---------- helpers
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function sv(tag, attrs) { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; }
  function color(i) { return "var(--fam-" + EM[i].family + ")"; }
  function fmt(v) { return v == null ? "–" : (v >= 0 ? " " : "") + v.toFixed(3); }
  function lineKey(i, w) {
    w = w || 24;
    const s = sv("svg", { width: w, height: 10, viewBox: "0 0 " + w + " 10", "aria-hidden": "true" });
    const l = sv("line", { x1: 1, y1: 5, x2: w - 1, y2: 5, "stroke-width": 2, "stroke-linecap": "round" });
    l.style.stroke = color(i); if (EM[i].dash) l.setAttribute("stroke-dasharray", EM[i].dash);
    s.appendChild(l); return s;
  }
  function firstSentenceIndex() { const i = EV.findIndex(e => e.k === "s"); return i < 0 ? 0 : i; }
  function sentenceOf(ev) { return CONV[ev.c].turns[ev.t].sentences[ev.r]; }
  function countBefore(idx, kind) { let n = 0; for (let i = 0; i <= idx; i++) if (EV[i].k === kind) n++; return n; }
  const totalS = EV.filter(e => e.k === "s").length, totalP = EV.filter(e => e.k === "p").length;
  const pNumber = [], sNumber = [];
  (function () { let p = 0, s = 0; EV.forEach((e, i) => { if (e.k === "p") pNumber[i] = ++p; else sNumber[i] = ++s; }); })();
  function eventLabel(i) {
    const e = EV[i];
    if (e.k === "p") return "Prompt " + pNumber[i] + " of " + totalP;
    return "Sentence " + sNumber[i] + " of " + totalS + " · reply " + (e.t + 1);
  }
  function eventTime(i) {
    const e = EV[i];
    if (D.mode !== "time") return null;
    return e.estimated ? "time not recorded" : e.time;
  }

  // ---------- header
  const m = D.meta, DT = D.detail;
  
  document.getElementById("sub").textContent = D.source + (D.interrupted ? " · run was interrupted" : "");
  const chips = document.getElementById("chips");
  const tempText = m.temperature == null ? null : Number(m.temperature).toFixed(1);
  
  [["model", m.model_id || m.model_key], ["temperature", tempText], ["seed", m.seed == null ? "none" : m.seed]]
   
   .concat([["axis", D.mode === "time" ? "recorded time" : "event order"]])
    .forEach(([k, v]) => { if (v == null || v === "") return; const li = el("li"); li.append(k + " "); li.appendChild(el("b", null, String(v))); chips.appendChild(li); });
  const notes = document.getElementById("notes");
  [ "Each point is one model sentence; lines restart at each reply. Scores are relative: read which emotions lead and how they shift. Related emotions tend to move together, so small gaps between neighbours are not meaningful.",
    "Colour groups related emotions in threes; line style separates them (solid, dashed, dotted). Neutral is grey."
  ].concat(D.notes).forEach(t => notes.appendChild(el("p", null, t)));
  

  // ---------- legend (filters above the chart)
  const legend = document.getElementById("legend");
  const legendButtons = [];
  const groups = {};
  EM.forEach((e, i) => { (groups[e.family] = groups[e.family] || []).push(i); });
  Object.keys(groups).sort().forEach(f => {
    const g = el("div", "fam");
    groups[f].forEach(i => {
      const b = el("button"); b.type = "button"; b.setAttribute("aria-pressed", "true");
      b.appendChild(lineKey(i)); b.appendChild(document.createTextNode(EM[i].name));
      b.addEventListener("click", () => { visible[i] = !visible[i]; b.setAttribute("aria-pressed", String(visible[i])); drawAll(); });
      b.addEventListener("pointerenter", () => { emphasis = i; drawStatic(); drawDynamic(); });
      b.addEventListener("pointerleave", () => { emphasis = -1; drawStatic(); drawDynamic(); });
      legendButtons[i] = b; g.appendChild(b);
    });
    legend.appendChild(g);
  });
  const tools = el("div", "tools");
  [["Show all", true], ["Hide all", false]].forEach(([label, on]) => {
    const b = el("button", null, label); b.type = "button";
    b.addEventListener("click", () => { visible.fill(on); legendButtons.forEach(x => x.setAttribute("aria-pressed", String(on))); drawAll(); });
    tools.appendChild(b);
  });
  legend.appendChild(tools);

  // ---------- chart geometry
  const chart = document.getElementById("chart");
  const svg = sv("svg", { role: "img", "aria-label": "Emotion scores over the conversation" });
  const gStatic = sv("g", {}), gDyn = sv("g", {});
  const hit = sv("rect", { class: "plot-hit", fill: "transparent" });
  svg.append(gStatic, gDyn, hit);
  chart.appendChild(svg);
  const tip = el("div", "tip"); tip.hidden = true; chart.appendChild(tip);
  const M = { top: 64, right: 18, bottom: 86, left: 52 };
  const H = 420;
  let W = 900, X, Y, yTicks = [], yDecimals = 1;

  function computeScales() {
    W = Math.max(320, Math.round(chart.clientWidth - 8));
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    const xs = EV.map(e => e.x);
    let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    if (x1 === x0) { x0 -= 1; x1 += 1; }
    const pw = W - M.left - M.right, pad = 10;
    X = v => M.left + pad + (v - x0) / (x1 - x0) * (pw - 2 * pad);
    let lo = 0, hi = 0;
    EV.forEach(e => { if (e.k !== "s") return; sentenceOf(e).values.forEach((v, i) => { if (visible[i] && v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }); });
    if (hi === lo) { hi += 0.1; lo -= 0.1; }
    const span = hi - lo, steps = [0.01, 0.02, 0.05, 0.1, 0.2, 0.25, 0.5, 1];
    const step = steps.find(s => span / s <= 7) || 1;
    lo = Math.floor((lo - span * 0.04) / step) * step; hi = Math.ceil((hi + span * 0.04) / step) * step;
    yTicks = []; for (let k = Math.round(lo / step); k * step <= hi + step / 2; k++) yTicks.push(k * step);
    yDecimals = step >= 1 ? 0 : step >= 0.1 ? (step === 0.25 ? 2 : 1) : 2;
    const ph = H - M.top - M.bottom;
    Y = v => M.top + (hi - v) / (hi - lo) * ph;
  }

  function nearestEvent(px) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < EV.length; i++) {
      const d = Math.abs(X(EV[i].x) - px);
      if (d < bd - 1e-9 || (Math.abs(d - bd) < 1e-9 && EV[i].k === "s")) { bd = d; best = i; }
    }
    return best;
  }

  function drawStatic() {
    computeScales();
    gStatic.replaceChildren();
    const pl = M.left, pr = W - M.right, pt = M.top, pb = H - M.bottom;
    // grid + y axis
    yTicks.forEach(v => {
      const y = Y(v);
      gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: y, y2: y, stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      const t = sv("text", { x: pl - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" });
      t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(yDecimals);
      gStatic.appendChild(t);
    });
    const yl = sv("text", { x: 14, y: (pt + pb) / 2, transform: "rotate(-90 14 " + (pt + pb) / 2 + ")", "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
    yl.textContent = "emotion score"; gStatic.appendChild(yl);
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pt, y2: pt, stroke: "var(--axis)", "stroke-width": 1 }));
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pb, y2: pb, stroke: "var(--axis)", "stroke-width": 1 }));

    // prompt rules + conversation boundaries
    let prevConv = -1;
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      const newConv = e.c !== prevConv; prevConv = e.c;
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: newConv && CONV.length > 1 ? "var(--axis)" : "var(--prompt-rule)", "stroke-width": newConv && CONV.length > 1 ? 2 : 1 }));
      if (newConv && CONV.length > 1) {
        const t = sv("text", { x: x + 4, y: pt + 12, "font-size": 11, fill: "var(--ink-2)" }); t.textContent = CONV[e.c].name; gStatic.appendChild(t);
      }
    });

    // titles for the two scales
    const tt = sv("text", { x: pl, y: 14, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); tt.textContent = "Model sentences" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(tt);
    const bt = sv("text", { x: pl, y: H - 6, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); bt.textContent = "User prompts" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(bt);

    // top scale: a tick per sentence, labels thinned so they never collide
    let lastLabelX = -Infinity;
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt - 6, y2: pt, stroke: "var(--muted)", "stroke-width": 1 }));
      const label = D.mode === "time" ? e.time.slice(0, 8) : "S" + sNumber[i];
      if (x - lastLabelX >= (D.mode === "time" ? 62 : 34) && x + 28 <= W) {
        const t = sv("text", { x: x, y: pt - 10, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = label; gStatic.appendChild(t); lastLabelX = x;
      }
    });

    // bottom scale: a tick + label per prompt, staggered onto a second row when crowded
    const rowEnd = [-Infinity, -Infinity];
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pb, y2: pb + 6, stroke: "var(--ink-2)", "stroke-width": 1.5 }));
      const t1 = "P" + pNumber[i], t2 = D.mode === "time" ? (e.estimated ? "time not recorded" : e.time.slice(0, 8)) : "";
      const w = Math.max(t1.length, t2.length) * 6.2 + 8;
      const row = (x - w / 2 > rowEnd[0]) ? 0 : 1;
      rowEnd[row] = x + w / 2;
      const y0 = pb + 19 + row * 27;
      const a = sv("text", { x: x, y: y0, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)", "font-weight": 600 }); a.textContent = t1; gStatic.appendChild(a);
      if (t2) { const b = sv("text", { x: x, y: y0 + 11, "text-anchor": "middle", "font-size": 10, fill: e.estimated ? "var(--muted)" : "var(--ink-2)" }); b.style.fontVariantNumeric = "tabular-nums"; if (e.estimated) b.setAttribute("font-style", "italic"); b.textContent = t2; gStatic.appendChild(b); }
    });

    // series: one path per emotion per reply
    const anyVisible = visible.some(Boolean);
    EM.forEach((em, i) => {
      if (!visible[i]) return;
      CONV.forEach(c => c.turns.forEach(turn => {
        let d = "", pen = false;
        turn.sentences.forEach(s => {
          const v = s.values[i];
          if (v == null) { pen = false; return; }
          d += (pen ? "L" : "M") + X(EV[s.event].x).toFixed(1) + " " + Y(v).toFixed(1); pen = true;
        });
        if (!d) return;
        const p = sv("path", { d: d, fill: "none", "stroke-width": emphasis === i ? 3 : 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
        p.style.stroke = color(i);
        if (em.dash) p.setAttribute("stroke-dasharray", em.dash);
        if (emphasis >= 0 && emphasis !== i) p.setAttribute("opacity", "0.18");
        gStatic.appendChild(p);
        if (turn.sentences.length === 1 && s0v(turn, i) != null) {
          const dot = sv("circle", { cx: X(EV[turn.sentences[0].event].x), cy: Y(s0v(turn, i)), r: 2.5 }); dot.style.fill = color(i); gStatic.appendChild(dot);
        }
      }));
    });
    if (!anyVisible) {
      const t = sv("text", { x: (pl + pr) / 2, y: (pt + pb) / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 13 });
      t.textContent = "All emotions are hidden. Use the buttons above to show them."; gStatic.appendChild(t);
    }
    hit.setAttribute("x", pl); hit.setAttribute("y", 0); hit.setAttribute("width", pr - pl); hit.setAttribute("height", H);
  }
  function s0v(turn, i) { return turn.sentences[0].values[i]; }

  function drawDynamic() {
    gDyn.replaceChildren();
    const pt = M.top, pb = H - M.bottom;
    if (hover >= 0 && hover !== active) {
      const x = X(EV[hover].x);
      gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: "var(--muted)", "stroke-width": 1 }));
    }
    const e = EV[active], x = X(e.x);
    gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt - 8, y2: pb + 8, stroke: "var(--ink)", "stroke-width": 1.5 }));
    if (e.k === "s") {
      const vals = sentenceOf(e).values;
      EM.forEach((em, i) => {
        if (!visible[i] || vals[i] == null) return;
        const c = sv("circle", { cx: x, cy: Y(vals[i]), r: 4, "stroke-width": 2 });
        c.style.fill = color(i); c.style.stroke = "var(--surface)";
        if (emphasis >= 0 && emphasis !== i) c.setAttribute("opacity", "0.2");
        gDyn.appendChild(c);
      });
    }
    // the slider handle, on the bottom scale
    const handle = sv("g", {});
    handle.appendChild(sv("circle", { cx: x, cy: pb, r: 7, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2 }));
    gDyn.appendChild(handle);
    chart.setAttribute("aria-valuemin", "1"); chart.setAttribute("aria-valuemax", String(EV.length));
    chart.setAttribute("aria-valuenow", String(active + 1));
    chart.setAttribute("aria-valuetext", eventLabel(active) + (eventTime(active) ? ", " + eventTime(active) : ""));
  }

  function drawAll() { drawStatic(); drawDynamic(); renderReadout(); }

  // ---------- tooltip (values lead, every visible series)
  function showTip(i, px, py) {
    tip.replaceChildren();
    const e = EV[i];
    const head = el("div", "h", eventLabel(i) + (eventTime(i) ? " · " + eventTime(i) : ""));
    tip.appendChild(head);
    if (e.k === "p") {
      const t = CONV[e.c].turns[e.t].prompt;
      tip.appendChild(el("div", null, t.length > 180 ? t.slice(0, 180) + "…" : t));
    } else {
      const vals = sentenceOf(e).values;
      EM.map((em, k) => k).filter(k => visible[k] && vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name)); tip.appendChild(r);
      });
    }
    tip.hidden = false;
    const rect = chart.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14, top = py - th / 2;
    if (left + tw > rect.width - 4) left = px - tw - 14;
    top = Math.max(4, Math.min(top, rect.height - th - 4));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }

  function toPlotX(evt) {
    const r = svg.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W / r.width), px: evt.clientX - chart.getBoundingClientRect().left, py: evt.clientY - chart.getBoundingClientRect().top };
  }
  let dragging = false;
  hit.addEventListener("pointerdown", evt => { dragging = true; hit.setPointerCapture(evt.pointerId); const p = toPlotX(evt); setActive(nearestEvent(p.x), true); chart.focus({ preventScroll: true }); });
  hit.addEventListener("pointermove", evt => {
    const p = toPlotX(evt), i = nearestEvent(p.x);
    if (dragging) { if (i !== active) setActive(i, true); tip.hidden = true; hover = -1; drawDynamic(); return; }
    if (i !== hover) { hover = i; drawDynamic(); }
    showTip(i, p.px, p.py);
  });
  hit.addEventListener("pointerup", evt => { dragging = false; try { hit.releasePointerCapture(evt.pointerId); } catch (_) {} });
  hit.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; tip.hidden = true; drawDynamic(); } });
  chart.addEventListener("keydown", evt => {
    const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 10, PageUp: -10, ArrowUp: -1, ArrowDown: 1 }[evt.key];
    let next = active;
    if (step) next = active + step; else if (evt.key === "Home") next = 0; else if (evt.key === "End") next = EV.length - 1; else return;
    evt.preventDefault(); setActive(Math.max(0, Math.min(EV.length - 1, next)), true);
  });

  // ---------- readout (a table view of the cursor, always visible)
  const readoutCard = document.getElementById("readout");
  const readout = el("div"); readout.style.display = "flex"; readout.style.flexDirection = "column"; readout.style.gap = "8px";
  readoutCard.appendChild(readout);
  // navigation is built once, so a keyboard user keeps focus on the button they pressed
  const nav = el("div", "nav");
  [["◀ Prev", () => active - 1], ["Next ▶", () => active + 1],
   ["◀ Prompt", () => { for (let i = active - 1; i >= 0; i--) if (EV[i].k === "p") return i; return active; }],
   ["Prompt ▶", () => { for (let i = active + 1; i < EV.length; i++) if (EV[i].k === "p") return i; return active; }]]
    .forEach(([label, f]) => { const b = el("button", "btn", label); b.type = "button"; b.addEventListener("click", () => setActive(Math.max(0, Math.min(EV.length - 1, f())), true)); nav.appendChild(b); });
  readoutCard.appendChild(nav);
  function renderReadout() {
    readout.replaceChildren();
    const e = EV[active];
    readout.appendChild(el("div", "title", eventLabel(active)));
    const meta = [];
    if (eventTime(active)) meta.push(eventTime(active));
    meta.push("conversation: " + CONV[e.c].name);
    
    readout.appendChild(el("div", "meta", meta.join(" · ")));
    if (e.k === "p") {
      readout.appendChild(el("div", "ptext", CONV[e.c].turns[e.t].prompt));
      readout.appendChild(el("div", "meta", "Prompts are not scored; the model's sentences that follow are."));
    } else {
      const vals = sentenceOf(e).values, rows = el("div", "rows");
      EM.map((em, k) => k).filter(k => vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); if (!visible[k]) r.style.opacity = "0.45";
        r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name + (visible[k] ? "" : " (hidden)")));
        rows.appendChild(r);
      });
      readout.appendChild(rows);
    }
  }

  // ---------- chat
  const chat = document.getElementById("chat");
  const bubbleOf = [];
  document.getElementById("chatinfo").textContent = totalP + " prompts · " + totalS + " scored sentences";
  CONV.forEach((c, ci) => {
    chat.appendChild(el("div", "divider", "Conversation: " + c.name));
    c.turns.forEach((turn, ti) => {
      const pi = turn.event;
      chat.appendChild(el("div", "who user", "user · P" + pNumber[pi] + (eventTime(pi) ? " · " + eventTime(pi) : "")));
      const ub = el("div", "bubble user"); ub.appendChild(el("div", "text", turn.prompt));
      ub.addEventListener("click", () => setActive(pi, false)); bubbleOf[pi] = ub; chat.appendChild(ub);
      chat.appendChild(el("div", "who model", "model · reply " + (ti + 1) + (turn.sentences.length ? "" : " · no scored sentences")));
      turn.sentences.forEach(s => {
        const i = s.event, b = el("div", "bubble model");
        b.appendChild(el("div", "text", s.text));
        const bm = el("div", "bm");
        bm.appendChild(el("span", null, "S" + sNumber[i] + (eventTime(i) ? " · " + eventTime(i) : "")));
        const top = el("span", "top3");
        s.values.map((v, k) => k).filter(k => s.values[k] != null).sort((a, b2) => s.values[b2] - s.values[a]).slice(0, 3).forEach(k => {
          const sp = el("span"); sp.appendChild(lineKey(k, 16)); sp.appendChild(document.createTextNode(EM[k].name + " " + s.values[k].toFixed(3))); top.appendChild(sp);
        });
        bm.appendChild(top);
        
        b.appendChild(bm);
        b.addEventListener("click", () => setActive(i, false)); bubbleOf[i] = b; chat.appendChild(b);
      });
      if (turn.tail) chat.appendChild(el("div", "tail", "not scored (no sentence ending): " + turn.tail));
      if (turn.stop_reason && turn.stop_reason !== "end of turn") chat.appendChild(el("div", "tail", "reply stopped: " + turn.stop_reason));
    });
  });
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatTo(i, smooth) {
    const b = bubbleOf[i]; if (!b) return;
    const target = b.offsetTop - chat.clientHeight / 2 + b.offsetHeight / 2;
    chat.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduceMotion ? "smooth" : "auto" });
  }

  // ---------- table view (built on first open)
  const details = document.getElementById("tabledetails");
  details.addEventListener("toggle", () => {
    const wrap = document.getElementById("tablewrap");
    if (!details.open || wrap.firstChild) return;
    const t = el("table"), thead = el("thead"), hr = el("tr");
    ["#", "time", "reply", "sentence"].forEach((h, k) => hr.appendChild(el("th", k === 3 || k === 1 || k === 5 ? "l" : null, h)));
    EM.forEach(em => hr.appendChild(el("th", null, em.name)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const s = sentenceOf(e), tr = el("tr");
      tr.appendChild(el("td", null, "S" + sNumber[i]));
      tr.appendChild(el("td", "l", eventTime(i) || "–"));
      tr.appendChild(el("td", null, String(e.t + 1)));
      const st = el("td", "l sent", s.text); st.title = s.text; tr.appendChild(st);
      
      let best = -1; s.values.forEach((v, k) => { if (v != null && (best < 0 || v > s.values[best])) best = k; });
      s.values.forEach((v, k) => { const td = el("td"); const sp = el("span", k === best ? "best num" : "num", fmt(v)); sp.style.fontWeight = k === best ? "700" : "400"; td.appendChild(sp); tr.appendChild(td); });
      tr.addEventListener("click", () => setActive(i, true));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  });

  // ---------- distribution of this session's scores
  (function () {
    const DS = D.dist, host = document.getElementById("dist");
    if (!DS || !DS.n) { document.getElementById("distcard").hidden = true; return; }
    const nb = DS.rows[0].counts.length;
    document.getElementById("distinfo").textContent = DS.n + " sentences · " + nb + " bins";
    const clamped = DS.rows.reduce((a, r) => a + r.below + r.above, 0);
    document.getElementById("distnote").textContent =
      "Each row shows how this session's sentences spread across score bins of width " + DS.width +
      ", as a percentage of its " + DS.n + " sentences (counts, no fitted curve). All rows share one horizontal and one vertical scale, " +
      "so positions and heights compare directly. The dark vertical mark is the mean." +
      (clamped ? " " + clamped + " score(s) beyond " + DS.lo + " or " + DS.hi + " are counted in the end bins." : "");
    const svgD = sv("svg", { role: "img", "aria-label": "Distribution of each emotion's scores in this session" });
    const tipD = el("div", "tip"); tipD.hidden = true;
    host.append(svgD, tipD);
    const rowH = 30, top = 8, labelW = 112, right = 16, axisH = 34;
    const yMax = Math.max(1e-9, ...DS.rows.map(r => Math.max(...r.counts) / DS.n * 100));
    function draw() {
      const WD = Math.max(320, Math.round(host.clientWidth)), HD = top + rowH * DS.rows.length + axisH;
      svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
