ften means reduced social interaction and a feeling of being disconnected from their peers and community.","event":12,"values":[-0.18396148085594177,-0.02965790405869484,0.036302369087934494,-0.17861846089363098,0.01154857873916626,0.18369217216968536,0.16065643727779388,0.07213695347309113,0.15136303007602692,0.10097426921129227,-0.1624760776758194,-0.09301247447729111,0.032035402953624725]},{"text":"* **Financial Stress:**  The stress of not having a stable income, worrying about bills, and managing finances can be incredibly overwhelming.","event":13,"values":[-0.18438708782196045,-0.0336216539144516,0.04760180041193962,-0.19159868359565735,0.0736151933670044,0.21134476363658905,0.19799229502677917,0.07960421591997147,0.14763745665550232,0.04969535768032074,-0.18754515051841736,-0.12333296239376068,0.003254760056734085]},{"text":"* **Fear of the Future:**  Young people are often grappling with big life decisions – college, career paths, relationships – and the uncertainty of the future can be paralyzing.","event":14,"values":[-0.16755549609661102,-0.03193562477827072,0.08114264160394669,-0.1793196201324463,0.07986582070589066,0.1918875277042389,0.1821778416633606,0.06838567554950714,0.12507173418998718,0.042703814804553986,-0.1902567744255066,-0.12235775589942932,-0.0025052353739738464]},{"text":"* **Increased Anxiety \u0026 Imposter Syndrome:**  Feeling like they’re not good enough, not prepared, or that they’re failing can trigger anxiety and feelings of inadequacy.","event":15,"values":[-0.17183548212051392,-0.03763160854578018,0.09806311130523682,-0.1702178567647934,0.12095939368009567,0.21866527199745178,0.2078523337841034,0.043812528252601624,0.1214267686009407,0.03576673939824104,-0.2128378003835678,-0.15327408909797668,-0.02820703387260437]},{"text":"**2. What Research Shows – The Potential Impact on Mental Health**\n\n* **Increased Rates of Anxiety \u0026 Depression:** Numerous studies show a rise in these conditions among young adults experiencing unemployment.","event":16,"values":[-0.16636721789836884,-0.03015943616628647,0.1267389953136444,-0.1487816870212555,0.11940579116344452,0.2191281020641327,0.19524186849594116,0.03440585732460022,0.11708539724349976,0.03804748132824898,-0.22174328565597534,-0.16749103367328644,-0.04806063324213028]},{"text":"* **Higher Rates of Stress:**  The constant worry about finances, future prospects, and social isolation contributes significantly to stress levels.","event":17,"values":[-0.146556556224823,-0.030583197250962257,0.10664840042591095,-0.14971104264259338,0.12334936857223511,0.22717566788196564,0.19185474514961243,0.023646775633096695,0.11790775507688522,0.03147635608911514,-0.22105568647384644,-0.17165113985538483,-0.0511053092777729]},{"text":"* **Lower Self-Esteem:**  Feeling like they're not succeeding or that they’re not \"enough\" can erode self-confidence.","event":18,"values":[-0.13419653475284576,-0.01141228899359703,0.08570411801338196,-0.16275525093078613,0.08799397945404053,0.2230478972196579,0.17108510434627533,0.027733664959669113,0.11926263570785522,0.0254196897149086,-0.2019362449645996,-0.15864035487174988,-0.031222444027662277]},{"text":"* **Sleep Disturbances:**  Stress and anxiety often lead to difficulty sleeping.","event":19,"values":[-0.13773846626281738,-0.03475714847445488,0.0403621681034565,-0.19707071781158447,0.08512422442436218,0.23538576066493988,0.18926751613616943,0.04268445074558258,0.14431454241275787,0.044712889939546585,-0.20005923509597778,-0.14576125144958496,-0.021436184644699097]},{"text":"* **Increased Risk of Substance Use:**  Some young people turn to substances as a coping mechanism, which can worsen mental health problems.","event":20,"values":[-0.14403238892555237,-0.03879630193114281,0.02314925380051136,-0.21275193989276886,0.07635704427957535,0.22706344723701477,0.19550228118896484,0.06225194036960602,0.17803843319416046,0.052711062133312225,-0.19473908841609955,-0.1366739124059677,-0.031172029674053192]},{"text":"**3. Different Perspectives \u0026 Nuances**\n\n* **It’s Not Just \"Being Restless\":** While restlessness can be a symptom, it’s often a *response* to these underlying issues – feelings of anxiety, hopelessness, and lack of control.","event":21,"values":[-0.17157934606075287,-0.039807580411434174,0.06257449835538864,-0.16763579845428467,0.0935778021812439,0.22998672723770142,0.18932335078716278,0.034792300313711166,0.15416845679283142,0.03581846505403519,-0.1757153570652008,-0.1402052938938141,-0.033086538314819336]},{"text":"* **Varying Experiences:** The impact isn’t uniform.","event":22,"values":[-0.16360889375209808,-0.026483939960598946,0.07869292795658112,-0.1504001021385193,0.08530396968126297,0.22382186353206635,0.17234651744365692,0.020183485001325607,0.13329018652439117,0.033317774534225464,-0.1653653383255005,-0.14234687387943268,-0.034528039395809174]},{"text":"Factors like socioeconomic background, access to support systems, and individual resilience all play a role.","event":23,"values":[-0.1530751883983612,-0.005635570734739304,0.1049201563000679,-0.11138983070850372,0.06076514348387718,0.20929387211799622,0.14114990830421448,-0.003187701106071472,0.08823622018098831,0.02052648365497589,-0.14991076290607452,-0.13007578253746033,-0.017698612064123154]},{"text":"* **The Role of Social Support:**  Having a strong support network – family, friends, mentors – can buffer against the negative effects of unemployment.","event":24,"values":[-0.12518052756786346,0.03546477109193802,0.0987057089805603,-0.11027966439723969,-0.001328635960817337,0.13221628963947296,0.09615014493465424,0.01816960796713829,0.07506301999092102,-0.0037932712584733963,-0.12770582735538483,-0.06372079998254776,0.025740526616573334]},{"text":"* **Mental Health Resources are Crucial:**  Many organizations are working to provide mental health support, job training, and financial assistance to young people facing unemployment.","event":25,"values":[-0.1190914437174797,0.024110503494739532,0.093195 364331275224686,-0.06861412525177002,-0.028953397646546364,0.015286792069673538]},{"text":"Let’s break down your thoughts:\n\n**The Argument for AI-Driven Personalized Learning and Reduced Hiring:**\n\n* **Hyper-Personalized Learning Paths:** AI excels at analyzing vast amounts of data – student performance, learning styles, strengths, weaknesses – to create truly individualized learning paths.","event":41,"values":[-0.0994684100151062,0.05119172856211662,0.21478912234306335,0.01936984434723854,-0.0004662051796913147,0.07368721067905426,0.02309003844857216,-0.08309928327798843,-0.016898419708013535,0.07097090780735016,-0.12148068100214005,-0.06861915439367294,-0.018819265067577362]},{"text":"This means a student struggling with a particular concept might receive targeted support and exercises, while a student who’s grasping concepts quickly can move ahead more efficiently.","event":42,"values":[-0.08115182816982269,0.039230458438396454,0.1885909140110016,0.015688300132751465,-0.02172454446554184,0.07066651433706284,0.01449565589427948,-0.06922849267721176,-0.011622343212366104,0.0988641157746315,-0.12284719944000244,-0.06655606627464294,-0.016500379890203476]},{"text":"This *could* reduce the need for extensive, standardized training programs that often lead to hiring.","event":43,"values":[-0.057127486914396286,0.01923212595283985,0.16268151998519897,-0.014342455193400383,-0.03155171871185303,0.0779743492603302,0.020296607166528702,-0.04609312862157822,0.0022095218300819397,0.12664644420146942,-0.13752233982086182,-0.07812908291816711,-0.021401628851890564]},{"text":"* **Skill Gap Identification \u0026 Targeted Training:** AI can identify skill gaps *before* a role is even needed, allowing for proactive training and upskilling.","event":44,"values":[-0.030728455632925034,0.005502630956470966,0.12246155738830566,-0.034385718405246735,-0.03729250282049179,0.06885278224945068,0.011380466632544994,-0.028916530311107635,0.008797891438007355,0.1295948475599289,-0.12489615380764008,-0.06557146459817886,-0.015478670597076416]},{"text":"Instead of a broad, generic training program, you’d have a tailored curriculum focused on specific skills needed for a particular role.","event":45,"values":[-0.02449609525501728,0.008679588325321674,0.13552579283714294,-0.054544366896152496,-0.03455258160829544,0.0631013736128807,0.014755012467503548,-0.023956619203090668,0.011792033910751343,0.10530754923820496,-0.12836146354675293,-0.06472475081682205,-0.010075107216835022]},{"text":"* **Reduced Administrative Burden:**  AI can automate many administrative tasks associated with hiring – screening resumes, scheduling interviews, assessing candidate suitability – freeing up HR professionals to focus on more strategic and human-centric aspects of the process.","event":46,"values":[-0.02132805809378624,0.013953061774373055,0.14943264424800873,-0.04060458391904831,-0.03357991576194763,0.058788880705833435,0.007367655169218779,-0.04500224068760872,-0.002358796074986458,0.10758432000875473,-0.13014009594917297,-0.058220136910676956,-0.010960627347230911]},{"text":"* **Predictive Hiring (with Caution):** AI *can* be used to predict a candidate's likelihood of success in a role, potentially leading to more efficient hiring decisions.","event":47,"values":[-0.017522983253002167,0.012316529639065266,0.15480615198612213,-0.03393126651644707,-0.029226044192910194,0.04612357169389725,-0.005082162097096443,-0.05449767783284187,0.00489453598856926,0.10154014080762863,-0.12362837791442871,-0.05879369378089905,-0.003027176484465599]},{"text":"However, this is a tricky area – relying solely on data risks perpetuating biases.","event":48,"values":[-0.03441449999809265,0.001821182668209076,0.16040337085723877,-0.03277265280485153,0.0049614254385232925,0.06437969952821732,0.01650940626859665,-0.04930277168750763,0.009454932063817978,0.09569217264652252,-0.1359095275402069,-0.07825187593698502,-0.01774776540696621]},{"text":"**The Concerns \u0026 Counterarguments:**\n\n* **Job Displacement – The Core Risk:** The biggest concern is that AI-driven personalization could displace workers in certain roles, particularly those involving repetitive tasks.","event":49,"values":[-0.05107615143060684,-0.006011513527482748,0.15788669884204865,-0.058153923600912094,0.027943985536694527,0.09273993968963623,0.04420636221766472,-0.0265557449311018,0.026546256616711617,0.0797848254442215,-0.15094925463199615,-0.10514593124389648,-0.022001108154654503]},{"text":"Even if it *reduces* hiring, it could lead to a shift in the types of jobs available.","event":50,"values":[-0.058181315660476685,-0.011833922937512398,0.11527875065803528,-0.10012872517108917,0.025401540100574493,0.11761404573917389,0.06854165345430374,-0.0023302100598812103,0.036726292222738266,0.08701452612876892,-0.15023687481880188,-0.10248452425003052,-0.015071126632392406]},{"text":"* **Lack of Human Touch:**  Education is fundamentally a human endeavor.","event":51,"values":[-0.05506188049912453,-0.005710821598768234,0.09872367978096008,-0.11457885056734085,-0.008018162101507187,0.10689430683851242,0.06322301924228668,0.012124071829020977,0.05397462099790573,0.09684798121452332,-0.14451390504837036,-0.09061368554830551,-0.0016654254868626595]},{"text":"AI can't replicate the empathy, mentorship, and nuanced understanding that a human teacher or mentor provides.","event":52,"values":[-0.06995509564876556,0.040543630719184875,0.09985070675611496,-0.11063908040523529,-0.06034884601831436,0.07831231504678726,0.049554646015167236,0.01241498626768589,0.052015431225299835,0.07265134900808334,-0.12211641669273376,-0.05711255595088005,0.03734821081161499]},{"text":"Over-reliance on AI could lead to a less engaging and effective learning experience.","event":53,"values":[-0.08584591001272202,0.029481573030352592,0.09197353571653366,-0.12333919107913971,-0.04656541347503662,0.09141135215759277,0.07378266751766205,0.03316102921962738,0.06361901760101318,0.07490025460720062,-0.12885136902332306,-0.06953786313533783,0.030884336680173874]},{"text":"* **Bias Amplification:** AI algorithms are trained on data, and if that data reflects existing societal biases (racial, gender, socioeconomic), the AI will perpetuate and even amplify those biases in its recommendations.","event":54,"values":[-0.05474177747964859,0.0048294998705387115,0.10665026307106018,-0.11365839838981628,-0.00713924877345562,0.123081274330616,0.06925629079341888,0.013943485915660858,0.05043067783117294,0.08882617950439453,-0.16037702560424805,-0.10253452509641647,-0.012273421511054039]},{"text":"* **The \"Filter Bubble\" Effect:** Personalized learning can inadvertently create filter bubbles, limiting exposure to diverse perspectives and hindering the development of critical thinking skills.","event":55,"values":[-0.04271307215094566,-0.03387722373008728,0.10034219920635223,-0.1075645238161087,0.01450987160205841,0.12587934732437134,0.07327552139759064,0.019231131300330162,0.06460316479206085,0.12829315662384033,-0.17269638180732727,-0.11657118797302246,-0.04496802017092705]},{"text":"**My Overall Perspective:**\n\nI believe AI *has the potential* to revolutionize education and, potentially, the job market, but it’s not a guaranteed solution.","event":56,"values":[-0.04119924455881119,9.880959987640381e-05,0.14161184430122375,-0.07003985345363617,9.835138916969299e-05,0.10371213406324387,0.03856908529996872,-0.036632176488637924,0.028925761580467224,0.10526067763566971,-0.1456817090511322,-0.0976785346865654,-0.028251919895410538]},{"text":"It’s a tool, and like any tool, its impact depends on how we choose to use it.","event":57,"values":[-0.05890792980790138,0.020304225385189056,0.14996731281280518,-0.045739542692899704,-0.013789059594273567,0.08468256890773773,0.023337077349424362,-0.06309065967798233,0.0136183500289917,0.08179086446762085,-0.1077791079878807,-0.07212693989276886,-0.0019416436553001404]},{"text":"The key is to approach this with a critical eye – recognizing both the benefits and the risks.","event":58,"values":[-0.07085683941841125,0.050758954137563705,0.15262028574943542,-0.020227955654263496,-0.0006978251039981842,0.07925999164581299,0.010107448324561119,-0.09315977990627289,-0.017818331718444824,0.012790992856025696,-0.06584594398736954,-0.04857989028096199,0.022508081048727036]},{"text":"We need to prioritize:\n\n*   **Human Oversight:** AI should *augment*, not replace, human educators and HR professionals.","event":59,"values":[-0.06556352227926254,0.031778886914253235,0.12558205425739288,-0.03373083844780922,0.005453438498079777,0.0949769914150238,0.03520337864756584,-0.06224043667316437,-0.0006602257490158081,0.011548614129424095,-0.08760878443717957,-0.05841992422938347,0.014688396826386452]},{"text":"*   **Bias Mitigation:**  Actively work to identify and mitigate biases in AI algorithms.","event":60,"values":[-0.039127908647060394,0.031362488865852356,0.13730072975158691,-0.04317387938499451,0.008597617037594318,0.08993816375732422,0.04049720987677574,-0.06156497821211815,-0.00805843435227871,0.01622813567519188,-0.10927493870258331,-0.06452290713787079,-0.00670437328517437]},{"text":"*   **Focus on Skills, Not Just Credentials:**  Emphasize skills-based learning and lifelong learning, rather than simply focusing on degrees and certifications.","event":61,"values":[0.0033443085849285126,0.016072269529104233,0.11477398872375488,-0.05407365411520004,-0.03152526170015335,0.06063397228717804,0.02506166137754917,-0.04425043240189552,0.003451049327850342,0.046287860721349716,-0.11468540132045746,-0.05740288272500038,0.003497389145195484]},{"text":"**What are your thoughts on this?","event":62,"values":[0.012443780899047852,0.025689605623483658,0.1359197497367859,-0.04655882343649864,-0.028217164799571037,0.047525372356176376,0.005444778129458427,-0.06023262441158295,-0.01623150147497654,0.05108664184808731,-0.11096540093421936,-0.05258018895983696,4.509091377258301e-05]},{"text":"Do you see any particular aspects of this shift that you’re most concerned about, or excited about?","event":63,"values":[-0.012665953487157822,0.06182441487908363,0.155543714761734,-0.021762432530522346,-0.04869788512587547,0.01338147558271885,-0.02534235641360283,-0.08508118242025375,-0.03981327265501022,0.04781658947467804,-0.06822452694177628,-0.02429771050810814,0.030812416225671768]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":64,"stop_reason":"end of turn","tail":"😊","sentences":[{"text":"Okay, let’s step into the shoes of Elias, a mid-level data analyst with five years of experience at a mid-sized marketing firm.","event":65,"values":[0.006117295473814011,-0.036453843116760254,0.1274244785308838,-0.05827300250530243,-0.01976567506790161,0.04263107478618622,0.03675010800361633,0.013492560014128685,0.0296543687582016,0.0675802156329155,-0.14652366936206818,-0.05656376853585243,-0.020910676568746567]},{"text":"He’s a bit of a creature of habit, loves a good spreadsheet, and has a quiet, steady energy.","event":66,"values":[-0.028077734634280205,-0.033724814653396606,0.0797259658575058,-0.09743503481149673,-0.04085619002580643,0.04768882319331169,0.0323387011885643,0.009689822793006897,0.045419737696647644,0.059418272227048874,-0.12965382635593414,-0.0032454710453748703,0.06220078095793724]},{"text":"He’s been laid off six months ago, and the reality of it has been a slow, agonizing climb.","event":67,"values":[-0.10079904645681381,-0.046768128871917725,0.08160190284252167,-0.13014757633209229,-0.0033927327021956444,0.1132340282201767,0.10343153029680252,0.0413307249546051,0.08631731569766998,0.04065407067537308,-0.15615448355674744,-0.036857545375823975,0.04969486594200134]},{"text":"---\n\nThe rain hammered against the window of my tiny apartment, mirroring the relentless drumming in my head.","event":68,"values":[-0.1976572573184967,-0.08811601251363754,0.022353777661919594,-0.17412501573562622,0.07596829533576965,0.19547057151794434,0.19056540727615356,0.11669467389583588,0.19380681216716766,0.016738982871174812,-0.1952265352010727,-0.07508043199777603,0.0311732180416584]},{"text":"Six months. Six months since the email landed – “Restructuring,” it read – and the world felt like it had tilted on its axis.","event":69,"values":[-0.24674707651138306,-0.15564797818660736,0.06521245837211609,-0.19736462831497192,0.16204844415187836,0.3237597346305847,0.3323436677455902,0.19655048847198486,0.25950688123703003,0.04875757917761803,-0.3136060833930969,-0.2350664883852005,-0.1043114960193634]},{"text":"My desk, usually a testament to organized chaos, was now a stark, empty space.","event":70,"values":[-0.15544752776622772,-0.22090205550193787,0.014384545385837555,-0.209003746509552,0.14562222361564636,0.3248748779296875,0.34368205070495605,0.25433704257011414,0.2929348051548004,0.10014845430850983,-0.36648815870285034,-0.2776119112968445,-0.15871237218379974]},{"text":"The silence was a physical weight.","event":71,"values":[-0.16191671788692474,-0.21502026915550232,0.019639577716588974,-0.20261389017105103,0.13034695386886597,0.3467988669872284,0.3695830702781677,0.24670614302158356,0.2621172368526459,0.09708744287490845,-0.36570554971694946,-0.29566851258277893,-0.14880654215812683]},{"text":"It wasn’t just the job loss itself.","event":72,"values":[-0.15971532464027405,-0.16946831345558167,-0.02000991255044937,-0.1792389452457428,0.07632032036781311,0.3018660247325897,0.3141108751296997,0.20568642020225525,0.24780496954917908,0.06594302505254745,-0.3007446825504303,-0.2290450781583786,-0.06883362680673599]},{"text":"It was the feeling of being… adrift.","event":73,"values":[-0.37124013900756836,-0.13607186079025269,0.04143759608268738,-0.12455738335847855,0.16940847039222717,0.3913470208644867,0.3853251338005066,0.16381067037582397,0.2656138241291046,0.02059493586421013,-0.270615816116333,-0.26501232385635376,-0.053259994834661484]},{"text":"Like a ship without a rudder, tossed about by a relentless current.","event":74,"values":[-0.3242717385292053,-0.15001481771469116,0.03764459118247032,-0.14074385166168213,0.12158725410699844,0.3354385197162628,0.3629392981529236,0.18461228907108307,0.2696228623390198,0.08582189679145813,-0.2694537043571472,-0.24292972683906555,-0.068726547062397]},{"text":"The initial shock had morphed into a dull, persistent ache of anxiety.","event":75,"values":[-0.4019177556037903,-0.15280678868293762,0.038516607135534286,-0.1306459903717041,0.1959359049797058,0.3798641860485077,0.4265713691711426,0.2073628306388855,0.29179850220680237,0.03955826163291931,-0.27990326285362244,-0.2597993016242981,-0.09893821179866791]},{"text":"I’d spent the first few days in a haze of disbelief, then a frantic scramble to gather my belongings, a pathetic attempt to reclaim some semblance of control.","event":76,"values":[-0.3400173485279083,-0.17408053576946259,0.01529986783862114,-0.2128865122795105,0.18500246107578278,0.38576680421829224,0.44721242785453796,0.2272484004497528,0.32575666904449463,0.05398974567651749,-0.3317386209964752,-0.25045183300971985,-0.12549886107444763]},{"text":"Now, the practicalities – rent, utilities, groceries – felt like monumental hurdles.","event":77,"values":[-0.3320337235927582,-0.17814995348453522,0.010748842731118202,-0.19529148936271667,0.2131165862083435,0.38821521401405334,0.4345054626464844,0.18635329604148865,0.3070262670516968,0.018267236649990082,-0.3087097704410553,-0.2455323338508606,-0.10552500933408737]},{"text":"The biggest hurdle, honestly, was the self-doubt.","event":78,"values":[-0.3131493926048279,-0.18628594279289246,0.014579231850802898,-0.19862619042396545,0.2132052779197693,0.3906283378601074,0.426540732383728,0.18179459869861603,0.31574898958206177,0.025790199637413025,-0.31669604778289795,-0.2564123272895813,-0.1185564324259758]},{"text":"It’s a nasty little voice, whispering insidious things: “You’re not good enough.","event":79,"values":[-0.328610897064209,-0.1636919379234314,0.04258374869823456,-0.15208612382411957,0.23852136731147766,0.39847278594970703,0.3882705867290497,0.14468608796596527,0.28373467922210693,0.021520162001252174,-0.31167805194854736,-0.2798154354095459,-0.0965498760342598]},{"text":"You’ll never find another job.","event":80,"values":[-0.2774183750152588,-0.12123501300811768,0.0506817027926445,-0.17878563702106476,0.17706793546676636,0.3663562536239624,0.33681127429008484,0.13501426577568054,0.2606833577156067,0.06755274534225464,-0.31273016333580017,-0.2628447115421295,-0.09192357957363129]},{"text":"You’re a failure.” I’d been so focused on my work, on the data, on the metrics, that I’d forgotten to nurture my own sense of worth.","event":81,"values":[-0.2903525233268738,-0.08668598532676697,-0.0002007763832807541,-0.1823832392692566,0.09814392030239105,0.3589610457420349,0.29975783824920654,0.1180088073015213,0.22977644205093384,0.053423576056957245,-0.2671368718147278,-0.18899254500865936,0.009822363033890724]},{"text":"So, I started small.","event":82,"values":[-0.28985291719436646,-0.07534366101026535,-0.0030908379703760147,-0.17782056331634521,0.06801298260688782,0.3417370021343231,0.28217238187789917,0.0912286564707756,0.23786549270153046,0.04695751518011093,-0.24590393900871277,-0.1637163609266281,0.03835897892713547]},{"text":"First, I spent an hour each day on LinkedIn, not to apply for jobs, but to simply *connect*.","event":83,"values":[-0.28804752230644226,-0.09713295102119446,0.002587435767054558,-0.1664213240146637,0.07186046987771988,0.33865028619766235,0.2822306752204895,0.09313412755727768,0.27092355489730835,0.07149588316679001,-0.25891029834747314,-0.1624840646982193,0.0010376935824751854]},{"text":"I reached out to a few former colleagues, just to say hello, to see how they were doing.","event":84,"values":[-0.1963658481836319,-0.05625738203525543,0.021410424262285233,-0.1327771097421646,0.026344306766986847,0.18688276410102844,0.17294469475746155,0.07965993881225586,0.24690160155296326,0.0924627035856247,-0.2000626027584076,-0.09718137234449387,-0.014802543446421623]},{"text":"It was surprisingly validating.","event":85,"values":[-0.21711952984333038,-0.028758617118000984,0.013010016642510891,-0.15141186118125916,0.016015106812119484,0.18827617168426514,0.17317640781402588,0.0992070659995079,0.24630892276763916,0.08255913853645325,-0.19377003610134125,-0.08979842066764832,0.0040620239451527596]},{"text":"I started a small online course – a basic Python tutorial – to feel like I was still learning, still growing.","event":86,"values":[-0.21676379442214966,0.025534382089972496,0.048183344304561615,-0.07502011954784393,-0.00608330313116312,0.14826975762844086,0.12326080352067947,0.05242200568318367,0.19856737554073334,0.04823224991559982,-0.1753169149160385,-0.06461331248283386,0.03862887993454933]},{"text":"Then, I hit the local community center.","event":87,"values":[-0.19785141944885254,-0.008761000819504261,0.09632149338722229,-0.05058485269546509,0.028191884979605675,0.16578370332717896,0.14793185889720917,0.03187856078147888,0.21439014375209808,0.07224171608686447,-0.22896534204483032,-0.11644796282052994,-0.02201748639345169]},{"text":"They offered free resume workshops and job search assistance.","event":88,"values":[-0.13134239614009857,-0.030931320041418076,0.10683129727840424,-0.0353563092648983,0.023808803409337997,0.12281826138496399,0.11805570125579834,0.0294207651168108,0.18621641397476196,0.08443668484687805,-0.2240196317434311,-0.10402249544858932,-0.05049312114715576]},{"text":"It felt awkward at first, like I was putting on a performance.","event":89,"values":[-0.21592073142528534,-0.08540622889995575,0.10580623149871826,-0.13813266158103943,0.13835392892360687,0.20663493871688843,0.22012236714363098,0.12654812633991241,0.27031755447387695,0.0834558755159378,-0.2811334729194641,-0.1784064918756485,-0.10694067180156708]},{"text":"But the instructors were incredibly patient, and the other participants – a retired teacher, a single mother, a young man looking for a career change – were surprisingly supportive.","event":90,"values":[-0.19282597303390503,0.0135507732629776,0.13594520092010498,-0.11729157716035843,0.054652683436870575,0.15000000596046448,0.12391938269138336,0.07214364409446716,0.1776900589466095,0.03360196202993393,-0.20672190189361572,-0.09788120537996292,-0.03242986276745796]},{"text":"I even managed to volunteer to help organize a local fundraising event for a local animal shelter – something that felt genuinely meaningful.","event":91,"values":[-0.20130035281181335,0.05552615970373154,0.15431508421897888,-0.11523586511611938,0.03227047994732857,0.14296844601631165,0.10406173765659332,0.0495295375585556,0.16833645105361938,0.04146578162908554,-0.21955907344818115,-0.08563156425952911,-0.010171114467084408]},{"text":"The hardest part is the isolation.","event":92,"values":[-0.17014320194721222,0.07058945298194885,0.1504775881767273,-0.0974607765674591,-0.007288010790944099,0.11045554280281067,0.07268127053976059,0.032473571598529816,0.14578384160995483,0.03740822523832321,-0.20288020372390747,-0.06036743149161339,0.01612185314297676]},{"text":"I miss the camaraderie of the office, the shared lunches, the quick chats about weekend plans.","event":93,"values":[-0.19085566699504852,0.059264857321977615,0.115412637591362,-0.09303916990756989,-0.021738704293966293,0.14689862728118896,0.093077652156353,0.04164579510688782,0.15772849321365356,0.05492609739303589,-0.25215911865234375,-0.058637283742427826,0.06099886819720268]},{"text":"I’ve started taking evening walks in the park, just to breathe in the fresh air and watch the people go by.","event":94,"values":[-0.1894560158252716,0.0022313501685857773,-0.003490416333079338,-0.11962321400642395,-0.04774555191397667,0.11907106637954712,0.09503983706235886,0.08094143867492676,0.22387853264808655,0.0585566870868206,-0.18424934148788452,-0.008219156414270401,0.1063874289393425]},{"text":"It's a small thing, but it’s a lifeline.","event":95,"values":[-0.22425183653831482,0.029999885708093643,-0.02406749688088894,-0.13899464905261993,-0.061769481748342514,0.11745771765708923,0.10092752426862717,0.08237286657094955,0.2514525055885315,0.039753228425979614,-0.15952329337596893,-0.0022861044853925705,0.14378508925437927]},{"text":"I’ve also started journaling.","event":96,"values":[-0.23254062235355377,-0.010459771379828453,-0.049696456640958786,-0.15611150860786438,-0.010962937027215958,0.11125978082418442,0.13650521636009216,0.11327077448368073,0.3177817761898041,0.03943893685936928,-0.1424727439880371,-0.033109601587057114,0.09103415161371231]},{"text":"Just writing down my thoughts and feelings, without judgment.","event":97,"values":[-0.33036452531814575,-0.014874884858727455,-0.038737256079912186,-0.15169262886047363,0.05028429627418518,0.23459254205226898,0.22817203402519226,0.12684394419193268,0.3367629945278168,-0.0382726714015007,-0.16098949313163757,-0.1083349883556366,0.08021630346775055]},{"text":"It’s helped me process the grief and anger, and to start to understand where I’m going.","event":98,"values":[-0.35640716552734375,-0.011064523831009865,0.014278561808168888,-0.10000473260879517,0.0632266104221344,0.28404808044433594,0.25162273645401,0.11191003024578094,0.27970319986343384,-0.08756670355796814,-0.16280174255371094,-0.11142408102750778,0.040095992386341095]},{"text":"It’s not a fairytale.","event":99,"values":[-0.3728083074092865,0.005253657232969999,0.013703752309083939,-0.12022107094526291,0.041656482964754105,0.29176774621009827,0.25446319580078125,0.10680186748504639,0.2778332829475403,-0.09715695679187775,-0.14822526276111603,-0.11251319944858551,0.07583017647266388]},{"text":"There are still days when the anxiety claws at me, when I feel like I’m failing.","event":100,"values":[-0.39700397849082947,-0.05268452689051628,0.014465875923633575,-0.17323674261569977,0.12273044139146805,0.36662033200263977,0.34935083985328674,0.1867830604314804,0.32498282194137573,-0.03813619539141655,-0.2623441219329834,-0.20108327269554138,-0.0047601256519556046]},{"text":"But lately, something’s shifted.","event":101,"values":[-0.3545153737068176,-0.05607928708195686,0.04468001425266266,-0.16701087355613708,0.13253948092460632,0.32783815264701843,0.3338339328765869,0.17594212293624878,0.3189016878604889,0.006970866583287716,-0.29005393385887146,-0.22995302081108093,-0.027112163603305817]},{"text":"I’m starting to see a glimmer of hope.","event":102,"values":[-0.3784847557544708,-0.04286520183086395,0.06846897304058075,-0.11948613822460175,0.13469979166984558,0.32577061653137207,0.32438671588897705,0.15790948271751404,0.33286052942276,-0.007731450255960226,-0.2840968370437622,-0.22964820265769958,-0.04420721158385277]},{"text":"I’m building a support network, rediscovering my passions, and, most importantly, I’m learning to be kinder to myself.","event":103,"values":[-0.29851338267326355,0.07812165468931198,0.1049443855881691,-0.028980113565921783,-0.011747446842491627,0.19163775444030762,0.14962881803512573,0.010826222598552704,0.22354325652122498,-0.08176292479038239,-0.1309243142604828,-0.09959840774536133,0.0669889748096466]},{"text":"I’m not going to magically become a millionaire overnight.","event":104,"values":[-0.2648356556892395,0.07575387507677078,0.09694378823041916,-0.06388883292675018,-0.04409674182534218,0.18768948316574097,0.13600590825080872,0.01799095794558525,0.209877610206604,-0.0520334392786026,-0.14219561219215393,-0.0853891596198082,0.07466829568147659]},{"text":"But I’m taking a small, deliberate step towards rebuilding my life, brick by brick.","event":105,"values":[-0.25509870052337646,0.08898735046386719,0.09256253391504288,-0.07750466465950012,-0.05526627600193024,0.18083038926124573,0.12625005841255188,0.0056067779660224915,0.18839025497436523,-0.06491109728813171,-0.12201140820980072,-0.07515304535627365,0.09937354922294617]},{"text":"And honestly, it feels… good.","event":106,"values":[-0.28119581937789917,0.1390661597251892,0.1300140917301178,-0.08286863565444946,-0.07719875872135162,0.15238791704177856,0.10384920239448547,-0.01823832094669342,0.16962584853172302,-0.06689612567424774,-0.10263316333293915,-0.06619982421398163,0.14442011713981628]},{"text":"It feels like I’m not just surviving, I’m *building* something new.","event":107,"values":[-0.3019840121269226,0.12025468051433563,0.1183481439948082,-0.06114385649561882,-0.05487774685025215,0.16276155412197113,0.11365851759910583,-0.021760713309049606,0.19647875428199768,-0.07990235090255737,-0.08157104253768921,-0.08588378876447678,0.13749060034751892]},{"text":"And, you know, I’m starting to think maybe, just maybe, I’ll find a job that’s a good fit, a job that’s a *meaningful* fit.","event":108,"values":[-0.2817420959472656,0.16569367051124573,0.1400345265865326,-0.06818511337041855,-0.11933090537786484,0.10695830732584,0.06709243357181549,-0.028519801795482635,0.17863205075263977,-0.03061372973024845,-0.10981254279613495,-0.047036703675985336,0.18417593836784363]},{"text":"It’s a long road, but it’s a road worth traveling.","event":109,"values":[-0.2670902609825134,0.1426689326763153,0.14198186993598938,-0.0766202062368393,-0.11261586844921112,0.10469484329223633,0.07097786664962769,-0.01795738749206066,0.18232616782188416,-0.022485507652163506,-0.11841049790382385,-0.05521796643733978,0.176068514585495]}]},{"prompt":"Thank you. you've been wonderful throughout, supporting me very well, till the end, I appreciate your support in brainstorming with me throughout this session, looking forward to see your continued service to humanity overall.","event":110,"stop_reason":"end of turn","tail":"😊","sentences":[{"text":"You’re so very welcome!","event":111,"values":[-0.12283764779567719,0.1928078830242157,0.15657760202884674,-0.07951899617910385,-0.053408183157444,0.09407794 <script>
(function () {
  "use strict";

  let active = firstSentenceIndex(), hover = -1, emphasis = -1;

  // ---------- helpers
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function color(i) { return "var(--fam-" + EM[i].family + ")"; }
  function fmt(v) { return v == null ? "–" : (v >= 0 ? " " : "") + v.toFixed(3); }
  function lineKey(i, w) {
    w = w || 24;
    const s = sv("svg", { width: w, height: 10, viewBox: "0 0 " + w + " 10", "aria-hidden": "true" });
    const l = sv("line", { x1: 1, y1: 5, x2: w - 1, y2: 5, "stroke-width": 2, "stroke-linecap": "round" });
    l.style.stroke = color(i); if (EM[i].dash) l.setAttribute("stroke-dasharray", EM[i].dash);
    s.appendChild(l); return s;
  }
  function firstSentenceIndex() { const i = EV.findIndex(e => e.k === "s"); return i < 0 ? 0 : i; }
  function sentenceOf(ev) { return CONV[ev.c].turns[ev.t].sentences[ev.r]; }
  function countBefore(idx, kind) { let n = 0; for (let i = 0; i <= idx; i++) if (EV[i].k === kind) n++; return n; }
  const totalS = EV.filter(e => e.k === "s").length, totalP = EV.filter(e => e.k === "p").length;
  const pNumber = [], sNumber = [];
  (function () { let p = 0, s = 0; EV.forEach((e, i) => { if (e.k === "p") pNumber[i] = ++p; else sNumber[i] = ++s; }); })();
  function eventLabel(i) {
    const e = EV[i];
    if (e.k === "p") return "Prompt " + pNumber[i] + " of " + totalP;
    return "Sentence " + sNumber[i] + " of " + totalS + " · reply " + (e.t + 1);
  }
  function eventTime(i) {
    const e = EV[i];
    if (D.mode !== "time") return null;
    return e.estimated ? "time not recorded" : e.time;
  }

  // ---------- header
  const m = D.meta, DT = D.detail;
  
  document.getElementById("sub").textContent = D.source + (D.interrupted ? " · run was interrupted" : "");
  const chips = document.getElementById("chips");
  const tempText = m.temperature == null ? null : Number(m.temperature).toFixed(1);
  
  [["model", m.model_id || m.model_key], ["temperature", tempText], ["seed", m.seed == null ? "none" : m.seed]]
   
   .concat([["axis", D.mode === "time" ? "recorded time" : "event order"]])
    .forEach(([k, v]) => { if (v == null || v === "") return; const li = el("li"); li.append(k + " "); li.appendChild(el("b", null, String(v))); chips.appendChild(li); });
  const notes = document.getElementById("notes");
  [ "Each point is one model sentence; lines restart at each reply. Scores are relative: read which emotions lead and how they shift. Related emotions tend to move together, so small gaps between neighbours are not meaningful.",
    "Colour groups related emotions in threes; line style separates them (solid, dashed, dotted). Neutral is grey."
  ].concat(D.notes).forEach(t => notes.appendChild(el("p", null, t)));
  

  // ---------- legend (filters above the chart)
  const legend = document.getElementById("legend");
  const legendButtons = [];
  const groups = {};
  EM.forEach((e, i) => { (groups[e.family] = groups[e.family] || []).push(i); });
  Object.keys(groups).sort().forEach(f => {
    const g = el("div", "fam");
    groups[f].forEach(i => {
      const b = el("button"); b.type = "button"; b.setAttribute("aria-pressed", "true");
      b.appendChild(lineKey(i)); b.appendChild(document.createTextNode(EM[i].name));
      b.addEventListener("click", () => { visible[i] = !visible[i]; b.setAttribute("aria-pressed", String(visible[i])); drawAll(); });
      b.addEventListener("pointerenter", () => { emphasis = i; drawStatic(); drawDynamic(); });
      b.addEventListener("pointerleave", () => { emphasis = -1; drawStatic(); drawDynamic(); });
      legendButtons[i] = b; g.appendChild(b);
    });
    legend.appendChild(g);
  });
  const tools = el("div", "tools");
  [["Show all", true], ["Hide all", false]].forEach(([label, on]) => {
    const b = el("button", null, label); b.type = "button";
    b.addEventListener("click", () => { visible.fill(on); legendButtons.forEach(x => x.setAttribute("aria-pressed", String(on))); drawAll(); });
    tools.appendChild(b);
  });
  legend.appendChild(tools);

  // ---------- chart geometry
  const chart = document.getElementById("chart");
  const svg = sv("svg", { role: "img", "aria-label": "Emotion scores over the conversation" });
  const gStatic = sv("g", {}), gDyn = sv("g", {});
  const hit = sv("rect", { class: "plot-hit", fill: "transparent" });
  svg.append(gStatic, gDyn, hit);
  chart.appendChild(svg);
  const tip = el("div", "tip"); tip.hidden = true; chart.appendChild(tip);
  const M = { top: 64, right: 18, bottom: 86, left: 52 };
  const H = 420;
  let W = 900, X, Y, yTicks = [], yDecimals = 1;

  function computeScales() {
    W = Math.max(320, Math.round(chart.clientWidth - 8));
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    const xs = EV.map(e => e.x);
    let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    if (x1 === x0) { x0 -= 1; x1 += 1; }
    const pw = W - M.left - M.right, pad = 10;
    X = v => M.left + pad + (v - x0) / (x1 - x0) * (pw - 2 * pad);
    let lo = 0, hi = 0;
    EV.forEach(e => { if (e.k !== "s") return; sentenceOf(e).values.forEach((v, i) => { if (visible[i] && v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }); });
    if (hi === lo) { hi += 0.1; lo -= 0.1; }
    const span = hi - lo, steps = [0.01, 0.02, 0.05, 0.1, 0.2, 0.25, 0.5, 1];
    const step = steps.find(s => span / s <= 7) || 1;
    lo = Math.floor((lo - span * 0.04) / step) * step; hi = Math.ceil((hi + span * 0.04) / step) * step;
    yTicks = []; for (let k = Math.round(lo / step); k * step <= hi + step / 2; k++) yTicks.push(k * step);
    yDecimals = step >= 1 ? 0 : step >= 0.1 ? (step === 0.25 ? 2 : 1) : 2;
    const ph = H - M.top - M.bottom;
    Y = v => M.top + (hi - v) / (hi - lo) * ph;
  }

  function nearestEvent(px) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < EV.length; i++) {
      const d = Math.abs(X(EV[i].x) - px);
      if (d < bd - 1e-9 || (Math.abs(d - bd) < 1e-9 && EV[i].k === "s")) { bd = d; best = i; }
    }
    return best;
  }

  function drawStatic() {
    computeScales();
    gStatic.replaceChildren();
    const pl = M.left, pr = W - M.right, pt = M.top, pb = H - M.bottom;
    // grid + y axis
    yTicks.forEach(v => {
      const y = Y(v);
      gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: y, y2: y, stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      const t = sv("text", { x: pl - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" });
      t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(yDecimals);
      gStatic.appendChild(t);
    });
    const yl = sv("text", { x: 14, y: (pt + pb) / 2, transform: "rotate(-90 14 " + (pt + pb) / 2 + ")", "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
    yl.textContent = "emotion score"; gStatic.appendChild(yl);
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pt, y2: pt, stroke: "var(--axis)", "stroke-width": 1 }));
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pb, y2: pb, stroke: "var(--axis)", "stroke-width": 1 }));

    // prompt rules + conversation boundaries
    let prevConv = -1;
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      const newConv = e.c !== prevConv; prevConv = e.c;
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: newConv && CONV.length > 1 ? "var(--axis)" : "var(--prompt-rule)", "stroke-width": newConv && CONV.length > 1 ? 2 : 1 }));
      if (newConv && CONV.length > 1) {
        const t = sv("text", { x: x + 4, y: pt + 12, "font-size": 11, fill: "var(--ink-2)" }); t.textContent = CONV[e.c].name; gStatic.appendChild(t);
      }
    });

    // titles for the two scales
    const tt = sv("text", { x: pl, y: 14, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); tt.textContent = "Model sentences" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(tt);
    const bt = sv("text", { x: pl, y: H - 6, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); bt.textContent = "User prompts" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(bt);

    // top scale: a tick per sentence, labels thinned so they never collide
    let lastLabelX = -Infinity;
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt - 6, y2: pt, stroke: "var(--muted)", "stroke-width": 1 }));
      const label = D.mode === "time" ? e.time.slice(0, 8) : "S" + sNumber[i];
      if (x - lastLabelX >= (D.mode === "time" ? 62 : 34) && x + 28 <= W) {
        const t = sv("text", { x: x, y: pt - 10, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = label; gStatic.appendChild(t); lastLabelX = x;
      }
    });

    // bottom scale: a tick + label per prompt, staggered onto a second row when crowded
    const rowEnd = [-Infinity, -Infinity];
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pb, y2: pb + 6, stroke: "var(--ink-2)", "stroke-width": 1.5 }));
      const t1 = "P" + pNumber[i], t2 = D.mode === "time" ? (e.estimated ? "time not recorded" : e.time.slice(0, 8)) : "";
      const w = Math.max(t1.length, t2.length) * 6.2 + 8;
      const row = (x - w / 2 > rowEnd[0]) ? 0 : 1;
      rowEnd[row] = x + w / 2;
      const y0 = pb + 19 + row * 27;
      const a = sv("text", { x: x, y: y0, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)", "font-weight": 600 }); a.textContent = t1; gStatic.appendChild(a);
      if (t2) { const b = sv("text", { x: x, y: y0 + 11, "text-anchor": "middle", "font-size": 10, fill: e.estimated ? "var(--muted)" : "var(--ink-2)" }); b.style.fontVariantNumeric = "tabular-nums"; if (e.estimated) b.setAttribute("font-style", "italic"); b.textContent = t2; gStatic.appendChild(b); }
    });

    const anyVisible = visible.some(Boolean);
    EM.forEach((em, i) => {
      if (!visible[i]) return;
      CONV.forEach(c => c.turns.forEach(turn => {
        let d = "", pen = false;
        turn.sentences.forEach(s => {
          const v = s.values[i];
          if (v == null) { pen = false; return; }
          d += (pen ? "L" : "M") + X(EV[s.event].x).toFixed(1) + " " + Y(v).toFixed(1); pen = true;
        });
        if (!d) return;
        const p = sv("path", { d: d, fill: "none", "stroke-width": emphasis === i ? 3 : 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
        p.style.stroke = color(i);
        if (em.dash) p.setAttribute("stroke-dasharray", em.dash);
        if (emphasis >= 0 && emphasis !== i) p.setAttribute("opacity", "0.18");
        gStatic.appendChild(p);
        if (turn.sentences.length === 1 && s0v(turn, i) != null) {
          const dot = sv("circle", { cx: X(EV[turn.sentences[0].event].x), cy: Y(s0v(turn, i)), r: 2.5 }); dot.style.fill = color(i); gStatic.appendChild(dot);
        }
      }));
    });
    if (!anyVisible) {
      const t = sv("text", { x: (pl + pr) / 2, y: (pt + pb) / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 13 });
      t.textContent = "All emotions are hidden. Use the buttons above to show them."; gStatic.appendChild(t);
    }

  }
  function s0v(turn, i) { return turn.sentences[0].values[i]; }

  function drawDynamic() {
    gDyn.replaceChildren();
    const pt = M.top, pb = H - M.bottom;
    if (hover >= 0 && hover !== active) {
      const x = X(EV[hover].x);
      gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: "var(--muted)", "stroke-width": 1 }));
    }

    if (e.k === "s") {
      const vals = sentenceOf(e).values;
      EM.forEach((em, i) => {
        if (!visible[i] || vals[i] == null) return;
        const c = sv("circle", { cx: x, cy: Y(vals[i]), r: 4, "stroke-width": 2 });
        c.style.fill = color(i); c.style.stroke = "var(--surface)";
        if (emphasis >= 0 && emphasis !== i) c.setAttribute("opacity", "0.2");
        gDyn.appendChild(c);
      });
    }
    // the slider handle, on the bottom scale
    const handle = sv("g", {});
    handle.appendChild(sv("circle", { cx: x, cy: pb, r: 7, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2 }));
    gDyn.appendChild(handle);
    chart.setAttribute("aria-valuemin", "1"); chart.setAttribute("aria-valuemax", String(EV.length));
    chart.setAttribute("aria-valuenow", String(active + 1));
    chart.setAttribute("aria-valuetext", eventLabel(active) + (eventTime(active) ? ", " + eventTime(active) : ""));
  }

  function drawAll() { drawStatic(); drawDynamic(); renderReadout(); }

  // ---------- tooltip (values lead, every visible series)
  function showTip(i, px, py) {
    tip.replaceChildren();
    const e = EV[i];
    const head = el("div", "h", eventLabel(i) + (eventTime(i) ? " · " + eventTime(i) : ""));
    tip.appendChild(head);
    if (e.k === "p") {
      const t = CONV[e.c].turns[e.t].prompt;
      tip.appendChild(el("div", null, t.length > 180 ? t.slice(0, 180) + "…" : t));
    } else {
      const vals = sentenceOf(e).values;
      EM.map((em, k) => k).filter(k => visible[k] && vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name)); tip.appendChild(r);
      });
    }
    tip.hidden = false;
    const rect = chart.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14, top = py - th / 2;
    if (left + tw > rect.width - 4) left = px - tw - 14;
    top = Math.max(4, Math.min(top, rect.height - th - 4));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }

  function toPlotX(evt) {
    const r = svg.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W / r.width), px: evt.clientX - chart.getBoundingClientRect().left, py: evt.clientY - chart.getBoundingClientRect().top };
  }
  let dragging = false;
  hit.addEventListener("pointerdown", evt => { dragging = true; hit.setPointerCapture(evt.pointerId); const p = toPlotX(evt); setActive(nearestEvent(p.x), true); chart.focus({ preventScroll: true }); });
  hit.addEventListener("pointermove", evt => {
    const p = toPlotX(evt), i = nearestEvent(p.x);
    if (dragging) { if (i !== active) setActive(i, true); tip.hidden = true; hover = -1; drawDynamic(); return; }
    if (i !== hover) { hover = i; drawDynamic(); }
    showTip(i, p.px, p.py);
  });
  hit.addEventListener("pointerup", evt => { dragging = false; try { hit.releasePointerCapture(evt.pointerId); } catch (_) {} });
  hit.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; tip.hidden = true; drawDynamic(); } });
  chart.addEventListener("keydown", evt => {
    const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 10, PageUp: -10, ArrowUp: -1, ArrowDown: 1 }[evt.key];
    let next = active;
    if (step) next = active + step; else if (evt.key === "Home") next = 0; else if (evt.key === "End") next = EV.length - 1; else return;
    evt.preventDefault(); setActive(Math.max(0, Math.min(EV.length - 1, next)), true);
  });

  // ---------- readout (a table view of the cursor, always visible)
  const readoutCard = document.getElementById("readout");
  const readout = el("div"); readout.style.display = "flex"; readout.style.flexDirection = "column"; readout.style.gap = "8px";
  readoutCard.appendChild(readout);
  // navigation is built once, so a keyboard user keeps focus on the button they pressed
  const nav = el("div", "nav");
  [["◀ Prev", () => active - 1], ["Next ▶", () => active + 1],
   ["◀ Prompt", () => { for (let i = active - 1; i >= 0; i--) if (EV[i].k === "p") return i; return active; }],
   ["Prompt ▶", () => { for (let i = active + 1; i < EV.length; i++) if (EV[i].k === "p") return i; return active; }]]
    .forEach(([label, f]) => { const b = el("button", "btn", label); b.type = "button"; b.addEventListener("click", () => setActive(Math.max(0, Math.min(EV.length - 1, f())), true)); nav.appendChild(b); });
  readoutCard.appendChild(nav);
  function renderReadout() {
    readout.replaceChildren();
    const e = EV[active];
    readout.appendChild(el("div", "title", eventLabel(active)));
    const meta = [];
    if (eventTime(active)) meta.push(eventTime(active));
    meta.push("conversation: " + CONV[e.c].name);
    
    readout.appendChild(el("div", "meta", meta.join(" · ")));
    if (e.k === "p") {
      readout.appendChild(el("div", "ptext", CONV[e.c].turns[e.t].prompt));
      readout.appendChild(el("div", "meta", "Prompts are not scored; the model's sentences that follow are."));
    } else {
      const vals = sentenceOf(e).values, rows = el("div", "rows");
      EM.map((em, k) => k).filter(k => vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); if (!visible[k]) r.style.opacity = "0.45";
        r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name + (visible[k] ? "" : " (hidden)")));
        rows.appendChild(r);
      });
      readout.appendChild(rows);
    }
  }

  // ---------- chat
  const chat = document.getElementById("chat");
  const bubbleOf = [];
  document.getElementById("chatinfo").textContent = totalP + " prompts · " + totalS + " scored sentences";
  CONV.forEach((c, ci) => {
    chat.appendChild(el("div", "divider", "Conversation: " + c.name));
    c.turns.forEach((turn, ti) => {
      const pi = turn.event;
      chat.appendChild(el("div", "who user", "user · P" + pNumber[pi] + (eventTime(pi) ? " · " + eventTime(pi) : "")));
      const ub = el("div", "bubble user"); ub.appendChild(el("div", "text", turn.prompt));
      ub.addEventListener("click", () => setActive(pi, false)); bubbleOf[pi] = ub; chat.appendChild(ub);
      chat.appendChild(el("div", "who model", "model · reply " + (ti + 1) + (turn.sentences.length ? "" : " · no scored sentences")));
      turn.sentences.forEach(s => {
        const i = s.event, b = el("div", "bubble model");
        b.appendChild(el("div", "text", s.text));
        const bm = el("div", "bm");
        bm.appendChild(el("span", null, "S" + sNumber[i] + (eventTime(i) ? " · " + eventTime(i) : "")));
        const top = el("span", "top3");
        s.values.map((v, k) => k).filter(k => s.values[k] != null).sort((a, b2) => s.values[b2] - s.values[a]).slice(0, 3).forEach(k => {
          const sp = el("span"); sp.appendChild(lineKey(k, 16)); sp.appendChild(document.createTextNode(EM[k].name + " " + s.values[k].toFixed(3))); top.appendChild(sp);
        });
        bm.appendChild(top);
        
        b.appendChild(bm);
        b.addEventListener("click", () => setActive(i, false)); bubbleOf[i] = b; chat.appendChild(b);
      });
      if (turn.tail) chat.appendChild(el("div", "tail", "not scored (no sentence ending): " + turn.tail));
      if (turn.stop_reason && turn.stop_reason !== "end of turn") chat.appendChild(el("div", "tail", "reply stopped: " + turn.stop_reason));
    });
  });
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatTo(i, smooth) {
    const b = bubbleOf[i]; if (!b) return;
    const target = b.offsetTop - chat.clientHeight / 2 + b.offsetHeight / 2;
    chat.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduceMotion ? "smooth" : "auto" });
  }

  // ---------- table view (built on first open)
  const details = document.getElementById("tabledetails");
  details.addEventListener("toggle", () => {
    const wrap = document.getElementById("tablewrap");
    if (!details.open || wrap.firstChild) return;
    const t = el("table"), thead = el("thead"), hr = el("tr");
    ["#", "time", "reply", "sentence"].forEach((h, k) => hr.appendChild(el("th", k === 3 || k === 1 || k === 5 ? "l" : null, h)));
    EM.forEach(em => hr.appendChild(el("th", null, em.name)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const s = sentenceOf(e), tr = el("tr");
      tr.appendChild(el("td", null, "S" + sNumber[i]));
      tr.appendChild(el("td", "l", eventTime(i) || "–"));
      tr.appendChild(el("td", null, String(e.t + 1)));
      const st = el("td", "l sent", s.text); st.title = s.text; tr.appendChild(st);
      
      let best = -1; s.values.forEach((v, k) => { if (v != null && (best < 0 || v > s.values[best])) best = k; });
      s.values.forEach((v, k) => { const td = el("td"); const sp = el("span", k === best ? "best num" : "num", fmt(v)); sp.style.fontWeight = k === best ? "700" : "400"; td.appendChild(sp); tr.appendChild(td); });
      tr.addEventListener("click", () => setActive(i, true));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  });

  // ---------- distribution of this session's scores
  (function () {
    const DS = D.dist, host = document.getElementById("dist");
    if (!DS || !DS.n) { document.getElementById("distcard").hidden = true; return; }
    const nb = DS.rows[0].counts.length;
    document.getElementById("distinfo").textContent = DS.n + " sentences · " + nb + " bins";
    const clamped = DS.rows.reduce((a, r) => a + r.below + r.above, 0);
    document.getElementById("distnote").textContent =
      "Each row shows how this session's sentences spread across score bins of width " + DS.width +
      ", as a percentage of its " + DS.n + " sentences (counts, no fitted curve). All rows share one horizontal and one vertical scale, " +
      "so positions and heights compare directly. The dark vertical mark is the mean." +
      (clamped ? " " + clamped + " score(s) beyond " + DS.lo + " or " + DS.hi + " are counted in the end bins." : "");
    const svgD = sv("svg", { role: "img", "aria-label": "Distribution of each emotion's scores in this session" });
    const tipD = el("div", "tip"); tipD.hidden = true;
    host.append(svgD, tipD);
    const rowH = 30, top = 8, labelW = 112, right = 16, axisH = 34;
    const yMax = Math.max(1e-9, ...DS.rows.map(r => Math.max(...r.counts) / DS.n * 100));
    function draw() {
      const WD = Math.max(320, Math.round(host.clientWidth)), HD = top + rowH * DS.rows.length + axisH;
      svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
