90264034271,0.028539588674902916]},{"text":"It’s a complex issue with both potential benefits and risks, and it’s a fascinating area of consideration.","event":33,"values":[0.033052459359169006,0.04800274968147278,0.028779320418834686,0.027568310499191284,-0.021082106977701187,-0.031319014728069305,-0.07867264747619629,-0.10105863213539124,-0.058559298515319824,0.011217830702662468,0.02947327122092247,0.06158146262168884,0.03180485963821411]},{"text":"Let’s delve into your points about AI and learning:\n\n**AI's Potential to Reduce Hiring (and thus, Hiring-Related Job Losses):**\n\n* **Personalized Feedback Loops:** AI-powered systems can analyze student responses (written answers, problem-solving steps, etc.)","event":34,"values":[0.02120187319815159,0.03990830108523369,0.0505254827439785,0.005907087586820126,-0.024852050468325615,-0.0072168149054050446,-0.05358017981052399,-0.07882900536060333,-0.03270301967859268,0.04049697145819664,-0.010127407498657703,0.022541362792253494,0.011119561269879341]},{"text":"to provide immediate, individualized feedback.","event":35,"values":[0.002451770007610321,0.030903756618499756,0.05430632829666138,-0.0016864538192749023,-0.015701327472925186,0.011876298114657402,-0.033713653683662415,-0.06146933138370514,-0.017400426790118217,0.04891064390540123,-0.025477657094597816,-0.0006635840982198715,0.004290370270609856]},{"text":"This feedback loop can help students identify areas for improvement, leading to more focused learning and potentially fewer errors that might be flagged as needing a human hand.","event":36,"values":[0.017962006852030754,0.0233251191675663,0.04929244518280029,0.004195338115096092,-0.011110134422779083,0.013278614729642868,-0.031660161912441254,-0.0647052600979805,-0.02576497383415699,0.05624735727906227,-0.036781683564186096,0.0022660004906356335,-0.008569449186325073]},{"text":"* **Reduced Administrative Burden:** AI can automate tasks like grading, answering common questions, and providing feedback on assignments, freeing up teachers' time to focus on instruction and individual student needs.","event":37,"values":[0.025063905864953995,0.01750398427248001,0.029681729152798653,0.012522568926215172,-0.007983997464179993,0.0027649151161313057,-0.03991597145795822,-0.07312317937612534,-0.03816156089305878,0.057283915579319,-0.025970332324504852,0.02774844318628311,0.0011521317064762115]},{"text":"* **Identifying Learning Patterns:** AI can identify patterns in student behavior (e.","event":38,"values":[0.049326926469802856,0.02346879616379738,0.034937769174575806,0.03032340109348297,-0.012742635793983936,-0.014276869595050812,-0.05410362780094147,-0.09159420430660248,-0.05716032162308693,0.05124760791659355,-0.02286945842206478,0.042139992117881775,-0.005353379994630814]},{"text":"laptop) that might indicate areas where a student is struggling, allowing for targeted interventions and support.","event":39,"values":[0.046020351350307465,0.02071531116962433,0.030689552426338196,0.023839030414819717,-0.016132507473230362,-0.017951348796486855,-0.05169301480054855,-0.08471978455781937,-0.046787068247795105,0.054729584604501724,-0.02053854614496231,0.043401069939136505,-0.003976710140705109]},{"text":"**However, acknowledging the Risks of Job Displacement:**\n\n* **Automation of Tasks:** AI excels at automating many tasks performed by educators – grading, lesson planning, even some aspects of assessment.","event":40,"values":[0.05199885368347168,0.018857114017009735,0.029076099395751953,0.007413209415972233,-0.018412131816148758,-0.015967849642038345,-0.04383304715156555,-0.06543803960084915,-0.031279563903808594,0.04523279890418053,-0.02393035776913166,0.02200969122350216,-0.004997327923774719]},{"text":"This could lead to a reduction in the need for human instructors.","event":41,"values":[0.03052215464413166,0.01044958271086216,0.019444894045591354,-0.02419596165418625,-0.016398929059505463,-0.005550905596464872,-0.029849102720618248,-0.036337390542030334,-0.0018016267567873001,0.051412757486104965,-0.02218129113316536,0.005513113923370838,0.0037731770426034927]},{"text":"* **Shifting Focus to Observation:**  If AI systems handle many of the initial assessments, teachers might spend less time observing student behavior and more time observing the *results* of their instruction.","event":42,"values":[0.04411857947707176,0.012364543974399567,0.0161103755235672,-0.018906177952885628,-0.01592516526579857,-0.014806974679231644,-0.04259905964136124,-0.04807676374912262,-0.008953340351581573,0.05470668524503708,-0.017428461462259293,0.015369297936558723,0.0014858394861221313]},{"text":"**Overall, the impact on hiring (and therefore, job roles) is likely to be nuanced and complex.** It’s not a simple case of AI replacing teachers entirely.","event":43,"values":[0.048429761081933975,0.007883911952376366,0.01073419488966465,-0.02130524441599846,-0.013893365859985352,-0.020566612482070923,-0.045130081474781036,-0.056839682161808014,-0.013715177774429321,0.050721749663352966,0.002693749964237213,0.02821052074432373,-0.0037390440702438354]},{"text":"Instead, it’s likely to change the *nature* of their work, requiring them to adapt to new roles that involve more observation, feedback, and support.","event":44,"values":[0.053516313433647156,0.007845256477594376,0.013919086195528507,-0.014056464657187462,-0.015540743246674538,-0.025346027687191963,-0.04711281508207321,-0.06298764050006866,-0.01846664771437645,0.05408594384789467,-0.0032148007303476334,0.03676354140043259,-0.007360308431088924]},{"text":"**Here's a broader perspective on the issue:**\n\n* **AI as a Tool, Not a Replacement:**  I think it's most accurate to view AI as a tool that *supports* educators, rather than replacing them.","event":45,"values":[0.04540016129612923,0.014936833642423153,0.010264504700899124,-0.021692879498004913,-0.03474704921245575,-0.019652247428894043,-0.03788670524954796,-0.04728963226079941,-0.008035351522266865,0.041067272424697876,0.0024264072999358177,0.030857466161251068,-0.0008884090930223465]},{"text":"* **The Need for Training \u0026 Adaptation:** Educators will need training on how to effectively use AI-powered tools to support student learning.","event":46,"values":[0.05490187928080559,0.018406182527542114,0.016363641247153282,-0.01284592505544424,-0.03178161382675171,-0.017278684303164482,-0.03727686405181885,-0.05339851230382919,-0.017393874004483223,0.041389524936676025,-0.015368149615824223,0.028391722589731216,-0.006137601099908352]},{"text":"**Do you want to explore any of these points in more detail?","event":47,"values":[0.04841474071145058,0.025076063349843025,0.018065009266138077,-0.013191181235015392,-0.04126489907503128,-0.01238858513534069,-0.03773556649684906,-0.047575876116752625,-0.011851956136524677,0.04081237316131592,-0.011858210898935795,0.018308229744434357,-0.004305882379412651]},{"text":"For example, we could discuss:**\n\n*   The specific types of feedback AI systems provide.","event":48,"values":[0.050200868397951126,0.025500698015093803,0.03808395192027092,-0.009060659445822239,-0.02648128941655159,-0.009136824868619442,-0.03891727328300476,-0.05912082642316818,-0.020591391250491142,0.0519435741007328,-0.029625950381159782,0.009122096002101898,-0.01384216919541359]},{"text":"*   How AI could be used to support different learning styles (visual, auditory, kinesthetic).","event":49,"values":[0.04182363301515579,0.0241339523345232,0.04352925717830658,-0.0006689010187983513,-0.029220491647720337,-0.016498537734150887,-0.043558161705732346,-0.057034868746995926,-0.017521677538752556,0.059865884482860565,-0.021809499710798264,0.008743371814489365,-0.013450861908495426]},{"text":"*   The role of human educators in providing emotional support and mentorship.**\n\nI' laptop am here to explore this topic further, and I'd love to hear your thoughts.","event":50,"values":[0.056755390018224716,0.04585342854261398,0.04444479942321777,0.010730904527008533,-0.044574618339538574,-0.02925581857562065,-0.060850776731967926,-0.08197526633739471,-0.045933302491903305,0.031584132462739944,-0.0043368153274059296,0.03725598007440567,0.002536596730351448]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":51,"stop_reason":"end of turn","tail":"","sentences":[{"text":"Okay, let’s do that.","event":52,"values":[-0.06818795949220657,-0.014509126543998718,0.040192022919654846,-0.015114398673176765,-0.01207274105399847,0.024178192019462585,0.0233293566852808,0.04187735542654991,0.07846430689096451,0.009497953578829765,-0.004965377971529961,-0.05454610288143158,0.01102177333086729]},{"text":"I’m now sitting here, a little weary in the seat of a formerly bustling office space.","event":53,"values":[-0.005377658177167177,-0.010808560065925121,0.03114035725593567,0.005637583322823048,-0.02151256427168846,-0.010198194533586502,-0.012006286531686783,0.020517520606517792,0.05943836271762848,0.0006722072139382362,-0.003772401250898838,-0.025329191237688065,-0.00953359343111515]},{"text":"My name is Elias, and I was a Learning Coordinator – a guide, really, helping students navigate their studies, offering support to teachers, and ensuring a smooth flow of information.","event":54,"values":[-0.004129236098378897,-0.003573584370315075,0.05478091165423393,0.0178360715508461,-0.005023462697863579,-0.005717321299016476,-0.01080978661775589,-0.010919051244854927,0.036377158015966415,0.015595851466059685,-0.02728114277124405,-0.02267696149647236,-0.02001836895942688]},{"text":"I’d built a routine around it, a steady stream of questions, explanations, and gentle redirections.","event":55,"values":[0.0017199572175741196,0.004369582515209913,0.05069848895072937,0.019729256629943848,-0.006706947460770607,-0.011427204124629498,-0.02172248810529709,-0.027793552726507187,0.020543109625577927,0.006287219002842903,-0.016093237325549126,-0.004595406353473663,-0.0076191723346710205]},{"text":"Now, the rhythm is gone.","event":56,"values":[0.0011615618132054806,0.003985066432505846,0.0443442165851593,0.01644219644367695,-0.0007944405078887939,-0.009798715822398663,-0.020353026688098907,-0.037282101809978485,0.009795867837965488,0.009145514108240604,-0.011408844962716103,0.0054108332842588425,-0.003878869116306305]},{"text":"**(Pause, a slight sigh – a quiet, almost brittle movement)**\n\nMy world has shrunk.","event":57,"values":[0.024125926196575165,0.0055258432403206825,0.015226222574710846,0.003430597484111786,9.345076978206635e-05,-0.02891622856259346,-0.04056134074926376,-0.04652652144432068,0.005160234868526459,-0.014335214160382748,0.0360478013753891,0.02386688068509102,0.004504065960645676]},{"text":"It’ laptops been a library of screens, a constant stream of questions, and now, just… quiet.","event":58,"values":[0.08092045783996582,-0.00804505031555891,0.0031371712684631348,0.036217108368873596,0.0050047338008880615,-0.054332539439201355,-0.05909523367881775,-0.06429022550582886,-0.022396985441446304,-0.009734026156365871,0.03511452674865723,0.04518032819032669,-0.029178276658058167]},{"text":"The office is still there, a little less frantic, but the air feels thick with a quiet stillness.","event":59,"values":[0.07950928807258606,0.0015497085405513644,0.007667670026421547,0.05885201692581177,0.014108028262853622,-0.06465112417936325,-0.07408212125301361,-0.06110168620944023,-0.0276018176227808,-0.021911414340138435,0.03510988876223564,0.050894685089588165,-0.033542245626449585]},{"text":"**My Struggles:**\n\nI’d always been a planner.","event":60,"values":[0.05945174768567085,-0.006865917704999447,0.0076303016394376755,0.060922615230083466,0.010844726115465164,-0.05249950662255287,-0.058341044932603836,-0.0381837897002697,-0.0077003007754683495,-0.020828930661082268,0.019548073410987854,0.03479033708572388,-0.027690622955560684]},{"text":"I’d map out lessons, anticipate student needs, and anticipate the needs of my colleagues.","event":61,"values":[0.029707185924053192,-0.007069256156682968,0.03343381732702255,0.05029771104454994,0.02490324154496193,-0.02658611163496971,-0.040816329419612885,-0.028525792062282562,0.0066980947740375996,-0.016753744333982468,-0.006250798236578703,0.0038246288895606995,-0.027466317638754845]},{"text":"Now, the maps are blurred, the lines are soft, and the spaces between tasks are sharp.","event":62,"values":[0.039524152874946594,-0.013836318626999855,0.02836800180375576,0.04308037459850311,0.024640042334794998,-0.014947737567126751,-0.025839081034064293,-0.04167140647768974,-0.010506944730877876,0.0014909221790730953,-0.02502097189426422,0.009442638605833054,-0.02807418256998062]},{"text":"The biggest hurdle is the expectation of immediate, detailed feedback.","event":63,"values":[0.04969339817762375,-0.013850202783942223,0.026413841173052788,0.04678675904870033,0.030548369511961937,-0.008270136080682278,-0.03241529315710068,-0.06384020298719406,-0.030830515548586845,0.013616818934679031,-0.026403743773698807,0.022097589448094368,-0.03584890067577362]},{"text":"Students are used to quick, visual cues – a quick question, a glance, a gesture.","event":64,"values":[0.04028555750846863,0.00533905066549778,0.01016463153064251,0.039343468844890594,0.01262487843632698,-0.0010569430887699127,-0.045440398156642914,-0.07753924280405045,-0.0404697060585022,0.013125278055667877,-0.007414942607283592,0.04426867142319679,-0.013759870082139969]},{"text":"Theers a lot of space for interpretation, and that’s where the confusion can be.","event":65,"values":[-0.02359565906226635,0.0009691854938864708,0.020242296159267426,3.178487531840801e-05,0.01681523397564888,0.030990542843937874,-0.012742439284920692,-0.044396959245204926,0.002524926792830229,0.031106645241379738,-0.012822551652789116,0.007001284509897232,0.001705758273601532]},{"text":"I’d often find myself explaining concepts multiple times, patiently guiding students through their own thinking.","event":66,"values":[-0.025773050263524055,0.004062785767018795,0.024919241666793823,0.0011735522421076894,0.01582622155547142,0.03154468536376953,-0.00803363136947155,-0.035396721214056015,0.004542383830994368,0.02927672304213047,-0.024248400703072548,0.004305862821638584,-0.001849023625254631]},{"text":"I’d also noticed a shift in the students’ interactions.","event":67,"values":[-0.04416775703430176,-0.024737929925322533,0.011491850018501282,-0.031777046620845795,0.03383009508252144,0.03738372400403023,0.024125128984451294,0.018349120393395424,0.057281434535980225,0.051333457231521606,-0.03935685008764267,-0.031244661659002304,-0.02141675166785717]},{"text":"Fewer small group discussions, more individual work.","event":68,"values":[-0.002224856987595558,-0.007445137482136488,0.004870644770562649,-0.021122664213180542,0.015579710714519024,0.013227182440459728,-0.011134538799524307,-0.012259363196790218,0.031166844069957733,0.04547550901770592,-0.02333722822368145,-0.0027895672246813774,-0.018525509163737297]},{"text":"A natural flow of conversation, where students would bounce ideas off each other, is gone.","event":69,"values":[0.010483670979738235,0.02674858085811138,-0.006432452239096165,-0.019827570766210556,-0.013528520241379738,-0.026759617030620575,-0.046672187745571136,-0.028490154072642326,0.004979416728019714,0.030511071905493736,0.021031975746154785,0.04636158049106598,0.007434168830513954]},{"text":"**Aday’s Hurdles:**\n\nI’d started a small collection of books on resilience, focusing on finding strength in unexpected places.","event":70,"values":[0.015163678675889969,0.02176443114876747,0.001840897835791111,-0.03880332037806511,-0.028122203424572945,-0.0164700485765934,-0.025634953752160072,-0.010124573484063148,0.033471427857875824,0.024567225947976112,-0.002193022519350052,0.016390550881624222,0.005724459886550903]},{"text":"I’d watched tutorials on mindfulness, learning to quiet the internal voice of worry.","event":71,"values":[-0.0016315290704369545,0.010010340251028538,-0.0033658002503216267,-0.03677194565534592,-0.014705914072692394,0.0024944283068180084,-0.007464461959898472,-0.0006958898156881332,0.049421850591897964,0.013991793617606163,-0.009161986410617828,0.004915835335850716,0.0013849418610334396]},{"text":"But it felt…gentle.","event":72,"values":[-0.016416404396295547,-0.015849534422159195,-0.014132866635918617,-0.0534132644534111,-0.0033148862421512604,0.023662768304347992,0.021130139008164406,0.027507763355970383,0.08877266943454742,0.015903381630778313,-0.021644821390509605,-0.028666947036981583,-0.004256386309862137]},{"text":"It was like holding a flower in a pot, carefully adjusting the light, but not fully touching it.","event":73,"values":[-0.01880842074751854,0.02339780703186989,-0.025326702743768692,-0.03259192779660225,-0.01920674741268158,0.0014413557946681976,-0.007796497084200382,0.003280242905020714,0.04422793909907341,-0.0071961721405386925,0.012232806533575058,0.021525271236896515,0.026003308594226837]},{"text":"**My Story - A Moment of Reflection:** laptops a moment, sitting at a desk with a single, worn sketchbook.","event":74,"values":[0.07775504887104034,0.04480597376823425,-0.024759426712989807,-0.011066833510994911,-0.057881712913513184,-0.057767488062381744,-0.0664539635181427,-0.033579714596271515,-0.003889409825205803,-0.020235899835824966,0.02770785056054592,0.060973286628723145,0.02105754241347313]},{"text":"I’m drawing a simple wave – a constant motion, a sense of movement.","event":75,"values":[0.08946064859628677,0.04670219123363495,-0.02722402662038803,-0.009029125794768333,-0.05652922764420509,-0.06426636129617691,-0.07302968949079514,-0.043387074023485184,-0.012105726636946201,-0.021701335906982422,0.0308587197214365,0.06790073961019516,0.02045403979718685]},{"text":"I’m sketching a face, a young face with a thoughtful furrow of the brow, a hint of a smile playing around the eyes.","event":76,"values":[0.08752144873142242,0.017010850831866264,-0.020500771701335907,-0.0013945698738098145,-0.011833401396870613,-0.0477118194103241,-0.05000239610671997,-0.03544794023036957,0.006895969621837139,-0.006177942268550396,0.008802792988717556,0.031708236783742905,-0.024931177496910095]},{"text":"(I pause, taking a deep breath, a slight tremor in my hand)\n\n“It’s like… a ripple,” I’d say to myself, explaining the concept of waves.","event":77,"values":[0.03506368026137352,0.006835000589489937,-0.0001740437000989914,-0.006886991206556559,0.03306232765316963,-0.017356026917696,-0.01613117754459381,-0.020602522417902946,0.035185880959033966,0.009942028671503067,-0.0024536726996302605,-0.016893932595849037,-0.05048353224992752]},{"text":"“Small, insistent movements that create a larger pattern.”\n\nI’d started a small, private collection of objects – a smooth stone, a colourful bead, a feather.","event":78,"values":[0.053567226976156235,0.013052711263298988,0.0019176071509718895,-0.0036483649164438248,0.01532688457518816,-0.03310016542673111,-0.028556160628795624,-0.022769616916775703,0.023306164890527725,0.004656223580241203,0.005328052677214146,-0.003781994804739952,-0.048744164407253265]},{"text":"Each one represents a moment of stillness, a brief pause in the flow of activity.","event":79,"values":[0.05542641505599022,0.02901550941169262,-0.004227915778756142,0.010399903170764446,-0.008420687168836594,-0.042363934218883514,-0.04894479736685753,-0.05125350505113602,-0.0017577353864908218,-0.0031042098999023438,0.033744074404239655,0.02009950391948223,-0.016850460320711136]},{"text":"**My Actions:**\n\nI’ve started a small online group with fellow graduates, sharing snippets of our experiences, offering gentle encouragement, and discussing the importance of seeking support from each other.","event":80,"values":[0.052135489881038666,0.023399654775857925,-0.017508402466773987,0.001793084666132927,-0.03304360434412956,-0.043916910886764526,-0.04704616218805313,-0.04055733233690262,0.010296217165887356,-0.0016355211846530437,0.027272986248135567,0.03974681720137596,0.005704553797841072]},{"text":"We’re not discussing the specifics of our jobs, but rather, the feeling of being adrift.","event":81,"values":[0.02171054109930992,0.016743987798690796,-0.013818888925015926,0.0010405424982309341,-0.02087768167257309,-0.020095854997634888,-0.03256601095199585,-0.03721938282251358,0.02724466100335121,0.005619918927550316,0.012043939903378487,0.029482128098607063,0.007519152015447617]},{"text":"I’ve begun to offer short, reflective prompts – “What’s one thing you’re grateful for today?” – encouraging students to consider their own priorities.","event":82,"values":[0.020465869456529617,0.029200632125139236,-0.008869281969964504,-0.010596598498523235,-0.03078295662999153,-0.029871009290218353,-0.038827016949653625,-0.03352835774421692,0.03600803762674332,0.0016241283155977726,0.01014331541955471,0.036524608731269836,0.01593456044793129]},{"text":"I’ve started a simple, handwritten note on a piece of paper, offering a brief, supportive observation – “Your thought process is very thoughtful, and I’ laptops hope you’ll continue to explore it.”\n\n**(A gentle smile appears)\n\n...","event":83,"values":[0.042969875037670135,0.05726597458124161,0.00468905596062541,0.004900496918708086,-0.04356471821665764,-0.04053528606891632,-0.06806100904941559,-0.07117689400911331,0.0020308131352066994,-0.005612802226096392,0.0165064949542284,0.05504000559449196,0.02121695503592491]},{"text":"and then, a single, small flower pushing its way through the concrete.","event":84,"values":[0.06517761945724487,0.07374273240566254,0.008652821183204651,-0.0014835512265563011,-0.0619422048330307,-0.06537649035453796,-0.08525118976831436,-0.0805058479309082,-0.009906711988151073,-0.010116790421307087,0.028747938573360443,0.06645651161670685,0.031026722863316536]},{"text":"It’s a rose, a vibrant crimson, almost defiant against the grey.","event":85,"values":[0.08743105083703995,0.0689966231584549,0.017886603251099586,-0.006650123745203018,-0.06275323033332825,-0.07108915597200394,-0.08859238028526306,-0.07327580451965332,-0.014248828403651714,-0.00590513925999403,0.015150046907365322,0.05908626317977905,0.017578721046447754]},{"text":"It’s a reminder that even in the midst of a sudden shift, something new and unexpected can emerge.","event":86,"values":[0.05770713463425636,0.055879440158605576,0.018839869648218155,-0.044834647327661514,-0.06599272787570953,-0.06941823661327362,-0.04816751554608345,-0.011893898248672485,0.018942490220069885,-0.007105478085577488,0.009553525596857071,0.024214070290327072,0.029058095067739487]},{"text":"(I lean slightly forward, my gaze softening)\n\n“It’s a reminder that even when things feel uncertain, there’s always the potential for something new to bloom.","event":87,"values":[0.031544167548418045,0.047015197575092316,0.017690200358629227,-0.034897372126579285,-0.04198525473475456,-0.061020322144031525,-0.0360889658331871,-0.009807083755731583,0.03642886504530907,-0.0006553232669830322,0.011463518254458904,0.008313510566949844,0.020570866763591766]},{"text":"It’s a promise of growth, perhaps, or just a reminder to look for the colour in the grey.”\n\n(I pause, allowing the image to linger on the page)\n\n\"Perhaps… it's a sign that the path isn't always straight, but it's always leading somewhere.","event":88,"values":[0.020840724930167198,0.030972342938184738,0.005091827362775803,-0.031241022050380707,-0.03876703232526779,-0.0550011470913887,-0.032208770513534546,-0.008824417367577553,0.048976168036460876,0.010638780891895294,0.021855104714632034,0.001603228971362114,0.02473299950361252]},{"text":"And that direction is, in itself, a kind of journey.\"","event":89,"values":[0.013778126798570156,0.029726913198828697,0.0026055406779050827,-0.030709173530340195,-0.037729598581790924,-0.057062581181526184,-0.033966321498155594,-0.009155570529401302,0.05334215983748436,0         const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
