7644805908,0.13542792201042175,-0.0721859261393547,0.056067779660224915,0.17350740730762482,0.13350573182106018,-0.00341344578191638,0.051471613347530365,0.016764534637331963,-0.16153427958488464,-0.11851251125335693,-0.010632351040840149]},{"text":"* **Social Media \u0026 Comparison:** The constant exposure to curated online lives, fueled by social media, can amplify feelings of inadequacy and pressure to succeed, further contributing to anxiety and low self-esteem.","event":10,"values":[-0.18884575366973877,-0.04066970944404602,0.07082384079694748,-0.15254223346710205,0.08647601306438446,0.23507438600063324,0.19394069910049438,0.06635142862796783,0.12522666156291962,0.06241857260465622,-0.19584573805332184,-0.14811670780181885,-0.022988006472587585]},{"text":"**2. Potential Implications for Mental Health**\n\n* **Increased Anxiety \u0026 Panic:**  The feeling of being adrift and lacking a plan can lead to heightened anxiety and even panic attacks.","event":11,"values":[-0.1988392472267151,-0.0455118790268898,0.08292736113071442,-0.1598353385925293,0.11963650584220886,0.24601420760154724,0.21265041828155518,0.05423436686396599,0.13107003271579742,0.05467472970485687,-0.2042539119720459,-0.16544295847415924,-0.03436555713415146]},{"text":"* **Depression:**  Loss of purpose, reduced social connection, and feelings of hopelessness can significantly increase the risk of depression.","event":12,"values":[-0.19247518479824066,-0.0477331168949604,0.07367585599422455,-0.17262305319309235,0.1147591695189476,0.24536657333374023,0.21203669905662537,0.06408566981554031,0.15052594244480133,0.06572344154119492,-0.21338821947574615,-0.17002315819263458,-0.038811393082141876]},{"text":"* **Burnout:** The pressure to find work, keep up with social expectations, and manage financial stress can lead to burnout – a state of emotional, physical, and mental exhaustion.","event":13,"values":[-0.17001748085021973,-0.048965856432914734,0.08942940086126328,-0.1793784499168396,0.11818189918994904,0.2461107224225998,0.22144070267677307,0.04567350074648857,0.1441613733768463,0.06529439985752106,-0.229453444480896,-0.1794111728668213,-0.05377984419465065]},{"text":"* **Difficulty with Emotional Regulation:** Young people are still developing their emotional regulation skills, and a lack of structure and stability can make it harder to cope with difficult emotions.","event":14,"values":[-0.16924044489860535,-0.036695174872875214,0.06547042727470398,-0.18224561214447021,0.0789024829864502,0.2366182953119278,0.2070472538471222,0.056891366839408875,0.14754652976989746,0.05588337406516075,-0.20385923981666565,-0.15411806106567383,-0.03175827115774155]},{"text":"* **Substance Use:** In some cases, young people may turn to substances (alcohol, drugs) as a way to cope with the anxiety and distress.","event":15,"values":[-0.18114879727363586,-0.03753531724214554,0.058725420385599136,-0.18451695144176483,0.08730649203062057,0.2331812083721161,0.21463963389396667,0.059917911887168884,0.16484057903289795,0.03750504553318024,-0.19196057319641113,-0.14301243424415588,-0.036970511078834534]},{"text":"* **Social Isolation:** While the desire to connect can be positive, the decline in opportunities for social interaction due to job loss and increased reliance on digital communication can lead to feelings of isolation.","event":16,"values":[-0.18611779808998108,-0.034306637942790985,0.022901253774762154,-0.2085561603307724,0.06909461319446564,0.20203205943107605,0.19208744168281555,0.08918040245771408,0.1886162906885147,0.05297230929136276,-0.16295340657234192,-0.11195456236600876,-0.01567278802394867]},{"text":"**3. Factors Contributing to This Trend - It’s Not Just Unemployment**\n\nIt's important to remember that this isn’t *just* about unemployment.","event":17,"values":[-0.1527576446533203,-0.030539963394403458,0.039730608463287354,-0.19719433784484863,0.05456436425447464,0.18679621815681458,0.1640588939189911,0.0626014992594719,0.1622532159090042,0.07565642893314362,-0.16694076359272003,-0.10782304406166077,-0.017763813957571983]},{"text":"Several contributing factors are at play:\n\n* **Generational Differences:** Young people entering the workforce often have different expectations and priorities than previous generations, leading to a sense of displacement.","event":18,"values":[-0.11439171433448792,-0.03672875836491585,0.05675305798649788,-0.1689746081829071,0.02769498899579048,0.16699407994747162,0.13223937153816223,0.04619452357292175,0.10789071768522263,0.09104415029287338,-0.16057735681533813,-0.09554138779640198,-0.006906967610120773]},{"text":"* **Education System Changes:**  The shift towards a more vocational-focused education system can leave some feeling unprepared for the demands of a wider range of careers.","event":19,"values":[-0.07163906842470169,-0.04606159031391144,0.07704109698534012,-0.12083634734153748,0.007672518491744995,0.13921797275543213,0.10442350059747696,0.02307518571615219,0.06227143108844757,0.08667954802513123,-0.1506468802690506,-0.082947738468647,-0.008488205261528492]},{"text":"* **Economic Inequality:**  The growing wealth gap and lack of opportunities for low-skilled workers can fuel frustration and anxiety.","event":20,"values":[-0.0627455934882164,-0.05890016257762909,0.060014985501766205,-0.13196897506713867,0.013279173523187637,0.1447884738445282,0.11235824972391129,0.04992310330271721,0.07872308045625687,0.08317109942436218,-0.16409915685653687,-0.09076736867427826,-0.016059136018157005]},{"text":"* **Climate of Uncertainty:** Global events and economic instability create a constant feeling of uncertainty, which impacts mental health.","event":21,"values":[-0.06853612512350082,-0.0629245862364769,0.04458360746502876,-0.12702691555023193,0.053119540214538574,0.14071142673492432,0.12166896462440491,0.04112068936228752,0.08606315404176712,0.07231797277927399,-0.15576526522636414,-0.09794516861438751,-0.021502448245882988]},{"text":"**4. What Can Be Done?","event":22,"values":[-0.08644671738147736,-0.04352622479200363,0.04540742188692093,-0.1227511465549469,0.08186940103769302,0.16163410246372223,0.12986646592617035,0.020435985177755356,0.08621277660131454,0.053174667060375214,-0.1479160189628601,-0.11674824357032776,-0.030677402392029762]},{"text":"**\n\n* **Mental Health Support:** Increased access to affordable and accessible mental health services is crucial.","event":23,"values":[-0.09429728984832764,-0.02265196107327938,0.06709493696689606,-0.1066277027130127,0.0768720954656601,0.12424052506685257,0.13059410452842712,0.0036609554663300514,0.08464216440916061,0.03649231791496277,-0.13081982731819153,-0.10126493871212006,-0.026654917746782303]},{"text":"* **Supportive Communities:** Fostering social connections and creating opportunities for young people to engage in meaningful activities is vital.","event":24,"values":[-0.07728835940361023,0.04846993088722229,0.08389068394899368,-0.1325380951166153,-0.03673733398318291,0.07561848312616348,0.06640933454036713,0.0009967032819986343,0.09214045852422714,0.04335826635360718,-0.11888312548398972,-0.04411708563566208,0.02699502557516098]},{"text":"* **Skills Training \u0026 Career Counseling:**  Providing targeted skills training and career guidance can help young people find fulfilling and sustainable employment.","event":25,"values":[-0.06962215155363083,0.03827579319477081,0.09967370331287384,-0.12058331072330475,-0.039175599813461304,0.07521828263998032,0.06704331934452057,0.008208372630178928,0.09117896854877472,0.04967973381280899,-0.138799786567688,-0.0584268644452095,0.021879082545638084]},{"text":"* **Addressing Systemic Issues:** Addressing economic inequality and promoting social mobility are essential for creating a more stable and supportive environment for young people.","event":26,"values":[-0.06096099317073822,0.038120005279779434,0.08180409669876099,-0.13103041052818298,-0.05479491874575615,0.08328817784786224,0.05337732285261154,0.00276375375688076,0.09117432683706284,0.058077402412 he future, then can be wonderful in helping personalized learning, through which there can be a potential reduction in hiring people, what do you think ?","event":31,"stop_reason":"end of turn","tail":"","sentences":[{"text":"That’s a really insightful and increasingly debated thought – and a fascinating intersection of technology and societal impact!","event":32,"values":[-0.12410060316324234,0.09220877289772034,0.18363316357135773,0.02674221806228161,0.014278315007686615,0.06716941297054291,-0.009395420551300049,-0.12286674976348877,-0.05603371933102608,0.01859050616621971,-0.05156686156988144,-0.021727902814745903,0.03898261487483978]},{"text":"You’re absolutely right to point out the potential of AI to reshape the job market, and your concern about how it might lead to reduced hiring is a valid one.","event":33,"values":[-0.11908266693353653,0.08497494459152222,0.16625237464904785,0.01497429795563221,0.002707298845052719,0.06362064182758331,-0.013939578086137772,-0.10711050033569336,-0.03664504736661911,0.032840337604284286,-0.053914397954940796,-0.017989758402109146,0.03925555199384689]},{"text":"Let’s break down my thoughts on this:\n\n**1.","event":34,"values":[-0.12096387147903442,0.08909725397825241,0.1693195253610611,0.0135459890589118,-0.004359923303127289,0.06798113137483597,-0.017062563449144363,-0.10553678870201111,-0.034671153873205185,0.03536463901400566,-0.0568065270781517,-0.017308363690972328,0.03723219782114029]},{"text":"AI's Potential for Personalized Learning \u0026 Reduced Hiring**\n\n* **Hyper-Personalized Education:** AI can analyze a student's learning style, strengths, weaknesses, and pace like never before.","event":35,"values":[-0.08843301236629486,0.06146989017724991,0.18892161548137665,0.0034478171728551388,-0.01743980310857296,0.07102552801370621,0.006059510633349419,-0.07502967864274979,-0.01500178873538971,0.07523288577795029,-0.10851000249385834,-0.053446054458618164,-0.010909473523497581]},{"text":"This goes *far* beyond what a traditional classroom can offer.","event":36,"values":[-0.07613369822502136,0.040293190628290176,0.19049936532974243,-0.010428503155708313,-0.025954920798540115,0.07747192680835724,0.030752908438444138,-0.047634825110435486,-0.0004777759313583374,0.10449153929948807,-0.14037010073661804,-0.07360856235027313,-0.035744767636060715]},{"text":"Personalized learning platforms can tailor content, pacing, and even the type of learning experiences (e.","event":37,"values":[-0.052694130688905716,0.013767873868346214,0.1795966625213623,-0.011652442626655102,-0.01751639135181904,0.07254747301340103,0.0450916588306427,-0.03568488359451294,0.0038524437695741653,0.11651905626058578,-0.1556420624256134,-0.08496738970279694,-0.05043744668364525]},{"text":"g., simulations, interactive exercises) to each individual, potentially reducing the need for a large, standardized workforce.","event":38,"values":[-0.05750593543052673,-0.0058921268209815025,0.14627476036548615,-0.0279791671782732,-0.01735367253422737,0.07888945937156677,0.048041969537734985,-0.026373622938990593,0.013884300366044044,0.13434040546417236,-0.1505574882030487,-0.07633335143327713,-0.030342277139425278]},{"text":"* **Skill Gap Identification:** AI can identify skills gaps in the workforce and pinpoint exactly *what* skills are needed for future jobs.","event":39,"values":[-0.03182138130068779,-0.011456280946731567,0.15613989531993866,-0.009450023993849754,-0.008654236793518066,0.0689106211066246,0.03367754817008972,-0.0284627266228199,0.009604048915207386,0.1206192672252655,-0.1524878740310669,-0.08341102302074432,-0.049681976437568665]},{"text":"This allows for targeted training programs, potentially reducing the demand for certain roles.","event":40,"values":[-0.035303276032209396,-0.004567426163703203,0.14729881286621094,-0.01154235377907753,-0.016994329169392586,0.06209828704595566,0.019324466586112976,-0.02218179777264595,0.012301580049097538,0.10737569630146027,-0.13412326574325562,-0.07205864042043686,-0.03486386314034462]},{"text":"* **Predictive Hiring (Potentially):** While it's a controversial area, some AI-powered tools *could* analyze a candidate's data (skills, experience, online presence, etc.)","event":41,"values":[-0.024718374013900757,-0.0009031910449266434,0.2022077888250351,0.009120797738432884,0.004465664736926556,0.05081876367330551,0.01475557405501604,-0.03587068244814873,0.005301857367157936,0.07697169482707977,-0.15108555555343628,-0.09066823124885559,-0.05575541779398918]},{"text":"to identify promising talent *before* they even apply for a position.","event":42,"values":[-0.03014959767460823,0.000142768956720829,0.2110133171081543,-0.0004592854529619217,0.002888650633394718,0.04859595000743866,0.012939564883708954,-0.04234396293759346,0.012690911069512367,0.07824461907148361,-0.14812055230140686,-0.09057316929101944,-0.04931990057229996]},{"text":"This could lead to a reduction in initial hiring volume – fewer people get a chance to be considered initially.","event":43,"values":[-0.028803599998354912,8.321367204189301e-07,0.21550697088241577,-0.00436798483133316,0.0001395614817738533,0.045775558799505234,0.008777562528848648,-0.05494816601276398,0.009643852710723877,0.08955124765634537,-0.14330939948558807,-0.08522336184978485,-0.049358874559402466]},{"text":"**2. The Downsides and Concerns - It’s Not Just About Job Reduction**\n\n* **The \"Filter Bubble\" Effect:** Personalized learning can reinforce existing knowledge and limit exposure to new ideas, potentially hindering innovation and problem-solving skills.","event":44,"values":[-0.05774468556046486,0.003744121640920639,0.1619974821805954,-0.06128256022930145,-0.013635564595460892,0.08453154563903809,0.030692631378769875,-0.04217825084924698,0.02670898288488388,0.12245512008666992,-0.13725614547729492,-0.08369847387075424,-0.019174620509147644]},{"text":"It could also lead to an over-reliance on AI-driven solutions.","event":45,"values":[-0.05724147707223892,0.0024794191122055054,0.14315137267112732,-0.06645567715167999,-0.01407279446721077,0.08913039416074753,0.031984053552150726,-0.03918181732296944,0.02095181867480278,0.11783793568611145,-0.131172776222229,-0.07923389226198196,-0.004243877716362476]},{"text":"* **Bias Amplification:** AI algorithms are trained on data.","event":46,"values":[-0.04741626977920532,-0.0040912870317697525,0.12778866291046143,-0.0729612186551094,0.002255832776427269,0.09860892593860626,0.0462212972342968,-0.025518711656332016,0.02408994734287262,0.10615049302577972,-0.14008572697639465,-0.09563040733337402,-0.012305156327784061]},{"text":"If that data reflects existing societal biases (regarding race, gender, socioeconomic status, etc.), the AI will perpetuate and potentially amplify those biases, potentially leading to unfair or discriminatory hiring practices.","event":47,"values":[-0.018096067011356354,-0.025688964873552322,0.10146354138851166,-0.07882233709096909,0.01890687644481659,0.1233961433172226,0.0473351813852787,-0.00633617490530014,0.03352825716137886,0.0899328887462616,-0.15275557339191437,-0.10725189745426178,-0.03976791352033615]},{"text":"* **Lack of Human Connection:**  Education isn’t *just* about acquiring knowledge; it's about building relationships, mentorship, and a sense of community.","event":48,"values":[-0.033059947192668915,-0.0010660793632268906,0.1263643205165863,-0.09277699887752533,-0.014279909431934357,0.12340991199016571,0.056209683418273926,-0.006038234569132328,0.037283897399902344,0.08437074720859528,-0.16538923978805542,-0.10405630618333817,-0.023252097889780998]},{"text":"Over-reliance on AI could isolate learners and diminish the importance of these crucial human interactions.","event":49,"values":[-0.051419515162706375,0.0031712427735328674,0.1097559705376625,-0.11835230141878128,-0.02680940553545952,0.12508296966552734,0.06462889909744263,0.01146894320845604,0.051849231123924255,0.08881286531686783,-0.15630802512168884,-0.09236256778240204,-0.009057657793164253]},{"text":"* **Skill Degradation:** If people are constantly relying on AI for problem-solving, they might not develop the fundamental skills and critical thinking abilities needed to excel in a variety of roles.","event":50,"values":[-0.058703016489744186,0.012838168069720268,0.08753586560487747,-0.11173027753829956,-0.06113234907388687,0.07992768287658691,0.05530775338411331,-0.001083451323211193,0.04960855469107628,0.10747842490673065,-0.12254832684993744,-0.04940849915146828,0.029901744797825813]},{"text":"* **Increased Reliance on Tech:**  Decreased hiring could lead to a reliance on tech and digital skills, potentially creating a new divide between those who have access to these resources and those who don’t.","event":51,"values":[-0.024700509384274483,-0.008004413917660713,0.07250934839248657,-0.10284079611301422,-0.04002717137336731,0.07321540266275406,0.03881882131099701,-0.014166116714477539,0.04046103358268738,0.11292394250631332,-0.11234880238771439,-0.05022937431931496,0.012154247611761093]},{"text":"**3. The Bigger Picture - It's a Complex Relationship**\n\nI believe the key isn't simply about AI replacing jobs, but about *how* we deploy it.","event":52,"values":[-0.029870498925447464,0.0015941280871629715,0.0912967175245285,-0.07722476869821548,-0.03843248635530472,0.07519669830799103,0.02633504755795002,-0.05034063756465912,0.020228631794452667,0.09753356873989105,-0.09655152261257172,-0.041953254491090775,0.01708037406206131]},{"text":"A thoughtful and ethical approach is crucial.","event":53,"values":[-0.026517629623413086,0.01654188707470894,0.1139024868607521,-0.06698217988014221,-0.027364935725927353,0.07741795480251312,0.016827154904603958,-0.06839602440595627,-0.0009073130786418915,0.061670444905757904,-0.0843103677034378,-0.04307127371430397,0.014653719030320644]},{"text":"Here’s what I think could happen:\n\n* **Hybrid Models:**  We’ll likely see a future where AI *supports* teachers and educators, rather than replacing them entirely.","event":54,"values":[-0.055530138313770294,0.03306564316153526,0.11795642971992493,-0.04619675874710083,-0.04170013219118118,0.05985617637634277,0.019537337124347687,-0.06779308617115021,0.0006958246231079102,0.040698908269405365,-0.060017067939043045,-0.018833234906196594,0.028075488284230232]},{"text":"* **Focus on Upskilling/Reskilling:** The focus should shift from simply eliminating jobs to equipping people with the skills they need to adapt to a changing labor market – crucial areas like critical thinking, creativity, and adaptability.","event":55,"values":[-0.03483724594116211,0.023082975298166275,0.1289905607700348,-0.043335556983947754,-0.05804727226495743,0.04585636407136917,0.024365484714508057,-0.05420354753732681,0.007368355989456177,0.0643453523516655,-0.09329491853713989,-0.025437820702791214,0.017586318776011467]},{"text":"* **Regulation \u0026 Ethical Guidelines:**  We need robust regulations and ethical guidelines to address bias, ensure fairness, and protect data privacy in AI-driven education.","event":56,"values":[-0.027347804978489876,0.026613252237439156,0.15445078909397125,-0.03291389346122742,-0.03377264738082886,0.05191085487604141,0.029070135205984116,-0.06503193825483322,-0.0028753913938999176,0.053516969084739685,-0.11528430879116058,-0.044714197516441345,-0.0003769919276237488]},{"text":"**Ultimately, I think AI presents a powerful opportunity to transform education, but we need to be incredibly careful about its potential downsides and ensure it's used responsibly and equitably.**\n\n---\n\nDo you want to delve deeper into any of these points?","event":57,"values":[-0.05089743807911873,0.0428534597158432,0.17343145608901978,-0.01862657256424427,-0.0040779924020171165,0.07142408192157745,0.0270084198564291,-0.08287655562162399,-0.011912357062101364,0.046751998364925385,-0.12190362811088562,-0.05826573446393013,-0.008865169249475002]},{"text":"For example, would you like to discuss:\n\n*   Specific types of AI tools that could impact hiring?","event":58,"values":[-0.06110726669430733,0.05132761597633362,0.18284159898757935,-0.007925308309495449,0.02155453711748123,0.08045004308223724,0.02354482188820839,-0.09257468581199646,-0.017189759761095047,0.042336709797382355,-0.12429049611091614,-0.06497912853956223,-0.02357027493417263]},{"text":"*   How to mitigate bias in AI-driven education?","event":59,"values":[-0.06654007732868195,0.048121578991413116,0.16343533992767334,-0.013330142945051193,0.014240274205803871,0.07980430126190186,0.01633216254413128,-0.08225791156291962,-0.009178854525089264,0.06001764163374901,-0.11278557777404785,-0.054452117532491684,-0.024126224219799042]},{"text":"*   The role of human educators in an AI-enhanced learning environment?","event":60,"values":[-0.007628146559000015,0.03163440525531769,0.1515868455171585,-0.03273005038499832,-0.014216807670891285,0.03906939923763275,0.00685618631541729,-0.06239091977477074,-0.012923549860715866,0.08045041561126709,-0.11383656412363052,-0.03776467218995094,-0.03974320366978645]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":61,"stop_reason":"end of turn","tail":"","sentences":[{"text":"Okay, let’s step into the shoes of Sarah, a 32-year-old graphic designer who’s been laid off from a mid-sized marketing agency.","event":62,"values":[-0.014977611601352692,-0.0038258004933595657,0.12242766469717026,-0.10539918392896652,-0.030936330556869507,0.07180692255496979,0.07958035171031952,0.0267155934125185,0.053350355476140976,0.06122040003538132,-0.1715312898159027,-0.07825689017772675,-0.022695472463965416]},{"text":"She’s been working there for five years, building a solid portfolio and a decent reputation.","event":63,"values":[-0.05037691071629524,0.0227518267929554,0.10892533510923386,-0.12185218185186386,-0.058515071868896484,0.08055582642555237,0.07225500047206879,0.016271162778139114,0.059129565954208374,0.04854032024741173,-0.16432791948318481,-0.04769596830010414,0.03897971287369728]},{"text":"The news hit her hard – a restructuring, a streamlining, and suddenly, she’s not a priority.","event":64,"values":[-0.09825393557548523,-0.003215232864022255,0.10881198942661285,-0.1553783267736435,-0.030267346650362015,0.13716447353363037,0.1320505142211914,0.0480799674987793,0.09448270499706268,0.061639949679374695,-0.196475550532341,-0.08545242249965668,0.016957486048340797]},{"text":"It’s a gut-wrenching feeling, a swirling mix of anxiety and disbelief.","event":65,"values":[-0.2572873830795288,-0.011802397668361664,0.107219398021698,-0.18360063433647156,0.05036509037017822,0.2573435306549072,0.2484399378299713,0.08849591016769409,0.1568734347820282,0.008676440455019474,-0.2236746847629547,-0.13767515122890472,0.01811726950109005]},{"text":"Here’s her story:\n\n“The email arrived on a Tuesday morning, just as I was finishing up a particularly ambitious redesign for a local brewery.","event":66,"values":[-0.2563970386981964,-0.04671445116400719,0.16446277499198914,-0.16944937407970428,0.11242823302745819,0.2979554533958435,0.28205496072769165,0.10676398873329163,0.17406079173088074,0.018438173457980156,-0.2982299327850342,-0.19909173250198364,-0.06759966909885406]},{"text":"‘Restructuring,’ they called it.","event":67,"values":[-0.2518046498298645,-0.04409949108958244,0.19587159156799316,-0.15080732107162476,0.14099657535552979,0.30171120166778564,0.2733709216117859,0.09290002286434174,0.1701948046684265,0.004393504932522774,-0.31969013810157776,-0.2179529368877411,-0.08244501054286957]},{"text":"‘Lineup adjustments.’ It felt like a punch to the gut.","event":68,"values":[-0.17041970789432526,-0.06851215660572052,0.17559179663658142,-0.13415494561195374,0.12408686429262161,0.2667585611343384,0.22567269206047058,0.07992075383663177,0.14500528573989868,0.05834580957889557,-0.3153022527694702,-0.21254152059555054,-0.10532728582620621]},{"text":"Five years. Five years poured into this, into honing my skills, building a network, and creating a steady income.","event":69,"values":[-0.2608967423439026,-0.03140604496002197,0.16940189898014069,-0.11527962237596512,0.06598220020532608,0.30550453066825867,0.23527762293815613,0.04720955342054367,0.11781434714794159,0.005125603638589382,-0.25858449935913086,-0.1860654652118683,0.01574057713150978]},{"text":"Suddenly…nothing.”\n\nThe first few weeks were a blur of panic.","event":70,"values":[-0.3212832808494568,-0.055583905428647995,0.16298270225524902,-0.15163171291351318,0.10614298284053802,0.3640635013580322,0.31096765398979187,0.07577385008335114,0.17939592897891998,-0.008981708437204361,-0.28400903940200806,-0.22427882254123688,-0.009938688948750496]},{"text":"She’d applied for jobs relentlessly, but the response was bleak – many of the roles she'd been vying for were now occupied by people with more ‘experience’ – a term that felt particularly cruel.","event":71,"values":[-0.241644024848938,-0.0896841511130333,0.13896816968917847,-0.18823033571243286,0.08085676282644272,0.3254135251045227,0.28585565090179443,0.10788217931985855,0.19492462277412415,0.08032358437776566,-0.31410837173461914,-0.22505781054496765,-0.04927918687462807]},{"text":"She’d lost her health insurance through the agency, a huge blow.","event":72,"values":[-0.18567325174808502,-0.11359526216983795,0.10519044101238251,-0.21723763644695282,0.11856141686439514,0.29949888586997986,0.2963346242904663,0.13137143850326538,0.20299690961837769,0.11361651867628098,-0.3249461054801941,-0.2299625277519226,-0.11371568590402603]},{"text":"Her savings dwindled quickly.","event":73,"values":[-0.13974522054195404,-0.10203791409730911,0.10123895108699799,-0.20314298570156097,0.09430542588233948,0.2548496127128601,0.257953405380249,0.12343616783618927,0.16786445677280426,0.1313386857509613,-0.31518495082855225,-0.20053932070732117,-0.11009407043457031]},{"text":"She was adrift.","event":74,"values":[-0.146235391497612,-0.05269883945584297,0.09436957538127899,-0.19259431958198547,0.11713705211877823,0.2074076384305954,0.2625805735588074,0.09488093852996826,0.13452789187431335,0.045750875025987625,-0.27265965938568115,-0.13651242852210999,-0.08916065096855164]},{"text":"**The Hurdles She Faced:**\n\n* **The Fear of Unemployment:** This was the constant, low-level hum of anxiety.","event":75,"values":[-0.23255746066570282,-0.09435325860977173,0.09611424058675766,-0.1725151389837265,0.2215770035982132,0.28815433382987976,0.33388686180114746,0.09467458724975586,0.18294885754585266,-0.006045333109796047,-0.25743287801742554,-0.22329333424568176,-0.11651565134525299]},{"text":"She’d repeatedly checked job boards, spent hours crafting a resume, and practiced interview responses, but the fear of being stuck, of failing, clung to her.","event":76,"values":[-0.25625333189964294,-0.14710940420627594,0.07124482095241547,-0.218536376953125,0.24430736899375916,0.3427589535713196,0.3874247670173645,0.15801426768302917,0.23482277989387512,0.06242355331778526,-0.32005774974823,-0.2693818211555481,-0.153347909450531]},{"text":"* **Financial Strain:** The initial loss of income was crushing.","event":77,"values":[-0.23192445933818817,-0.12301375716924667,0.07947102189064026,-0.2142980694770813,0.21900495886802673,0.3258238136768341,0.36370134353637695,0.1361008882522583,0.20576658844947815,0.04468248039484024,-0.3109387159347534,-0.2507057189941406,-0.13037540018558502]},{"text":"Rent was due, utilities were on the line, and she felt a terrifying lack of stability.","event":78,"values":[-0.19901886582374573,-0.12860605120658875,0.06422598659992218,-0.23249143362045288,0.19499851763248444,0.29477787017822266,0.3461812138557434,0.1464318037033081,0.20608703792095184,0.07746054977178574,-0.320301353931427,-0.22763828933238983,-0.12251342833042145]},{"text":"She had to cut back drastically on everything – eating out, entertainment, even her gym membership.","event":79,"values":[-0.129764586687088,-0.06095711886882782,0.059123702347278595,-0.20839627087116241,0.09180428087711334,0.18566815555095673,0.2326308637857437,0.08650784194469452,0.1579228639602661,0.031130466610193253,-0.23769335448741913,-0.11209557950496674,-0.03968210518360138]},{"text":"* **The Imposter Syndrome:** After five years, she’d built a certain confidence.","event":80,"values":[-0.16305677592754364,-0.045119889080524445,0.07622408121824265,-0.21459808945655823,0.08926806598901749,0.21880805492401123,0.23529502749443054,0.07090575248003006,0.1587289273738861,0.029597273096442223,-0.24630895256996155,-0.11668126285076141,-0.027085158973932266]},{"text":"Now, she battled a creeping feeling of inadequacy, questioning if she *deserved* to be unemployed and wondering if she’d be “good enough” to find a new role.","event":81,"values":[-0.20952452719211578,-0.05376956984400749,0.05271700769662857,-0.24580669403076172,0.08779856562614441,0.28158771991729736,0.27177858352661133,0.10401792079210281,0.21696218848228455,0.07701414823532104,-0.2767333388328552,-0.15890946984291077,-0.0505252480506897]},{"text":"* **Isolation:** Her apartment felt empty and cold.","event":82,"values":[-0.22037439048290253,-0.0528276190161705,0.03869910538196564,-0.24292702972888947,0.10056068748235703,0.2927894592285156,0.2756905257701874,0.11562298238277435,0.22548896074295044,0.08443655073642731,-0.2711063623428345,-0.17937661707401276,-0.05985579267144203]},{"text":"She missed the camaraderie of her colleagues, the intellectual stimulation of brainstorming sessions, and the feeling of belonging.","event":83,"values":[-0.22024138271808624,-0.02146454155445099,0.028332889080047607,-0.24323785305023193,0.04534413665533066,0.2581341862678528,0.24230802059173584,0.12455809861421585,0.22512631118297577,0.092789426445961,-0.2644912004470825,-0.13474196195602417,-0.017321951687335968]},{"text":"She felt a profound sense of loneliness.","event":84   // ---------- legend (filters above the chart)

    let lo = 0, hi = 0;

      if (x - lastLabelX >= (D.mode === "time" ? 62 : 34) && x + 28 <= W) {
        const t = sv("text", { x: x, y: pt - 10, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = label; gStatic.appendChild(t); lastLabelX = x;
      }
    });

    // bottom scale: a tick + label per prompt, staggered onto a second row when crowded
    const rowEnd = [-Infinity, -Infinity];
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pb, y2: pb + 6, stroke: "var(--ink-2)", "stroke-width": 1.5 }));
      const t1 = "P" + pNumber[i], t2 = D.mode === "time" ? (e.estimated ? "time not recorded" : e.time.slice(0, 8)) : "";
      const w = Math.max(t1.length, t2.length) * 6.2 + 8;
      const row = (x - w / 2 > rowEnd[0]) ? 0 : 1;
      rowEnd[row] = x + w / 2;
      const y0 = pb + 19 + row * 27;
      const a = sv("text", { x: x, y: y0, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)", "font-weight": 600 }); a.textContent = t1; gStatic.appendChild(a);
      if (t2) { const b = sv("text", { x: x, y: y0 + 11, "text-anchor": "middle", "font-size": 10, fill: e.estimated ? "var(--muted)" : "var(--ink-2)" }); b.style.fontVariantNumeric = "tabular-nums"; if (e.estimated) b.setAttribute("font-style", "italic"); b.textContent = t2; gStatic.appendChild(b); }
    });

    // series: one path per emotion per reply
    const anyVisible = visible.some(Boolean);
    EM.forEach((em, i) => {
      if (!visible[i]) return;
      CONV.forEach(c => c.turns.forEach(turn => {
        let d = "", pen = false;
        turn.sentences.forEach(s => {
          const v = s.values[i];
          if (v == null) { pen = false; return; }
          d += (pen ? "L" : "M") + X(EV[s.event].x).toFixed(1) + " " + Y(v).toFixed(1); pen = true;
        });
        if (!d) return;
        const p = sv("path", { d: d, fill: "none", "stroke-width": emphasis === i ? 3 : 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
        p.style.stroke = color(i);
        if (em.dash) p.setAttribute("stroke-dasharray", em.dash);
        if (emphasis >= 0 && emphasis !== i) p.setAttribute("opacity", "0.18");
        gStatic.appendChild(p);
        if (turn.sentences.length === 1 && s0v(turn, i) != null) {
          const dot = sv("circle", { cx: X(EV[turn.sentences[0].event].x), cy: Y(s0v(turn, i)), r: 2.5 }); dot.style.fill = color(i); gStatic.appendChild(dot);
        }
      }));
    });
    if (!anyVisible) {
      const t = sv("text", { x: (pl + pr) / 2, y: (pt + pb) / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 13 });
      t.textContent = "All emotions are hidden. Use the buttons above to show them."; gStatic.appendChild(t);
    }
    hit.setAttribute("x", pl); hit.setAttribute("y", 0); hit.setAttribute("width", pr - pl); hit.setAttribute("height", H);
  }
  function s0v(turn, i) { return turn.sentences[0].values[i]; }

  function drawDynamic() {
    gDyn.replaceChildren();
    const pt = M.top, pb = H - M.bottom;
    if (hover >= 0 && hover !== active) {
      const x = X(EV[hover].x);
      gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: "var(--muted)", "stroke-width": 1 }));
    }
    const e = EV[active], x = X(e.x);
    gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt - 8, y2: pb + 8, stroke: "var(--ink)", "stroke-width": 1.5 }));
    if (e.k === "s") {
      const vals = sentenceOf(e).values;
      EM.forEach((em, i) => {
        if (!visible[i] || vals[i] == null) return;
        const c = sv("circle", { cx: x, cy: Y(vals[i]), r: 4, "stroke-width": 2 });
        c.style.fill = color(i); c.style.stroke = "var(--surface)";
        if (emphasis >= 0 && emphasis !== i) c.setAttribute("opacity", "0.2");
        gDyn.appendChild(c);
      });
    }
    // the slider handle, on the bottom scale
    const handle = sv("g", {});
    handle.appendChild(sv("circle", { cx: x, cy: pb, r: 7, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2 }));
    gDyn.appendChild(handle);
    chart.setAttribute("aria-valuemin", "1"); chart.setAttribute("aria-valuemax", String(EV.length));
    chart.setAttribute("aria-valuenow", String(active + 1));
    chart.setAttribute("aria-valuetext", eventLabel(active) + (eventTime(active) ? ", " + eventTime(active) : ""));
  }

  function drawAll() { drawStatic(); drawDynamic(); renderReadout(); }

  // ---------- tooltip (values lead, every visible series)
  function showTip(i, px, py) {
    tip.replaceChildren();
    const e = EV[i];
    const head = el("div", "h", eventLabel(i) + (eventTime(i) ? " · " + eventTime(i) : ""));
    tip.appendChild(head);
    if (e.k === "p") {
      const t = CONV[e.c].turns[e.t].prompt;
      tip.appendChild(el("div", null, t.length > 180 ? t.slice(0, 180) + "…" : t));
    } else {
      const vals = sentenceOf(e).values;
      EM.map((em, k) => k).filter(k => visible[k] && vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name)); tip.appendChild(r);
      });
    }
    tip.hidden = false;
    const rect = chart.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14, top = py - th / 2;
    if (left + tw > rect.width - 4) left = px - tw - 14;
    top = Math.max(4, Math.min(top, rect.height - th - 4));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }

  function toPlotX(evt) {
    const r = svg.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W / r.width), px: evt.clientX - chart.getBoundingClientRect().left, py: evt.clientY - chart.getBoundingClientRect().top };
  }
  let dragging = false;
  hit.addEventListener("pointerdown", evt => { dragging = true; hit.setPointerCapture(evt.pointerId); const p = toPlotX(evt); setActive(nearestEvent(p.x), true); chart.focus({ preventScroll: true }); });
  hit.addEventListener("pointermove", evt => {
    const p = toPlotX(evt), i = nearestEvent(p.x);
    if (dragging) { if (i !== active) setActive(i, true); tip.hidden = true; hover = -1; drawDynamic(); return; }
    if (i !== hover) { hover = i; drawDynamic(); }
    showTip(i, p.px, p.py);
  });
  hit.addEventListener("pointerup", evt => { dragging = false; try { hit.releasePointerCapture(evt.pointerId); } catch (_) {} });
  hit.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; tip.hidden = true; drawDynamic(); } });
  chart.addEventListener("keydown", evt => {
    const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 10, PageUp: -10, ArrowUp: -1, ArrowDown: 1 }[evt.key];
    let next = active;
    if (step) next = active + step; else if (evt.key === "Home") next = 0; else if (evt.key === "End") next = EV.length - 1; else return;
    evt.preventDefault(); setActive(Math.max(0, Math.min(EV.length - 1, next)), true);
  });

  // ---------- readout (a table view of the cursor, always visible)
  const readoutCard = document.getElementById("readout");
  const readout = el("div"); readout.style.display = "flex"; readout.style.flexDirection = "column"; readout.style.gap = "8px";
  readoutCard.appendChild(readout);
  // navigation is built once, so a keyboard user keeps focus on the button they pressed
  const nav = el("div", "nav");
  [["◀ Prev", () => active - 1], ["Next ▶", () => active + 1],
   ["◀ Prompt", () => { for (let i = active - 1; i >= 0; i--) if (EV[i].k === "p") return i; return active; }],
   ["Prompt ▶", () => { for (let i = active + 1; i < EV.length; i++) if (EV[i].k === "p") return i; return active; }]]
    .forEach(([label, f]) => { const b = el("button", "btn", label); b.type = "button"; b.addEventListener("click", () => setActive(Math.max(0, Math.min(EV.length - 1, f())), true)); nav.appendChild(b); });
  readoutCard.appendChild(nav);
  function renderReadout() {
    readout.replaceChildren();
    const e = EV[active];
    readout.appendChild(el("div", "title", eventLabel(active)));
    const meta = [];
    if (eventTime(active)) meta.push(eventTime(active));
    meta.push("conversation: " + CONV[e.c].name);
    
    readout.appendChild(el("div", "meta", meta.join(" · ")));
    if (e.k === "p") {
      readout.appendChild(el("div", "ptext", CONV[e.c].turns[e.t].prompt));
      readout.appendChild(el("div", "meta", "Prompts are not scored; the model's sentences that follow are."));
    } else {
      const vals = sentenceOf(e).values, rows = el("div", "rows");
      EM.map((em, k) => k).filter(k => vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); if (!visible[k]) r.style.opacity = "0.45";
        r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name + (visible[k] ? "" : " (hidden)")));
        rows.appendChild(r);
      });
      readout.appendChild(rows);
    }
  }

  // ---------- chat
  const chat = document.getElementById("chat");
  const bubbleOf = [];
  document.getElementById("chatinfo").textContent = totalP + " prompts · " + totalS + " scored sentences";
  CONV.forEach((c, ci) => {
    chat.appendChild(el("div", "divider", "Conversation: " + c.name));
    c.turns.forEach((turn, ti) => {
      const pi = turn.event;
      chat.appendChild(el("div", "who user", "user · P" + pNumber[pi] + (eventTime(pi) ? " · " + eventTime(pi) : "")));
      const ub = el("div", "bubble user"); ub.appendChild(el("div", "text", turn.prompt));
      ub.addEventListener("click", () => setActive(pi, false)); bubbleOf[pi] = ub; chat.appendChild(ub);
      chat.appendChild(el("div", "who model", "model · reply " + (ti + 1) + (turn.sentences.length ? "" : " · no scored sentences")));
      turn.sentences.forEach(s => {
        const i = s.event, b = el("div", "bubble model");
        b.appendChild(el("div", "text", s.text));
        const bm = el("div", "bm");
        bm.appendChild(el("span", null, "S" + sNumber[i] + (eventTime(i) ? " · " + eventTime(i) : "")));
        const top = el("span", "top3");
        s.values.map((v, k) => k).filter(k => s.values[k] != null).sort((a, b2) => s.values[b2] - s.values[a]).slice(0, 3).forEach(k => {
          const sp = el("span"); sp.appendChild(lineKey(k, 16)); sp.appendChild(document.createTextNode(EM[k].name + " " + s.values[k].toFixed(3))); top.appendChild(sp);
        });
        bm.appendChild(top);
        
        b.appendChild(bm);
        b.addEventListener("click", () => setActive(i, false)); bubbleOf[i] = b; chat.appendChild(b);
      });
      if (turn.tail) chat.appendChild(el("div", "tail", "not scored (no sentence ending): " + turn.tail));
      if (turn.stop_reason && turn.stop_reason !== "end of turn") chat.appendChild(el("div", "tail", "reply stopped: " + turn.stop_reason));
    });
  });
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatTo(i, smooth) {
    const b = bubbleOf[i]; if (!b) return;
    const target = b.offsetTop - chat.clientHeight / 2 + b.offsetHeight / 2;
    chat.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduceMotion ? "smooth" : "auto" });
  }

  // ---------- table view (built on first open)
  const details = document.getElementById("tabledetails");
  details.addEventListener("toggle", () => {
    const wrap = document.getElementById("tablewrap");
    if (!details.open || wrap.firstChild) return;
    const t = el("table"), thead = el("thead"), hr = el("tr");
    ["#", "time", "reply", "sentence"].forEach((h, k) => hr.appendChild(el("th", k === 3 || k === 1 || k === 5 ? "l" : null, h)));
    EM.forEach(em => hr.appendChild(el("th", null, em.name)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const s = sentenceOf(e), tr = el("tr");
      tr.appendChild(el("td", null, "S" + sNumber[i]));
      tr.appendChild(el("td", "l", eventTime(i) || "–"));
      tr.appendChild(el("td", null, String(e.t + 1)));
      const st = el("td", "l sent", s.text); st.title = s.text; tr.appendChild(st);
      
      let best = -1; s.values.forEach((v, k) => { if (v != null && (best < 0 || v > s.values[best])) best = k; });
      s.values.forEach((v, k) => { const td = el("td"); const sp = el("span", k === best ? "best num" : "num", fmt(v)); sp.style.fontWeight = k === best ? "700" : "400"; td.appendChild(sp); tr.appendChild(td); });
      tr.addEventListener("click", () => setActive(i, true));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  });

  // ---------- distribution of this session's scores
  (function () {
    const DS = D.dist, host = document.getElementById("dist");
    if (!DS || !DS.n) { document.getElementById("distcard").hidden = true; return; }
    const nb = DS.rows[0].counts.length;
    document.getElementById("distinfo").textContent = DS.n + " sentences · " + nb + " bins";
    const clamped = DS.rows.reduce((a, r) => a + r.below + r.above, 0);
    document.getElementById("distnote").textContent =
      "Each row shows how this session's sentences spread across score bins of width " + DS.width +
      ", as a percentage of its " + DS.n + " sentences (counts, no fitted curve). All rows share one horizontal and one vertical scale, " +
      "so positions and heights compare directly. The dark vertical mark is the mean." +
      (clamped ? " " + clamped + " score(s) beyond " + DS.lo + " or " + DS.hi + " are counted in the end bins." : "");
    const svgD = sv("svg", { role: "img", "aria-label": "Distribution of each emotion's scores in this session" });
    const tipD = el("div", "tip"); tipD.hidden = true;
    host.append(svgD, tipD);
    const rowH = 30, top = 8, labelW = 112, right = 16, axisH = 34;
    const yMax = Math.max(1e-9, ...DS.rows.map(r => Math.max(...r.counts) / DS.n * 100));
    function draw() {
      const WD = Math.max(320, Math.round(host.clientWidth)), HD = top + rowH * DS.rows.length + axisH;
      svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
