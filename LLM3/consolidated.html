<script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("payload").textContent);
  const EM = D.emotions, FAM = D.families;
  const TEXT = [["sentences", "Sentences", 0], ["words", "Words", 0], ["unique_words", "Unique-word ratio", 3],
                ["distinct_bigrams", "Distinct bigrams", 3], ["duration_s", "Duration (s)", 1], ["stop", "Stop reason", null]];
  const FAMNAME = ["Neutral", "F1 · happy / excited / alert", "F2 · tense / angry / distressed",
                   "F3 · sad / depressed / bored", "F4 · calm / relaxed / content"];
  const t = document.getElementById("t"), tip = document.getElementById("tip");
  const f = (v, d) => v == null ? "–" : (d == null ? String(v) : Number(v).toFixed(d));
  function el(tag, cls, txt) { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; }

  // header: family groups, then column names
  const thead = el("thead"), h1 = el("tr"), h2 = el("tr");
  const corner = el("th", "tree l", "Model / run / turn"); corner.rowSpan = 2; h1.appendChild(corner);
  let k = 0;
  while (k < EM.length) {
    let j = k; while (j < EM.length && FAM[j] === FAM[k]) j++;
    const th = el("th", "fam", FAMNAME[FAM[k]] || ""); th.colSpan = j - k; th.style.borderBottomColor = "var(--fam-" + FAM[k] + ")";
    h1.appendChild(th); k = j;
  }
  const tx = el("th", "fam", "Text figures"); tx.colSpan = TEXT.length; tx.style.borderBottomColor = "var(--muted)"; h1.appendChild(tx);
  const NEU = EM.indexOf("neutral");
  EM.forEach((e, i) => h2.appendChild(el("th", i === NEU ? "neu" : null, e)));
  if (NEU === 0 && FAM[1] !== FAM[0]) h1.children[1].classList.add("neu");   // neutral is its own family group

  // continuous colour scale by median: white at 0, green for positive, red for negative
  let M = 0;
  D.models.forEach(m => m.runs.forEach(r => r.turns.forEach(tu => tu.emotions.forEach(s => { if (s) M = Math.max(M, Math.abs(s.median)); }))));
  M = M || 1;
  const ZERO = [255, 255, 255], GREEN = [16, 122, 70], RED = [180, 42, 28];
  const mix = (a, b, w) => "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * w)).join(",") + ")";
  const weight = v => Math.min(1, Math.abs(v) / M);
  const shade = v => mix(ZERO, v >= 0 ? GREEN : RED, weight(v));
  // white text only where the cell is dark enough to read it
  const ink = v => weight(v) >= 0.45 ? "#fff" : "#0b0b0b";
  document.getElementById("grad").style.background = "linear-gradient(90deg," + mix(ZERO, RED, 1) + "," + mix(ZERO, RED, 0) + "," + mix(ZERO, GREEN, 1) + ")";
  document.getElementById("kmin").textContent = "−" + M.toFixed(2);
  document.getElementById("kmax").textContent = "+" + M.toFixed(2);
  TEXT.forEach(([, name], i) => h2.appendChild(el("th", i === 0 ? "gap" : (i === TEXT.length - 1 ? "l" : null), name)));
  thead.append(h1, h2); t.appendChild(thead);

  const tbody = el("tbody"); t.appendChild(tbody);
  function textCells(tr, x) {
    TEXT.forEach(([key, , d], i) => {
      const v = x[key];
      const td = el("td", i === 0 ? "gap" : (key === "stop" ? "l" : null), key === "stop" ? (v || "–") : f(v, d));
      if (key === "stop" && v && v !== "end of turn" && v !== "all end of turn") td.classList.add("stop-bad");
      tr.appendChild(td);
    });
  }
  function blanks(tr) { EM.forEach((_, i) => tr.appendChild(el("td", i === NEU ? "neu" : null))); }

  const groups = [];
  D.models.forEach((m, mi) => {
    const mr = el("tr", "model"), mt = el("td", "tree l");
    mt.innerHTML = '<span class="car">▸</span>'; mt.append(m.key + " ", Object.assign(el("span", "meta", m.id), {}));
    mr.appendChild(mt); blanks(mr); TEXT.forEach((_, i) => mr.appendChild(el("td", i === 0 ? "gap" : null)));
    tbody.appendChild(mr);
    const mg = { row: mr, open: false, runs: [] };
    m.runs.forEach(r => {
      const rr = el("tr", "run hide"), rt = el("td", "tree l ind1");
      rt.innerHTML = '<span class="car">▸</span>'; rt.append(r.label);
      rr.appendChild(rt); blanks(rr); textCells(rr, r.total);
      tbody.appendChild(rr);
      const rg = { row: rr, open: false, turns: [] };
      r.turns.forEach(tu => {
        const tr = el("tr", "turn hide"), tt = el("td", "tree l ind2", "P" + tu.turn + " · " + tu.label);
        tt.title = tu.prompt; tr.appendChild(tt);
        tu.emotions.forEach((s, ei) => {
          const td = el("td", ei === NEU ? "em neu" : "em");
          if (!s) { td.textContent = "–"; tr.appendChild(td); return; }
          td.style.background = shade(s.median);
          td.style.color = ink(s.median);
          td.appendChild(el("span", "a", f(s.median, 3)));
          td.appendChild(el("span", "r", f(s.min, 2) + " – " + f(s.max, 2)));
          td.dataset.tip = JSON.stringify({ title: m.key + " · " + r.label + " · T" + tu.turn + " · " + EM[ei], n: tu.text.sentences, s: s });
          tr.appendChild(td);
        });
        textCells(tr, tu.text);
        tbody.appendChild(tr); rg.turns.push(tr);
      });
      rr.addEventListener("click", () => setRun(rg, !rg.open));
      rg.tag = r.tag; rg.short = r.short;
      mg.runs.push(rg);
    });
    mr.addEventListener("click", () => setModel(mg, !mg.open));
    groups.push(mg);
  });

  function caret(row, open) { row.querySelector(".car").textContent = open ? "▾" : "▸"; }
  function setRun(rg, open) { rg.open = open; caret(rg.row, open); rg.turns.forEach(x => x.classList.toggle("hide", !open)); }
  function setModel(mg, open) {
    mg.open = open; caret(mg.row, open);
    mg.runs.forEach(rg => { rg.row.classList.toggle("hide", !open); if (!open) rg.turns.forEach(x => x.classList.add("hide")); else setRun(rg, rg.open); });
  }
  // run picker: open the chosen runs (down to their turns) in every model
  const menu = document.getElementById("menu"), picksum = document.getElementById("picksum");
  const kinds = [];
  D.models.forEach(m => m.runs.forEach(r => { if (!kinds.some(k => k.tag === r.tag)) kinds.push({ tag: r.tag, short: r.short }); }));
  const boxes = kinds.map(k => {
    const lab = el("label"), cb = el("input"); cb.type = "checkbox"; cb.value = k.tag;
    lab.append(cb, k.short); menu.appendChild(lab); cb.addEventListener("change", applyPick); return cb;
  });
  function applyPick() {
    const chosen = boxes.filter(b => b.checked).map(b => b.value);
    picksum.textContent = chosen.length ? kinds.filter(k => chosen.includes(k.tag)).map(k => k.short).join(", ") : "Select runs to expand…";
    groups.forEach(mg => {
      mg.runs.forEach(rg => rg.open = chosen.includes(rg.tag));
      setModel(mg, chosen.length > 0 || mg.open);
    });
  }
  document.addEventListener("click", e => { const p = document.getElementById("pick"); if (p.open && !p.contains(e.target)) p.open = false; });
  document.getElementById("exp").onclick = () => { boxes.forEach(b => b.checked = true); applyPick(); };
  document.getElementById("col").onclick = () => { boxes.forEach(b => b.checked = false); applyPick(); groups.forEach(mg => setModel(mg, false)); };
  // on open: the reference run selected, so every model shows its T0.0 turns
  boxes.forEach(b => b.checked = b.value === "0p0");
  applyPick();

  // curve built from the quartiles (a two-piece normal): centred on the median, the left
  // half as wide as q1 implies and the right half as wide as q3 implies (IQR half = 0.6745 sigma).
  // One fixed axis for every tooltip, so position, width and lean can be compared cell to cell.
  const NS = "http://www.w3.org/2000/svg";
  function sv(tag, a) { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); return n; }
  let GLO = 0, GHI = 0;
  D.models.forEach(m => m.runs.forEach(r => r.turns.forEach(tu => tu.emotions.forEach(s => { if (s) { GLO = Math.min(GLO, s.min); GHI = Math.max(GHI, s.max); } }))));
  GLO = Math.floor(GLO * 10) / 10; GHI = Math.ceil(GHI * 10) / 10;
  const Z = 0.6745;
  function curve(s) {
    const wrap = el("div");
    if (s.sd == null) { wrap.appendChild(el("div", "cap", "one sentence: no curve")); return wrap; }
    const W = 220, H = 120, pl = 6, pr = 6, pt = 8, pb = 34;
    const lo = GLO, hi = GHI, floor = (hi - lo) / 400;
    const sL = Math.max(floor, (s.median - s.q1) / Z), sR = Math.max(floor, (s.q3 - s.median) / Z);
    const X = v => pl + (v - lo) / (hi - lo) * (W - pl - pr);
    const pdf = v => Math.exp(-0.5 * ((v - s.median) / (v < s.median ? sL : sR)) ** 2);   // peak scaled to 1
    const base = H - pb, Y = p => base - p * (base - pt);
    const svg = sv("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "normal curve" });
    const col = shade(s.median), ok = Math.abs(s.median) / M >= 0.15 ? col : "var(--accent)";
    let d = "M" + X(lo) + "," + base;
    for (let i = 0; i <= 240; i++) { const v = lo + (hi - lo) * i / 240; d += " L" + X(v).toFixed(1) + "," + Y(pdf(v)).toFixed(1); }
    d += " L" + X(hi) + "," + base + " Z";
    svg.appendChild(sv("path", { d: d, fill: ok, "fill-opacity": 0.18, stroke: ok, "stroke-width": 1.5 }));
    svg.appendChild(sv("line", { x1: pl, x2: W - pr, y1: base, y2: base, stroke: "var(--grid)" }));
    if (lo < 0 && hi > 0) svg.appendChild(sv("line", { x1: X(0), x2: X(0), y1: pt, y2: base, stroke: "var(--muted)", "stroke-dasharray": "1 3" }));
    // box plot strip under the curve: whiskers min-max, box q1-q3, median tick
    const by = base + 9;
    svg.appendChild(sv("line", { x1: X(s.min), x2: X(s.max), y1: by, y2: by, stroke: "var(--ink-2)" }));
    [s.min, s.max].forEach(v => svg.appendChild(sv("line", { x1: X(v), x2: X(v), y1: by - 4, y2: by + 4, stroke: "var(--ink-2)" })));
    svg.appendChild(sv("rect", { x: X(s.q1), y: by - 5, width: Math.max(1, X(s.q3) - X(s.q1)), height: 10, fill: "var(--surface)", stroke: "var(--ink)" }));
    svg.appendChild(sv("line", { x1: X(s.median), x2: X(s.median), y1: pt, y2: by + 5, stroke: "var(--ink)", "stroke-width": 1.5 }));
    svg.appendChild(sv("line", { x1: X(s.avg), x2: X(s.avg), y1: pt, y2: base, stroke: "var(--ink)", "stroke-dasharray": "4 3" }));
    [[lo, "start"], [0, "middle"], [hi, "end"]].forEach(([v, a]) => {
      const tx = sv("text", { x: X(v), y: H - 4, "text-anchor": a, "font-size": 10, fill: "var(--muted)" }); tx.textContent = v === 0 ? "0" : v.toFixed(1); svg.appendChild(tx);
    });
    wrap.appendChild(svg);
    wrap.appendChild(el("div", "cap", "shape from q1 · median · q3 · solid median · dashed average"));
    return wrap;
  }

  // tooltip: five-number summary of the hovered cell
  t.addEventListener("mousemove", e => {
    const td = e.target.closest("td.em");
    if (!td || !td.dataset.tip) { tip.style.display = "none"; return; }
    const d = JSON.parse(td.dataset.tip), s = d.s;
    tip.innerHTML = "";
    tip.appendChild(el("b", null, d.title));
    const tb = el("table");
    [["min", s.min], ["q1", s.q1], ["median", s.median], ["q3", s.q3], ["max", s.max], ["average", s.avg], ["sd", s.sd], ["sentences", d.n]]
      .forEach(([k, v]) => { const r = el("tr"); r.append(el("td", "l", k), el("td", null, k === "sentences" ? String(v) : f(v, 3))); tb.appendChild(r); });
    const body = el("div", "body"); body.append(tb, curve(s)); tip.appendChild(body);
    tip.style.display = "block";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > innerWidth - 8) x = e.clientX - w - 14;
    if (y + h > innerHeight - 8) y = e.clientY - h - 14;
    tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
  });
  t.addEventListener("mouseleave", () => tip.style.display = "none");
  document.getElementById("gen").textContent = "Generated " + D.generated + " from <model>/chat_telemetry_*.html (latest batch per model).";
})();
</script>
</body>
</html>
