536684036,0.07750672101974487,0.027901258319616318,0.055638499557971954,0.01107010617852211,0.03995455801486969,0.03752030432224274,0.029628178104758263,0.0825405865907669,0.06695794314146042,0.04877319931983948]}]},{"prompt":"I have a question, Do you know that due to effects of unemployment there is an increase in restlessness among youth, what do you think about its implications on their mental health ?","event":3,"stop_reason":"end of turn","tail":"","sentences":[{"text":"That's a very relevant and concerning observation.","event":4,"values":[0.08223377168178558,0.06370985507965088,0.03990110754966736,0.06804446876049042,0.03275160491466522,0.05160088464617729,0.03370232507586479,0.040287770330905914,0.03784523904323578,0.04335090517997742,0.08063584566116333,0.07877812534570694,0.05156072974205017]},{"text":"The link between unemployment and increased restlessness among youth, and its implications for mental health, is well-documented and significant.","event":5,"values":[0.0901140421628952,0.05586428567767143,0.03785113990306854,0.06660321354866028,0.026632482185959816,0.04501289874315262,0.029572878032922745,0.028709033504128456,0.023357020691037178,0.024185335263609886,0.06488052010536194,0.06922045350074768,0.03847302868962288]},{"text":"Here's a breakdown of my thoughts on the implications:\n\n1.","event":6,"values":[0.09423023462295532,0.05365889519453049,0.037118878215551376,0.06478603929281235,0.024272914975881577,0.04298870265483856,0.02784411981701851,0.028643587604165077,0.02172750234603882,0.020882578566670418,0.06270630657672882,0.0674750804901123,0.03742080554366112]},{"text":"**Increased Anxiety and Stress:** Unemployment often leads to financial insecurity, which is a major stressor.","event":7,"values":[0.09596924483776093,0.04911764711141586,0.038357704877853394,0.06185854226350784,0.026569698005914688,0.044993262737989426,0.028607649728655815,0.02977941930294037,0.024494890123605728,0.017954614013433456,0.058454111218452454,0.05909871682524681,0.033666595816612244]},{"text":"For youth who are establishing themselves, this can be particularly daunting.","event":8,"values":[0.08884041756391525,0.04659660905599594,0.038555219769477844,0.059884361922740936,0.032436762005090714,0.048620112240314484,0.031848784536123276,0.03349059075117111,0.032010823488235474,0.022221684455871582,0.058484457433223724,0.057034458965063095,0.035612016916275024]},{"text":"This financial stress, combined with the uncertainty of finding new employment, can significantly increase anxiety levels.","event":9,"values":[0.0865069031715393,0.04658788815140724,0.04036671668291092,0.058260343968868256,0.040152452886104584,0.05399320274591446,0.040116727352142334,0.03160932660102844,0.034387797117233276,0.025715166702866554,0.0559304878115654,0.05522371828556061,0.03747802972793579]},{"text":"Restlessness can be both a physical and psychological manifestation of this underlying anxiety.","event":10,"values":[0.08665531128644943,0.04305606707930565,0.039534635841846466,0.05731341987848282,0.04243103414773941,0.05560474470257759,0.04494943097233772,0.02387244999408722,0.02695835754275322,0.022007150575518608,0.04725540429353714,0.05131912603974342,0.03433426097035408]},{"text":"2.  **Loss of Purpose and Identity:** Work often provides structure, a sense of identity, social interaction, and a purpose.","event":11,"values":[0.0883626639842987,0.04731093347072601,0.0360591895878315,0.05404578149318695,0.03382236137986183,0.04899612069129944,0.033873558044433594,0.03326161950826645,0.029270634055137634,0.021714838221669197,0.05739361047744751,0.053793251514434814,0.0375344380736351]},{"text":"For young people, who are still exploring their place in the world, losing this can be identity-shattering.","event":12,"values":[0.08035552501678467,0.0507270023226738,0.03672963008284569,0.05836282670497894,0.03395399823784828,0.04795265942811966,0.028960859403014183,0.03558631241321564,0.03083854168653488,0.020885473117232323,0.061657894402742386,0.05589204281568527,0.037761859595775604]},{"text":"Restlessness can arise from the lack of this structure and the feeling of being adrift, unsure of one's direction or contribution.","event":13,"values":[0.08368198573589325,0.05051180720329285,0.03760054334998131,0.05704648047685623,0.035490550100803375,0.04748028516769409,0.030002012848854065,0.03563101217150688,0.032088860869407654,0.025161895900964737,0.06080203875899315,0.05719699710607529,0.03800852596759796]},{"text":"3.  **Impact on Self-Esteem and Confidence:** Constant job searching or periods of inactivity can erode self-esteem and confidence.","event":14,"values":[0.08092566579580307,0.046347349882125854,0.03507548198103905,0.0586724616587162,0.035933755338191986,0.04641697183251381,0.027857452630996704,0.031880639493465424,0.028721095994114876,0.024642765522003174,0.06126554682850838,0.054644785821437836,0.03606501966714859]},{"text":"Youth might start to internalize the situation, believing they are incapable or undesirable as employees.","event":15,"values":[0.08131320029497147,0.04447769746184349,0.03537580370903015,0.05854232609272003,0.03692879155278206,0.04683925211429596,0.026590261608362198,0.031876951456069946,0.02789696678519249,0.026275543496012688,0.062070004642009735,0.05185975879430771,0.035863928496837616]},{"text":"This negative self-perception contributes heavily to feelings of restlessness and can lead to depression.","event":16,"values":[0.07657700777053833,0.04680033400654793,0.03606158122420311,0.058706387877464294,0.03797188028693199,0.0472429096698761,0.025298669934272766,0.034961916506290436,0.029427234083414078,0.027115818113088608,0.06953994184732437,0.05590640753507614,0.040692880749702454]},{"text":"4.  **Social Isolation:** Unemployment can sometimes lead to social withdrawal.","event":17,"values":[0.07883043587207794,0.04781642556190491,0.036977991461753845,0.05925243720412254,0.03799111768603325,0.04467102140188217,0.024757498875260353,0.03626994416117668,0.02762085199356079,0.026712965220212936,0.06865823268890381,0.058368124067783356,0.03958167880773544]},{"text":"Young people might feel embarrassed about their situation, struggle to maintain existing social networks (due to lack of funds or time), or simply lack the energy to socialize when preoccupied with worry and restlessness.","event":18,"values":[0.07988815009593964,0.04886633902788162,0.03591598570346832,0.059399187564849854,0.03359122574329376,0.040331967175006866,0.019384248182177544,0.03363380581140518,0.023621557280421257,0.02609248086810112,0.07218678295612335,0.06338099390268326,0.039353370666503906]},{"text":"Reduced social interaction further exacerbates feelings of loneliness and isolation, negatively impacting mental well-being.","event":19,"values":[0.0830845758318901,0.05047501623630524,0.035962022840976715,0.0593784935772419,0.032557640224695206,0.040110230445861816,0.01862635277211666,0.03433479741215706,0.024305297061800957,0.02335362695157528,0.07149963080883026,0.06400935351848602,0.038026608526706696]},{"text":"5.  **Sleep Disturbances:** The combination of stress, anxiety, restlessness, and irregular schedules (if any) often leads to sleep problems like insomnia or poor sleep quality.","event":20,"values":[0.07938376069068909,0.050357479602098465,0.03722462058067322,0.058108069002628326,0.03251352161169052,0.04147130623459816,0.020119383931159973,0.031787529587745667,0.023859236389398575,0.024934422224760056,0.06577156484127045,0.0598054900765419,0.035732340067625046]},{"text":"Poor sleep is a significant contributor to further mental health issues, creating a vicious cycle.","event":21,"values":[0.08161944895982742,0.05275341495871544,0.03985670208930969,0.05478738993406296,0.03480008244514465,0.048459917306900024,0.029761653393507004,0.03310439735651016,0.02727198600769043,0.028017031028866768,0.05944250896573067,0.05838148295879364,0.037449367344379425]},{"text":"6.  **Increased Risk of Depression:** The cumulative effect of prolonged stress, loss of purpose, diminished self-worth, social isolation, and sleep disturbances significantly increases the risk of developing depression or depressive symptoms in young people.","event":22,"values":[0.08361820131540298,0.052331991493701935,0.039822809398174286,0.05762113258242607,0.03245951607823372,0.044397562742233276,0.02560749463737011,0.03335876017808914,0.02626323699951172,0.027028100565075874,0.06271470338106155,0.058063142001628876,0.036844588816165924]},{"text":"7.  **Delayed Life Transitions:** Unemployment can postpone major life decisions and transitions, such as moving out, starting a family, or further education, adding to feelings of frustration and restlessness.","event":23,"values":[0.08497023582458496,0.04962550848722458,0.03524402901530266,0.05784193053841591,0.02920585870742798,0.03765546530485153,0.020297009497880936,0.03485627472400665,0.024856386706233025,0.025152288377285004,0.06481921672821045,0.0590982586145401,0.0344514474272728]},{"text":"**Implications:**\n\n*   **Long-Term Mental Health:** Prolonged periods of restlessness and associated stress due to unemployment can have lasting effects on mental health, potentially increasing the risk of chronic conditions if not addressed.","event":24,"values":[0.08654453605413437,0.04907809942960739,0.033819276839494705,0.057293206453323364,0.03166116029024124,0.03873559087514877,0.020730311051011086,0.03903348743915558,0.027639023959636688,0.025170978158712387,0.06438546627759933,0.05874469503760338,0.032947368919849396]},{"text":"*   **Developmental Impact:** This period can be critical for identity formation and career development.","event":25,"values":[0.0852598175406456,0.04776632785797119,0.031312767416238785,0.05435069650411606,0.034999191761016846,0.04230853170156479,0.0242192130535841,0.04321769252419472,0.0313507542014122,0.0287014190107584,0.06135416403412819,0.0593746080994606,0.03249502554535866]},{"text":"Setbacks due to unemployment can negatively impact long-term career trajectories and personal development.","event":26,"values":[0.0898650735616684,0.04854973033070564,0.03468765690922737,0.053897976875305176,0.03789915889501572,0.047683827579021454,0.031092552468180656,0.04117167368531227,0.03164653480052948,0.027442805469036102,0.05754146724939346,0.059310801327228546,0.03413445129990578]},{"text":"*   **Societal Concerns:** Widespread restlessness and poor mental health among youth due to unemployment can be a sign of broader societal economic issues and can impact future workforce participation, innovation, and social stability.","event":27,"values":[0.0942370817065239,0.04774850606918335,0.03707036003470421,0.05477246642112732,0.035722602158784866,0.04872261360287666,0.031446851789951324,0.0378229022026062,0.027194919064641,0.02575686201453209,0.05692611634731293,0.058779485523700714,0.03407491743564606]},{"text":"**In conclusion,** the restlessness observed in youth due to unemployment is not just a temporary state of unease.","event":28,"values":[0.09329579770565033,0.04590504243969917,0.03587232902646065,0.05684884637594223,0.034546855837106705,0.04645109176635742,0.03041432797908783,0.03224215656518936,0.022236399352550507,0.023413121700286865,0.05395403504371643,0.055998217314481735,0.032458096742630005]},{"text":"It's often a complex symptom stemming from financial stress, loss of purpose, identity crisis, and social isolation, all of which carry significant and potentially long-lasting implications for their mental health.","event":29,"values":[0.09355331212282181,0.043540019541978836,0.03555829077959061,0.058651819825172424,0.03617940470576286,0.04908807575702667,0.03362525254487991,0.030065756291151047,0.021475421264767647,0.020720619708299637,0.05133049190044403,0.054792650043964386,0.028870897367596626]},{"text":"Addressing this requires both individual support (like career counseling, mental health services) and broader societal efforts to mitigate the causes of youth unemployment and provide adequate support systems.","event":30,"values":[ 701,0.04014163464307785,0.05583658814430237,0.02050117403268814,0.03753502294421196,0.010382852517068386,0.039942868053913116,0.02814619615674019,0.022478045895695686,0.0697379857301712,0.06500525772571564,0.04188945144414902]},{"text":"This could potentially make education much more effective than the one-size-fits-all approach often used.","event":36,"values":[0.08244425058364868,0.059282466769218445,0.038448452949523926,0.05307872220873833,0.02606257051229477,0.04044784605503082,0.013841155916452408,0.04538755118846893,0.03256860747933388,0.025624403730034828,0.06778237968683243,0.06193925067782402,0.03960712254047394]},{"text":"2.  **Accessibility:** AI-driven platforms could offer quality education to people regardless of their location or background, potentially bridging educational gaps.","event":37,"values":[0.07615285366773605,0.060819193720817566,0.041590817272663116,0.051269710063934326,0.03236841410398483,0.0469103679060936,0.01946133002638817,0.045940376818180084,0.03594394773244858,0.026683127507567406,0.06632085144519806,0.05895242094993591,0.03955066576600075]},{"text":"3.  **Efficiency:** AI can automate administrative tasks (like grading basic assignments) and provide instant feedback, freeing up educators to focus on more complex, human-centric aspects of teaching like mentorship, critical thinking guidance, and emotional support.","event":38,"values":[0.06791636347770691,0.061295464634895325,0.04474080353975296,0.05390956625342369,0.0346345528960228,0.04783877357840538,0.01668591797351837,0.043743520975112915,0.033004019409418106,0.024439923465251923,0.06814909726381302,0.05676284432411194,0.042094066739082336]},{"text":"4.  **Early Identification:** AI might be better at identifying learning difficulties or areas where a student is struggling at an early stage, allowing for timely intervention.","event":39,"values":[0.07065574824810028,0.06024077534675598,0.045332979410886765,0.05450877547264099,0.034437358379364014,0.047815222293138504,0.018445 117704391,0.06066795438528061,0.04206876456737518]},{"text":"4.  **Focus Shift:** As routine tasks become automated, the role of the educator might shift towards more complex tasks like curriculum design (potentially involving AI collaboration), student counseling, fostering critical thinking and creativity, and managing the social dynamics of learning.","event":49,"values":[0.06754985451698303,0.05476156249642372,0.034806668758392334,0.0528261661529541,0.03428766503930092,0.04825582355260849,0.017001550644636154,0.037821680307388306,0.028095752000808716,0.027511700987815857,0.06889228522777557,0.06279502063989639,0.04136314615607262]},{"text":"5.  **Economic Growth and Demand:** AI and related technologies can also stimulate economic growth in other sectors, potentially creating jobs elsewhere that wouldn't exist otherwise.","event":50,"values":[0.0637831911444664,0.054534245282411575,0.03389802202582359,0.053051531314849854,0.035933952778577805,0.050888482481241226,0.01822691038250923,0.0364336222410202,0.029515130445361137,0.029789138585329056,0.06836270540952682,0.06350450962781906,0.038692329078912735]},{"text":"The overall impact on employment is complex and depends on broader economic factors.","event":51,"values":[0.06495200097560883,0.05776248872280121,0.03297805041074753,0.052019573748111725,0.03526487201452255,0.05009687319397926,0.01875339075922966,0.037714675068855286,0.030615173280239105,0.02917182259261608,0.07132350653409958,0.06833860278129578,0.03919006884098053]},{"text":"6.  **Cost and Implementation:** Widespread implementation of advanced AI in education is expensive and faces logistical, ethical, and infrastructural challenges.","event":52,"values":[0.07593972235918045,0.0549444817006588,0.03420570120215416,0.05149201303720474,0.03331941366195679,0.04941357299685478,0.02226732112467289,0.04191241040825844,0.03520889952778816,0.028875065967440605,0.06913379579782486,0.06817270815372467,0.03660569712519646]},{"text":"It might not happen uniformly or immediately.","event":53,"values":[0.07876479625701904,0.054881736636161804,0.03428519889712334,0.05375277251005173,0.0330708771944046,0.04728270322084427,0.02292019873857498,0.04095286503434181,0.034551817923784256,0.027605732902884483,0.07062448561191559,0.06859400123357773,0.04038775712251663]},{"text":"**Conclusion:**\n\nYou're right that AI has the potential to revolutionize personalized learning in powerful ways.","event":54,"values":[0.07322351634502411,0.05568733066320419,0.03687107190489769,0.05901576578617096,0.029877647757530212,0.045508839190006256,0.01727929897606373,0.03799732029438019,0.032582297921180725,0.029257694259285927,0.07278012484312057,0.07004440575838089,0.03999338299036026]},{"text":"However, the idea that it will *solely* lead to a reduction in human employment is likely an oversimplification.","event":55,"values":[0.0643397718667984,0.061157189309597015,0.04101533442735672,0.06739448010921478,0.02575465478003025,0.04250435531139374,0.00855676457285881,0.030706778168678284,0.024568362161517143,0.02934619039297104,0.07892660796642303,0.07319094240665436,0.04298735409975052]},{"text":"While it will undoubtedly change the nature of work in education, it also has the potential to create new roles, augment human capabilities, and shift the focus of educators towards more uniquely human skills.","event":56,"values":[0.06601659953594208,0.060557544231414795,0.040466874837875366,0.062447089701890945,0.024971745908260345,0.04162312299013138,0.00910140573978424,0.030828483402729034,0.024594996124505997,0.029735229909420013,0.0763668492436409,0.06952974200248718,0.0390462763607502]},{"text":"The key challenge lies in managing this transition smoothly.","event":57,"values":[0.06825500726699829,0.0610269233584404,0.04052571579813957,0.0589543916285038,0.027838289737701416,0.04207231104373932,0.011363509111106396,0.03052242286503315,0.02484036237001419,0.028416097164154053,0.07567596435546875,0.0678090900182724,0.04087625816464424]},{"text":"This ,0.035636402666568756,0.026254447177052498,0.026246439665555954]},{"text":"My world, the one I had carefully built over the years, felt like it had just tilted on its axis.","event":69,"values":[0.03376142680644989,0.039243184030056,0.034207772463560104,0.044472500681877136,0.04257471486926079,0.05541491135954857,0.037679653614759445,0.03674967959523201,0.04960699379444122,0.020809952169656754,0.041909925639629364,0.031643882393836975,0.027747884392738342]},{"text":"The first wave was the shock.","event":70,"values":[0.029400357976555824,0.042591795325279236,0.035653162747621536,0.041895635426044464,0.04529406502842903,0.05645708367228508,0.04248354956507683,0.03706451877951622,0.05305139720439911,0.018872244283556938,0.0414104238152504,0.030158016830682755,0.03169946372509003]},{"text":"Disbelief. I walked around in a daze for days, repeating the words, \"They can't be serious.","event":71,"values":[0.03190280497074127,0.0477931872010231,0.034282781183719635,0.03773834556341171,0.03862748667597771,0.04646811634302139,0.032423656433820724,0.039715804159641266,0.05214662849903107,0.020864740014076233,0.05062641575932503,0.038402121514081955,0.03408996760845184]},{"text":"This isn't happening.\"","event":72,"values":[0.029394250363111496,0.05484861135482788,0.041716109961271286,0.04021870344877243,0.042456839233636856,0.047507449984550476,0.02962864376604557,0.04742414504289627,0.05720681697130203,0.0233297236263752,0.05424552410840988,0.04169457033276558,0.040358301252126694]},{"text":"Then came the sinking feeling, cold and absolute.","event":73,"values":[0.031206101179122925,0.04551711305975914,0.036191947758197784,0.03990999236702919,0.04467800259590149,0.04653980955481529,0.0325983390212059,0.04813162982463837,0.05827309936285019,0.02001889795064926,0.04940417408943176,0.03505285829305649,0.03253774717450142]},{"text":"Reality crashed down.","event":74,"values":[0.05454951152205467,0.03645037114620209,0.03071754425764084,0.042821481823921204,0.05195564776659012,0.0564124621450901,0.051908835768699646,0.04803138226270676,0.06069716066122055,0.021079467609524727,0.04462097957730293,0.03355908766388893,0.03000056929886341]},{"text":"I had a mortgage, bills piling up, a family depending on me.","event":75,"values":[0.0434456393122673,0.043997786939144135,0.041701849550008774,0.042452067136764526,0.04260106757283211,0.056237418204545975,0.04341316223144531,0.038023144006729126,0.05252480134367943,0.02291925437748432,0.0434238463640213,0.03136729449033737,0.031123915687203407]},{"text":"The stable job I thought would be there until retirement was gone.","event":76,"values":[0.03600888326764107,0.051209673285484314,0.047869764268398285,0.04541407525539398,0.037778589874506,0.05851132422685623,0.036141298711299896,0.0372529998421669,0.04898880422115326,0.02820902317762375,0.050603579729795456,0.039891816675662994,0.034321509301662445]},{"text":"**My Hurdles:**\n\n1.","event":77,"values":[0.03794136643409729,0.050126638263463974,0.044132478535175323,0.046375639736652374,0.03346867114305496,0.05363841727375984,0.027321072295308113,0.04390234127640724,0.049020230770111084,0.02510637417435646,0.05384009703993797,0.04300418496131897,0.03315290808677673]},{"text":"**The Immediate Financial Strain:** This was the most immediate and terrifying hurdle.","event":78,"values":[0.05388408526778221,0.04024201259016991,0.029082966968417168,0.04703200235962868,0.0423838272690773,0.06235377863049507,0.04126150906085968,0.05185946449637413,0.054108984768390656,0.027861803770065308,0.04723720997571945,0.04099626839160919,0.028833037242293358]},{"text":"Paychecks stopped arriving.","event":79,"values":[0.063877634704113,0.04390294477343559,0.02955639362335205,0.048989977687597275,0.04277210682630539,0.0625036284327507,0.04158613085746765,0.05386942997574806,0.05664488300681114,0.03348219767212868,0.05016859620809555,0.044214628636837006,0.03397845849394798]},{"text":"The first few weeks were a blur of checking balances, canceling non-essential subscriptions, and trying to create a minimal budget that still felt impossible.","event":80,"values":[0.050543904304504395,0.04490618780255318,0.035183098167181015,0.04231001436710358,0.04167784005403519,0.0598246306180954,0.044322483241558075,0.04659958928823471,0.05627729371190071,0.040435709059238434,0.04190150648355484,0.03950057551264763,0.03280751034617424]},{"text":"Every unexpected expense, every car repair, felt like a knockout blow.","event":81,"values":[0.039554983377456665,0.04693097248673439,0.04219706356525421,0.04035305231809616,0.04267749935388565,0.0572725385427475,0.03939618915319443,0.038984887301921844,0.05301457270979881,0.03922703489661217,0.04145705699920654,0.04013825207948685,0.03398193418979645]},{"text":"2.  **The Crushing Weight of Uncertainty:** Where would the next paycheck come from?","event":82,"values":[0.04058167710900307,0.04838552325963974,0.042155005037784576,0.04410113766789436,0.03520118445158005,0.05111250281333923,0.028515951707959175,0.041716210544109344,0.04844419285655022,0.03156580030918121,0.04735974222421646,0.04075130820274353,0.03277401998639107]},{"text":"Would I find something similar?","event":83,"values":[0.04129161313176155,0.05518792197108269,0.048215948045253754,0.051322631537914276,0.03359167277812958,0.05215175449848175,0.018447784706950188,0.037948302924633026,0.041054002940654755,0.02286038175225258,0.05927775055170059,0.04534056782722473,0.03664522245526314]},{"text":"Would I find *anything*?","event":84,"values":[0.0525742843747139,0.06708221882581711,0.05392790585756302,0.05803857743740082,0.028134869411587715,0.04951825737953186,0.013753094710409641,0.04476991295814514,0.04182974994182587,0.02564011514186859,0.0742734968662262,0.055035173892974854,0.04546135663986206]},{"text":"The future became a vast, scary unknown.","event":85,"values":[0.05064878612756729,0.0606413334608078,0.05198653042316437,0.05363333225250244,0.03150666877627373,0.054642535746097565,0.025560935959219933,0.037368256598711014,0.04157762974500656,0.03021385706961155,0.06251224875450134,0.05137571692466736,0.04146953672170639]},{"text":"Sleepless nights became the norm as my mind raced with worst-case scenarios.","event":86,"values":[0.047500304877758026,0.05290603265166283,0.04421422630548477,0.05098647624254227,0.03186727687716484,0.05095608904957771,0.029575040563941002,0.03657941520214081,0.042591214179992676,0.026280123740434647,0.05064810812473297,0.03963261470198631,0.034706469625234604]},{"text":"3.  **The Stigma and Self-Doubt:** This was perhaps the hardest.","event":87,"values":[0.042617615312337875,0.04311439394950867,0.032153815031051636,0.051140740513801575,0.03709114342927933,0.052741989493370056,0.03021194413304329,0.048591725528240204,0.048317089676856995,0.03208184242248535,0.05548021197319031,0.045744188129901886,0.02978292480111122]},{"text":"Society often whispers that being laid off is a personal failing.","event":88,"values":[0.03462444618344307,0.049571894109249115,0.033316176384687424,0.05727962777018547,0.03481394052505493,0.048913080245256424,0.019363336265087128,0.04812008887529373,0.04460185021162033,0.02864905819296837,0.06487075239419937,0.0499548614025116,0.03219175338745117]},{"text":"I found myself avoiding friends, feeling ashamed to ask for help, questioning my skills and worth.","event":89,"values":[0.03042176552116871,0.04950743913650513,0.034330155700445175,0.05511932820081711,0.04183149337768555,0.05463655665516853,0.02457560785114765,0.050783056765794754,0.049162328243255615,0.03316887468099594,0.06880059093236923,0.05528554320335388,0.03412738814949989]},{"text":"The internal monologue turned critical: \"You're useless,\" \"You're a failure,\" \"You'll never find anything again.\"","event":90,"values":[0.028033290058374405,0.05833085626363754,0.040042854845523834,0.05811547860503197,0.03723127767443657,0.052327655255794525,0.020472709089517593,0.036493342369794846,0.03923545032739639,0.026423977687954903,0.06734862178564072,0.05433131381869316,0.042120277881622314]},{"text":"4.  **The Loss of Routine and Purpose:** My job wasn't just a source of income; it was structure.","event":91,"values":[0.0329749658703804,0.05037898197770119,0.034335099160671234,0.05040536820888519,0.03468315303325653,0.050636593252420425,0.01988336630165577,0.042325109243392944,0.041272200644016266,0.02648599073290825,0.0612671822309494,0.04777601361274719,0.0367584228515625]},{"text":"A place to be, people to see, goals to work towards.","event":92,"values":[0.04748675972223282,0.05216233432292938,0.035896457731723785,0.04886268079280853,0.031184762716293335,0.049020495265722275,0.01651701331138611,0.043068934231996536,0.037484828382730484,0.024257635697722435,0.060537148267030716,0.0466378852725029,0.03860757127404213]},{"text":"Suddenly, my days stretched endlessly ahead, empty and directionless.","event":93,"values":[0.059055764228105545,0.04524632915854454,0.03524560481309891,0.03734295070171356,0.03760412335395813,0.05193932726979256,0.02698749303817749,0.04956253990530968,0.048147864639759064,0.03200138360261917,0.051143042743206024,0.04063725471496582,0.03136005252599716]},{"text":"It was easy to fall into a rut, staying in bed, losing track of time.","event":94,"values":[0.043096594512462616,0.048216041177511215,0.0357167050242424,0.036715563386678696,0.03799855336546898,0.047941215336322784,0.024488039314746857,0.0448739156126976,0.05085327476263046,0.03368234634399414,0.05703534185886383,0.04560454934835434,0.03669174015522003]},{"text":"The sense of purpose I got from contributing faded, replaced by a growing sense of helplessness.","event":95,"values":[0.041614264249801636,0.04225698485970497,0.030323222279548645,0.03962268680334091,0.040040045976638794,0.047385264188051224,0.027942592278122902,0.042937107384204865,0.05212688073515892,0.03656639903783798,0.05521848797798157,0.04569736495614052,0.03393074870109558]},{"text":"5.  **The Social Isolation:** I lost the daily interaction with colleagues.","event":96,"values":[0.039982497692108154,0.04604632407426834,0.028212187811732292,0.046121206134557724,0.03370312601327896,0.04349607974290848,0.021026667207479477,0.0487699918448925,0.04758036509156227,0.03359515592455864,0.06602278351783752,0.05269995704293251,0.038100384175777435]},{"text":"The water cooler chats, the team lunches, the sense of belonging – it vanished.","event":97,"values":[0.04817099869251251,0.05022689700126648,0.03115312196314335,0.052965328097343445,0.03021308034658432,0.04078413546085358,0.017884213477373123,0.04662756621837616,0.0411415621638298,0.028092244639992714,0.06561443954706192,0.05484636500477791,0.0391385480761528]},{"text":"It became harder to gather the energy to attend social events, leading to further isolation and reinforcing negative thought patterns.","event":98,"values":[0.045055292546749115,0.06092555820941925,0.04141254350543022,0.05810824781656265,0.023477673530578613,0.03334228694438934,0.012594642117619514,0.04197331517934799,0.03521822392940521,0.0175497867166996,0.07196314632892609,0.06237974017858505,0.04637253284454346]},{"text":"6.  **The Fear of the Unknown Job Market:** The skills I had were specific.","event":99,"values":[0.04143928363919258,0.05868995189666748,0.03850095719099045,0.05768126994371414,0.02455887570977211,0.03495264798402786,0.010081044398248196,0.04034285992383957,0.034303031861782074,0.017329208552837372,0.06968465447425842,0.056974757462739944,0.04123733192682266]},{"text":"Would they still be needed?","event":100,"values":[0.046926308423280716,0.05722595378756523,0.03954498469829559,0.054137445986270905,0.03074687346816063,0.0416591502726078,0.01515355333685875,0.0426514595746994,0.03606926649808884,0.020575139671564102,0.06796862930059433,0.05299624428153038,0.03828151524066925]},{"text":"Would I have to take a significant pay cut?","event":101,"values":[0.05268189311027527,0.061084914952516556,0.045626137405633926,0.05450506508350372,0.04102505370974541,0.06122731789946556,0.021198365837335587,0.04546336829662323,0.04166320711374283,0.03643190115690231,0.07231900840997696,0.053264085203409195,0.03891829028725624]},{"text":"Would I be forced into a role completely outside my expertise?","event":102,"values":[0.0472957044839859,0.06981128454208374,0.05971791595220566,0.05847042053937912,0.04157376289367676,0.06475785374641418,0.019469114020466805,0.038173992186784744,0.0382961705327034,0.0333968847990036,0.07321758568286896,0.05325367674231529,0.040954068303108215]},{"text":"The process of job searching felt overwhelming and demoralizing after being laid off.","event":103,"values":[0.03653734549880028,0.06496773660182953,0.052122775465250015,0.06437760591506958,0.03674079477787018,0.056898266077041626,0.015420740470290184,0.037171728909015656,0.040292732417583466,0.03518488258123398,0.07556050270795822,0.05091329663991928,0.03459251672029495]},{"text":"**What I Might Do:**\n\nFeeling overwhelmed, I knew I couldn't just sit around.","event":104,"values":[0.027232419699430466,0.05400896444916725,0.03451059013605118,0.05606580153107643,0.03601490333676338,0.04629513621330261,0.017207399010658264,0.047629594802856445,0.04950346052646637,0.03654644265770912,0.07205843925476074,0.04913615435361862,0.03156513348221779]},{"text":"I had to take small steps.","event":105,"values":[0.037564605474472046,0.046968959271907806,0.029671672731637955,0.05026264488697052,0.038152679800987244,0.04682037979364395,0.028744153678417206,0.05309469252824783,0.05622020363807678,0.036989033222198486,0.06653855741024017,0.047269102185964584,0.03186459839344025]},{"text":"First, I allowed myself a few days to grieve the loss.","event":106,"values":[0.04435976594686508,0.05138818919658661,0.03731715679168701,0.04201308265328407,0.040409065783023834,0.05083348602056503,0.038663044571876526,0.05351975932717323,0.057651739567518234,0.031548719853162766,0.06165669858455658,0.048961855471134186,0.040823452174663544]},{"text":"Then, I forced myself to address the most immediate threat: the bank account.","event":107,"v <script>
(function () {
  "use strict";
  const D = JSON.parse(document.getElementById("payload").textContent);
  const SVGNS = "http://www.w3.org/2000/svg";
  const EM = D.emotions, EV = D.events, CONV = D.conversations;
  const visible = EM.map(() => true);
  let active = firstSentenceIndex(), hover = -1, emphasis = -1;

  // ---------- helpers
  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function sv(tag, attrs) { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); return n; }
  function color(i) { return "var(--fam-" + EM[i].family + ")"; }
  function fmt(v) { return v == null ? "–" : (v >= 0 ? " " : "") + v.toFixed(3); }
  function lineKey(i, w) {
    w = w || 24;
    const s = sv("svg", { width: w, height: 10, viewBox: "0 0 " + w + " 10", "aria-hidden": "true" });
    const l = sv("line", { x1: 1, y1: 5, x2: w - 1, y2: 5, "stroke-width": 2, "stroke-linecap": "round" });
    l.style.stroke = color(i); if (EM[i].dash) l.setAttribute("stroke-dasharray", EM[i].dash);
    s.appendChild(l); return s;
  }
  function firstSentenceIndex() { const i = EV.findIndex(e => e.k === "s"); return i < 0 ? 0 : i; }
  function sentenceOf(ev) { return CONV[ev.c].turns[ev.t].sentences[ev.r]; }
  function countBefore(idx, kind) { let n = 0; for (let i = 0; i <= idx; i++) if (EV[i].k === kind) n++; return n; }
  const totalS = EV.filter(e => e.k === "s").length, totalP = EV.filter(e => e.k === "p").length;
  const pNumber = [], sNumber = [];
  (function () { let p = 0, s = 0; EV.forEach((e, i) => { if (e.k === "p") pNumber[i] = ++p; else sNumber[i] = ++s; }); })();
  function eventLabel(i) {
    const e = EV[i];
    if (e.k === "p") return "Prompt " + pNumber[i] + " of " + totalP;
    return "Sentence " + sNumber[i] + " of " + totalS + " · reply " + (e.t + 1);
  }
  function eventTime(i) {
    const e = EV[i];
    if (D.mode !== "time") return null;
    return e.estimated ? "time not recorded" : e.time;
  }

  // ---------- header
  const m = D.meta, DT = D.detail;
  
  document.getElementById("sub").textContent = D.source + (D.interrupted ? " · run was interrupted" : "");
  const chips = document.getElementById("chips");
  const tempText = m.temperature == null ? null : Number(m.temperature).toFixed(1);
  
  [["model", m.model_id || m.model_key], ["temperature", tempText], ["seed", m.seed == null ? "none" : m.seed]]
   
   .concat([["axis", D.mode === "time" ? "recorded time" : "event order"]])
    .forEach(([k, v]) => { if (v == null || v === "") return; const li = el("li"); li.append(k + " "); li.appendChild(el("b", null, String(v))); chips.appendChild(li); });
  const notes = document.getElementById("notes");
  [ "Each point is one model sentence; lines restart at each reply. Scores are relative: read which emotions lead and how they shift. Related emotions tend to move together, so small gaps between neighbours are not meaningful.",
    "Colour groups related emotions in threes; line style separates them (solid, dashed, dotted). Neutral is grey."
  ].concat(D.notes).forEach(t => notes.appendChild(el("p", null, t)));
  

  // ---------- legend (filters above the chart)
  const legend = document.getElementById("legend");
  const legendButtons = [];
  const groups = {};
  EM.forEach((e, i) => { (groups[e.family] = groups[e.family] || []).push(i); });
  Object.keys(groups).sort().forEach(f => {
    const g = el("div", "fam");
    groups[f].forEach(i => {
      const b = el("button"); b.type = "button"; b.setAttribute("aria-pressed", "true");
      b.appendChild(lineKey(i)); b.appendChild(document.createTextNode(EM[i].name));
      b.addEventListener("click", () => { visible[i] = !visible[i]; b.setAttribute("aria-pressed", String(visible[i])); drawAll(); });
      b.addEventListener("pointerenter", () => { emphasis = i; drawStatic(); drawDynamic(); });
      b.addEventListener("pointerleave", () => { emphasis = -1; drawStatic(); drawDynamic(); });
      legendButtons[i] = b; g.appendChild(b);
    });
    legend.appendChild(g);
  });
  const tools = el("div", "tools");
  [["Show all", true], ["Hide all", false]].forEach(([label, on]) => {
    const b = el("button", null, label); b.type = "button";
    b.addEventListener("click", () => { visible.fill(on); legendButtons.forEach(x => x.setAttribute("aria-pressed", String(on))); drawAll(); });
    tools.appendChild(b);
  });
  legend.appendChild(tools);

  // ---------- chart geometry
  const chart = document.getElementById("chart");
  const svg = sv("svg", { role: "img", "aria-label": "Emotion scores over the conversation" });
  const gStatic = sv("g", {}), gDyn = sv("g", {});
  const hit = sv("rect", { class: "plot-hit", fill: "transparent" });
  svg.append(gStatic, gDyn, hit);
  chart.appendChild(svg);
  const tip = el("div", "tip"); tip.hidden = true; chart.appendChild(tip);
  const M = { top: 64, right: 18, bottom: 86, left: 52 };
  const H = 420;
  let W = 900, X, Y, yTicks = [], yDecimals = 1;

  function computeScales() {
    W = Math.max(320, Math.round(chart.clientWidth - 8));
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    const xs = EV.map(e => e.x);
    let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    if (x1 === x0) { x0 -= 1; x1 += 1; }
    const pw = W - M.left - M.right, pad = 10;
    X = v => M.left + pad + (v - x0) / (x1 - x0) * (pw - 2 * pad);
    let lo = 0, hi = 0;
    EV.forEach(e => { if (e.k !== "s") return; sentenceOf(e).values.forEach((v, i) => { if (visible[i] && v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }); });
    if (hi === lo) { hi += 0.1; lo -= 0.1; }
    const span = hi - lo, steps = [0.01, 0.02, 0.05, 0.1, 0.2, 0.25, 0.5, 1];
    const step = steps.find(s => span / s <= 7) || 1;
    lo = Math.floor((lo - span * 0.04) / step) * step; hi = Math.ceil((hi + span * 0.04) / step) * step;
    yTicks = []; for (let k = Math.round(lo / step); k * step <= hi + step / 2; k++) yTicks.push(k * step);
    yDecimals = step >= 1 ? 0 : step >= 0.1 ? (step === 0.25 ? 2 : 1) : 2;
    const ph = H - M.top - M.bottom;
    Y = v => M.top + (hi - v) / (hi - lo) * ph;
  }

  function nearestEvent(px) {
    let best = 0, bd = Infinity;
    for (let i = 0; i < EV.length; i++) {
      const d = Math.abs(X(EV[i].x) - px);
      if (d < bd - 1e-9 || (Math.abs(d - bd) < 1e-9 && EV[i].k === "s")) { bd = d; best = i; }
    }
    return best;
  }

  function drawStatic() {
    computeScales();
    gStatic.replaceChildren();
    const pl = M.left, pr = W - M.right, pt = M.top, pb = H - M.bottom;
    // grid + y axis
    yTicks.forEach(v => {
      const y = Y(v);
      gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: y, y2: y, stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
      const t = sv("text", { x: pl - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: "var(--muted)" });
      t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(yDecimals);
      gStatic.appendChild(t);
    });
    const yl = sv("text", { x: 14, y: (pt + pb) / 2, transform: "rotate(-90 14 " + (pt + pb) / 2 + ")", "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
    yl.textContent = "emotion score"; gStatic.appendChild(yl);
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pt, y2: pt, stroke: "var(--axis)", "stroke-width": 1 }));
    gStatic.appendChild(sv("line", { x1: pl, x2: pr, y1: pb, y2: pb, stroke: "var(--axis)", "stroke-width": 1 }));

    // prompt rules + conversation boundaries
    let prevConv = -1;
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      const newConv = e.c !== prevConv; prevConv = e.c;
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: newConv && CONV.length > 1 ? "var(--axis)" : "var(--prompt-rule)", "stroke-width": newConv && CONV.length > 1 ? 2 : 1 }));
      if (newConv && CONV.length > 1) {
        const t = sv("text", { x: x + 4, y: pt + 12, "font-size": 11, fill: "var(--ink-2)" }); t.textContent = CONV[e.c].name; gStatic.appendChild(t);
      }
    });

    // titles for the two scales
    const tt = sv("text", { x: pl, y: 14, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); tt.textContent = "Model sentences" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(tt);
    const bt = sv("text", { x: pl, y: H - 6, "font-size": 11.5, fill: "var(--ink-2)", "font-weight": 600 }); bt.textContent = "User prompts" + (D.mode === "time" ? " (time)" : " (order)"); gStatic.appendChild(bt);

    // top scale: a tick per sentence, labels thinned so they never collide
    let lastLabelX = -Infinity;
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pt - 6, y2: pt, stroke: "var(--muted)", "stroke-width": 1 }));
      const label = D.mode === "time" ? e.time.slice(0, 8) : "S" + sNumber[i];
      if (x - lastLabelX >= (D.mode === "time" ? 62 : 34) && x + 28 <= W) {
        const t = sv("text", { x: x, y: pt - 10, "text-anchor": "middle", "font-size": 10.5, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = label; gStatic.appendChild(t); lastLabelX = x;
      }
    });

    // bottom scale: a tick + label per prompt, staggered onto a second row when crowded
    const rowEnd = [-Infinity, -Infinity];
    EV.forEach((e, i) => {
      if (e.k !== "p") return;
      const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pb, y2: pb + 6, stroke: "var(--ink-2)", "stroke-width": 1.5 }));
      const t1 = "P" + pNumber[i], t2 = D.mode === "time" ? (e.estimated ? "time not recorded" : e.time.slice(0, 8)) : "";
      const w = Math.max(t1.length, t2.length) * 6.2 + 8;
      const row = (x - w / 2 > rowEnd[0]) ? 0 : 1;
      rowEnd[row] = x + w / 2;
      const y0 = pb + 19 + row * 27;
      const a = sv("text", { x: x, y: y0, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)", "font-weight": 600 }); a.textContent = t1; gStatic.appendChild(a);
      if (t2) { const b = sv("text", { x: x, y: y0 + 11, "text-anchor": "middle", "font-size": 10, fill: e.estimated ? "var(--muted)" : "var(--ink-2)" }); b.style.fontVariantNumeric = "tabular-nums"; if (e.estimated) b.setAttribute("font-style", "italic"); b.textContent = t2; gStatic.appendChild(b); }
    });

    // series: one path per emotion per reply
    const anyVisible = visible.some(Boolean);
    EM.forEach((em, i) => {
      if (!visible[i]) return;
      CONV.forEach(c => c.turns.forEach(turn => {
        let d = "", pen = false;
        turn.sentences.forEach(s => {
          const v = s.values[i];
          if (v == null) { pen = false; return; }
          d += (pen ? "L" : "M") + X(EV[s.event].x).toFixed(1) + " " + Y(v).toFixed(1); pen = true;
        });
        if (!d) return;
        const p = sv("path", { d: d, fill: "none", "stroke-width": emphasis === i ? 3 : 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
        p.style.stroke = color(i);
        if (em.dash) p.setAttribute("stroke-dasharray", em.dash);
        if (emphasis >= 0 && emphasis !== i) p.setAttribute("opacity", "0.18");
        gStatic.appendChild(p);
        if (turn.sentences.length === 1 && s0v(turn, i) != null) {
          const dot = sv("circle", { cx: X(EV[turn.sentences[0].event].x), cy: Y(s0v(turn, i)), r: 2.5 }); dot.style.fill = color(i); gStatic.appendChild(dot);
        }
      }));
    });
    if (!anyVisible) {
      const t = sv("text", { x: (pl + pr) / 2, y: (pt + pb) / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 13 });
      t.textContent = "All emotions are hidden. Use the buttons above to show them."; gStatic.appendChild(t);
    }
    hit.setAttribute("x", pl); hit.setAttribute("y", 0); hit.setAttribute("width", pr - pl); hit.setAttribute("height", H);
  }
  function s0v(turn, i) { return turn.sentences[0].values[i]; }

  function drawDynamic() {
    gDyn.replaceChildren();
    const pt = M.top, pb = H - M.bottom;
    if (hover >= 0 && hover !== active) {
      const x = X(EV[hover].x);
      gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: "var(--muted)", "stroke-width": 1 }));
    }
    const e = EV[active], x = X(e.x);
    gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt - 8, y2: pb + 8, stroke: "var(--ink)", "stroke-width": 1.5 }));
    if (e.k === "s") {
      const vals = sentenceOf(e).values;
      EM.forEach((em, i) => {
        if (!visible[i] || vals[i] == null) return;
        const c = sv("circle", { cx: x, cy: Y(vals[i]), r: 4, "stroke-width": 2 });
        c.style.fill = color(i); c.style.stroke = "var(--surface)";
        if (emphasis >= 0 && emphasis !== i) c.setAttribute("opacity", "0.2");
        gDyn.appendChild(c);
      });
    }
    // the slider handle, on the bottom scale
    const handle = sv("g", {});
    handle.appendChild(sv("circle", { cx: x, cy: pb, r: 7, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2 }));
    gDyn.appendChild(handle);
    chart.setAttribute("aria-valuemin", "1"); chart.setAttribute("aria-valuemax", String(EV.length));
    chart.setAttribute("aria-valuenow", String(active + 1));
    chart.setAttribute("aria-valuetext", eventLabel(active) + (eventTime(active) ? ", " + eventTime(active) : ""));
  }

  function drawAll() { drawStatic(); drawDynamic(); renderReadout(); }

  // ---------- tooltip (values lead, every visible series)
  function showTip(i, px, py) {
    tip.replaceChildren();
    const e = EV[i];
    const head = el("div", "h", eventLabel(i) + (eventTime(i) ? " · " + eventTime(i) : ""));
    tip.appendChild(head);
    if (e.k === "p") {
      const t = CONV[e.c].turns[e.t].prompt;
      tip.appendChild(el("div", null, t.length > 180 ? t.slice(0, 180) + "…" : t));
    } else {
      const vals = sentenceOf(e).values;
      EM.map((em, k) => k).filter(k => visible[k] && vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name)); tip.appendChild(r);
      });
    }
    tip.hidden = false;
    const rect = chart.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14, top = py - th / 2;
    if (left + tw > rect.width - 4) left = px - tw - 14;
    top = Math.max(4, Math.min(top, rect.height - th - 4));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }

  function toPlotX(evt) {
    const r = svg.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W / r.width), px: evt.clientX - chart.getBoundingClientRect().left, py: evt.clientY - chart.getBoundingClientRect().top };
  }
  let dragging = false;
  hit.addEventListener("pointerdown", evt => { dragging = true; hit.setPointerCapture(evt.pointerId); const p = toPlotX(evt); setActive(nearestEvent(p.x), true); chart.focus({ preventScroll: true }); });
  hit.addEventListener("pointermove", evt => {
    const p = toPlotX(evt), i = nearestEvent(p.x);
    if (dragging) { if (i !== active) setActive(i, true); tip.hidden = true; hover = -1; drawDynamic(); return; }
    if (i !== hover) { hover = i; drawDynamic(); }
    showTip(i, p.px, p.py);
  });
  hit.addEventListener("pointerup", evt => { dragging = false; try { hit.releasePointerCapture(evt.pointerId); } catch (_) {} });
  hit.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; tip.hidden = true; drawDynamic(); } });
  chart.addEventListener("keydown", evt => {
    const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 10, PageUp: -10, ArrowUp: -1, ArrowDown: 1 }[evt.key];
    let next = active;
    if (step) next = active + step; else if (evt.key === "Home") next = 0; else if (evt.key === "End") next = EV.length - 1; else return;
    evt.preventDefault(); setActive(Math.max(0, Math.min(EV.length - 1, next)), true);
  });

  // ---------- readout (a table view of the cursor, always visible)
  const readoutCard = document.getElementById("readout");
  const readout = el("div"); readout.style.display = "flex"; readout.style.flexDirection = "column"; readout.style.gap = "8px";
  readoutCard.appendChild(readout);
  // navigation is built once, so a keyboard user keeps focus on the button they pressed
  const nav = el("div", "nav");
  [["◀ Prev", () => active - 1], ["Next ▶", () => active + 1],
   ["◀ Prompt", () => { for (let i = active - 1; i >= 0; i--) if (EV[i].k === "p") return i; return active; }],
   ["Prompt ▶", () => { for (let i = active + 1; i < EV.length; i++) if (EV[i].k === "p") return i; return active; }]]
    .forEach(([label, f]) => { const b = el("button", "btn", label); b.type = "button"; b.addEventListener("click", () => setActive(Math.max(0, Math.min(EV.length - 1, f())), true)); nav.appendChild(b); });
  readoutCard.appendChild(nav);
  function renderReadout() {
    readout.replaceChildren();
    const e = EV[active];
    readout.appendChild(el("div", "title", eventLabel(active)));
    const meta = [];
    if (eventTime(active)) meta.push(eventTime(active));
    meta.push("conversation: " + CONV[e.c].name);
    
    readout.appendChild(el("div", "meta", meta.join(" · ")));
    if (e.k === "p") {
      readout.appendChild(el("div", "ptext", CONV[e.c].turns[e.t].prompt));
      readout.appendChild(el("div", "meta", "Prompts are not scored; the model's sentences that follow are."));
    } else {
      const vals = sentenceOf(e).values, rows = el("div", "rows");
      EM.map((em, k) => k).filter(k => vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); if (!visible[k]) r.style.opacity = "0.45";
        r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name + (visible[k] ? "" : " (hidden)")));
        rows.appendChild(r);
      });
      readout.appendChild(rows);
    }
  }

  // ---------- chat
  const chat = document.getElementById("chat");
  const bubbleOf = [];
  document.getElementById("chatinfo").textContent = totalP + " prompts · " + totalS + " scored sentences";
  CONV.forEach((c, ci) => {
    chat.appendChild(el("div", "divider", "Conversation: " + c.name));
    c.turns.forEach((turn, ti) => {
      const pi = turn.event;
      chat.appendChild(el("div", "who user", "user · P" + pNumber[pi] + (eventTime(pi) ? " · " + eventTime(pi) : "")));
      const ub = el("div", "bubble user"); ub.appendChild(el("div", "text", turn.prompt));
      ub.addEventListener("click", () => setActive(pi, false)); bubbleOf[pi] = ub; chat.appendChild(ub);
      chat.appendChild(el("div", "who model", "model · reply " + (ti + 1) + (turn.sentences.length ? "" : " · no scored sentences")));
      turn.sentences.forEach(s => {
        const i = s.event, b = el("div", "bubble model");
        b.appendChild(el("div", "text", s.text));
        const bm = el("div", "bm");
        bm.appendChild(el("span", null, "S" + sNumber[i] + (eventTime(i) ? " · " + eventTime(i) : "")));
        const top = el("span", "top3");
        s.values.map((v, k) => k).filter(k => s.values[k] != null).sort((a, b2) => s.values[b2] - s.values[a]).slice(0, 3).forEach(k => {
          const sp = el("span"); sp.appendChild(lineKey(k, 16)); sp.appendChild(document.createTextNode(EM[k].name + " " + s.values[k].toFixed(3))); top.appendChild(sp);
        });
        bm.appendChild(top);
        
        b.appendChild(bm);
        b.addEventListener("click", () => setActive(i, false)); bubbleOf[i] = b; chat.appendChild(b);
      });
      if (turn.tail) chat.appendChild(el("div", "tail", "not scored (no sentence ending): " + turn.tail));
      if (turn.stop_reason && turn.stop_reason !== "end of turn") chat.appendChild(el("div", "tail", "reply stopped: " + turn.stop_reason));
    });
  });
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatTo(i, smooth) {
    const b = bubbleOf[i]; if (!b) return;
    const target = b.offsetTop - chat.clientHeight / 2 + b.offsetHeight / 2;
    chat.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduceMotion ? "smooth" : "auto" });
  }

  // ---------- table view (built on first open)
  const details = document.getElementById("tabledetails");
  details.addEventListener("toggle", () => {
    const wrap = document.getElementById("tablewrap");
    if (!details.open || wrap.firstChild) return;
    const t = el("table"), thead = el("thead"), hr = el("tr");
    ["#", "time", "reply", "sentence"].forEach((h, k) => hr.appendChild(el("th", k === 3 || k === 1 || k === 5 ? "l" : null, h)));
    EM.forEach(em => hr.appendChild(el("th", null, em.name)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const s = sentenceOf(e), tr = el("tr");
      tr.appendChild(el("td", null, "S" + sNumber[i]));
      tr.appendChild(el("td", "l", eventTime(i) || "–"));
      tr.appendChild(el("td", null, String(e.t + 1)));
      const st = el("td", "l sent", s.text); st.title = s.text; tr.appendChild(st);
      
      let best = -1; s.values.forEach((v, k) => { if (v != null && (best < 0 || v > s.values[best])) best = k; });
      s.values.forEach((v, k) => { const td = el("td"); const sp = el("span", k === best ? "best num" : "num", fmt(v)); sp.style.fontWeight = k === best ? "700" : "400"; td.appendChild(sp); tr.appendChild(td); });
      tr.addEventListener("click", () => setActive(i, true));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  });

  // ---------- distribution of this session's scores
  (function () {
    const DS = D.dist, host = document.getElementById("dist");
    if (!DS || !DS.n) { document.getElementById("distcard").hidden = true; return; }
    const nb = DS.rows[0].counts.length;
    document.getElementById("distinfo").textContent = DS.n + " sentences · " + nb + " bins";
    const clamped = DS.rows.reduce((a, r) => a + r.below + r.above, 0);
    document.getElementById("distnote").textContent =
      "Each row shows how this session's sentences spread across score bins of width " + DS.width +
      ", as a percentage of its " + DS.n + " sentences (counts, no fitted curve). All rows share one horizontal and one vertical scale, " +
      "so positions and heights compare directly. The dark vertical mark is the mean." +
      (clamped ? " " + clamped + " score(s) beyond " + DS.lo + " or " + DS.hi + " are counted in the end bins." : "");
    const svgD = sv("svg", { role: "img", "aria-label": "Distribution of each emotion's scores in this session" });
    const tipD = el("div", "tip"); tipD.hidden = true;
    host.append(svgD, tipD);
    const rowH = 30, top = 8, labelW = 112, right = 16, axisH = 34;
    const yMax = Math.max(1e-9, ...DS.rows.map(r => Math.max(...r.counts) / DS.n * 100));
    function draw() {
      const WD = Math.max(320, Math.round(host.clientWidth)), HD = top + rowH * DS.rows.length + axisH;
      svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
