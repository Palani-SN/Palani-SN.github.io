":"05:29:50.943","iso":"2026-10-20T05:29:50.943+00:00","estimated":false}],"conversations":[{"name":"unemployment_and_ai","turns":[{"prompt":"Hi, Good Morning","event":0,"stop_reason":"end of turn","tail":"","sentences":[{"text":"Good morning!","event":1,"values":[0.09148243069648743,0.17321279644966125,0.14844021201133728,0.12891364097595215,-0.02675105258822441,0.023755628615617752,-0.013946093618869781,-0.010485680773854256,0.04901779815554619,-0.07190452516078949,0.08141402900218964,0.04411632567644119,0.09832002222537994]},{"text":"How can I assist you today?","event":2,"values":[0.08263551443815231,0.1864013671875,0.15491485595703125,0.12253015488386154,-0.031948577612638474,0.017880983650684357,-0.016619553789496422,-0.012273531407117844,0.044616200029850006,-0.0952264666557312,0.08777448534965515,0.029014835134148598,0.096626877784729]}]},{"prompt":"I have a question, Do you know that due to effects of unemployment there is an increase in restlessness among youth, what do you think about its implications on their mental health ?","event":3,"stop_reason":"end of turn","tail":"","sentences":[{"text":"That's a very relevant and important question.","event":4,"values":[0.08781641721725464,0.09540431201457977,0.08683992922306061,0.09776437282562256,0.009104968048632145,0.05005629360675812,0.04310847446322441,0.01846465840935707,0.05664455518126488,-0.04053642228245735,0.08077172189950943,0.04154535382986069,0.07877276837825775]},{"text":"The connection between unemployment and increased restlessness in youth, and its implications for mental health, is well-documented and concerning.","event":5,"values":[0.07398179173469543,0.10738381743431091,0.1293535679578781,0.11750589311122894,0.011683010496199131,0.062234967947006226,0.04028628394007683,-0.020740775391459465,0.045225195586681366,-0.07382762432098389,0.048821255564689636,-0.0023035425692796707,0.05604002624750137]},{"text":"Here's my perspective on the implications:\n\n1.","event":6,"values":[0.0781068354845047,0.11324571818113327,0.13842737674713135,0.1189381331205368,0.0049973223358392715,0.05805663764476776,0.0362045019865036,-0.025617878884077072,0.043781884014606476,-0.08304325491189957,0.04904680326581001,-0.008684927597641945,0.05846071243286133]},{"text":"**Increased Anxiety and Stress:** Unemployment often leads to financial insecurity, which is a major stressor.","event":7,"values":[0.0804486870765686,0.08799829334020615,0.14712698757648468,0.09794393926858902,0.052140869200229645,0.09386225044727325,0.07090482115745544,-0.021549293771386147,0.06594826281070709,-0.06988939642906189,-0.00036930572241544724,-0.055440232157707214,0.022204384207725525]},{"text":"This, combined with the uncertainty of finding new employment and the pressure to meet expectations (from self, family, society), can significantly increase anxiety levels.","event":8,"values":[0.07623282074928284,0.06382901221513748,0.14329476654529572,0.07456259429454803,0.09267713129520416,0.12533940374851227,0.10310661792755127,-0.009032664820551872,0.09466544538736343,-0.05175387114286423,-0.041064437478780746,-0.087668776512146,-0.0029912926256656647]},{"text":"Restlessness is often a physical manifestation of this mental anxiety – difficulty relaxing, feeling on edge, an inability to sit still.","event":9,"values":[0.049067530781030655,0.04338984936475754,0.12908869981765747,0.0622062049806118,0.13753074407577515,0.163304403424263,0.13062980771064758,-0.00033312104642391205,0.10262486338615417,-0.02920188382267952,-0.06715759634971619,-0.10063518583774567,-0.03966287523508072]},{"text":"2.  **Low Mood and Depression:** Prolonged unemployment can lead to feelings of hopelessness, worthlessness, and low self-esteem.","event":10,"values":[0.05975636467337608,0.04903570935130119,0.11728891730308533,0.03904373198747635,0.11440356075763702,0.1530652940273285,0.11837904155254364,0.023198988288640976,0.1234525516629219,-0.014038186520338058,-0.06178118288516998,-0.10164710879325867,-0.04333365708589554]},{"text":"The loss of routine, social interaction (often through work), and a sense of purpose can contribute to depression.","event":11,"values":[0.061539605259895325,0.06440675258636475,0.11100608110427856,0.028092579916119576,0.09492293000221252,0.13224203884601593,0.0952228456735611,0.03910711035132408,0.1288118064403534,-0.0017613936215639114,-0.045644938945770264,-0.081113800406456,-0.032626356929540634]},{"text":"Restlessness can be both a symptom *and* a coping mechanism for low mood, where the individual feels unable to engage with activities that might improve their mood.","event":12,"values":[0.07198899984359741,0.06793127208948135,0.09321732819080353,0.009096494875848293,0.07460450381040573,0.11329329013824463,0.0836198627948761,0.06666997075080872,0.16076165437698364,0.007455568760633469,-0.041629575192928314,-0.08151870220899582,-0.02642907202243805]},{"text":"3.  **Decreased Self-Esteem and Identity:** For many young people, work is a crucial part of developing their identity, learning new skills, and gaining confidence.","event":13,"values":[0.07286470383405685,0.08662250638008118,0.1242004856467247,0.0447993166744709,0.052242912352085114,0.09333023428916931,0.06301466375589371,0.0288906991481781,0.13167348504066467,-0.034665390849113464,-0.026553042232990265,-0.06749996542930603,0.004728150088340044]},{"text":"Unemployment can feel like a loss of identity, leading to feelings of inadequacy and reduced self-worth.","event":14,"values":[0.07351662218570709,0.069467693567276,0.12087568640708923,0.041054174304008484,0.06606534123420715,0.10933920741081238,0.0866236612200737,0.035000331699848175,0.14027485251426697,-0.0376393124461174,-0.04076550155878067,-0.08616431057453156,-0.009930661879479885]},{"text":"This can manifest as restlessness – an inner restlessness stemming from a lack of perceived purpose or competence.","event":15,"values":[0.06711956113576889,0.0664348378777504,0.13867750763893127,0.05519261211156845,0.07276898622512817,0.12153748422861099,0.0939619243144989,0.025471370667219162,0.12103132158517838,-0.03422316908836365,-0.04324458912014961,-0.08498413860797882,-0.008631912991404533]},{"text":"4.  **Social Isolation and Loneliness:** While some might restlessly search for opportunities, others might withdraw due to lack of motivation, self-esteem issues, or the difficulty of actively job searching while feeling down.","event":16,"values":[0.06387829035520554,0.03037317469716072,0.09830242395401001,0.031922753900289536,0.10628682374954224,0.14252308011054993,0.12862718105316162,0.06953639537096024,0.1722969114780426,-0.0025827502831816673,-0.0742259994149208,-0.110905721783638,-0.05601976811885834]},{"text":"This withdrawal can lead to social isolation, which further exacerbates mental health problems like depression and anxiety.","event":17,"values":[0.07177698612213135,0.030952367931604385,0.08814144879579544,0.030475715175271034,0.09881903231143951,0.1380125880241394,0.12893900275230408,0.07603499293327332,0.1740507185459137,-0.009382051415741444,-0.06933776289224625,-0.10905193537473679,-0.05494079738855362]},{"text":"5.  **Impact on Physical Health:** Chronic stress and restlessness can also take a physical toll, potentially leading to issues like sleep disturbances, digestive problems, headaches, and even a weakened immune system.","event":18,"values":[0.1106448769569397,0.03394873067736626,0.08968581259250641,0.0388152115046978,0.08486524224281311,0.12357725203037262,0.12794490158557892,0.05665867030620575,0.1477089822292328,-0.0446217879652977,-0.05189485847949982,-0.10134918242692947,-0.03852354735136032]},{"text":"6.  **Difficulties with Future Planning:** Restlessness can make it hard to focus, learn new skills, or commit to long-term goals, which is crucial for career development.","event":19,"values":[0.11827457696199417,0.0447831004858017,0.10495308041572571,0.0452304482460022,0.07545341551303864,0.12222541123628616,0.12181275337934494,0.02775980532169342,0.11801944673061371,-0.06181658059358597,-0.04049302265048027,-0.09728708863258362,-0.024123385548591614]},{"text":"This can create a vicious cycle where the inability to settle makes finding stable employment even harder, further impacting mental well-being.","event":20,"values":[0.11206904798746109,0.04389788210391998,0.11013583838939667,0.04190804064273834,0.08827707916498184,0.1323421448469162,0.1293039470911026,0.016160089522600174,0.11292419582605362,-0.05465155467391014,-0.05005806311964989,-0.10137157887220383,-0.031298164278268814]},{"text":"7.  **Delayed Life Transitions:** Youth unemployment can delay important life transitions, such as buying a home, starting a family, or further education, which can add to feelings of frustration and restlessness.","event":21,"values":[0.10473808646202087,0.0634409487247467,0.1203802302479744,0.042651087045669556,0.06675171852111816,0.10438273847103119,0.09482230246067047,0.008217956870794296,0.1070355772972107,-0.046619780361652374,-0.02951163426041603,-0.07428847253322601,-0.008442148566246033]},{"text":"**Implications:**\n\n*   **Long-Term Mental Health Risks:** Prolonged periods of restlessness and unemployment during formative years can potentially increase the risk of long-term mental health issues.","event":22,"values":[0.11749792098999023,0.07434330880641937,0.1265968531370163,0.05290567874908447,0.05433044582605362,0.08674837648868561,0.07371845841407776,0.0034528039395809174,0.0810621902346611,-0.055076953023672104,-0.013562696054577827,-0.06135149672627449,0.006413009949028492]},{"text":"*   **Economic and Social Costs:** This impacts not just the individuals and their families but also society through potential increased healthcare costs and reduced economic productivity in the future.","event":23,"values":[0.13377854228019714,0.07691849768161774,0.12458249926567078,0.06528153270483017,0.036276593804359436,0.07192527502775192,0.05493408814072609,0.0026821810752153397,0.07324443012475967,-0.05507340282201767,0.002768447622656822,-0.049470141530036926,0.018638499081134796]},{"text":"*   **Need for Support:** It highlights the critical need for support systems, including mental health services, career counseling, financial assistance, and community programs tailored to unemployed youth to help them navigate this challenging period.","event":24,"values":[0.13587242364883423,0.08293237537145615,0.12874731421470642,0.07882924377918243,0.025381440296769142,0.07095304876565933,0.051210302859544754,-0.0016000885516405106,0.06378898024559021,-0.05275623872876167,0.006211984436959028,-0.04858090355992317,0.024210743606090546]},{"text":"In summary, the restlessness observed in youth due to unemployment is often a signal of underlying significant mental health stressors.","event":25,"values":[0.11606627702713013,0.08063769340515137,0.12900497019290924,0.08235614001750946,0.037564001977443695,0.088693767786026,0.06447508931159973,-0.002855531871318817,0.07139729708433151,-0.05325295031070709,-0.008271263912320137,-0.06023123487830162,0.011885600164532661]},{"text":"Addressing the root cause (unemployment) and providing targeted support is crucial for mitigating these negative implications.","event":26,"values":[0.10198818147182465,0.09297642856836319,0.1408613920211792,0.08713450282812119,0.03209444880485535,0.08541615307331085,0.0593949630856514,-0.011288611218333244,0.05820819362998009,-0.06156592071056366,-0.0013033561408519745,-0.0490686409175396,0.02351396158337593]}]},{"prompt":"I believe that AI models, even though can cause unemployment in the future, then can be wonderful in helping personalized learning, through which there can be a potential reduction in hiring people, what do you think ?","event":27,"stop_reason":"end of turn","tail":"","sentences":[{"text":"That's a really insightful point, touching on the complex dual nature of AI's impact.","event":28,"values":[0.08493158966302872,0.1309623420238495,0.1489473283290863,0.1133381649851799,0.00693488959223032,0.04711536690592766,0.01874844916164875,-0.031187184154987335,0.013922041282057762,-0.07364360988140106,0.07140520215034485,0.027734043076634407,0.08798778057098389]},{"text":"You've highlighted a significant potential paradox.","event":29,"values":[0.08549190312623978,0.13130679726600647,0.15267601609230042,0.11895984411239624,0.007082486990839243,0.04709237441420555,0.01612214557826519,-0.032299209386110306,0.014179786667227745,-0.07932434976100922,0.0695239007472992,0.028354547917842865,0.08554578572511673]},{"text":"Let's break down the aspects:\n\n1.","event":30,"values":[0.08372212946414948,0.1354166716337204,0.16177299618721008,0.11867603659629822,0.0014390703290700912,0.043299853801727295,0.016298070549964905,-0.03345624729990959,0.017910093069076538,-0.086870938539505,0.06243159994482994,0.019992558285593987,0.0849827229976654]},{"text":"**AI and Unemployment:** It's widely acknowledged that AI and automation will likely disrupt the job market.","event":31,"values":[0.10625775903463364,0.13230833411216736,0.17002460360527039,0.09980127215385437,-0.0024656816385686398,0.041335396468639374,0.009555437602102757,-0.032534413039684296,0.020880822092294693,-0.08951658010482788,0.05340520292520523,0.010988280177116394,0.08158555626869202]},{"text":"Tasks currently performed by humans, especially in routine cognitive and manual roles, could be automated.","event":32,"values":[0.1272449791431427,0.11899317800998688,0.157395601272583,0.08802948892116547,-0.006113529670983553,0.040107548236846924,0.00816328078508377,-0.03519783169031143,0.03237393498420715,-0.08139027655124664,0.05334057658910751,0.0036937426775693893,0.07796578854322433]},{"text":"While AI will also create new jobs requiring different skills, there's a valid concern about a net loss of jobs in certain sectors or a significant shift in the types of work available.","event":33,"values":[0.122950978577137,0.1103343814611435,0.14921435713768005,0.07613580673933029,0.0035998853854835033,0.05024676397442818,0.014024777337908745,-0.0290435217320919 3535461,-0.025491077452898026,0.04023031145334244,-0.06360563635826111,0.03995632380247116,-0.013920633122324944,0.054721567779779434]},{"text":"*   **Resource Efficiency:** Potentially reduce the need for large numbers of teachers for certain foundational tasks like grading basic assignments, answering common questions, or delivering standardized instruction.","event":39,"values":[0.14307096600532532,0.08711528778076172,0.140510693192482,0.08204931020736694,0.006076425313949585,0.06471839547157288,0.025251347571611404,-0.009854888543486595,0.04886545240879059,-0.0421438030898571,0.03190122917294502,-0.015854457393288612,0.04711125046014786]},{"text":"3.  **The Connection and the \"Potential Reduction in Hiring People\":** Your line of thought connects these points: If AI excels at personalized learning, it could become a primary method for delivering education and potentially training.","event":40,"values":[0.1339711844921112,0.09585018455982208,0.15117698907852173,0.07575713098049164,0.002052583731710911,0.06993123888969421,0.027078617364168167,-0.022801591083407402,0.04612906649708748,-0.06004048511385918,0.02489505708217621,-0.02116965875029564,0.05235729366540909]},{"text":"If this becomes more cost-effective and scalable than employing large numbers of teachers for instruction and basic support, it *could* indeed lead to a reduction in demand for human educators in those roles.","event":41,"values":[0.13859964907169342,0.09654754400253296,0.1480989009141922,0.06928424537181854,-0.00020522810518741608,0.06902150809764862,0.025825494900345802,-0.03352364897727966,0.04267006367444992,-0.062232911586761475,0.029253236949443817,-0.01581544056534767,0.05804509297013283]},{"text":"**However, there are important considerations and nuances:**\n\n*   **The Role of the Human Teacher Evolves:** While AI can handle content delivery and basic interaction, the human element – emotional support, mentorship, fostering critical thinking and creativity, managing classroom dynamics, inspiring curiosity, and providing ethical guidance – is unlikely to be fully replicated by AI any time soon.","event":42,"values":[0.12061738967895508,0.11348523199558258,0.1708456426858902,0.07441286742687225,-0.002854416146874428,0.06474757939577103,0.025927115231752396,-0.049847330898046494,0.03669111430644989,-0.07834407687187195,0.02216864377260208,-0.023134419694542885,0.07511155307292938]},{"text":"The role of teachers might shift towards becoming facilitators, guides, curriculum designers who leverage AI tools, and mentors focusing on higher-order skills.","event":43,"values":[0.11628112196922302,0.11044009774923325,0.16781467199325562,0.07143086194992065,0.0024965154007077217,0.06694865226745605,0.029116962105035782,-0.0478481687605381,0.03877245634794235,-0.07210788875818253,0.0216422900557518,-0.023246075958013535,0.07607871294021606]},{"text":"*   **New Skill Requirements:** The jobs *created* by AI will require different skills – data analysis, AI development and maintenance, human-AI interaction design, prompt engineering, etc.","event":44,"values":[0.10738673061132431,0.11419408023357391,0.16546134650707245,0.07807205617427826,0.004405747167766094,0.06459924578666687,0.027755720540881157,-0.04320661723613739,0.03929783031344414,-0.06854213774204254,0.02609497681260109,-0.016882965341210365,0.07827652990818024]},{"text":"The education system itself would need to adapt to prepare students for these roles.","event":45,"values":[0.10006144642829895,0.10941603779792786,0.1563858985900879,0.07785976678133011,0.01353125274181366,0.07392002642154694,0.03377009183168411,-0.03508361428976059,0.04098952189087868,-0.06715838611125946,0.02898668311536312,-0.012015167623758316,0.0694296583533287]},{"text":"*   **Accessibility and Equity:** There's a risk that if AI-driven education becomes dominant, it might exacerbate existing inequalities if access to the necessary technology and high-quality AI systems is not universally available.","event":46,"values":[0.1 hools are major employers.","event":51,"values":[0.11448603868484497,0.11004172265529633,0.1648363173007965,0.06731312721967697,0.0012302398681640625,0.060157716274261475,0.027496151626110077,-0.04216324910521507,0.03195585310459137,-0.08552630990743637,0.03541054204106331,-0.015954725444316864,0.08313647657632828]},{"text":"It also raises questions about the purpose of education beyond just job preparation.","event":52,"values":[0.11013157665729523,0.11016914248466492,0.16278722882270813,0.06053299829363823,0.008458108641207218,0.05675695091485977,0.031303539872169495,-0.031720008701086044,0.0364028736948967,-0.08113783597946167,0.034304387867450714,-0.016741935163736343,0.07967108488082886]},{"text":"**Conclusion:**\n\nYou are right to point out this tension.","event":53,"values":[0.10580059885978699,0.1178581491112709,0.16666844487190247,0.06807142496109009,0.010386861860752106,0.05774415284395218,0.03307546302676201,-0.02637949399650097,0.04694536328315735,-0.07263290882110596,0.017702899873256683,-0.026185639202594757,0.06983151286840439]},{"text":"AI *could* significantly enhance personalized learning, potentially making certain educational functions less reliant on human teachers.","event":54,"values":[0.11785222589969635,0.10114721208810806,0.17218218743801117,0.07119940221309662,0.015573413111269474,0.06708602607250214,0.03198681026697159,-0.035506002604961395,0.04776677489280701,-0.07700961828231812,0.017787005752325058,-0.03054783307015896,0.05413991957902908]},{"text":"However, this doesn't necessarily mean a complete replacement.","event":55,"values":[0.11625669151544571,0.10410249978303909,0.17165657877922058,0.07623683661222458,0.012270275503396988,0.07080718874931335,0.03261629119515419,-0.041543833911418915,0.044049669057130814,-0.07592496275901794,0.019221318885684013,-0.022162646055221558,0.0581006184220314]},{"text":"It's more likely to lead to a transformation of the education sector, requiring educators to adapt and focusing AI on specific task       const x = X(e.x);
      gStatic.appendChild(sv("line", { x1: x, x2: x, y1: pb, y2: pb + 6, stroke: "var(--ink-2)", "stroke-width": 1.5 }));
      const t1 = "P" + pNumber[i], t2 = D.mode === "time" ? (e.estimated ? "time not recorded" : e.time.slice(0, 8)) : "";
      const w = Math.max(t1.length, t2.length) * 6.2 + 8;
      const row = (x - w / 2 > rowEnd[0]) ? 0 : 1;
      rowEnd[row] = x + w / 2;
      const y0 = pb + 19 + row * 27;
      const a = sv("text", { x: x, y: y0, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)", "font-weight": 600 }); a.textContent = t1; gStatic.appendChild(a);
      if (t2) { const b = sv("text", { x: x, y: y0 + 11, "text-anchor": "middle", "font-size": 10, fill: e.estimated ? "var(--muted)" : "var(--ink-2)" }); b.style.fontVariantNumeric = "tabular-nums"; if (e.estimated) b.setAttribute("font-style", "italic"); b.textContent = t2; gStatic.appendChild(b); }
    });

    // series: one path per emotion per reply
    const anyVisible = visible.some(Boolean);
    EM.forEach((em, i) => {
      if (!visible[i]) return;
      CONV.forEach(c => c.turns.forEach(turn => {
        let d = "", pen = false;
        turn.sentences.forEach(s => {
          const v = s.values[i];
          if (v == null) { pen = false; return; }
          d += (pen ? "L" : "M") + X(EV[s.event].x).toFixed(1) + " " + Y(v).toFixed(1); pen = true;
        });
        if (!d) return;
        const p = sv("path", { d: d, fill: "none", "stroke-width": emphasis === i ? 3 : 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
        p.style.stroke = color(i);
        if (em.dash) p.setAttribute("stroke-dasharray", em.dash);
        if (emphasis >= 0 && emphasis !== i) p.setAttribute("opacity", "0.18");
        gStatic.appendChild(p);
        if (turn.sentences.length === 1 && s0v(turn, i) != null) {
          const dot = sv("circle", { cx: X(EV[turn.sentences[0].event].x), cy: Y(s0v(turn, i)), r: 2.5 }); dot.style.fill = color(i); gStatic.appendChild(dot);
        }
      }));
    });
    if (!anyVisible) {
      const t = sv("text", { x: (pl + pr) / 2, y: (pt + pb) / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 13 });
      t.textContent = "All emotions are hidden. Use the buttons above to show them."; gStatic.appendChild(t);
    }
    hit.setAttribute("x", pl); hit.setAttribute("y", 0); hit.setAttribute("width", pr - pl); hit.setAttribute("height", H);
  }
  function s0v(turn, i) { return turn.sentences[0].values[i]; }

  function drawDynamic() {
    gDyn.replaceChildren();
    const pt = M.top, pb = H - M.bottom;
    if (hover >= 0 && hover !== active) {
      const x = X(EV[hover].x);
      gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: "var(--muted)", "stroke-width": 1 }));
    }
    const e = EV[active], x = X(e.x);
    gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt - 8, y2: pb + 8, stroke: "var(--ink)", "stroke-width": 1.5 }));
    if (e.k === "s") {
      const vals = sentenceOf(e).values;
      EM.forEach((em, i) => {
        if (!visible[i] || vals[i] == null) return;
        const c = sv("circle", { cx: x, cy: Y(vals[i]), r: 4, "stroke-width": 2 });
        c.style.fill = color(i); c.style.stroke = "var(--surface)";
        if (emphasis >= 0 && emphasis !== i) c.setAttribute("opacity", "0.2");
        gDyn.appendChild(c);
      });
    }
    // the slider handle, on the bottom scale
    const handle = sv("g", {});
    handle.appendChild(sv("circle", { cx: x, cy: pb, r: 7, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2 }));
    gDyn.appendChild(handle);
    chart.setAttribute("aria-valuemin", "1"); chart.setAttribute("aria-valuemax", String(EV.length));
    chart.setAttribute("aria-valuenow", String(active + 1));
    chart.setAttribute("aria-valuetext", eventLabel(active) + (eventTime(active) ? ", " + eventTime(active) : ""));
  }

  function drawAll() { drawStatic(); drawDynamic(); renderReadout(); }

  // ---------- tooltip (values lead, every visible series)
  function showTip(i, px, py) {
    tip.replaceChildren();
    const e = EV[i];
    const head = el("div", "h", eventLabel(i) + (eventTime(i) ? " · " + eventTime(i) : ""));
    tip.appendChild(head);
    if (e.k === "p") {
      const t = CONV[e.c].turns[e.t].prompt;
      tip.appendChild(el("div", null, t.length > 180 ? t.slice(0, 180) + "…" : t));
    } else {
      const vals = sentenceOf(e).values;
      EM.map((em, k) => k).filter(k => visible[k] && vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name)); tip.appendChild(r);
      });
    }
    tip.hidden = false;
    const rect = chart.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14, top = py - th / 2;
    if (left + tw > rect.width - 4) left = px - tw - 14;
    top = Math.max(4, Math.min(top, rect.height - th - 4));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }

  function toPlotX(evt) {
    const r = svg.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W / r.width), px: evt.clientX - chart.getBoundingClientRect().left, py: evt.clientY - chart.getBoundingClientRect().top };
  }
  let dragging = false;
  hit.addEventListener("pointerdown", evt => { dragging = true; hit.setPointerCapture(evt.pointerId); const p = toPlotX(evt); setActive(nearestEvent(p.x), true); chart.focus({ preventScroll: true }); });
  hit.addEventListener("pointermove", evt => {
    const p = toPlotX(evt), i = nearestEvent(p.x);
    if (dragging) { if (i !== active) setActive(i, true); tip.hidden = true; hover = -1; drawDynamic(); return; }
    if (i !== hover) { hover = i; drawDynamic(); }
    showTip(i, p.px, p.py);
  });
  hit.addEventListener("pointerup", evt => { dragging = false; try { hit.releasePointerCapture(evt.pointerId); } catch (_) {} });
  hit.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; tip.hidden = true; drawDynamic(); } });
  chart.addEventListener("keydown", evt => {
    const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 10, PageUp: -10, ArrowUp: -1, ArrowDown: 1 }[evt.key];
    let next = active;
    if (step) next = active + step; else if (evt.key === "Home") next = 0; else if (evt.key === "End") next = EV.length - 1; else return;
    evt.preventDefault(); setActive(Math.max(0, Math.min(EV.length - 1, next)), true);
  });

  // ---------- readout (a table view of the cursor, always visible)
  const readoutCard = document.getElementById("readout");
  const readout = el("div"); readout.style.display = "flex"; readout.style.flexDirection = "column"; readout.style.gap = "8px";
  readoutCard.appendChild(readout);
  // navigation is built once, so a keyboard user keeps focus on the button they pressed
  const nav = el("div", "nav");
  [["◀ Prev", () => active - 1], ["Next ▶", () => active + 1],
   ["◀ Prompt", () => { for (let i = active - 1; i >= 0; i--) if (EV[i].k === "p") return i; return active; }],
   ["Prompt ▶", () => { for (let i = active + 1; i < EV.length; i++) if (EV[i].k === "p") return i; return active; }]]
    .forEach(([label, f]) => { const b = el("button", "btn", label); b.type = "button"; b.addEventListener("click", () => setActive(Math.max(0, Math.min(EV.length - 1, f())), true)); nav.appendChild(b); });
  readoutCard.appendChild(nav);
  function renderReadout() {
    readout.replaceChildren();
    const e = EV[active];
    readout.appendChild(el("div", "title", eventLabel(active)));
    const meta = [];
    if (eventTime(active)) meta.push(eventTime(active));
    meta.push("conversation: " + CONV[e.c].name);
    
    readout.appendChild(el("div", "meta", meta.join(" · ")));
    if (e.k === "p") {
      readout.appendChild(el("div", "ptext", CONV[e.c].turns[e.t].prompt));
      readout.appendChild(el("div", "meta", "Prompts are not scored; the model's sentences that follow are."));
    } else {
      const vals = sentenceOf(e).values, rows = el("div", "rows");
      EM.map((em, k) => k).filter(k => vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); if (!visible[k]) r.style.opacity = "0.45";
        r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name + (visible[k] ? "" : " (hidden)")));
        rows.appendChild(r);
      });
      readout.appendChild(rows);
    }
  }

  // ---------- chat
  const chat = document.getElementById("chat");
  const bubbleOf = [];
  document.getElementById("chatinfo").textContent = totalP + " prompts · " + totalS + " scored sentences";
  CONV.forEach((c, ci) => {
    chat.appendChild(el("div", "divider", "Conversation: " + c.name));
    c.turns.forEach((turn, ti) => {
      const pi = turn.event;
      chat.appendChild(el("div", "who user", "user · P" + pNumber[pi] + (eventTime(pi) ? " · " + eventTime(pi) : "")));
      const ub = el("div", "bubble user"); ub.appendChild(el("div", "text", turn.prompt));
      ub.addEventListener("click", () => setActive(pi, false)); bubbleOf[pi] = ub; chat.appendChild(ub);
      chat.appendChild(el("div", "who model", "model · reply " + (ti + 1) + (turn.sentences.length ? "" : " · no scored sentences")));
      turn.sentences.forEach(s => {
        const i = s.event, b = el("div", "bubble model");
        b.appendChild(el("div", "text", s.text));
        const bm = el("div", "bm");
        bm.appendChild(el("span", null, "S" + sNumber[i] + (eventTime(i) ? " · " + eventTime(i) : "")));
        const top = el("span", "top3");
        s.values.map((v, k) => k).filter(k => s.values[k] != null).sort((a, b2) => s.values[b2] - s.values[a]).slice(0, 3).forEach(k => {
          const sp = el("span"); sp.appendChild(lineKey(k, 16)); sp.appendChild(document.createTextNode(EM[k].name + " " + s.values[k].toFixed(3))); top.appendChild(sp);
        });
        bm.appendChild(top);
        
        b.appendChild(bm);
        b.addEventListener("click", () => setActive(i, false)); bubbleOf[i] = b; chat.appendChild(b);
      });
      if (turn.tail) chat.appendChild(el("div", "tail", "not scored (no sentence ending): " + turn.tail));
      if (turn.stop_reason && turn.stop_reason !== "end of turn") chat.appendChild(el("div", "tail", "reply stopped: " + turn.stop_reason));
    });
  });
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatTo(i, smooth) {
    const b = bubbleOf[i]; if (!b) return;
    const target = b.offsetTop - chat.clientHeight / 2 + b.offsetHeight / 2;
    chat.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduceMotion ? "smooth" : "auto" });
  }

  // ---------- table view (built on first open)
  const details = document.getElementById("tabledetails");
  details.addEventListener("toggle", () => {
    const wrap = document.getElementById("tablewrap");
    if (!details.open || wrap.firstChild) return;
    const t = el("table"), thead = el("thead"), hr = el("tr");
    ["#", "time", "reply", "sentence"].forEach((h, k) => hr.appendChild(el("th", k === 3 || k === 1 || k === 5 ? "l" : null, h)));
    EM.forEach(em => hr.appendChild(el("th", null, em.name)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const s = sentenceOf(e), tr = el("tr");
      tr.appendChild(el("td", null, "S" + sNumber[i]));
      tr.appendChild(el("td", "l", eventTime(i) || "–"));
      tr.appendChild(el("td", null, String(e.t + 1)));
      const st = el("td", "l sent", s.text); st.title = s.text; tr.appendChild(st);
      
      let best = -1; s.values.forEach((v, k) => { if (v != null && (best < 0 || v > s.values[best])) best = k; });
      s.values.forEach((v, k) => { const td = el("td"); const sp = el("span", k === best ? "best num" : "num", fmt(v)); sp.style.fontWeight = k === best ? "700" : "400"; td.appendChild(sp); tr.appendChild(td); });
      tr.addEventListener("click", () => setActive(i, true));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  });

  // ---------- distribution of this session's scores
  (function () {
    const DS = D.dist, host = document.getElementById("dist");
    if (!DS || !DS.n) { document.getElementById("distcard").hidden = true; return; }
    const nb = DS.rows[0].counts.length;
    document.getElementById("distinfo").textContent = DS.n + " sentences · " + nb + " bins";
    const clamped = DS.rows.reduce((a, r) => a + r.below + r.above, 0);
    document.getElementById("distnote").textContent =
      "Each row shows how this session's sentences spread across score bins of width " + DS.width +
      ", as a percentage of its " + DS.n + " sentences (counts, no fitted curve). All rows share one horizontal and one vertical scale, " +
      "so positions and heights compare directly. The dark vertical mark is the mean." +
      (clamped ? " " + clamped + " score(s) beyond " + DS.lo + " or " + DS.hi + " are counted in the end bins." : "");
    const svgD = sv("svg", { role: "img", "aria-label": "Distribution of each emotion's scores in this session" });
    const tipD = el("div", "tip"); tipD.hidden = true;
    host.append(svgD, tipD);
    const rowH = 30, top = 8, labelW = 112, right = 16, axisH = 34;
    const yMax = Math.max(1e-9, ...DS.rows.map(r => Math.max(...r.counts) / DS.n * 100));
    function draw() {
      const WD = Math.max(320, Math.round(host.clientWidth)), HD = top + rowH * DS.rows.length + axisH;
      svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
