are often establishing their careers and identities, and increased restlessness is well-documented, and the implications for mental health are significant and concerning.","event":5,"values":[0.06399625539779663,0.1158238872885704,0.14592616260051727,0.13383141160011292,0.010160134173929691,0.061123013496398926,0.034157924354076385,-0.030917294323444366,0.042821235954761505,-0.08634565770626068,0.044164352118968964,-0.003946396522223949,0.05469585955142975]},{"text":"Here's my perspective on the implications:\n\n1.","event":6,"values":[0.0686655342578888,0.11943095922470093,0.15199027955532074,0.13433898985385895,0.0051124924793839455,0.059048380702733994,0.031164780259132385,-0.034567613154649734,0.04167221486568451,-0.09371235221624374,0.04417639225721359,-0.011018183082342148,0.05528489500284195]},{"text":"**Increased Anxiety and Stress:** The uncertainty associated with unemployment is a major stressor.","event":7,"values":[0.07036097347736359,0.09875806421041489,0.15624265372753143,0.11437772959470749,0.043377891182899475,0.08915170282125473,0.06009228527545929,-0.030476108193397522,0.061016812920570374,-0.07755032181739807,0.004854987375438213,-0.049524590373039246,0.02531750500202179]},{"text":"Youth might worry about future finances, their ability to support themselves or families (if applicable), meeting societal expectations, and falling behind peers who are employed.","event":8,"values":[0.1043931245803833,0.07150082290172577,0.14079201221466064,0.07688823342323303,0.06411424279212952,0.10217291861772537,0.08114248514175415,-0.020678957924246788,0.08384310454130173,-0.060235556215047836,-0.01964896358549595,-0.07922817766666412,0.014806021936237812]},{"text":"This chronic stress can significantly impact mental well-being.","event":9,"values":[0.0968640148639679,0.06018178164958954,0.12886390089988708,0.06773646920919418,0.08968138694763184,0.11879248917102814,0.10273432731628418,-0.01036759838461876,0.0876801609992981,-0.04965580254793167,-0.0328340083360672,-0.08522960543632507,0.0018825097940862179]},{"text":"2.  **Depression and Low Mood:** Prolonged unemployment can lead to feelings of hopelessness, worthlessness, and sadness.","event":10,"values":[0.1061209887266159,0.06623238325119019,0.11436663568019867,0.04082009941339493,0.06528028845787048,0.10614101588726044,0.09017208963632584,0.027748912572860718,0.11580825597047806,-0.034898541867733,-0.026462581008672714,-0.0860065221786499,-0.0035698674619197845]},{"text":"The loss of a routine, social interaction (often lost in the workplace), and a sense of purpose can contribute heavily to depressive symptoms.","event":11,"values":[0.08763384819030762,0.0825737863779068,0.11345219612121582,0.033411502838134766,0.0612357035279274,0.09811291098594666,0.07671786099672318,0.05178254842758179,0.12580987811088562,-0.020995257422327995,-0.023248618468642235,-0.07226711511611938,-0.0041244057938456535]},{"text":"3.  **Reduced Self-Esteem and Identity Crisis:** For many young people, work is a primary source of identity and self-worth.","event":12,"values":[0.10088469088077545,0.09445063769817352,0.13508737087249756,0.04455515742301941,0.03579748049378395,0.08064571022987366,0.05724251642823219,0.035049449652433395,0.11536388099193573,-0.03443208336830139,-0.013298854231834412,-0.0617399699985981,0.01705925166606903]},{"text":"Unemployment can lead to questioning one's abilities, value, and place in the world, severely damaging self-esteem and potentially leading to an identity crisis.","event":13,"values":[0.09460602700710297,0.10089606791734695,0.1535404473543167,0.07189732789993286,0.037531428039073944,0.07802750170230865,0.06097988039255142,0.011946059763431549,0.09497073292732239,-0.06328626722097397,-0.01815800555050373,-0.06272786855697632,0.027071941643953323]},{"text":"4.  **Restlessness Manifesting as Agitation or Inaction:** This restlessness you mentioned can manifest in various ways:\n    *   **Psychological:** Constant worrying, inability to focus, irritability, feeling on edge.","event":14,"values":[0.0888911709189415,0.06998792290687561,0.14807741343975067,0.06870821118354797,0.07658588886260986,0.125942200422287,0.09523977339267731,0.01174090150743723,0.10137154161930084,-0.05733998864889145,-0.04983866959810257,-0.10290777683258057,-0.013895890675485134]},{"text":"*   **Behavioral:** Agitated movements, difficulty sitting still, pacing, inability to engage in activities, or conversely, aimless internet browsing/vacant staring (which can also be a sign of depression or anxiety).","event":15,"values":[0.07800746709108353,0.027493633329868317,0.09598094969987869,0.03822171315550804,0.10994866490364075,0.14868035912513733,0.11940830200910568,0.05250097066164017,0.1441085785627365,0.008243618533015251,-0.06254951655864716,-0.1173085868358612,-0.05632155388593674]},{"text":"*   **Cognitive:** Racing thoughts, difficulty making decisions, feeling overwhelmed.","event":16,"values":[0.07390652596950531,0.017689302563667297,0.07804875075817108,0.03152808919548988,0.1227070540189743,0.15765443444252014,0.12471984326839447,0.0620076060295105,0.14916247129440308,0.03444044291973114,-0.05746841058135033,-0.10762718319892883,-0.0654764398932457]},{"text":"5.  **Social Isolation:** Unemployment can lead to withdrawal from social activities due to financial constraints, feelings of shame, or simply a lack of energy or motivation.","event":17,"values":[0.08325012028217316,0.014323128387331963,0.05900299549102783,0.013269868679344654,0.10504729300737381,0.1301577091217041,0.12283116579055786,0.09362933039665222,0.18718183040618896,0.034221749752759933,-0.05585934594273567,-0.10400672256946564,-0.06436092406511307]},{"text":"This isolation further exacerbates mental health problems like depression and anxiety.","event":18,"values":[0.09307089447975159,0.04154745489358902,0.07699914276599884,0.027534903958439827,0.0842546820640564,0.11309590935707092,0.11916429549455643,0.08904647827148438,0.1733672320842743,-0.02554568648338318,-0.04925302416086197,-0.09278447926044464,-0.03975873440504074]},{"text":"6.  **Impact on Physical Health:** Chronic stress and mental health issues can also manifest physically, leading to problems like sleep disturbances (insomnia or excessive sleeping), changes in appetite, headaches, digestive issues, and a weakened immune system.","event":19,"values":[0.11737530678510666,0.048568692058324814,0.08908184617757797,0.03286903724074364,0.07081180810928345,0.1033417358994484,0.11587724089622498,0.06997547298669815,0.14914590120315552,-0.052902668714523315,-0.04049328714609146,-0.09129335731267929,-0.02350543811917305]},{"text":"7.  **Delayed Life Milestones:** Unemployment can postpone major life decisions and milestones, such as moving out, further education, marriage, or starting a family, adding another layer of stress and potential regret.","event":20,"values":[0.12572422623634338,0.061358921229839325,0.11898455768823624,0.04878472909331322,0.06078263372182846,0.09601379185914993,0.10422199219465256,0.02859494462609291,0.11457380652427673,-0.0745789110660553,-0.03391900658607483,-0.08626791834831238,-0.010676114819943905]},{"text":"**Implications:**\n\n*   **Long-Term Mental Health Risks:** Prolonged unemployment, especially during formative years, can increase the risk of developing long-term mental health conditions.","event":21,"values":[0.138429194688797,0.06944949924945831,0.12672561407089233,0.059102222323417664,0.04747355729341507,0.07961452007293701,0.08471977710723877,0.013139289803802967,0.09169714152812958,-0.07669070363044739,-0.017722222954034805,-0.07208503037691116,0.0051734005101025105]},{"text":"*   **Economic Consequences:** Beyond the immediate financial strain, poor mental health can lead to reduced future employability and lower lifetime earning potential.","event":22,"values":[0.14152765274047852,0.0748402327299118,0.12659817934036255,0.06418272852897644,0.03350716084241867,0.06736821681261063,0.06843478232622147,0.004963137209415436,0.08083145320415497,-0.06400101631879807,-0.0040401434525847435,-0.05009305849671364,0.01927061378955841]},{"text":"*   **Social Costs:** Increased reliance on social support systems, potential rise in crime rates (though this is complex and debated), and a general strain on societal resources.","event":23,"values":[0.1462278813123703,0.07251355051994324,0.10949365794658661,0.06811471283435822,0.03249388188123703,0.06770691275596619,0.06462728977203369,0.009673230350017548,0.07421080023050308,-0.049416616559028625,0.002960412297397852,-0.043223895132541656,0.02292056381702423]},{"text":"*   **Need for Support:** Highlights the critical need for robust support systems for unemployed youth, including financial assistance, career counseling, mental health services, and community programs that foster engagement and purpose.","event":24,"values":[0.13063912093639374,0.07528350502252579,0.11688962578773499,0.07279947400093079,0.03335360810160637,0.07854972779750824,0.06906618177890778,0.0048400964587926865,0.07934752106666565,-0.04204237088561058,-0.009713783860206604,-0.050840504467487335,0.017062347382307053]},{"text":"In conclusion, the restlessness experienced by youth due to unemployment is not just a fleeting feeling but can be a significant symptom of underlying mental distress.","event":25,"values":[0.1089877039194107,0.07848386466503143,0.12689846754074097,0.07773010432720184,0.04523175209760666,0.08911080658435822,0.06720767915248871,-0.006501806899905205,0.07078240811824799,-0.047456782311201096,-0.015645425766706467,-0.05564361810684204,0.013515833765268326]},{"text":"Its implications are far-reaching, affecting their psychological well-being, social functioning, physical health, and future prospects.","event":26,"values":[0.09271164983510971,0.09087434411048889,0.14676512777805328,0.08638906478881836,0.04233185946941376,0.08764997124671936,0.06827028095722198,-0.013432029634714127,0.06513401865959167,-0.06398722529411316,-0.018116936087608337,-0.05712185800075531,0.0183450 n Personalized Learning:**\n    *   **Tailored Pace and Style:** AI can adapt to individual learning speeds and styles, providing customized content, practice, and feedback that's difficult for human educators to scale efficiently.","event":32,"values":[0.10769655555486679,0.13823489844799042,0.1913677155971527,0.11223175376653671,-0.023092681542038918,0.050910454243421555,0.004500005394220352,-0.04794301092624664,0.027121391147375107,-0.08880552649497986,0.03603598475456238,-0.023657117038965225,0.06901724636554718]},{"text":"*   **Accessibility:** It can offer educational resources 24/7, breaking down barriers of time and location.","event":33,"values":[0.10886401683092117,0.12260536104440689,0.17978721857070923,0.10034234821796417,-0.013857804238796234,0.062110599130392075,0.01702015846967697,-0.03524123132228851,0.03754667192697525,-0.07161079347133636,0.030801530927419662,-0.026721611618995667,0.060885846614837646]},{"text":"*   **Data-Driven Insights:** AI can analyze student performance data to identify specific knowledge gaps and suggest targeted interventions.","event":34,"values":[0.11458060145378113,0.1161869615316391,0.16979876160621643,0.0994972363114357,-0.011705285869538784,0.05945916846394539,0.016512112691998482,-0.02847210131585598,0.03712601214647293,-0.06140119582414627,0.035230979323387146,-0.020233415067195892,0.05926474928855896]},{"text":"*   **Resource Optimization:** It could potentially reduce the need for large numbers of teaching staff for routine tasks, freeing them up for more complex roles like mentorship, counseling, and curriculum development.","event":35,"values":[0.12238319963216782,0.10335535556077957,0.16105246543884277,0.08312545716762543,-0.0006676185876131058,0.060030676424503326,0.028243694454431534,-0.02590557187795639,0.038659799844026566,-0.05455070361495018,0.026649130508303642,-0.01276591420173645,0.05690718814730644]},{"text":"2.  **The Risk of Reduced Hiring:**\n    *   **Economic Inefficiency (Potentially):** While AI can automate tasks, the role of human educators involves much more than just content delivery.","event":36,"values":[0.12432162463665009,0.11016009747982025,0.16739395260810852,0.08475682884454727,-0.007923285476863384,0.05483518913388252,0.018644388765096664,-0.03663693368434906,0.0323018841445446,-0.06317257881164551,0.03115469217300415,-0.008517155423760414,0.06716025620698929]},{"text":"Elements like empathy, inspiration, ethical guidance, fostering social skills, and addressing complex emotional needs are deeply human and currently难以被 AI fully replicates.","event":37,"values":[0.11482226848602295,0.11085416376590729,0.1681310385465622,0.07945055514574051,0.0029458748176693916,0.06231316924095154,0.02303193137049675,-0.04356646537780762,0.03501461073756218,-0.06256057322025299,0.027914583683013916,-0.00767604261636734,0.06954444199800491]},{"text":"A system purely reliant on AI might lead to less engaged, less well-rounded learners.","event":38,"values":[0.10465724766254425,0.11370527744293213,0.16455325484275818,0.07729917764663696,0.0038848998956382275,0.062463920563459396,0.026182200759649277,-0.03364657983183861,0.04800957441329956,-0.06181615963578224,0.02626989409327507,-0.016483856365084648,0.06829851120710373]},{"text":"*   **Cost and Infrastructure:** Implementing widespread, high-quality AI personalized learning systems requires significant investment in technology, infrastructure, and ongoing maintenance, which might not be feasible or equitable globally.","event":39,"values":[0.11254563927650452,0.1035289540886879,0.15463273227214813,0.07100844383239746,0.010190289467573166,0.06922626495361328,0.03750041127204895,-0.026274802163243294,0.05245853587985039,-0.06011305749416351,0.01802610047161579,-0.026934998109936714,0.059478096663951874]},{"text":"*   **Quality Control and Oversight:** Someone still needs to be involved in curating content, ensuring the AI is performing ethically, and providing support when the AI isn't sufficient.","event":40,"values":[0.12772725522518158,0.10001347959041595,0.14649760723114014,0.060550086200237274,0.006993506103754044,0.06512434780597687,0.04207368940114975,-0.021998418495059013,0.053670793771743774,-0.058664288371801376,0.01939455047249794,-0.03140871226787567,0.0596211776137352]},{"text":"*   **Potential for Increased Inequality:** If access to advanced AI learning tools is uneven, it could potentially widen the educational gap between different socioeconomic groups or regions.","event":41,"values":[0.1285850703716278,0.10362604260444641,0.1540231704711914,0.06634996831417084,0.013284922577440739,0.06978762149810791,0.042398594319820404,-0.02534741722047329,0.04158381372690201,-0.06925013661384583,0.014530360698699951,-0.03408065438270569,0.05847777798771858]},{"text":"3.  **The Balancing Act:**\n    *   It's unlikely that AI will *completely* replace human educators in the near to medium term.","event":42,"values":[0.12452183663845062,0.10734938085079193,0.1615566611289978,0.06238032877445221,0.01440487988293171,0.06890648603439331,0.047053731977939606,-0.0303003191947937,0.04222344607114792,-0.07823386043310165,0.009683717042207718,-0.03515004366636276,0.06067603453993797]},{"text":"Instead, the future probably lies in a **human-AI collaboration**.","event":43,"values":[0.11918224394321442,0.10822486877441406,0.16452081501483917,0.06267783045768738,0.02008192054927349,0.07395961880683899,0.04960452392697334,-0.025837097316980362,0.04171749949455261,-0.08655576407909393,0.009475009515881538,-0.027597691863775253,0.05754251778125763]},{"text":"*   AI could handle the personalized delivery and basic assessment aspects, while humans focus on higher-order skills, mentorship, critical thinking facilitation, creativity sparking, and providing emotional support.","event":44,"values":[0.10961931943893433,0.11825142800807953,0.16984960436820984,0.06262731552124023,0.005000436678528786,0.06389915198087692,0.03864926099777222,-0.04387684166431427,0.039441920816898346,-0.08279276639223099,0.02260354906320572,-0.014710314571857452,0.07671162486076355]},{"text":"*   The *nature* of teaching jobs might change significantly.","event":45,"values":[0.10394760221242905,0.12034887075424194,0.16803058981895447,0.06850241869688034,0.002625059336423874,0.06297697126865387,0.03223032504320145,-0.04587489366531372,0.034568823873996735,-0.07530701160430908,0.03397153317928314,-0.01156624685972929,0.07653115689754486]},{"text":"Teachers might need to develop new skills related to managing AI tools, interpreting AI-generated insights about students, and focusing more on interaction and guidance.","event":46,"values":[0.09596754610538483,0.1208498477935791,0.1654266119003296,0.07726988196372986,0.005645602010190487,0.06022019684314728,0.025878066197037697,-0.045516788959503174,0.03137211874127388,-0.06751662492752075,0.03938012197613716,-0.00913153775036335,0.08057837188243866]},{"text":"**Conclusion:**\n\nYou are correct that AI holds immense potential to revolutionize personalized learning.","event":47,"values":[0.09194671362638474,0.1284465491771698,0.189701646566391,0.08777804672718048,-0.0015816222876310349,0.058981962502002716,0.017332853749394417,-0.05228507146239281,0.02520071715116501,-0.08320951461791992,0.03715771436691284,-0.014721047133207321,0.07950536906719208]},{"text":"However, the idea that it *will* inevitably lead to a significant reduction in hiring is overly simplistic.","event":48,"values":[0.09515536576509476,0.12484733760356903,0.19256466627120972,0.09189091622829437,-0.0027626771479845047,0.06187605857849121,0.02285202033817768,-0.06346218287944794,0.024376697838306427,-0.08534630388021469,0.024526705965399742,-0.01927725225687027,0.07943569868803024]},{"text":"While AI *could* automate certain tasks and potentially reduce the *number* of people needed for routine teaching roles, the unique and irreplaceable value of human educators in areas like empathy, inspiration, and complex social interaction means that human involvement will likely remain crucial.","event":49,"values":[0.11390473693609238,0.11308526247739792,0.17511440813541412,0.08219224214553833,-0.0010881833732128143,0.06652471423149109,0.02419750764966011,-0.06409217417240143,0.02979716658592224,-0.07626060396432877,0.02696080505847931,-0.012692704796791077,0.06954263150691986]},{"text":"The impact on employment will likely be a shift in *roles* rather than outright elimination on a massive scale, assuming responsible development and implementation.","event":50,"values":[0.11478564888238907,0.10184521973133087,0.15903127193450928,0.07148098945617676,0.004913460463285446,0.0653211921453476,0.031925901770591736,-0.051195114850997925,0.03563632816076279,-0.07280506193637848,0.030911458656191826,-0.007650602608919144,0.06580321490764618]},{"text":"We'll need to focus on how to integrate AI effectively *to augment* human capabilities rather than just replace them, ensuring the education system remains equitable and focused on developing well-rounded individuals.","event":51,"values":[0.1060783714056015,0.10998746752738953,0.15725991129875183,0.0599394254386425,0.008104090578854084,0.06429790705442429,0.029769495129585266,-0.04131697490811348,0.03767598420381546,-0.08759559690952301,0.040776751935482025,-0.005168331786990166,0.06984828412532806]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":52,"stop_reason":"end of turn","tail":"😊","sentences":[{"text":"Okay, let's step into those shoes.","event":53,"values":[0.044481635093688965,0.09233523905277252,0.09583936631679535,0.01276850514113903,0.06370458006858826,0.08414502441883087,0.09169428050518036,0.06938573718070984,0.10223235189914703,-0.07248784601688385,0.016188399866223335,-0.00038463715463876724,0.06740392744541168]},{"text":"**(Taking a deep breath, trying to steady the tremor in my hands that I didn't notice until now)**\n\nThe phone call was brief.","event":54,"values":[0.012037539854645729,0.004940951243042946,0.07736837863922119,-0.03196100890636444,0.17874674499034882,0.18220701813697815,0.22909073531627655,0.12055694311857224,0.171464741230011,-0.09702743589878082,-0.12159048020839691,-0.143927201628685,-0.05397670716047287]},{"text":"Polite, almost detached.","event":55,"values":[0.010113212279975414,-0.019754279404878616,0.05660405382514,-0.04748385399580002,0.18882913887500763,0.19531843066215515,0.24971050024032593,0.14167465269565582,0.21215158700942993,-0.08742042630910873,-0.1373697817325592,-0.16788765788078308,-0.06991034746170044]},{"text":"\"We need to restructure,\" they said, the words tasting like ash.","event":56,"values":[0.013012831099331379,-0.04677398130297661,0.03290702402591705,-0.07471024990081787,0.20541320741176605,0.20124953985214233,0.28205564618110657,0.1674565076828003,0.25274690985679626,-0.06259114295244217,-0.15960906445980072,-0.1867191046476364,-0.09125623106956482]},{"text":"My role, years of dedication, the late nights, the projects I'd poured my heart into – it all felt like it meant nothing in the face of some corporate buzzword I couldn't understand.","event":57,"values":[-0.030538886785507202,-0.0133769316598773,0.09400936216115952,-0.06183469295501709,0.1432395577430725,0.1737556755542755,0.21157792210578918,0.13437029719352722,0.25987136363983154,-0.016047067940235138,-0.12964341044425964,-0.14437171816825867,-0.032189782708883286]},{"text":"I hung up, the silence in the room suddenly deafening.","event":58,"values":[-0.05426079034805298,-0.03518151491880417,0.08991532027721405,-0.0823180228471756,0.18440040946006775,0.2101280391216278,0.25025707483291626,0.15209859609603882,0.28353452682495117,-0.007022727280855179,-0.1771523803472519,-0.1757650524377823,-0.06284792721271515]},{"text":"The carefully constructed image of stability in my life felt like it had just crumbled.","event":59,"values":[-0.0705394297838211,-0.037360772490501404,0.10747542232275009,-0.07329073548316956,0.19722247123718262,0.23734818398952484,0.2664525508880615,0.1294788420200348,0.2656590938568115,-0.001837385818362236,-0.19510477781295776,-0.17959696054458618,-0.07623781263828278]},{"text":"The first few days were a blur.","event":60,"values":[-0.06928358227014542,-0.07944487035274506,0.03963472321629524,-0.09724342823028564,0.2577313780784607,0.27014556527137756,0.3307644724845886,0.17600807547569275,0.3008143901824951,0.022623252123594284,-0.2169078290462494,-0.19083470106124878,-0.12629321217536926]},{"text":"Sleep offered no escape, filled with fragments of conversations I didn't want to have and images of empty spreadsheets.","event":61,"values":[-0.09584058821201324,-0.08828200399875641,0.040114179253578186,-0.08042160421609879,0.263203501701355,0.25588008761405945,0.33369094133377075,0.19485437870025635,0.32450833916664124,0.04090217500925064,-0.23012465238571167,-0.2106812298297882,-0.1405072659254074]},{"text":"My mind raced with a million panicked questions: *How?","event":62,"values":[-0.10571137815713882,-0.10424348711967468,0.029678761959075928,-0.06845464557409286,0.28967583179473877,0.266047865152359,0.34112054109573364,0.21491864323616028,0.3453194499015808,0.058992594480514526,-0.23845072090625763,-0.22703160345554352,-0.15584245324134827]},{"text":"How do I pay rent next month?","event":63,"values":[-0.07244163751602173,-0.08607541024684906,0.04667030647397041,-0.05192919075489044,0.2608003318309784,0.24666425585746765,0.3197464942932129,0.17567622661590576,0.3131415843963623,0.04431664198637009,-0.22827424108982086,-0.21078044176101685,-0.13330763578414917]},{"text":"How do I tell my family?","event":64,"values":[0.001819005236029625,-0.010313768871128559,0.08639588207006454,-0.02494434081017971,0.1732945740222931,0.18796677887439728,0.24123355746269226,0.09715689718723297,0.22054916620254517,-0.01154934149235487,-0.13182777166366577,-0.11881144344806671,-0.046113740652799606]},{"text":"How do I even start again?","event":65,"values":[0.05897555500268936,0.03755295276641846,0.08795639127492905,-0.011821498163044453,0.09159544110298157,0.12086819112300873,0.162372887134552,0.07480663806200027,0.18636009097099304,-0.025025708600878716,-0.048328496515750885,-0.051581405103206635,0.018768051639199257]},{"text":"*\n\n**My Hurdles, My Struggles:**\n\n1.","event":66,"values":[0.02095923200249672,0.04498440399765968,0.09655903279781342,0.009180761873722076,0.10906609147787094,0.14096775650978088,0.16902241110801697,0.09509065002202988,0.19381412863731384,-0.07604911923408508,-0.07230804860591888,-0.10267871618270874,0.008778376504778862]},{"text":"**The Immediate Financial Shock:** My savings account felt terrifyingly empty.","event":67,"values":[0.004731477238237858,0.005101451650261879,0.08698539435863495,0.00937796849757433,0.16159045696258545,0.17394158244132996,0.2207919806241989,0.10953053832054138,0.21884968876838684,-0.041765905916690826,-0.1254466474056244,-0.14451155066490173,-0.04092565178871155]},{"text":"Every expense – the mortgage, utilities, groceries – loomed large.","event":68,"values":[0.0028169406577944756,-0.01140136830508709,0.0942147970199585,0.031691938638687134,0.18907980620861053,0.18565469980239868,0.2213236689567566,0.08272255212068558,0.20951008796691895,-0.025849975645542145,-0.15415924787521362,-0.1591458022594452,-0.05647483095526695]},{"text":"The thought of needing to ask for help, to borrow money from family I barely wanted to burden, was almost unbearable.","event":69,"values":[-0.008771272376179695,-0.03533453866839409,0.08019232749938965,-0.006928832270205021,0.21179193258285522,0.21495360136032104,0.2621522545814514,0.07617636024951935,0.23634150624275208,-0.005314060486853123,-0.18595367670059204,-0.1631648987531662,-0.06851190328598022]},{"text":"Every check I received from the short-term unemployment benefits felt like a temporary bandage on a gaping wound.","event":70,"values":[-0.013290910981595516,-0.043897420167922974,0.07558777928352356,-0.026945337653160095,0.21723946928977966,0.22523802518844604,0.27030038833618164,0.05890048295259476,0.23581568896770477,0.0034852465614676476,-0.1955934762954712,-0.16177991032600403,-0.06845302134752274]},{"text":"2.  **The Paralysis of Uncertainty:** The job market felt alien and intimidating.","event":71,"values":[-0.031109090894460678,-0.041925303637981415,0.07357596606016159,-0.04250267148017883,0.2181612253189087,0.2311510592699051,0.28534865379333496,0.09086377173662186,0.26458975672721863,0.003304379992187023,-0.2000400871038437,-0.17699439823627472,-0.08144699782133102]},{"text":"What skills were still needed?","event":72,"values":[-0.017013635486364365,-0.04087371379137039,0.07626837491989136,-0.028468873351812363,0.20384910702705383,0.21517422795295715,0.26577240228652954,0.0915064811706543,0.2592436969280243,0.02955985628068447,-0.18699344992637634,-0.17878419160842896,-0.08522561192512512]},{"text":"What companies were hiring?","event":73,"values":[0.0007271976210176945,0.003674805164337158,0.08899921923875809,0.012300277128815651,0.1530187427997589,0.17576900124549866,0.2050655484199524,0.0943143218755722,0.23453819751739502,0.012757435441017151,-0.12510916590690613,-0.1499025672674179,-0.04609190672636032]},{"text":"My resume, once a source of pride, now felt inadequate, outdated.","event":74,"values":[0.0030401935800909996,0.00021969061344861984,0.0925743579864502,-0.0018776068463921547,0.1583012491464615,0.18522414565086365,0.2102077156305313,0.0902165025472641,0.2347387671470642,0.021982036530971527,-0.14504188299179077,-0.16911625862121582,-0.03694294020533562]},{"text":"Applying for jobs became a daily ritual, followed by nights of anxiety waiting for replies that never came.","event":75,"values":[-0.03368688374757767,-0.06233583763241768,0.0635678619146347,-0.06350778043270111,0.2343965470790863,0.23052074015140533,0.2736940979957580       xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
