5566621571779251,0.041189149022102356,0.00944664515554905,0.050972726196050644,-0.05063939839601517,0.07338182628154755,0.024638155475258827,0.07179370522499084]},{"text":"The link between unemployment, particularly among youth who are often establishing their careers and identities, and increased restlessness is well-documented, and the implications for mental health are significant and multifaceted.","event":5,"values":[0.0708438977599144,0.1155061349272728,0.14522194862365723,0.134679913520813,0.0092637212947011,0.06400922685861588,0.03156082332134247,-0.033688612282276154,0.04054095596075058,-0.08753040432929993,0.04154207557439804,-0.010891181416809559,0.055305030196905136]},{"text":"Here's my perspective on the implications:\n\n1.","event":6,"values":[0.07458294183015823,0.11809006333351135,0.15048277378082275,0.13423718512058258,0.004967795684933662,0.062127288430929184,0.02971392311155796,-0.035601239651441574,0.040822144597768784,-0.09352853894233704,0.041147008538246155,-0.016872674226760864,0.05479004979133606]},{"text":"**Increased Anxiety and Stress:** The uncertainty associated with unemployment is a major stressor.","event":7,"values":[0.0737660750746727,0.09833449870347977,0.1564529985189438,0.11258700489997864,0.04263916239142418,0.08908944576978683,0.057386837899684906,-0.03128513693809509,0.060517892241477966,-0.07662419974803925,0.0034999619238078594,-0.05112782493233681,0.02695002406835556]},{"text":"Youth might worry about future finances, their ability to provide for themselves or family, meeting societal expectations, and the duration of their jobless spell.","event":8,"values":[0.10330946743488312,0.06364630162715912,0.13382203876972198,0.06513608992099762,0.06783764064311981,0.10552525520324707,0.08836039900779724,-0.014062625356018543,0.08891600370407104,-0.04838230460882187,-0.02129445970058441,-0.07944789528846741,0.010297825559973717]},{"text":"This constant worry can manifest as general anxiety, panic attacks, and chronic stress.","event":9,"values":[0.08941851556301117,0.04562359303236008,0.12029853463172913,0.05403301119804382,0.10776607692241669,0.13516992330551147,0.12042907625436783,-0.004782546311616898,0.09415513277053833,-0.035567786544561386,-0.043089546263217926,-0.09183437377214432,-0.009681163355708122]},{"text":"2.  **Depression and Low Mood:** Prolonged unemployment can lead to feelings of hopelessness, worthlessness, and a lack of purpose.","event":10,"values":[0.0957355871796608,0.055778857320547104,0.10945272445678711,0.02921902947127819,0.08115598559379578,0.12298047542572021,0.10526297986507416,0.030524536967277527,0.12199817597866058,-0.023494118824601173,-0.03710133954882622,-0.09116858243942261,-0.013758007436990738]},{"text":"Youth might feel they are not contributing, are falling behind peers, or are perceived as failures.","event":11,"values":[0.08033798635005951,0.04919205605983734,0.09402044117450714,0.011232338845729828,0.09082125127315521,0.13629259169101715,0.1146930381655693,0.0631098598241806,0.14896529912948608,0.002892349846661091,-0.04940875247120857,-0.0984085202217102,-0.024287819862365723]},{"text":"This can significantly increase the risk of depression, leading to persistent sadness, loss of interest in activities, and feelings of emptiness.","event":12,"values":[0.09436716139316559,0.05719687044620514,0.08691461384296417,0.0018720626831054688,0.05898957699537277,0.10626672208309174,0.09081349521875381,0.09557653218507767,0.1760234832763672,0.0057502370327711105,-0.035283032804727554,-0.08746064454317093,-0.01887441799044609]},{"text":"3.  **Loss of Identity and Self-Esteem:** For many young people, work is a primary source of identity and self-worth.","event":13,"values":[0.09114919602870941,0.0748712345957756,0.12256838381290436,0.034384921193122864,0.042952802032232285,0.09251125901937485,0.07645202428102493,0.05830205976963043,0.148795485496521,-0.0310182087123394,-0.0317511186003685,-0.08378225564956665,0.00446905056014657]},{"text":"Losing a job can feel like losing a part of themselves, leading to diminished self-esteem, feelings of inadequacy, and a crisis of identity.","event":14,"values":[0.08382388204336166,0.07917103916406631,0.13510221242904663,0.047924965620040894,0.048206038773059845,0.09028838574886322,0.0877683088183403,0.05412694066762924,0.1394171267747879,-0.04865541309118271,-0.0327858030796051,-0.08226589858531952,0.0017714272253215313]},{"text":"This restlessness can be partly driven by the internal struggle to find purpose and value outside of employment.","event":15,"values":[0.05990384519100189,0.0745241716504097,0.14349952340126038,0.0601118728518486,0.07165233790874481,0.11638703942298889,0.10347301512956619,0.030298814177513123,0.11845589429140091,-0.03800428658723831,-0.04433722048997879,-0.08739514648914337,-0.0027198928873986006]},{"text":"4.  **Social Isolation and Withdrawal:** Unemployment can lead to reduced social interaction, as individuals may lack the resources (like transport) or the confidence to engage in social activities.","event":16,"values":[0.07210996001958847,0.0636155903339386,0.11971224844455719,0.0579504668712616,0.07225598394870758,0.1088329553604126,0.1005270779132843,0.05151892453432083,0.13782085478305817,-0.039141107350587845,-0.04691652953624725,-0.08767824620008469,-0.017686549574136734]},{"text":"This isolation can exacerbate feelings of loneliness and depression, further impacting mental well-being.","event":17,"values":[0.07948265224695206,0.06357616186141968,0.10690625011920929,0.057246915996074677,0.0701761320233345,0.10821409523487091,0.09052710980176926,0.05562875419855118,0.13684776425361633,-0.03670063614845276,-0.03969082981348038,-0.07912375777959824,-0.021534521132707596]},{"text":"The restlessness might also manifest as an inability to relax or engage in previously enjoyed social hobbies.","event":18,"values":[0.08608073741197586,0.08121184259653091,0.09755533933639526,0.05494217574596405,0.048129964619874954,0.08008080720901489,0.05982912331819534,0.05466778576374054,0.13249342143535614,-0.03678347170352936,-0.012960092164576054,-0.04542431980371475,-0.0006106044165790081]},{"text":"5.  **Sleep Disturbances:** Stress, anxiety, and depression often disrupt sleep patterns, leading to insomnia or excessive sleeping.","event":19,"values":[0.0740814208984375,0.06604758650064468,0.09420950710773468,0.04314801096916199,0.08778844028711319,0.10979922115802765,0.0926353931427002,0.05551644042134285,0.13067415356636047,-0.036478523164987564,-0.03334905207157135,-0.07842789590358734,-0.023480556905269623]},{"text":"Poor sleep further exacerbates mental health issues, reducing resilience and increasing irritability and restlessness.","event":20,"values":[0.07971148937940598,0.058852799236774445,0.08471405506134033,0.041063882410526276,0.10011941194534302,0.12072008848190308,0.10381008684635162,0.05624445527791977,0.12664709985256195,-0.040335968136787415,-0.039992742240428925,-0.08063803613185883,-0.029373444616794586]},{"text":"6.  **Physical Health Issues:** Chronic stress and mental health problems can manifest physically, leading to issues like headaches, digestive problems, weakened immunity, and other stress-related ailments.","event":21,"values":[0.1139359325170517,0.042917728424072266,0.09033680707216263,0.05101897194981575,0.10015296936035156,0.13162609934806824,0.12806802988052368,0.04867539554834366,0.11323512345552444,-0.05435246229171753,-0.04234389215707779,-0.09469425678253174,-0.036841243505477905]},{"text":"This physical unease can contribute to a general feeling of restlessness.","event":22,"values":[0.09567847102880478,0.04616068676114082,0.0889311134815216,0.047774650156497955,0.10613231360912323,0.14844217896461487,0.13171085715293884,0.04734671115875244,0.11237312853336334,-0.05153193324804306,-0.046825893223285675,-0.09223153442144394,-0.04731118679046631]},{"text":"7.  **Substance Abuse:** Some individuals might turn to alcohol or drugs as a coping mechanism, which can create a dangerous cycle that worsens both mental and physical health in the long run.","event":23,"values":[0.11762301623821259,0.040906645357608795,0.09427706897258759,0.03257772698998451,0.0990661233663559,0.13390931487083435,0.13278141617774963,0.047626785933971405,0.11258544027805328,-0.05569913610816002,-0.0518374890089035,-0.0964890792965889,-0.0394584983587265]},{"text":"8.  **Impact on Future Opportunities:** Prolonged restlessness and poor mental health can negatively impact future job searches by affecting motivation, concentration, confidence, and interpersonal skills.","event":24,"values":[0.12281209230422974,0.044588860124349594,0.09786862879991531,0.030854227021336555,0.08597603440284729,0.12085661292076111,0.12319488823413849,0.04895266145467758,0.1130494624376297,-0.05095022916793823,-0.050520896911621094,-0.09059303253889084,-0.03412623330950737]},{"text":"**Implications:**\n\n*   **Individual Level:** Severe and prolonged mental health issues, potential long-term career setbacks, strain on personal relationships, and overall reduced quality of life.","event":25,"values":[0.1406802535057068,0.05142301693558693,0.10547174513339996,0.04071272164583206,0.06284438818693161,0.09964878857135773,0.10590983927249908,0.03676089271903038,0.1005190834403038,-0.053900957107543945,-0.031221473589539528,-0.07799910753965378,-0.010151882655918598]},{"text":"*   **Societal Level:** Increased demand on mental health services, potential rise in crime rates (linked to desperation), reduced economic productivity, and a potential \"lost generation\" if youth skills atrophy and confidence is severely damaged.","event":26,"values":[0.13497617840766907,0.06004513055086136,0.11111317574977875,0.056767985224723816,0.04743194580078125,0.09273076057434082,0.0855884850025177,0.024218402802944183,0.08878114819526672,-0.03870827704668045,-0.017166243866086006,-0.06521762907505035,-0.000753527507185936]},{"text":"**In conclusion:** The restlessness observed in youth due to unemployment is often a symptom o iate Feedback:** AI can provide instant feedback on exercises and assessments, allowing learners to correct misunderstandings quickly.","event":36,"values":[0.11286206543445587,0.11898243427276611,0.18064475059509277,0.11559143662452698,-0.004641207866370678,0.06430511176586151,0.007484906353056431,-0.052149251103401184,0.03195590525865555,-0.07510899007320404,0.027149904519319534,-0.030554359778761864,0.0543467253446579]},{"text":"*   **Access to Resources:** It can offer on-demand access to a vast array of educational resources, experts, and simulations.","event":37,"values":[0.11184032261371613,0.11456520855426788,0.174571692943573,0.11340119689702988,-0.004665291868150234,0.060031235218048096,0.012888988479971886,-0.042901989072561264,0.0413740873336792,-0.0672050416469574,0.024897471070289612,-0.024769501760601997,0.058397211134433746]},{"text":"*   **Identifying Strengths and Weaknesses:** AI can potentially analyze learning patterns to identify specific areas where a person excels or struggles, guiding focused development.","event":38,"values":[0.11728337407112122,0.10361519455909729,0.16633418202400208,0.11859866976737976,0.0005756374448537827,0.061886318027973175,0.01888570375740528,-0.031520307064056396,0.038584426045417786,-0.052126359194517136,0.023430658504366875,-0.02560684084892273,0.052321020513772964]},{"text":"**The Risk of Reduced Hiring:**\n\n*   **Increased Skill Gaps:** If AI-driven learning becomes the primary mode of education, individuals without access or the ability to leverage it effectively might fall behind, widening the skill gap.","event":39,"values":[0.11548352986574173,0.10330299288034439,0.16884423792362213,0.1086295023560524,0.008419502526521683,0.06989360600709915,0.02634529396891594,-0.03429635614156723,0.040859438478946686,-0.0596911795437336,0.011686400510370731,-0.03980707377195358,0.04411456733942032]},{"text":"*   **Focus on Efficiency over Quantity:** Employers might indeed prioritize hiring individuals who can demonstrate high proficiency acquired through advanced AI learning systems, potentially making it harder for others to enter the workforce.","event":40,"values":[0.12207277119159698,0.10174650698900223,0.16185110807418823,0.10817884653806686,0.01283173356205225,0.07410801947116852,0.032318610697984695,-0.03391212970018387,0.03911064937710762,-0.07123880088329315,0.009201226755976677,-0.043574851006269455,0.04114720970392227]},{"text":"*   **Cost Reduction:** Implementing widespread AI learning could be cheaper for organizations in the long run compared to maintaining large training departments or investing heavily in individual training for every employee.","event":41,"values":[0.12494916468858719,0.09485611319541931,0.15140366554260254,0.0934867113828659,0.0182613767683506,0.07800191640853882,0.037523575127124786,-0.03731703385710716,0.04355484992265701,-0.06406772881746292,0.01154996082186699,-0.037082821130752563,0.043019551783800125]},{"text":"*   **Shift in Required Skills:** The skills valued might shift heavily towards those needed to *utilize* and *interact with* AI systems effectively, potentially devaluing other skills.","event":42,"values":[0.12411876022815704,0.09906347095966339,0.1517772525548935,0.09596722573041916,0.014067977666854858,0.07527007162570953,0.030269140377640724,-0.04418322071433067,0.03708217293024063,-0.06588973104953766,0.020012471824884415,-0.030983511358499527,0.04990805685520172]},{"text":"**Overall Thoughts:**\n\nIt's highly likely that AI will significantly transform education and the nature of work.","event":43,"values":[0.11997225880622864,0.10571008920669556,0.15996262431144714,0.0912909060716629,0.004823238588869572,0.06714839488267899,0.02189180627465248,-0.04784655570983887,0.03051571175456047,-0.06988602876663208,0.030961312353610992,-0.021682318300008774,0.05706987529993057]},{"text":"The personalized learning aspect *could* be a powerful force for individual development and potentially making the workforce more adaptable and capable.","event":44,"values":[0.09734992682933807,0.11914583295583725,0.17535626888275146,0.09699425846338272,0.010595109313726425,0.07478979229927063,0.024548795074224472,-0.04571644961833954,0.03167848661541939,-0.07366109639406204,0.024618374183773994,-0.021004626527428627,0.052437715232372284]},{"text":"However, the concern that this could lead to a reduction in hiring is very real.","event":45,"values":[0.08174513280391693,0.11691071838140488,0.17940035462379456,0.09588313102722168,0.01996925286948681,0.08262503892183304,0.04021667689085007,-0.04309207946062088,0.03664351627230644,-0.07607987523078918,0.016838867217302322,-0.022411221638321877,0.050003159791231155]},{"text":"It raises crucial questions:\n\n1.","event":46,"values":[0.07646231353282928,0.10734038800001144,0.17575928568840027,0.0969076156616211,0.03302114084362984,0.0918840616941452,0.051459189504384995,-0.04083043336868286,0.04401963949203491,-0.06777620315551758,0.004945193417370319,-0.029800506308674812,0.042870599776506424]},{"text":"**Accessibility:** How will we ensure equitable access to these advanced AI learning tools?","event":47,"values":[0.082473985850811,0.10545429587364197,0.16317152976989746,0.0918995589017868,0.03996216133236885,0.09344860166311264,0.05570240691304207,-0.028396282345056534,0.038444243371486664,-0.07727709412574768,0.007419002242386341,-0.036796052008867264,0.048297300934791565]},{"text":"A digital divide in education could exacerbate existing social inequalities.","event":48,"values":[0.09129038453102112,0.10146313905715942,0.15151268243789673,0.08510072529315948,0.04417943209409714,0.09450237452983856,0.0531521700322628,-0.019950691610574722,0.03993387892842293,-0.06750920414924622,0.009409981779754162,-0.03012283518910408,0.041078563779592514]},{"text":"2.  **Validation:** How will employers validate the skills acquired through AI-driven learning?","event":49,"values":[0.10455626249313354,0.0986703410744667,0.14784210920333862,0.07941458374261856,0.03033430501818657,0.08590526878833771,0.04430466890335083,-0.01561695709824562,0.04326818138360977,-0.059990644454956055,0.015819314867258072,-0.03297720104455948,0.04318378493189812]},{"text":"Will certifications based on AI assessments hold the same weight as traditional degrees or on-the-job experience?","event":50,"values":[0.11836343258619308,0.08060510456562042,0.13639602065086365,0.07654672861099243,0.029749203473329544,0.08473803102970123,0.05089620128273964,-0.013319186866283417,0.050331488251686096,-0.05055474117398262,0.00901893712580204,-0.03734444081783295,0.04351065307855606]},{"text":"3.  **Nature of Work:** What kind of jobs will remain or emerge?","event":51,"values":[0.12047218531370163,0.0930006206035614,0.1375366449356079,0.07159365713596344,0.018377887085080147,0.06669377535581589,0.03746378421783447,-0.014097858220338821,0.047197699546813965,-0.042300913482904434,0.024719156324863434,-0.023011529818177223,0.05929084122180939]},{"text":"Even if AI handles learning, will the roles themselves change fundamentally?","event":52,"values":[0.11413320153951645,0.09710457175970078,0.13416214287281036,0.07378239929676056,0.015990763902664185,0.06701261550188065,0.03612721711397171,-0.027505192905664444,0.0438387431204319,-0.041172608733177185,0.029264070093631744,-0.010199431329965591,0.0651397630572319]},{"text":"Will there be a persistent need for human interaction, creativity, critical thinking, and emotional intelligence – skills harder to automate – that still require human employment?","event":53,"values":[0.08349396288394928,0.11433500796556473,0.13697335124015808,0.085044264793396,0.013765583746135235,0.06784965097904205,0.03378353640437126,-0.03152723237872124,0.03900102153420448,-0.04228685796260834,0.04045286402106285,0.014098536223173141,0.0760461837053299]},{"text":"**Conclusion:**\n\nYou're right to see both the immense potential and the significant risks.","event":54,"values":[0.07336603105068207,0.12465989589691162,0.1628360152244568,0.09863866120576859,0.008943703025579453,0.06683748960494995,0.027043022215366364,-0.05005697160959244,0.03490559756755829,-0.06688226759433746,0.03166617080569267,0.004600349813699722,0.07515032589435577]},{"text":"AI *could* be a fantastic engine for personalized learning, empowering individuals.","event":55,"values":[0.05831524729728699,0.13102349638938904,0.1905311793088913,0.10046164691448212,0.017345979809761047,0.07815129309892654,0.029816698282957077,-0.058878958225250244,0.032153911888599396,-0.07442429661750793,0.0173958707600832,-0.011076599359512329,0.06892303377389908]},{"text":"But there's a real danger that this progress could be coupled with structural changes in the job market that make it harder for everyone, especially those less able to leverage these new tools, to find employment.","event":56,"values":[0.0702303797006607,0.11451183259487152,0.18757009506225586,0.09450022876262665,0.03328811004757881,0.07961747795343399,0.04017960652709007,-0.05409901589155197,0.030159112066030502,-0.08087636530399323,0.013638725504279137,-0.020329216495156288,0.05106952041387558]},{"text":"The future likely involves a blend of AI-enhanced learning and a need for humans to develop complementary skills that AI cannot easily replicate.","event":57,"values":[0.07101878523826599,0.10405318439006805,0.1744544804096222,0.09160346537828445,0.03583161532878876,0.08703276515007019,0.04830124229192734,-0.04816688969731331,0.03073377162218094,-0.08079507946968079,0.01797090843319893,-0.020540714263916016,0.05233283340930939]},{"text":"Ensuring that the benefits of AI in education are widely distributed and don't inadvertently widen the gap between \"haves\" and \"have-nots\" will be crucial.","event":58,"values":[0.0819043219089508,0.10358339548110962,0.1598736047744751,0.08504413813352585,0.029065340757369995,0.07878511399030685,0.04354509711265564,-0.03650180250406265,0.0343826562166214,-0.09025929123163223,0.02594326063990593,-0.016961926594376564,0.05404061824083328]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":59,"stop_reason":"end of turn","tail":"😊","sentences":[{"text":"Okay, let's step into those shoes.","event":60,"values":[0.04262197017669678,0.09045018255710602,0.09448763728141785,0.016063086688518524,0.06415842473506927,0.08559691905975342,0.09124782681465149,0.06884263455867767,0.10393668711185455,-0.07054931670427322,0.01499776542186737,-0.002347961999475956,0.06522877514362335]},{"text":"**(Narrating as the laid-off worker)**\n\nThe call came on my lunch break.","event":61,"values":[0.062090255320072174,0.044840335845947266,0.07916752994060516,-0.00797104462981224,0.08965310454368591,0.11375635862350464,0.13039904832839966,0.08627228438854218,0.1587066352367401,-0.07955056428909302,-0.04865225404500961,-0.08028937876224518,0.02179960533976555]},{"text":"HR, stiff and professional.","event":62,"values":[0.05951579660177231,0.01457102969288826,0.05369018763303757,-0.021882783621549606,0.11330416798591614,0.13479407131671906,0.16319763660430908,0.11165056377649307,0.19802811741828918,-0.07130572199821472,-0.07789374887943268,-0.11064347624778748,-0.0015603043138980865]},{"text":"\"Due to restructuring...","event":63,"values":[0.09226982295513153,-0.0037257634103298187,0.038090843707323074,-0.025108233094215393,0.11030955612659454,0.13280443847179413,0.17051920294761658,0.11164235323667526,0.20442871749401093,-0.046425338834524155,-0.07671363651752472,-0.11756514757871628,-0.011695824563503265]},{"text":"we've had to make some tough decisions.\"","event":64,"values":[0.13121646642684937,0.0418848879635334,0.05018377676606178,-0.01075943373143673,0.055164583027362823,0.07088127732276917,0.12632346153259277,0.0824020504951477,0.14131024479866028,-0.0387195348739624,0.009402862749993801,-0.0325583778321743,0.041089609265327454]},{"text":"My name wasn't on a list of 'redundant', but the implication hung heavy in the air.","event":65,"values":[0.07969561219215393,0.054915424436330795,0.09372596442699432,-0.0011320891790091991,0.047617219388484955,0.08327900618314743,0.11073862016201019,0.05892665311694145,0.13002344965934753,-0.046525146812200546,-0.0203592199832201,-0.043855808675289154,0.03461179882287979]},{"text":"My stomach dropped.","event":66,"values":[0.05147857964038849,0.03956916183233261,0.09453286230564117,-0.019717706367373466,0.07931998372077942,0.11744512617588043,0.14577023684978485,0.07368616759777069,0.15512841939926147,-0.0487232431769371,-0.06285784393548965,-0.0728975236415863,0.009545504115521908]},{"text":"I replayed the call in my head on the drive home, the silence in the car feeling like it was pressing in on me.","event":67,"values":[-0.04898848757147789,-0.07041101157665253,0.03347986191511154,-0.08844578266143799,0.2437043935060501,0.26628977060317993,0.27833235263824463,0.17386874556541443,0.2748182415962219,0.020549362525343895,-0.2108442783355713,-0.19376686215400696,-0.12186262011528015]},{"text":"Walking through the familiar corridors of the office one last time felt surreal.","event":68,"values":[-0.05624757707118988,-0.09327289462089539,0.010260557755827904,-0.11423885822296143,0.28465768694877625,0.2756194472312927,0.30418121814727783,0.2236815243959427,0.33812180161476135,0.04595135152339935,-0.23980486392974854,-0.22803816199302673,-0.15012839436531067]},{"text":"My desk, usually cluttered with files and deadlines, was almost bare.","event":69,"values":[-0.03546420484781265,-0.08883453160524368,0.038787178695201874,-0.0869787335395813,0.24975067377090454,0.23750220239162445,0.2782524824142456,0.19838671386241913,0.34661322832107544,0.05802096426486969,-0.2507486343383789,-0.23173482716083527,-0.13651145994663239]},{"text":"Packing my things felt like packing a part of myself away.","event":70,"values":[0.0083151       const y0 = pb + 19 + row * 27;
      const a = sv("text", { x: x, y: y0, "text-anchor": "middle", "font-size": 11, fill: "var(--ink)", "font-weight": 600 }); a.textContent = t1; gStatic.appendChild(a);
      if (t2) { const b = sv("text", { x: x, y: y0 + 11, "text-anchor": "middle", "font-size": 10, fill: e.estimated ? "var(--muted)" : "var(--ink-2)" }); b.style.fontVariantNumeric = "tabular-nums"; if (e.estimated) b.setAttribute("font-style", "italic"); b.textContent = t2; gStatic.appendChild(b); }
    });

    // series: one path per emotion per reply
    const anyVisible = visible.some(Boolean);
    EM.forEach((em, i) => {
      if (!visible[i]) return;
      CONV.forEach(c => c.turns.forEach(turn => {
        let d = "", pen = false;
        turn.sentences.forEach(s => {
          const v = s.values[i];
          if (v == null) { pen = false; return; }
          d += (pen ? "L" : "M") + X(EV[s.event].x).toFixed(1) + " " + Y(v).toFixed(1); pen = true;
        });
        if (!d) return;
        const p = sv("path", { d: d, fill: "none", "stroke-width": emphasis === i ? 3 : 2, "stroke-linejoin": "round", "stroke-linecap": "round" });
        p.style.stroke = color(i);
        if (em.dash) p.setAttribute("stroke-dasharray", em.dash);
        if (emphasis >= 0 && emphasis !== i) p.setAttribute("opacity", "0.18");
        gStatic.appendChild(p);
        if (turn.sentences.length === 1 && s0v(turn, i) != null) {
          const dot = sv("circle", { cx: X(EV[turn.sentences[0].event].x), cy: Y(s0v(turn, i)), r: 2.5 }); dot.style.fill = color(i); gStatic.appendChild(dot);
        }
      }));
    });
    if (!anyVisible) {
      const t = sv("text", { x: (pl + pr) / 2, y: (pt + pb) / 2, "text-anchor": "middle", fill: "var(--muted)", "font-size": 13 });
      t.textContent = "All emotions are hidden. Use the buttons above to show them."; gStatic.appendChild(t);
    }
    hit.setAttribute("x", pl); hit.setAttribute("y", 0); hit.setAttribute("width", pr - pl); hit.setAttribute("height", H);
  }
  function s0v(turn, i) { return turn.sentences[0].values[i]; }

  function drawDynamic() {
    gDyn.replaceChildren();
    const pt = M.top, pb = H - M.bottom;
    if (hover >= 0 && hover !== active) {
      const x = X(EV[hover].x);
      gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt, y2: pb, stroke: "var(--muted)", "stroke-width": 1 }));
    }
    const e = EV[active], x = X(e.x);
    gDyn.appendChild(sv("line", { x1: x, x2: x, y1: pt - 8, y2: pb + 8, stroke: "var(--ink)", "stroke-width": 1.5 }));
    if (e.k === "s") {
      const vals = sentenceOf(e).values;
      EM.forEach((em, i) => {
        if (!visible[i] || vals[i] == null) return;
        const c = sv("circle", { cx: x, cy: Y(vals[i]), r: 4, "stroke-width": 2 });
        c.style.fill = color(i); c.style.stroke = "var(--surface)";
        if (emphasis >= 0 && emphasis !== i) c.setAttribute("opacity", "0.2");
        gDyn.appendChild(c);
      });
    }
    // the slider handle, on the bottom scale
    const handle = sv("g", {});
    handle.appendChild(sv("circle", { cx: x, cy: pb, r: 7, fill: "var(--surface)", stroke: "var(--ink)", "stroke-width": 2 }));
    gDyn.appendChild(handle);
    chart.setAttribute("aria-valuemin", "1"); chart.setAttribute("aria-valuemax", String(EV.length));
    chart.setAttribute("aria-valuenow", String(active + 1));
    chart.setAttribute("aria-valuetext", eventLabel(active) + (eventTime(active) ? ", " + eventTime(active) : ""));
  }

  function drawAll() { drawStatic(); drawDynamic(); renderReadout(); }

  // ---------- tooltip (values lead, every visible series)
  function showTip(i, px, py) {
    tip.replaceChildren();
    const e = EV[i];
    const head = el("div", "h", eventLabel(i) + (eventTime(i) ? " · " + eventTime(i) : ""));
    tip.appendChild(head);
    if (e.k === "p") {
      const t = CONV[e.c].turns[e.t].prompt;
      tip.appendChild(el("div", null, t.length > 180 ? t.slice(0, 180) + "…" : t));
    } else {
      const vals = sentenceOf(e).values;
      EM.map((em, k) => k).filter(k => visible[k] && vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name)); tip.appendChild(r);
      });
    }
    tip.hidden = false;
    const rect = chart.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14, top = py - th / 2;
    if (left + tw > rect.width - 4) left = px - tw - 14;
    top = Math.max(4, Math.min(top, rect.height - th - 4));
    tip.style.left = left + "px"; tip.style.top = top + "px";
  }

  function toPlotX(evt) {
    const r = svg.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W / r.width), px: evt.clientX - chart.getBoundingClientRect().left, py: evt.clientY - chart.getBoundingClientRect().top };
  }
  let dragging = false;
  hit.addEventListener("pointerdown", evt => { dragging = true; hit.setPointerCapture(evt.pointerId); const p = toPlotX(evt); setActive(nearestEvent(p.x), true); chart.focus({ preventScroll: true }); });
  hit.addEventListener("pointermove", evt => {
    const p = toPlotX(evt), i = nearestEvent(p.x);
    if (dragging) { if (i !== active) setActive(i, true); tip.hidden = true; hover = -1; drawDynamic(); return; }
    if (i !== hover) { hover = i; drawDynamic(); }
    showTip(i, p.px, p.py);
  });
  hit.addEventListener("pointerup", evt => { dragging = false; try { hit.releasePointerCapture(evt.pointerId); } catch (_) {} });
  hit.addEventListener("pointerleave", () => { if (!dragging) { hover = -1; tip.hidden = true; drawDynamic(); } });
  chart.addEventListener("keydown", evt => {
    const step = { ArrowRight: 1, ArrowLeft: -1, PageDown: 10, PageUp: -10, ArrowUp: -1, ArrowDown: 1 }[evt.key];
    let next = active;
    if (step) next = active + step; else if (evt.key === "Home") next = 0; else if (evt.key === "End") next = EV.length - 1; else return;
    evt.preventDefault(); setActive(Math.max(0, Math.min(EV.length - 1, next)), true);
  });

  // ---------- readout (a table view of the cursor, always visible)
  const readoutCard = document.getElementById("readout");
  const readout = el("div"); readout.style.display = "flex"; readout.style.flexDirection = "column"; readout.style.gap = "8px";
  readoutCard.appendChild(readout);
  // navigation is built once, so a keyboard user keeps focus on the button they pressed
  const nav = el("div", "nav");
  [["◀ Prev", () => active - 1], ["Next ▶", () => active + 1],
   ["◀ Prompt", () => { for (let i = active - 1; i >= 0; i--) if (EV[i].k === "p") return i; return active; }],
   ["Prompt ▶", () => { for (let i = active + 1; i < EV.length; i++) if (EV[i].k === "p") return i; return active; }]]
    .forEach(([label, f]) => { const b = el("button", "btn", label); b.type = "button"; b.addEventListener("click", () => setActive(Math.max(0, Math.min(EV.length - 1, f())), true)); nav.appendChild(b); });
  readoutCard.appendChild(nav);
  function renderReadout() {
    readout.replaceChildren();
    const e = EV[active];
    readout.appendChild(el("div", "title", eventLabel(active)));
    const meta = [];
    if (eventTime(active)) meta.push(eventTime(active));
    meta.push("conversation: " + CONV[e.c].name);
    
    readout.appendChild(el("div", "meta", meta.join(" · ")));
    if (e.k === "p") {
      readout.appendChild(el("div", "ptext", CONV[e.c].turns[e.t].prompt));
      readout.appendChild(el("div", "meta", "Prompts are not scored; the model's sentences that follow are."));
    } else {
      const vals = sentenceOf(e).values, rows = el("div", "rows");
      EM.map((em, k) => k).filter(k => vals[k] != null).sort((a, b) => vals[b] - vals[a]).forEach(k => {
        const r = el("div", "row"); if (!visible[k]) r.style.opacity = "0.45";
        r.appendChild(lineKey(k, 22)); r.appendChild(el("span", "num", fmt(vals[k]))); r.appendChild(el("span", "name", EM[k].name + (visible[k] ? "" : " (hidden)")));
        rows.appendChild(r);
      });
      readout.appendChild(rows);
    }
  }

  // ---------- chat
  const chat = document.getElementById("chat");
  const bubbleOf = [];
  document.getElementById("chatinfo").textContent = totalP + " prompts · " + totalS + " scored sentences";
  CONV.forEach((c, ci) => {
    chat.appendChild(el("div", "divider", "Conversation: " + c.name));
    c.turns.forEach((turn, ti) => {
      const pi = turn.event;
      chat.appendChild(el("div", "who user", "user · P" + pNumber[pi] + (eventTime(pi) ? " · " + eventTime(pi) : "")));
      const ub = el("div", "bubble user"); ub.appendChild(el("div", "text", turn.prompt));
      ub.addEventListener("click", () => setActive(pi, false)); bubbleOf[pi] = ub; chat.appendChild(ub);
      chat.appendChild(el("div", "who model", "model · reply " + (ti + 1) + (turn.sentences.length ? "" : " · no scored sentences")));
      turn.sentences.forEach(s => {
        const i = s.event, b = el("div", "bubble model");
        b.appendChild(el("div", "text", s.text));
        const bm = el("div", "bm");
        bm.appendChild(el("span", null, "S" + sNumber[i] + (eventTime(i) ? " · " + eventTime(i) : "")));
        const top = el("span", "top3");
        s.values.map((v, k) => k).filter(k => s.values[k] != null).sort((a, b2) => s.values[b2] - s.values[a]).slice(0, 3).forEach(k => {
          const sp = el("span"); sp.appendChild(lineKey(k, 16)); sp.appendChild(document.createTextNode(EM[k].name + " " + s.values[k].toFixed(3))); top.appendChild(sp);
        });
        bm.appendChild(top);
        
        b.appendChild(bm);
        b.addEventListener("click", () => setActive(i, false)); bubbleOf[i] = b; chat.appendChild(b);
      });
      if (turn.tail) chat.appendChild(el("div", "tail", "not scored (no sentence ending): " + turn.tail));
      if (turn.stop_reason && turn.stop_reason !== "end of turn") chat.appendChild(el("div", "tail", "reply stopped: " + turn.stop_reason));
    });
  });
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollChatTo(i, smooth) {
    const b = bubbleOf[i]; if (!b) return;
    const target = b.offsetTop - chat.clientHeight / 2 + b.offsetHeight / 2;
    chat.scrollTo({ top: Math.max(0, target), behavior: smooth && !reduceMotion ? "smooth" : "auto" });
  }

  // ---------- table view (built on first open)
  const details = document.getElementById("tabledetails");
  details.addEventListener("toggle", () => {
    const wrap = document.getElementById("tablewrap");
    if (!details.open || wrap.firstChild) return;
    const t = el("table"), thead = el("thead"), hr = el("tr");
    ["#", "time", "reply", "sentence"].forEach((h, k) => hr.appendChild(el("th", k === 3 || k === 1 || k === 5 ? "l" : null, h)));
    EM.forEach(em => hr.appendChild(el("th", null, em.name)));
    thead.appendChild(hr); t.appendChild(thead);
    const tb = el("tbody");
    EV.forEach((e, i) => {
      if (e.k !== "s") return;
      const s = sentenceOf(e), tr = el("tr");
      tr.appendChild(el("td", null, "S" + sNumber[i]));
      tr.appendChild(el("td", "l", eventTime(i) || "–"));
      tr.appendChild(el("td", null, String(e.t + 1)));
      const st = el("td", "l sent", s.text); st.title = s.text; tr.appendChild(st);
      
      let best = -1; s.values.forEach((v, k) => { if (v != null && (best < 0 || v > s.values[best])) best = k; });
      s.values.forEach((v, k) => { const td = el("td"); const sp = el("span", k === best ? "best num" : "num", fmt(v)); sp.style.fontWeight = k === best ? "700" : "400"; td.appendChild(sp); tr.appendChild(td); });
      tr.addEventListener("click", () => setActive(i, true));
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t);
  });

  // ---------- distribution of this session's scores
  (function () {
    const DS = D.dist, host = document.getElementById("dist");
    if (!DS || !DS.n) { document.getElementById("distcard").hidden = true; return; }
    const nb = DS.rows[0].counts.length;
    document.getElementById("distinfo").textContent = DS.n + " sentences · " + nb + " bins";
    const clamped = DS.rows.reduce((a, r) => a + r.below + r.above, 0);
    document.getElementById("distnote").textContent =
      "Each row shows how this session's sentences spread across score bins of width " + DS.width +
      ", as a percentage of its " + DS.n + " sentences (counts, no fitted curve). All rows share one horizontal and one vertical scale, " +
      "so positions and heights compare directly. The dark vertical mark is the mean." +
      (clamped ? " " + clamped + " score(s) beyond " + DS.lo + " or " + DS.hi + " are counted in the end bins." : "");
    const svgD = sv("svg", { role: "img", "aria-label": "Distribution of each emotion's scores in this session" });
    const tipD = el("div", "tip"); tipD.hidden = true;
    host.append(svgD, tipD);
    const rowH = 30, top = 8, labelW = 112, right = 16, axisH = 34;
    const yMax = Math.max(1e-9, ...DS.rows.map(r => Math.max(...r.counts) / DS.n * 100));
    function draw() {
      const WD = Math.max(320, Math.round(host.clientWidth)), HD = top + rowH * DS.rows.length + axisH;
      svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
