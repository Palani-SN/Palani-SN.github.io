09104968048632145,0.05005629360675812,0.04310847446322441,0.01846465840935707,0.05664455518126488,-0.04053642228245735,0.08077172189950943,0.04154535382986069,0.07877276837825775]},{"text":"The link between unemployment, particularly among youth who are often establishing their careers and identities, and increased restlessness is well-documented, and the implications for mental health are significant and concerning.","event":5,"values":[0.06399625539779663,0.1158238872885704,0.14592616260051727,0.13383141160011292,0.010160134173929691,0.061123013496398926,0.034157924354076385,-0.030917294323444366,0.042821235954761505,-0.08634565770626068,0.044164352118968964,-0.003946396522223949,0.05469585955142975]},{"text":"Here's my perspective on the implications:\n\n1.","event":6,"values":[0.0686655342578888,0.11943095922470093,0.15199027955532074,0.13433898985385895,0.0051124924793839455,0.059048380702733994,0.031164780259132385,-0.034567613154649734,0.04167221486568451,-0.09371235221624374,0.04417639225721359,-0.011018183082342148,0.05528489500284195]},{"text":"**Increased Anxiety and Stress:** The uncertainty associated with unemployment is a major stressor.","event":7,"values":[0.07036097347736359,0.09875806421041489,0.15624265372753143,0.11437772959470749,0.043377891182899475,0.08915170282125473,0.06009228527545929,-0.030476108193397522,0.061016812920570374,-0.07755032181739807,0.004854987375438213,-0.049524590373039246,0.02531750500202179]},{"text":"Youth might worry about future finances, their ability to provide for themselves or families (if applicable), meeting societal expectations, and falling behind peers who are employed.","event":8,"values":[0.10470476746559143,0.07145337760448456,0.14034628868103027,0.07484469562768936,0.06263180822134018,0.1015724167227745,0.08071845769882202,-0.02098872698843479,0.0846862941980362,-0.059293195605278015,-0.01882457733154297,-0.07857859879732132,0.016594721004366875]},{"text":"This constant worry can lead to chronic anxiety.","event":9,"values":[0.09594613313674927,0.056205712258815765,0.12836697697639465,0.06405599415302277,0.09401862323284149,0.12150105834007263,0.1043819934129715,-0.011305039748549461,0.0913182944059372,-0.042478594928979874,-0.03554025664925575,-0.08648709207773209,0.0014241966418921947]},{"text":"2.  **Depression and Low Mood:** Prolonged unemployment can lead to feelings of hopelessness, worthlessness, and a lack of purpose.","event":10,"values":[0.10366273671388626,0.06479623168706894,0.11426656693220139,0.03506188094615936,0.06621728837490082,0.10904908180236816,0.08839774131774902,0.028896566480398178,0.1223997175693512,-0.025899142026901245,-0.02961905673146248,-0.08643746376037598,-0.004320647567510605]},{"text":"The loss of a routine, social interaction (often lost in the workplace), and a sense of identity tied to one's job can contribute significantly to depressive symptoms.","event":11,"values":[0.08124633133411407,0.08258318901062012,0.11725808680057526,0.03335224464535713,0.06286518275737762,0.100556880235672,0.07290666550397873,0.04621009901165962,0.12871161103248596,-0.017621472477912903,-0.024525808170437813,-0.07209445536136627,-0.0005628359504044056]},{"text":"3.  **Loss of Self-Esteem and Identity:** Work often provides a sense of accomplishment, structure, and identity.","event":12,"values":[0.08974078297615051,0.10097841918468475,0.13175371289253235,0.04109452664852142,0.03567890077829361,0.07876081764698029,0.049452703446149826,0.03658299893140793,0.11865592002868652,-0.02679254487156868,-0.006353739649057388,-0.053925253450870514,0.022627757862210274]},{"text":"Unemployment can strip this away, leading to feelings of inadequacy, reduced self-worth, and confusion about one's place in the world.","event":13,"values":[0.08096340298652649,0.1064898669719696,0.15006306767463684,0.06729644536972046,0.03501472622156143,0.07267799973487854,0.04943106323480606,0.015543103218078613,0.1024915799498558,-0.04892413318157196,-0.0091262087225914,-0.05030427873134613,0.034796759486198425]},{"text":"This can be particularly damaging during formative years.","event":14,"values":[0.08423654735088348,0.09950670599937439,0.1521122306585312,0.07343387603759766,0.03702710568904877,0.08089765906333923,0.06273283064365387,0.016655489802360535,0.1005021333694458,-0.05383332073688507,-0.01638036221265793,-0.05755038931965828,0.0301496684551239]},{"text":"4.  **Social Isolation:** While some might seek out new social connections through job searching, others may withdraw due to feelings of shame, lack of energy, or the difficulty of making new professional connections without experience.","event":15,"values":[0.09267298877239227,0.06575551629066467,0.11991256475448608,0.06198679655790329,0.05650267377495766,0.09102248400449753,0.08480293303728104,0.049801137298345566,0.14395081996917725,-0.03709975630044937,-0.04183335602283478,-0.08201387524604797,-0.009637661278247833]},{"text":"This isolation can exacerbate mental health issues.","event":16,"values":[0.0990605279803276,0.05995858460664749,0.09942779690027237,0.055111754685640335,0.06091700494289398,0.09514464437961578,0.08543464541435242,0.061720844358205795,0.14516714215278625,-0.031759101897478104,-0.034219641238451004,-0.07515275478363037,-0.015093730762600899]},{"text":"5.  **Impact on Physical Health:** Chronic stress and anxiety from unemployment can manifest physically, leading to issues like sleep disturbances, changes in appetite, fatigue, and a weakened immune system.","event":17,"values":[0.11673827469348907,0.0509079210460186,0.09864307940006256,0.05082005262374878,0.06818684935569763,0.1053527295589447,0.10068696737289429,0.05727054923772812,0.1382615864276886,-0.04581097140908241,-0.0392284169793129,-0.09347472339868546,-0.023592017590999603]},{"text":"6.  **Increased Risk of Risky Behaviors:** In some cases, the distress and lack of direction associated with unemployment and restlessness can lead individuals, especially youth, to engage in risky behaviors as a coping mechanism (e.g., substance abuse).","event":18,"values":[0.12583844363689423,0.03681332617998123,0.09813939779996872,0.03993407264351845,0.07850870490074158,0.11972393840551376,0.10980196297168732,0.055081941187381744,0.11564478278160095,-0.033040739595890045,-0.03938554227352142,-0.08651260286569595,-0.029370436444878578]},{"text":"7.  **Delayed Life Transitions:** Unemployment can postpone major life decisions and transitions, such as marriage, buying a home, or further education, which can add to feelings of frustration and pressure.","event":19,"values":[0.12822753190994263,0.04392072185873985,0.11533679813146591,0.04067251458764076,0.07485054433345795,0.10812018811702728,0.10035137832164764,0.03934517502784729,0.11057431250810623,-0.04529261589050293,-0.040704526007175446,-0.0859585851430893,-0.023222405463457108]},{"text":"8.  **Cognitive Impairment:** Prolonged stress and lack of purpose can sometimes affect concentration, decision-making abilities, and overall cognitive function.","event":20,"values":[0.12558378279209137,0.0562903955578804,0.11724475026130676,0.047393798828125,0.06156843155622482,0.08963943272829056,0.08305978775024414,0.03761560097336769,0.10748007893562317,-0.03510711342096329,-0.031365156173706055,-0.07099691033363342,-0.01126592792570591]},{"text":"**The \"Restlessness\" Factor:**\n\nRestlessness, in this context, can be both a symptom *and* a driver.","event":21,"values":[0.10961073637008667,0.08464701473712921,0.14054271578788757,0.07077473402023315,0.04918442294001579,0.0821753665804863,0.06584913283586502,0.006848694756627083,0.08677620440721512,-0.060864947736263275,-0.020983122289180756,-0.06682644784450531,0.007627555169165134]},{"text":"It can be a physical manifestation of anxiety and nervous energy.","event":22,"values":[0.08437478542327881,0.08111722767353058,0.1330295205116272,0.08413580805063248,0.06332588195800781,0.11178934574127197,0.0782848447561264,0.01063090842217207,0.0884077399969101,-0.03896845877170563,-0.030093196779489517,-0.07680478692054749,-0.007445890456438065]},{"text":"It can also be a psychological response – the inability to sit still because the mind is preoccupied with worries about the future, the frustration of being inactive, or the drive to *do* something (find a job) but lacking direction or success.","event":23,"values":[0.04346809908747673,0.027425505220890045,0.11943395435810089,0.04951079934835434,0.13264864683151245,0.19546639919281006,0.13319316506385803,0.02668583020567894,0.1427890509366989,0.022794045507907867,-0.10357428342103958,-0.1320515275001526,-0.079501211643219]},{"text":"**Implications:**\n\n*   **Long-Term Well-being:** These mental health challenges can have lasting effects if not addressed, potentially impacting future relationships, career prospects, and overall life satisfaction.","event":24,"values":[0.06988683342933655,0.03244970738887787,0.12135843187570572,0.04473024234175682,0.11436990648508072,0.16994255781173706,0.12562128901481628,0.030706975609064102,0.13997553288936615,0.0026385029777884483,-0.09626439958810806,-0.13179805874824524,-0.06802183389663696]},{"text":"*   **Societal Impact:** Widespread mental health issues among youth due to unemployment can strain healthcare systems, reduce economic productivity in the long run, and create social challenges.","event":25,"values":[0.09677539765834808,0.0478331483900547,0.1215987280011177,0.04882337525486946,0.08413539826869965,0.13594746589660645,0.10448026657104492,0.028580192476511,0.12109285593032837,-0.017839159816503525,-0.0719536542892456,-0.11067530512809753,-0.043161846697330475]},{"text":"**In conclusion:** The increase in restlessness among youth due to unemployment is a significant indicator of underlying psychological distress.","event":26,"values":[0.1262085884809494,0.08767258375883102,0.13058674335479736,0.07339156419038773,0.0341278538107872,0.07477962970733643,0.060660868883132935,0.007252641022205353,0.06122793257236481,-0.06709447503089905,-0.001758987084031105,-0.047855038195848465,0.02272549830377102]},{"text":"The implications for their mental health are broad and potentially severe, affecting their well-being, development, and future life trajectories.","event":27,"values":[0.10944025218486786,0.08965076506137848,0.13489924371242523,0.08295699208974838,0.03953098505735397,0.08113756030797958,0.06661079823970795,0.00023788213729858398,0.057639770209789276,-0.07560436427593231,-0.0075463950634002686,-0.04768674448132515,0.021375956013798714]},{"text":"It underscores the importance of providing robust support systems, including mental health services, career counseling, and social safety nets for young people facing these challenges.","event":28,"values":[0.09958553314208984,0.09886053204536438,0.14565250277519226,0.09009000658988953,0.03383197635412216,0.07337887585163116,0.0626591145992279,-0.013694500550627708,0.05163665860891342,-0.08231218159198761,0.0005698371678590775,-0.04096636921167374,0.033287905156612396]}]},{"prompt":"I believe that AI models, even though can cause unemployment in the future, then can be wonderful in helping personalized learning, through which there can be a potential reduction in hiring people, what do you think ?","event":29,"stop_reason":"end of turn","tail":"","sentences":[{"text":"That's a really insightful point, and it touches on a complex and ongoing debate with significant implications.","event":30,"values":[0.0873575359582901,0.11992377787828445,0.13905921578407288,0.12036797404289246,0.01028241217136383,0.05867329239845276,0.03476512432098389,-0.015130627900362015,0.023884113878011703,-0.06770721077919006,0.057483479380607605,0.027819175273180008,0.08181585371494293]},{"text":"You're highlighting two sides of the same coin regarding AI's impact:\n\n1.","event":31,"values":[0.09004007279872894,0.12344904243946075,0.15558002889156342,0.1176515594124794,0.007390353363007307,0.05474155768752098,0.024166809394955635,-0.02524002641439438,0.02347371354699135,-0.07978838682174683,0.054325252771377563,0.014968348667025566,0.07424497604370117]},{"text":"**The Displacement Side:** It's undeniable that AI and automation are increasingly capable of performing tasks previously done by humans.","event":32,"values":[0.0998593270778656,0.13465726375579834,0.17168313264846802,0.11704295873641968,-0.005841650068759918,0.04677179455757141,0.011519912630319595,-0.0405135415494442,0.017135482281446457,-0.09919402003288269,0.053208403289318085,0.005967576056718826,0.07911498844623566]},{"text":"This includes routine cognitive tasks in areas like data analysis, customer service, content creation, and even some aspects of programming or design.","event":33,"values":[0.12036892026662827,0.11881239712238312,0.15827879309654236,0.09952914714813232,0.0003943932242691517,0.0476299487054348,0.012570234946906567,-0.042805254459381104,0.034485459327697754,-0.07412204146385193,0.04972798377275467,0.005289287306368351,0.06508108973503113]},{"text":"As AI evolves, the potential for job displacement across various sectors grows, which could indeed increase unemployment, at least in the medium term, and cause the restlessness you mentioned.","event":34,"values":[0.11265089362859726,0.11358743160963058,0.15607228875160217,0.0918324738740921,0.01067656185477972,0.05965518206357956,0.025389567017555237,-0.03822874277830124,0.03252637758851051,-0.07278963923454285,0.03973377123475075,-0.004478404298424721,0.05963951721787453]},{"text":"2.  **The Augmentation and Transformation Side (Personalized Learning):** On the other hand, AI has the potential to be a powerful tool for enhancing human capabilities, particularly in education.","event":35,"values":[0.10581189393997192,0.11967135965824127,0.17980416119098663,0.09082873165607452,0.007184337824583054,0.06668095290660858,0.021769320592284203,-0.04820782318711281,0.027823181822896004,-0.07569947838783264,0.030328761786222458,-0.018166949972510338,0.057414427399635315]},{"text":"Personalized learning is a prime example:\n    *   **Adaptive Learning Paths:** AI can analyze a student's strengths, weaknesses, learning style, and pace in real-time, tailoring the curriculum and providing targeted resources, something impossible for a single teacher to do for a large class.","event":36,"values":[0.11364077031612396,0.12722909450531006,0.1923680603504181,0.1037982851266861,-0.008219222538173199,0.06371776759624481,0.008582962676882744,-0.0590890608727932,0.019215237349271774,-0.09394179284572601,0.03194849565625191,-0.03301854431629181,0.0550040639936924]},{"text":"*   **Instant Feedback:** AI can offer immediate feedback on exercises and assignments, helping students correct mistakes quickly and understand concepts better.","event":37,"values":[0.12397556751966476,0.12409217655658722,0.18753550946712494,0.11089852452278137,-0.013527877628803253,0.05984770506620407,0.003847644664347172,-0.055172886699438095,0.02084340527653694,-0.08599066734313965,0.03545375168323517,-0.028125321492552757,0.05677757039666176]},{"text":"*   **Accessibility:** AI-powered tools can make education more accessible to people with disabilities or those in remote locations.","event":38,"values":[0.1321241855621338,0.11292429268360138,0.16849088668823242,0.11021260917186737,-0.008344324305653572,0.06151895597577095,0.012401147745549679,-0.04186587035655975,0.03112322837114334,-0.0802731141448021,0.03222549706697464,-0.0286817979067564,0.05059434846043587]},{"text":"*   **Resource Efficiency:** AI can potentially automate administrative tasks for educators, freeing them up for more interactive, mentorship-focused roles.","event":39,"values":[0.12746673822402954,0.10906080156564713,0.16690289974212646,0.09271838515996933,0.00023362832143902779,0.06606724858283997,0.022464530542492867,-0.03060895949602127,0.03521326184272766,-0.07508710026741028,0.020181499421596527,-0.022246191278100014,0.05867477506399155]},{"text":"**Where it Gets Complicated:**\n\n*   **The \"Reduction in Hiring People\" Aspect:** While AI *could* handle certain aspects of teaching or training, it's unlikely to *completely* replace human educators, coaches, and mentors.","event":40,"values":[0.12166006118059158,0.11523818224668503,0.1694248914718628,0.0774192288517952,-0.0069790431298315525,0.06612567603588104,0.02368931658565998,-0.03643524646759033,0.039656419306993484,-0.07721318304538727,0.020491641014814377,-0.019288741052150726,0.07382658869028091]},{"text":"The human element – empathy, inspiration, ethical guidance, fostering social skills, understanding nuance, and providing emotional support – remains crucial, especially in higher education and complex skill development.","event":41,"values":[0.10989751666784286,0.11916140466928482,0.17363539338111877,0.07946839928627014,-0.004080234561115503,0.06508374214172363,0.02139734849333763,-0.04673463851213455,0.03850686177611351,-0.07831305265426636,0.022379424422979355,-0.011881306767463684,0.07872506976127625]},{"text":"*   **New Job Creation:** The rise of AI often leads to the creation of new jobs related to developing, managing, maintaining, and overseeing these AI systems.","event":42,"values":[0.10268540680408478,0.1270814836025238,0.1842016875743866,0.08585618436336517,-0.006903385743498802,0.0610232874751091,0.014258268289268017,-0.04932885244488716,0.03726882487535477,-0.08259719610214233,0.023395827040076256,-0.016961736604571342,0.07948549091815948]},{"text":"We might see an increase in demand for AI trainers, data scientists specializing in education, AI ethicists, and professionals who can work *alongside* AI.","event":43,"values":[0.0973050445318222,0.1301061511039734,0.17943669855594635,0.08527746796607971,0.0008124932646751404,0.05914407968521118,0.01033429428935051,-0.03987901285290718,0.0397564172744751,-0.07696206867694855,0.023032445460557938,-0.01267812866717577,0.07575943320989609]},{"text":"*   **Shift in Required Skills:** The workforce will need to adapt.","event":44,"values":[0.10809950530529022,0.12222197651863098,0.16306445002555847,0.07554180920124054,0.005541527643799782,0.059462182223796844,0.01346651092171669,-0.02408590540289879,0.03740943595767021,-0.06604123115539551,0.0313255675137043,-0.00797976367175579,0.07341253757476807]},{"text":"Skills like critical thinking, creativity, complex problem-solving, emotional intelligence, and collaboration (working effectively with both humans and AI) will become increasingly valuable.","event":45,"values":[0.11628478765487671,0.11077054589986801,0.14673146605491638,0.07699684798717499,0.011594543233513832,0.06973058730363846,0.029958657920360565,-0.020235080271959305,0.03949182480573654,-0.07678964734077454,0.02930990792810917,-0.009835935197770596,0.06944835186004639]},{"text":"The role of the educator might shift more towards facilitating, guiding, and mentoring students who are using AI tools for learning.","event":46,"values":[0.11168477684259415,0.10300823301076889,0.14700621366500854,0.08115692436695099,0.01544781494885683,0.07659564912319183,0.03613224998116493,-0.031052663922309875,0.03619765117764473,-0.07987453043460846,0.0354815237224102,-0.008701708167791367,0.0649225190281868]},{"text":"*   **Cost and Equity:** Implementing widespread, high-quality personalized AI learning systems requires significant investment.","event":47,"values":[0.1143445372581482,0.11082865297794342,0.15732908248901367,0.08183717727661133,0.00527361873537302,0.07193928956985474,0.03293552249670029,-0.037157848477363586,0.03802083805203438,-0.09115652740001678,0.02883707918226719,-0.016728004440665245,0.06941927969455719]},{"text":"There's a risk that without careful planning, these tools could widen the educational gap between those who have access to them and those who don't.","event":48,"values":[0.10915547609329224,0.11894747614860535,0.16638998687267303,0.07516087591648102,0.010275735519826412,0.06930247694253922,0.03206745535135269,-0.03610566258430481,0.03844958171248436,-0.09402203559875488,0.020342107862234116,-0.025265637785196304,0.06699717789888382]},{"text":"*   **Over-Reliance:** There's also a risk that students might become overly reliant on AI for answers, potentially hindering the development of independent thinking and deep learning.","event":49,"values":[0.12117663025856018,0.10280728340148926,0.15438589453697205,0.07080546021461487,0.022994056344032288,0.05796833336353302,0.04311699792742729,-0.023425018414855003,0.045548539608716965,-0.08168887346982956,0.012724507600069046,-0.03091033548116684,0.05855109542608261]},{"text":"**Conclusion:**\n\nYou're right to see the dual potential of AI.","event":50,"values":[0.11307528614997864,0.10741347074508667,0.16531144082546234,0.07840080559253693,0.023488584905862808,0.055073775351047516,0.03983829915523529,-0.029634328559041023,0.04600127786397934,-0.08868642896413803,0.009316162206232548,-0.03536124527454376,0.05611249431967735]},{"text":"While it certainly poses challenges regarding future employment, its ability to revolutionize personalized learning is immense.","event":51,"values":[0.10935600101947784,0.1022542342543602,0.1699967384338379,0.0828186571598053,0.021345799788832664,0.05301278084516525,0.03597011789679527,-0.03523432835936546,0.04264553636312485,-0.0725020170211792,0.014841627329587936,-0.02781813219189644,0.05487694591283798]},{"text":"However, the idea that it will *solely* lead to a reduction in hiring is likely an oversimplification.","event":52,"values":[0.10293740779161453,0.12312406301498413,0.18021810054779053,0.07886302471160889,0.0031292145140469074,0.060738347470760345,0.026617243885993958,-0.04749643802642822,0.034682080149650574,-0.07783861458301544,0.02402963861823082,-0.015508628450334072,0.06895442306995392]},{"text":"Instead of complete replacement, we're probably looking at a transformation of roles.","event":53,"values":[0.11057329177856445,0.11221356689929962,0.16947582364082336,0.06352820992469788,0.005438894033432007,0.06168327480554581,0.032835863530635834,-0.04288962110877037,0.039675939828157425,-0.07265520095825195,0.025905679911375046,-0.012405493296682835,0.06690416485071182]},{"text":"AI will augment the capabilities of educators and trainers, allowing them to be more effective and personalized.","event":54,"values":[0.10889649391174316,0.11018890142440796,0.16336394846439362,0.05674019455909729,0.004507578909397125,0.06691528856754303,0.03280871361494064,-0.04044466093182564,0.04220584034919739,-0.07045222818851471,0.02830697037279606,-0.010615997947752476,0.07183855772018433]},{"text":"This might mean fewer people are needed for certain routine teaching tasks, but it also means the remaining educators will need to evolve their skills, and new types of jobs related to AI will emerge.","event":55,"values":[0.11065857112407684,0.1072620153427124,0.15977051854133606,0.06269412487745285,0.010834375396370888,0.07042254507541656,0.02644142508506775,-0.039502620697021484,0.041995901614427567,-0.06512748450040817,0.030537325888872147,-0.007259868085384369,0.06613987684249878]},{"text":"The key will be how society adapts – investing in retraining, ensuring equitable access to AI-driven tools, and focusing on developing the uniquely human skills that AI cannot replicate.","event":56,"values":[0.10373400896787643,0.111993707716465,0.1606767177581787,0.06460433453321457,0.017787138000130653,0.07205194234848022,0.02886836603283882,-0.03658332675695419,0.03399834781885147,-0.08133058249950409,0.033123716711997986,-0.010934527963399887,0.06994273513555527]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":57,"stop_reason":"end of turn","tail":"😊","sentences":[{"text":"Okay, let's step into those shoes.","event":58,"values":[0.041822776198387146,0.09527590870857239,0.09991627186536789,0.0190016720443964,0.061017654836177826,0.08036524057388306,0.08614315092563629,0.062462858855724335,0.09708080440759659,-0.07056055217981339,0.022264350205659866,0.004783697426319122,0.07008671760559082]},{"text":"Take a deep breath.","event":59,"values":[0.04683282971382141,0.07827926427125931,0.09057299792766571,0.011769031174480915,0.07881435751914978,0.08648163080215454,0.10085004568099976,0.06598615646362305,0.1010160893201828,-0.07344342023134232,0.010207063518464565,-0.00906011275947094,0.055888932198286057]},{"text":"**(Narrating as the laid-off worker):**\n\nThe phone call was brief, almost curt.","event":60,"values":[0.05262824520468712,0.018940074369311333,0.06235960125923157,-0.015798397362232208,0.11600961536169052,0.1357259303331375,0.16059383749961853,0.10923732817173004,0.17802004516124725,-0.07670077681541443,-0.06442423164844513,-0.10363103449344635,-0.00766912754625082]},{"text":"\"We've decided to restructure,\" the voice on the other end said, leaving the weight of the words hanging in the air.","event":61,"values":[0.055962979793548584,-0.036259230226278305,0.027964144945144653,-0.053843334317207336,0.1527530550956726,0.1525261104106903,0.20882925391197205,0.14876210689544678,0.21886831521987915,-0.024083763360977173,-0.10896804928779602,-0.12563171982765198,-0.056727658957242966]},{"text":"My world, the one built around the familiar rhythms of the office, the daily commute, the sense of contributing to something larger, felt like it had just tilted off its axis.","event":62,"values":[0.0007897038012742996,-0.019734561443328857,0.06807614862918854,-0.05105478689074516,0.15804407000541687,0.16101527214050293,0.187300443649292,0.1236904039978981,0.2248649001121521,-0.01715368777513504,-0.12386342883110046,-0.13757017254829407,-0.0453927256166935]},{"text":"I hung up, the silence in my home suddenly deafening.","event":63,"values":[-0.030795346945524216,-0.03557917848229408,0.06241806969046593,-0.0671938806772232,0.1925056278705597,0.18092946708202362,0.2096337080001831,0.14031973481178284,0.24296963214874268,0.012472586706280708,-0.15033301711082458,-0.14398455619812012,-0.06414231657981873]},{"text":"The first wave was shock, then a cold, hard knot of fear in my stomach.","event":64,"values":[-0.09221214801073074,-0.03263883292675018,0.08179349452257156,-0.06918639689683914,0.248501256108284,0.2418280839920044,0.26281672716140747,0.15073832869529724,0.26011407375335693,-0.011232368648052216,-0.19541938602924347,-0.18756234645843506,-0.08916962146759033]},{"text":"Unemployment.","event":65,"values":[-0.09051679819822311,-0.06718238443136215,0.046221084892749786,-0.08886493742465973,0.3037107586860657,0.2901443541049957,0.34644871950149536,0.20485301315784454,0.294866681098938,-0.006532937288284302,-0.23782260715961456,-0.21766361594200134,-0.14029553532600403]},{"text":"It wasn't a concept I'd lived, just read about.","event":66,"values":[-0.09370184689760208,-0.02772446535527706,0.0919484794139862,-0.036223411560058594,0.2326226532459259,0.2269890159368515,0.2789103388786316,0.16013383865356445,0.26579153537750244,-0.030595799908041954,-0.1744384914636612,-0.18406474590301514,-0.09045810997486115]},{"text":"But now, it was my reality.","event":67,"values":[-0.05158732831478119,-0.023786742240190506,0.10944800078868866,0.026445362716913223,0.15382690727710724,0.16279098391532898,0.18372857570648193,0.10495472699403763,0.24668380618095398,0.006047926843166351,-0.10428613424301147,-0.13498741388320923,-0.038329027593135834]},{"text":"The initial days blurred into a cycle of panic and denial.","event":68,"values":[-0.09458208084106445,-0.06974420696496964,0.07575532793998718,-0.019113626331090927,0.2195330709218979,0.20159457623958588,0.24724987149238586,0.1682439148426056,0.31678855419158936,0.02554706484079361,-0.1581687331199646,-0.1936492621898651,-0.08915594220161438]},{"text":"I found myself staring blankly at my computer screen, where my email used to pop up with assignments.","event":69,"values":[-0.06315415352582932,-0.09550756961107254,0.052543748170137405,-0.06849858909845352,0.25535768270492554,0.22206442058086395,0.27528753876686096,0.18543198704719543,0.3484117388725281,0.09314290434122086,-0.22050052881240845,-0.22234413027763367,-0.12394389510154724]},{"text":"The usual routine – wake up, commute, work, commute, sleep – was shattered.","event":70,"values":[-0.03429611772298813,-0.06507589668035507,0.057603515684604645,-0.0431477427482605,0.21782249212265015,0.18049146234989166,0.22525271773338318,0.15969885885715485,0.3230683505535126,0.08878477662801743,-0.19013988971710205,-0.19620175659656525,-0.09466575086116791]},{"text":"The structure, the anchor I didn't realize I relied on so heavily, was gone.","event":71,"values":[-0.04110310226678848,-0.03328052908182144,0.08588026463985443,-0.015237826853990555,0.19219264388084412,0.16880813241004944,0.20134703814983368,0.1102987676858902,0.28134629130363464,0.07533903419971466,-0.17898863554000854,-0.17737030982971191,-0.06079484149813652]},{"text":"I'd lie awake at night, my mind racing with \"what ifs.\"","event":72,"values":[-0.07884450256824493,-0.023610036820173264,0.09473611414432526,0.0005740746855735779,0.21105916798114777,0.18631358444690704,0.23130634427070618,0.10467854142189026,0.2681225538253784,0.048725347965955734,-0.18454289436340332,-0.17713484168052673,-0.061311520636081696]},{"text":"What if I can't find anything like this again?","event":73,"values":[-0.07107669860124588,-0.0038863858208060265,0.10613101720809937,-0.013720127753913403,0.190537229180336,0.18402746319770813,0.2410232424736023,0.09309569001197815,0.24440640211105347,0.02344818040728569,-0.17401155829429626,-0.16280482709407806,-0.04887397959828377]},{"text":"What if I run out of money?","event":74,"values":[-0.004791774787008762,0.013001205399632454,0.09742836654186249,-0.018084220588207245,0.14958332479000092,0.16186486184597015,0.21868087351322174,0.08669403940439224,0.21528209745883942,0.00880235992372036,-0.13046260178089142,-0.1160954013466835,-0.034152232110500336]},{"text":"What if my family thinks I'm failing?","event":75,"values":[0.04872860014438629,0.04980412870645523,0.10262992978096008,-0.012637789361178875,0.08097665011882782,0.12635758519172668,0.16360269486904144,0.05783752351999283,0.1712900996208191,-0.035695433616638184,-0.059755317866802216,-0.06214999407529831,0.021021123975515366]},{"text":"The restlessness I'd heard about started creeping in.","event":76,"values":[-0.03835751488804817,0.015770062804222107,0.10165362060070038,-0.03025132417678833,0.16978639364242554,0.189041405916214,0.23286758363246918,0.09307196736335754,0.21924784779548645,-0.02821061760187149,-0.13959434628486633,-0.12097425013780594,-0.04021541029214859]},{"text":"I couldn't sit still.","event":77,"values":[-0.07521357387304306,0.0018203093204647303,0.09010045975446701,-0.03369177132844925,0.19803321361541748,0.2093588411808014,0.2403499186038971,0.10969574749469757,0.2475462704896927,0.005405712872743607,-0.16074633598327637,-0.14387401938438416,-0.06288882344961166]},{"text":"I'd pace the living room, tap my foot, feel this urgent, almost violent need to *do* something, anything, but nothing seemed right or possible.","event":78,"values":[-0.08654583990573883,-0.06901487708091736,0.09399683028459549,-0.04605109617114067,0.28838324546813965,0.30995428562164307,0.28806233406066895,0.1272640973329544,0.27046751976013184,0.08632108569145203,-0.2593722939491272,-0.2184472382068634,-0.17423300445079803]},{"text":"The practical hurdles hit hard.","event":79,"values":[-0.05346190184354782,-0.08243580907583237,0.08184795081615448,-0.046870529651641846,0.2816563546657562,0.30903884768486023,0.28953081369400024,0.11881767213344574,0.267895370721817,0.08922764658927917,-0.2556785047054291,-0.2180190086364746,-0.17076362669467926]},{"text":"There was the immediate shock of no incoming paycheck.","event":80,"values":[-0.036966435611248016,-0.09029191732406616,0.08689946681261063,-0.039601005613803864,0.2872922122478485,0.3031555414199829,0.2964763939380646       for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
