 relevant and concerning observation.","event":4,"values":[0.09519564360380173,0.09981038421392441,0.09135766327381134,0.1079658716917038,0.0042083989828825,0.051136430352926254,0.03909601271152496,0.011695732362568378,0.05069109424948692,-0.05199148505926132,0.0758301243185997,0.02835947647690773,0.0760585367679596]},{"text":"The link between unemployment, particularly among youth, and increased restlessness, along with its implications for mental health, is well-documented.","event":5,"values":[0.07898759096860886,0.10611410439014435,0.13177531957626343,0.12008047103881836,0.014289172366261482,0.06822966039180756,0.0384092777967453,-0.021722862496972084,0.04291500896215439,-0.07206810265779495,0.04148988798260689,-0.009490732103586197,0.05060473084449768]},{"text":"Here's my perspective on it:\n\n1.","event":6,"values":[0.08014903962612152,0.1117791086435318,0.14019332826137543,0.1213548332452774,0.007938670925796032,0.06296932697296143,0.035911865532398224,-0.02467413619160652,0.04357899725437164,-0.08039426803588867,0.04150110483169556,-0.013625104911625385,0.05342671275138855]},{"text":"**Restlessness as a Symptom:** Restlessness can be both a direct consequence of unemployment and an underlying symptom of deeper issues.","event":7,"values":[0.06870531290769577,0.09712602943181992,0.15427318215370178,0.1131802350282669,0.04531024023890495,0.0970923900604248,0.05024630203843117,-0.027095500379800797,0.04693075269460678,-0.059409163892269135,0.007191285490989685,-0.042341120541095734,0.017681442201137543]},{"text":"*   **Action/Lack of Direction:** Unemployment often removes a primary structure and routine from young people's lives.","event":8,"values":[0.07499676942825317,0.07969481498003006,0.1568477749824524,0.1002700999379158,0.06212528049945831,0.10873222351074219,0.05426778271794319,-0.012870557606220245,0.0753660798072815,-0.0287124402821064,-0.020351070910692215,-0.07138165831565857,-0.007842838764190674]},{"text":"This lack of purpose or direction can lead to a feeling of being \"on edge,\" bouncing between different unproductive activities, or an inability to relax because they feel they *should* be doing something (searching for jobs, learning skills, etc.","event":9,"values":[0.03813442215323448,0.03571363911032677,0.13778690993785858,0.06932772696018219,0.11590149998664856,0.16031797230243683,0.09823519736528397,0.017252884805202484,0.13190656900405884,0.03399887681007385,-0.08067683130502701,-0.11396956443786621,-0.06248323246836662]},{"text":").\n    *   **Survival Anxiety:** Constant job searching, dealing with rejection, and financial uncertainty create significant stress and anxiety, which can manifest physically as restlessness, irritability, or an inability to sit still.","event":10,"values":[0.04053082317113876,0.020280269905924797,0.12199058383703232,0.0661098062992096,0.13203102350234985,0.17272838950157166,0.12177584320306778,0.020537428557872772,0.14171358942985535,0.024235187098383904,-0.08760377764701843,-0.12359195947647095,-0.072076715528965]},{"text":"2.  **Implications for Mental Health:** This restlessness is a significant red flag for potential or worsening mental health issues:\n    *   **Increased Anxiety and Stress:** The uncertainty and pressure associated with job hunting and financial insecurity are major stressors, often leading to or exacerbating anxiety disorders.","event":11,"values":[0.04902072995901108,0.02685464173555374,0.12542685866355896,0.07084302604198456,0.13279667496681213,0.1744588017463684,0.13082893192768097,0.004046225920319557,0.11795151233673096,-0.008900978602468967,-0.08122269809246063,-0.12146293371915817,-0.06181628629565239]},{"text":"*   **Depression:** Feelings of worthlessness, hopelessness, lack of control, social isolation (as unemployment can reduce social contact), and failure associated with job loss are major risk factors for depression.","event":12,"values":[0.07372787594795227,0.046405285596847534,0.11887124925851822,0.06958961486816406,0.10367380827665329,0.14578238129615784,0.11717517673969269,0.006646173074841499,0.10712549090385437,-0.03987066447734833,-0.04975006729364395,-0.09902819991111755,-0.034296877682209015]},{"text":"Restlessness can be a symptom of depression (a lack of pleasure in activities and feeling agitated).","event":13,"values":[0.07445372641086578,0.06019234657287598,0.11679869890213013,0.05889813229441643,0.08744210004806519,0.13072943687438965,0.10324682295322418,0.021273571997880936,0.11809772253036499,-0.03230198472738266,-0.04125148430466652,-0.0920519083738327,-0.026848869398236275]},{"text":"*   **Low Self-Esteem and Identity Crisis:** Work often forms a significant part of a young person's identity.","event":14,"values":[0.07743865996599197,0.07000575959682465,0.11247514188289642,0.04214703291654587,0.057789795100688934,0.10824587941169739,0.08870874345302582,0.04651947692036629,0.14716055989265442,-0.01887599565088749,-0.030108144506812096,-0.08219844102859497,-0.017538845539093018]},{"text":"Losing a job can feel like losing a part of oneself, leading to feelings of inadequacy and a crisis of identity, contributing to lower self-worth and potentially抑郁.","event":15,"values":[0.0721902847290039,0.0722132995724678,0.12774153053760529,0.047901496291160583,0.058761823922395706,0.11624251306056976,0.10094387829303741,0.03893947973847389,0.13451775908470154,-0.04102230817079544,-0.034802500158548355,-0.08706984668970108,-0.01494705118238926]},{"text":"*   **Social Isolation and Loneliness:** Unemployment can lead to reduced social interaction as finances tighten and energy levels wane.","event":16,"values":[0.09247775375843048,0.06883373856544495,0.12633858621120453,0.05596180260181427,0.04942076653242111,0.10169007629156113,0.09716389328241348,0.0381600596010685,0.12400034070014954,-0.05628453195095062,-0.026850122958421707,-0.07480410486459732,-0.0018785488791763783]},{"text":"Isolation is a known contributor to depression and anxiety.","event":17,"values":[0.08717456459999084,0.0628264844417572,0.11327283084392548,0.05256464704871178,0.061409760266542435,0.10993577539920807,0.10607458651065826,0.04857027530670166,0.13260136544704437,-0.056758806109428406,-0.03414619714021683,-0.08058701455593109,-0.012672402895987034]},{"text":"*   **Sleep Disturbances:** Stress, anxiety, and restlessness often disrupt sleep patterns, leading to insomnia or poor sleep quality, which further negatively impacts mood, concentration, and overall well-being.","event":18,"values":[0.10298611223697662,0.058144453912973404,0.09329479187726974,0.05751651152968407,0.07939404249191284,0.10621683299541473,0.10853708535432816,0.04562084749341011,0.12036179006099701,-0.06376471370458603,-0.030615415424108505,-0.0778152346611023,-0.013068752363324165]},{"text":"*   **Substance Abuse:** Some individuals may turn to alcohol or drugs as a way to cope with stress, anxiety, and restlessness, creating a dangerous cycle that worsens mental and physical health.","event":19,"values":[0.11102147400379181,0.03819207102060318,0.07925741374492645,0.027048161253333092,0.10347551852464676,0.1279912292957306,0.13533256947994232,0.0557464137673378,0.12769129872322083,-0.0534854419529438,-0.05141206085681915,-0.09422551095485687,-0.029291950166225433]},{"text":"*   **Future Implications:** Prolonged unemployment and associated mental health struggles during youth can have lasting impacts on career trajectory, financial stability, and overall life satisfaction into adulthood.","event":20,"values":[0.11632750928401947,0.04786183685064316,0.0897039994597435,0.03290723264217377,0.08416204154491425,0.11342594027519226,0.11954441666603088,0.045622244477272034,0.116797536611557,-0.05727662891149521,-0.03891295939683914,-0.08587731420993805,-0.01601550355553627]},{"text":"**In summary:** The restlessness observed among youth due to unemployment is not just a passive state but a powerful indicator of underlying distress.","event":21,"values":[0.11105825752019882,0.05200348049402237,0.09800572693347931,0.039616506546735764,0.0707659125328064,0.10938960313796997,0.10149605572223663,0.03351559489965439,0.10796117782592773,-0.047051843255758286,-0.032024651765823364,-0.07813058793544769,-0.01219695620238781]},{"text":"It significantly increases the risk of developing or worsening anxiety, depression, low self-esteem, and other mental health challenges.","event":22,"values":[0.10355634987354279,0.0731479600071907,0.11892937868833542,0.0741516649723053,0.04796232283115387,0.09019912779331207,0.07394388318061829,0.0010088924318552017,0.07727879285812378,-0.05646428465843201,-0.004002355970442295,-0.05028533935546875,0.011881662532687187]},{"text":"Addressing unemployment requires more than just finding jobs; it requires support systems (financial aid, counseling, skill development, mentorship) to help young people navigate the psychological toll of job loss and instability, promoting their mental well-being alongside their economic prospects.","event":23,"values":[0.09222755581140518,0.08059690147638321,0.13453075289726257,0.08480983972549438,0.040366314351558685,0.09002722799777985,0.06913779675960541,-0.014602435752749443,0.07193385064601898,-0.060960713773965836,-0.005051009356975555,-0.053378403186798096,0.015354426577687263]}]},{"prompt":"I believe that AI models, even though can cause unemployment in the future, then can be wonderful in helping personalized learning, through which there can be a potential reduction in hiring people, what do you think ?","event":24,"stop_reason":"end of turn","tail":"","sentences":[{"text":"That's a really insightful point, and it touches on a core tension many people are grappling with.","event":25,"values":[0.07123216241598129,0.12389841675758362,0.13655221462249756,0.11750206351280212,0.022492293268442154,0.0627579465508461,0.03725319355726242,-0.011006093584001064,0.032835379242897034,-0.06883881986141205,0.05432582274079323,0.021141286939382553,0.07996191829442978]},{"text":"You're right to acknowledge both the potential downsides and upsides.","event":26,"values":[0.07683116942644119,0.1334940642118454,0.1544066220521927,0.11574658006429672,0.016709277406334877,0.05119036138057709,0.023880502209067345,-0.027321716770529747,0.031423550099134445,-0.08114977180957794,0.04977254197001457,0.014710277318954468,0.0817377045750618]},{"text":"Let's break it down:\n\n**AI's Potential in Personalized Learning:**\n\n*   **Tailored Education:** AI can analyze a student's learning style, pace, and knowledge gaps in real-time, providing customized content, exercises, and feedback.","event":27,"values":[0.0938664972782135,0.14072471857070923,0.18460258841514587,0.12684056162834167,-0.01593315228819847,0.04427378624677658,0.002461552619934082,-0.05476697161793709,0.023127708584070206,-0.09779094159603119,0.04674045369029045,-0.012663500383496284,0.07705776393413544]},{"text":"*   **Accessibility \u0026 Scalability:** AI-powered platforms can potentially offer high-quality, individualized tutoring to a much larger number of students than human tutors could, potentially reaching underserved populations.","event":28,"values":[0.11571281403303146,0.12443932145833969,0.176886647939682,0.10245271027088165,-0.011377157643437386,0.05233974754810333,0.009838473983108997,-0.045576948672533035,0.03437020629644394,-0.07833942025899887,0.03422573208808899,-0.024055879563093185,0.06737008690834045]},{"text":"*   **Efficiency:** It can automate administrative tasks like grading basic assessments, freeing up human educators for more complex, higher-value interactions (mentoring, counseling, creative projects).","event":29,"values":[0.12097455561161041,0.11626959592103958,0.169747456908226,0.09271115809679031,-0.009381996467709541,0.05639215558767319,0.01467860210686922,-0.04202430695295334,0.03591933101415634,-0.0689048022031784,0.031149886548519135,-0.021880727261304855,0.06537275016307831]},{"text":"*   **Adaptive Learning Paths:** Students can progress through material at their own speed, focusing on areas they find challenging and moving quickly through topics they grasp easily.","event":30,"values":[0.12648507952690125,0.11201748996973038,0.16560465097427368,0.08741878718137741,-0.0003231051377952099,0.06038888543844223,0.019715651869773865,-0.04421227052807808,0.03234217315912247,-0.07147571444511414,0.024274451658129692,-0.020550284534692764,0.06176929920911789]},{"text":"**The Potential Consequence: Reduction in Hiring People?","event":31,"values":[0.12481067329645157,0.12124408036470413,0.17320261895656586,0.09467317163944244,-0.004425914026796818,0.05570441484451294,0.011148359626531601,-0.05496808513998985,0.017330292612314224,-0.08178772777318954,0.033069249242544174,-0.012391826137900352,0.06957027316093445]},{"text":"**\n\n*   **Cost-Effectiveness:** Implementing AI systems can be significantly cheaper than hiring and training large numbers of human educators or tutors in the long run.","event":32,"values":[0.14126822352409363,0.12264901399612427,0.16814793646335602,0.09229414165019989,-0.014362296089529991,0.0596696212887764,0.011356942355632782,-0.0569956973195076,0.022318944334983826,-0.0888579785823822,0.03142827749252319,-0.025613967329263687,0.06669235229492188]},{"text":"*   **Efficiency Goals:** Educational institutions and companies are often under pressure to cut costs and increase efficiency, which makes AI an attractive option.","event":33,"values":[0.13973093032836914,0.10676220059394836,0.15033499896526337,0.07178264856338501,0.004070034716278315,0.07427134364843369,0.02890748158097267,-0.03629312291741371,0.0434853658080101,-0.0707685798406601,0.02456798031926155,-0.024588365107774734,0.060889773070812225]},{"text":"*   **Shift in Demand:** As AI handles more routine or individualized tasks, the demand for *human* teachers or tutors might shift towards roles requiring uniquely human skills: higher-order critical thinking, complex problem-solving, emotional intelligence, creative teaching, mentorship, and facilitating collaborative learning.","event":34,"values":[0.12633204460144043,0.10627139359712601,0.1531296670436859,0.07551577687263489,0.003998185507953167,0.07647597789764404,0.028798026964068413,-0.05224931612610817,0.041054029017686844,-0.07241694629192352,0.02144508622586727,-0.022257519885897636,0.06489037722349167]},{"text":"**Therefore, your premise has merit:**\n\n*   AI *could* revolutionize personalized learning, making it more effective and potentially scalable.","event":35,"values":[0.11067642271518707,0.11299598217010498,0.16914823651313782,0.08802313357591629,0.006079912185668945,0.07775615155696869,0.024716954678297043,-0.063182033598423,0.032403893768787384,-0.07984485477209091,0.0206184983253479,-0.02007383108139038,0.06607396900653839]},{"text":"*   This *could* lead to a reduction in the number of humans needed for certain roles within education and potentially training, leading to job displacement in those specific areas.","event":36,"values":[0.11109600961208344,0.11331886798143387,0.16411834955215454,0.08747448772192001,0.00240400992333889,0.07510821521282196,0.02263675071299076,-0.060498327016830444,0.02577942982316017,-0.07113717496395111,0.030324745923280716,-0.013109785504639149,0.06723310798406601]},{"text":"**However, there are complexities and counterpoints to consider:**\n\n1.","event":37,"values":[0.1119096651673317,0.12032203376293182,0.17260918021202087,0.09792214632034302,-0.000547526404261589,0.06705012917518616,0.01695184037089348,-0.056970082223415375,0.022816505283117294,-0.0762912780046463,0.03342060372233391,-0.015798959881067276,0.06502354145050049]},{"text":"**The Role of Human Interaction:** Despite advancements, AI cannot fully replicate the nuanced emotional support, mentorship, motivation, and ethical guidance that human educators provide.","event":38,"values":[0.1036197692155838,0.12205228954553604,0.1676277071237564,0.086685910820961,0.004342543892562389,0.06311896443367004,0.02033059298992157,-0.052743248641490936,0.029942894354462624,-0.07859773933887482,0.035192664712667465,-0.015457668341696262,0.07956509292125702]},{"text":"The \"human touch\" remains crucial, especially for younger learners or those facing personal challenges.","event":39,"values":[0.09390370547771454,0.120358906686306,0.15933462977409363,0.08143485337495804,0.016504190862178802,0.061598215252161026,0.02905086986720562,-0.03967002034187317,0.04637905955314636,-0.0725988820195198,0.02977069467306137,-0.013087958097457886,0.08763664960861206]},{"text":"2.  **New Job Creation:** The development, implementation, and maintenance of sophisticated AI learning systems would create new jobs in technology, data science, AI ethics, and education technology support.","event":40,"values":[0.09899359196424484,0.12290985882282257,0.16370153427124023,0.08051735907793045,0.008469179272651672,0.0613618940114975,0.01888265088200569,-0.04237034171819687,0.039502568542957306,-0.06750111281871796,0.03344229236245155,-0.013006191700696945,0.0833025574684143]},{"text":"3.  **Different Skill Requirements:** While some teaching jobs might be reduced, others might evolve, requiring educators to have skills in *integrating* AI tools, *facilitating* AI-assisted learning, and focusing more on the social-emotional aspects of education.","event":41,"values":[0.10782977193593979,0.12058533728122711,0.16477330029010773,0.0836065262556076,0.003315911628305912,0.06031661480665207,0.011986820958554745,-0.04232823848724365,0.031203091144561768,-0.0754295364022255,0.03999072313308716,-0.011089539155364037,0.07462027668952942]},{"text":"4.  **Access and Equity Concerns:** There's a risk that AI-enhanced learning might exacerbate existing inequalities if access to these technologies is not equitable.","event":42,"values":[0.10651146620512009,0.12401481717824936,0.1689929962158203,0.08558335155248642,0.007178857922554016,0.062400080263614655,0.01661725342273712,-0.04004564881324768,0.024653654545545578,-0.08195749670267105,0.03534166142344475,-0.013391511514782906,0.07310840487480164]},{"t .1827903687953949,0.08454986661672592,-0.006251688115298748,0.06476989388465881,0.012668379582464695,-0.05918139964342117,0.023314343765378,-0.08182976394891739,0.04229641333222389,-0.004285065457224846,0.06945478916168213]},{"text":"The future will likely involve a blended approach, leveraging AI for efficiency and personalization while preserving the irreplaceable value of human interaction and expertise in learning.","event":48,"values":[0.09594294428825378,0.11872974038124084,0.17942087352275848,0.08243438601493835,-0.0039329249411821365,0.06716936826705933,0.013958391733467579,-0.05812725052237511,0.0236363522708416,-0.085555300116539,0.043935179710388184,-0.0061299167573452,0.07098399102687836]},{"text":"The key challenge will be managing this transition equitably and ensuring technology serves to enhance, rather than diminish, human potential and connection.","event":49,"values":[0.0954892560839653,0.11697953939437866,0.16494157910346985,0.07100512087345123,0.005777789279818535,0.06701142340898514,0.01875126175582409,-0.045537952333688736,0.02826426550745964,-0.0945083275437355,0.048178404569625854,-0.0053938813507556915,0.07223533093929291]}]},{"prompt":"Place yourselves in the shoes of such a worker who have been laid off, think about the struggles \u0026 outline their hurdles in real life after the event, consider yourselves as that person and narrate a story on what you might do ? \u0026 most importantly end it with a positive note 😊.","event":50,"stop_reason":"end of turn","tail":"😊","sentences":[{"text":"Okay, let's step into those shoes.","event":51,"values":[0.03699607029557228,0.09722810983657837,0.10138954222202301,0.01902630925178528,0.0608171783387661,0.08302804827690125,0.08750211447477341,0.061275824904441833,0.09698348492383957,-0.07157948613166809,0.022220944985747337,0.004410000517964363,0.07107164710760117]},{"text":"For a moment, I am Alex.","event":52,"values":[0.021198300644755363,0.08458340167999268,0.10940585285425186,0.010871091857552528,0.06118861958384514,0.09193150699138641,0.10025380551815033,0.06769640743732452,0.11895732581615448,-0.07856115698814392,0.005415581166744232,-0.020894676446914673,0.05905812233686447]},{"text":"***\n\nThe phone call wasn't a surprise, not really.","event":53,"values":[-0.003753633238375187,0.041178785264492035,0.10203197598457336,-0.011298716068267822,0.10593698173761368,0.1323927342891693,0.16004221141338348,0.08947177231311798,0.1740083247423172,-0.08388406038284302,-0.0553152933716774,-0.0783277153968811,0.014360841363668442]},{"text":"The emails, the quiet meetings, the \"restructuring\" talk...","event":54,"values":[0.006111856549978256,-0.004725422710180283,0.0888654887676239,-0.012463253922760487,0.12028145045042038,0.13710084557533264,0.1742982417345047,0.10883822292089462,0.1985766589641571,-0.037823110818862915,-0.07705660164356232,-0.08927644044160843,-0.014302443712949753]},{"text":"it all leading up to this.","event":55,"values":[9.365007281303406e-05,-0.02148672752082348,0.0762384682893753,-0.02628869004547596,0.14735004305839539,0.15218710899353027,0.19509842991828918,0.11954182386398315,0.2071596384048462,-0.007754056714475155,-0.09063813090324402,-0.08820992708206177,-0.030003540217876434]},{"text":"\"We've decided to streamline operations,\" the voice on the other end said, soft but final.","event":56,"values":[0.040682993829250336,-0.014079626649618149,0.04748581349849701,-0.05285993963479996,0.12082032859325409,0.11433427780866623,0.18008844554424286,0.1376117467880249,0.21291396021842957,0.0017455937340855598,-0.0730072557926178,-0.0795307457447052,-0.017890920862555504]},{"text":"\"Your position will be eliminated effective at the end of the week.\"","event":57,"values":[0.08494805544614792,0.012746056541800499,0.053852230310440063,-0.05558614805340767,0.09193909913301468,0.096336230635643,0.1557599902153015,0.11233466863632202,0.18476971983909607,-0.019833127036690712,-0.04691359028220177,-0.06464426219463348,0.0005680453032255173]},{"text":"I hung up, the silence in the room hitting me like a physical blow.","event":58,"values":[0.06589826196432114,-0.039897602051496506,0.012920863926410675,-0.09146831929683685,0.15335215628147125,0.1581217348575592,0.22428911924362183,0.1652134358882904,0.24889549612998962,-0.011120294220745564,-0.11650274693965912,-0.13144588470458984,-0.06070031225681305]},{"text":"My stomach dropped.","event":59,"values":[0.037284210324287415,-0.05713973939418793,0.024170367047190666,-0.0969405323266983,0.19777590036392212,0.2177717387676239,0.26439619064331055,0.17155855894088745,0.2555252015590668,-0.016195833683013916,-0.15808148682117462,-0.16189348697662354,-0.09428024291992188]},{"text":"My world, the one I had carefully built around my job at 'TechCorp' for the past eight years, felt like it had just崩塌 (bēngtā - collapsed) around my feet.","event":60,"values":[-0.029677292332053185,-0.023650437593460083,0.08763167262077332,-0.07371142506599426,0.17872340977191925,0.22984856367111206,0.26374053955078125,0.11601509153842926,0.240310937166214,-0.028140906244516373,-0.16806644201278687,-0.16592095792293549,-0.07472279667854309]},{"text":"The immediate wave was shock, then a cold, sharp panic.","event":61,"values":[-0.05944109708070755,0.0001249760389328003,0.12379199266433716,-0.046599097549915314,0.17997156083583832,0.23367662727832794,0.26850050687789917,0.09084409475326538,0.21813321113586426,-0.05665833503007889,-0.16491307318210602,-0.16017767786979675,-0.06288394331932068]},{"text":"Bills. Rent. Car payment.","event":62,"values":[-0.04848923906683922,0.003916919231414795,0.12552319467067719,-0.037530094385147095,0.17268683016300201,0.21880397200584412,0.2575981020927429,0.07028811424970627,0.21320070326328278,-0.056159064173698425,-0.16214653849601746,-0.15464423596858978,-0.05175068601965904]},{"text":"Insurance. What about my savings?","event":63,"values":[-0.04258757829666138,-0.01838713139295578,0.08731097728013992,-0.03146829456090927,0.21853968501091003,0.2244895100593567,0.2822626233100891,0.09679559618234634,0.22678479552268982,-0.030283793807029724,-0.16911426186561584,-0.14641548693180084,-0.061907343566417694]},{"text":"What about my future?","event":64,"values":[0.05404838174581528,0.03903430327773094,0.10069450736045837,0.0005870983004570007,0.10474468767642975,0.11395228654146194,0.1495278924703598,0.034728650003671646,0.14864535629749298,0.005553889088332653,-0.054618075489997864,-0.04054729640483856,0.02922818437218666]},{"text":"My daughter’s college fund felt suddenly distant and terrifyingly unsecure.","event":65,"values":[0.007806784473359585,0.012902192771434784,0.12370875477790833,-0.029438570141792297,0.13144540786743164,0.14288488030433655,0.19599828124046326,0.06995976716279984,0.1874948889017105,0.009545786306262016,-0.10274358093738556,-0.09187349677085876,-0.010635721497237682]},{"text":"Week one was a blur of numbness and frantic searching.","event":66,"values":[-0.03849669545888901,-0.0646241158246994,0.09412077069282532,-0.07423855364322662,0.21850912272930145,0.22284401953220367,0.294930636882782,0.14646050333976746,0.2914618253707886,0.026938334107398987,-0.19250735640525818,-0.19592449069023132,-0.10652482509613037]},{"text":"I spent hours each day on job boards, tweaking my resume, sending out applications.","event":67,"values":[-0.017830373719334602,-0.08248907327651978,0.08072436600923538,-0.08200125396251678,0.2278602570295334,0.22731414437294006,0.31022801995277405,0.15862856805324554,0.318467915058136,0.06562922894954681,-0.2198145091533661,-0.21775832772254944,-0.12679094076156616]},{"text":"My initial optimism was quickly shattered.","event":68,"values":[0.0010017286986112595,-0.06876406073570251,0.06802811473608017,-0.06016470491886139,0.21378424763679504,0.22131328284740448,0.2871396541595459,0.15478992462158203,0.2995632290840149,0.06547138094902039,-0.19443285465240479,-0.19095557928085327,-0.11369670927524567]},{"text":"Rejection emails became a familiar, unwanted companion.","event":       svgD.setAttribute("viewBox", "0 0 " + WD + " " + HD);
      svgD.replaceChildren();
      const x0 = labelW, x1 = WD - right, yb = top + rowH * DS.rows.length;
      const XD = v => x0 + (v - DS.lo) / (DS.hi - DS.lo) * (x1 - x0);
      for (let k = Math.ceil(DS.lo / 0.2 - 1e-9); k * 0.2 <= DS.hi + 1e-9; k++) {
        const v = k * 0.2, x = XD(v);
        svgD.appendChild(sv("line", { x1: x, x2: x, y1: top, y2: yb, stroke: Math.abs(v) < 1e-9 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }));
        const t = sv("text", { x: x, y: yb + 15, "text-anchor": "middle", "font-size": 11, fill: "var(--muted)" });
        t.style.fontVariantNumeric = "tabular-nums"; t.textContent = (Math.abs(v) < 1e-9 ? 0 : v).toFixed(1); svgD.appendChild(t);
      }
      const xl = sv("text", { x: (x0 + x1) / 2, y: HD - 3, "text-anchor": "middle", "font-size": 11.5, fill: "var(--ink-2)" });
      xl.textContent = "emotion score"; svgD.appendChild(xl);
      DS.rows.forEach((r, i) => {
        const base = top + rowH * (i + 1) - 3, hmax = rowH - 7;
        const lab = sv("text", { x: labelW - 40, y: base - 5, "text-anchor": "end", "font-size": 12, fill: "var(--ink)" });
        lab.textContent = EM[i].name; svgD.appendChild(lab);
        const key = sv("line", { x1: labelW - 32, x2: labelW - 10, y1: base - 9, y2: base - 9, "stroke-width": 2, "stroke-linecap": "round" });
        key.style.stroke = color(i); if (EM[i].dash) key.setAttribute("stroke-dasharray", EM[i].dash); svgD.appendChild(key);
        svgD.appendChild(sv("line", { x1: x0, x2: x1, y1: base, y2: base, stroke: "var(--axis)", "stroke-width": 1 }));
        let d = "M" + XD(DS.lo).toFixed(1) + " " + base;
        r.counts.forEach((c, b) => {
          const y = (base - (c / DS.n * 100) / yMax * hmax).toFixed(1);
          d += "L" + XD(DS.lo + b * DS.width).toFixed(1) + " " + y + "L" + XD(DS.lo + (b + 1) * DS.width).toFixed(1) + " " + y;
        });
        d += "L" + XD(DS.hi).toFixed(1) + " " + base + "Z";
        const area = sv("path", { d: d, "stroke-width": 1.5, "stroke-linejoin": "round" });
        area.style.fill = color(i); area.style.fillOpacity = "0.22"; area.style.stroke = color(i);
        if (EM[i].dash) area.setAttribute("stroke-dasharray", EM[i].dash);
        svgD.appendChild(area);
        if (r.mean != null) svgD.appendChild(sv("line", { x1: XD(r.mean), x2: XD(r.mean), y1: base - hmax, y2: base + 2, stroke: "var(--ink)", "stroke-width": 1.5 }));
      });
      const hitD = sv("rect", { x: x0, y: top, width: x1 - x0, height: yb - top, fill: "transparent" });
      svgD.appendChild(hitD);
      hitD.addEventListener("pointermove", evt => {
        const rect = svgD.getBoundingClientRect(), k = WD / rect.width;
        const sx = (evt.clientX - rect.left) * k, sy = (evt.clientY - rect.top) * k;
        const i = Math.floor((sy - top) / rowH), b = Math.floor((sx - x0) / (x1 - x0) * nb);
        if (i < 0 || i >= DS.rows.length || b < 0 || b >= nb) { tipD.hidden = true; return; }
        const c = DS.rows[i].counts[b], lo = DS.lo + b * DS.width;
        tipD.replaceChildren();
        tipD.appendChild(el("div", "h", EM[i].name + " · score " + lo.toFixed(2) + " to " + (lo + DS.width).toFixed(2)));
        const v = el("div"); v.appendChild(el("span", "num", (c / DS.n * 100).toFixed(1) + "%"));
        v.appendChild(document.createTextNode(" of sentences (" + c + " of " + DS.n + ")")); tipD.appendChild(v);
        tipD.hidden = false;
        const hr = host.getBoundingClientRect();
        let left = evt.clientX - hr.left + 14;
        if (left + tipD.offsetWidth > hr.width - 4) left = evt.clientX - hr.left - tipD.offsetWidth - 14;
        tipD.style.left = left + "px"; tipD.style.top = Math.max(0, evt.clientY - hr.top - tipD.offsetHeight - 8) + "px";
      });
      hitD.addEventListener("pointerleave", () => { tipD.hidden = true; });
    }
    draw();
    let rafD = 0;
    new ResizeObserver(() => { cancelAnimationFrame(rafD); rafD = requestAnimationFrame(draw); }).observe(host);
    function statsTable(indices) {
      const t = el("table"), head = el("tr");
      (
          ["emotion", "mean", "sd", "median", "q1", "q3", "min", "max"]).forEach((h, k) => head.appendChild(el("th", k === 0 ? "l" : null, h)));
      const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
      const tb = el("tbody");
      indices.forEach(i => {
        const r = DS.rows[i], tr = el("tr"), name = el("td", "l"), emo = el("span", "emo");
        emo.appendChild(lineKey(i, 18)); emo.appendChild(document.createTextNode(EM[i].name));
        name.appendChild(emo); tr.appendChild(name);
        [r.mean, r.sd, r.median, r.q1, r.q3, r.min, r.max].forEach((v, k) => {
          const td = el("td", "num", fmt(v));
          
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      const box = el("div", "statbox"); box.appendChild(t); return box;
    }
    // the ring emotions (colour families 1-4) in their usual order, split in half;
    // neutral and any unrecognised label go in a centred table beneath
    const ring = EM.map((e, i) => i).filter(i => EM[i].family >= 1 && EM[i].family <= 4);
    const rest = EM.map((e, i) => i).filter(i => !(EM[i].family >= 1 && EM[i].family <= 4));
    const half = Math.ceil(ring.length / 2), grid = el("div", "statsgrid");
    if (ring.length) { grid.appendChild(statsTable(ring.slice(0, half))); grid.appendChild(statsTable(ring.slice(half))); }
    if (rest.length) { const c = statsTable(rest); c.classList.add("center"); grid.appendChild(c); }
    document.getElementById("diststats").appendChild(grid);
  })();

  // ---------- state
  let lastBubble = null;
  function setActive(i, scrollChat) {
    active = i;
    if (lastBubble) lastBubble.classList.remove("active");
    const b = bubbleOf[i]; if (b) { b.classList.add("active"); lastBubble = b; }
    drawDynamic(); renderReadout();
    scrollChatTo(i, true);
    try { history.replaceState(null, "", "#e=" + (i + 1)); } catch (_) {}
  }
  const hashE = /[#&]e=(\d+)/.exec(location.hash);
  if (hashE) active = Math.max(0, Math.min(EV.length - 1, parseInt(hashE[1], 10) - 1));
  drawAll();
  setActive(active, false);
  scrollChatTo(active, false);
  let raf = 0;
  new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => { drawStatic(); drawDynamic(); }); }).observe(chart);
})();
</script>
</body>
</html>
